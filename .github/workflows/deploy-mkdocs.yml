name: Deploy static site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Keep large uploads sequential so a newer deploy does not interrupt one in progress.
concurrency:
  group: "site-deploy"
  cancel-in-progress: false

# One job on purpose: the repo is ~6 GB of history, so every extra job paid
# for another checkout plus an artifact upload/download of the whole site.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://shoug-tech.com/
    steps:
      # Shallow: no build step reads git history. IndexNow fetches the one
      # previous commit it needs at the end.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Embed new resource files
        run: python3 scripts/embed_resources.py

      - name: Repair slide breakdown viewers
        run: python3 scripts/repair_slide_breakdown_viewers.py

      - name: Apply cybersecurity red theme
        run: python3 scripts/apply_cyber_red_theme.py

      - name: Build and optimize static site
        run: |
          python3 scripts/install_breakdown_language.py
          node scripts/build-course-manifest.js
          node scripts/build-search-index.js
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          python3 scripts/build_ai_slide_contexts.py
          python3 scripts/optimize_site_html.py

      # SE371 used a legacy builder whose main-content selector stopped matching
      # after the site shell migration. Rebuild its seven chapter routes from
      # the current SE371 chrome so they cannot silently become listing clones.
      - name: Rebuild SE371 dedicated viewers
        run: python3 scripts/fix_se371_viewers.py

      # Generated pages sometimes inherit canonical/OG/hreflang URLs from the
      # template page. The filesystem route is authoritative, so normalize all
      # folder-page URLs after every HTML generator/optimizer has finished.
      - name: Normalize canonical page URLs
        run: python3 scripts/normalize_page_urls.py

      - name: Finalize slide breakdown viewers
        run: python3 scripts/repair_slide_breakdown_viewers.py

      - name: Validate final slide breakdown viewers
        run: python3 scripts/validate_slide_breakdown_viewers.py

      # The final viewer/SEO repair steps above can change which canonical URLs
      # belong in the sitemap. Rebuild it from the final deployable HTML, then
      # validate that exact sitemap rather than the earlier optimizer snapshot.
      - name: Synchronize academic sidebar and site shell
        run: |
          python3 scripts/build_academic_sidebar.py
          python3 scripts/sync_site_shell.py

      # Bots and AI assistants read pages without opening the PDF viewer, so give
      # slide pages a text version and publish /llms.txt as a map of the site.
      - name: Add text versions for bots and AI assistants
        run: |
          python3 scripts/add_slide_text.py
          python3 scripts/build_llms_txt.py

      - name: Rebuild final sitemap
        run: python3 scripts/check_sitemap.py --write

      # The four checks only read docs/, so they run side by side; each one's
      # output is printed in full and any failure fails the step.
      - name: Validate final static site
        run: |
          mkdir -p .validate-logs
          pids=()
          for check in verify_site_routes check_site_links check_seo_metadata check_sitemap; do
            python3 "scripts/$check.py" > ".validate-logs/$check.log" 2>&1 &
            pids+=("$!:$check")
          done
          failed=0
          for entry in "${pids[@]}"; do
            pid="${entry%%:*}"; check="${entry#*:}"
            if wait "$pid"; then status=ok; else status=FAILED; failed=1; fi
            echo "::group::$check ($status)"
            cat ".validate-logs/$check.log"
            echo "::endgroup::"
            [ "$status" = ok ] || echo "::error::$check failed"
          done
          [ "$failed" = 0 ]
          python3 scripts/build_indexing_manifest.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test indexing edge rules
        run: node --test workers/indexing/src/index.test.js

      # qpdf recompresses PDF structure and Flate streams losslessly. It does not
      # downsample, rasterize, or recompress embedded images; originals are kept
      # whenever the optimized candidate is not smaller or fails validation.
      # Results are cached by each original PDF's hash, so only new or changed
      # PDFs are recompressed; the rest are copied from the previous run.
      - name: Restore PDF compression cache
        uses: actions/cache/restore@v4
        with:
          path: .pdf-cache
          key: pdf-cache-v2-${{ github.run_id }}
          restore-keys: pdf-cache-v2-

      - name: Compress PDFs losslessly
        id: compress-pdfs
        run: python3 scripts/compress_pdfs_losslessly.py docs --cache .pdf-cache

      - name: Save PDF compression cache
        if: steps.compress-pdfs.outputs.new != '0'
        uses: actions/cache/save@v4
        with:
          path: .pdf-cache
          key: pdf-cache-v2-${{ github.run_id }}

      - name: Seal paid course content before publishing
        run: python3 scripts/secure_ethics_content.py --seal --check

      # Cloudflare Pages allows 20,000 files per deploy and the annotated-slide
      # figures are over half the site, so they are served from R2 instead
      # (assets.shoug-tech.com). Pages point at R2 before the figures are removed.
      - name: Move annotated-slide figures out of the Pages build
        run: python3 scripts/offload_annotated_figures.py

      # --size-only: checkout resets file times, so sizes decide what is new.
      - name: Upload annotated-slide figures to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          aws s3 sync .r2-upload s3://shoug-tech-assets \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --size-only --only-show-errors --no-progress \
            --cache-control "public, max-age=604800"

      - name: Check Cloudflare Pages limits
        run: python3 scripts/check_pages_limits.py

      - name: Report deployment artifact size
        run: |
          du -sh docs
          find docs -type f | wc -l

      # Meta-refresh pages become real 301s in functions/_middleware.js, which
      # also serves .html URLs without Pages' extension-stripping redirect.
      - name: Generate redirects and routes for the Pages middleware
        run: python3 scripts/build_meta_redirects.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.151.1 pages deploy docs
          --project-name shoug-tech-site --branch main
          --commit-hash "$GITHUB_SHA" --commit-dirty=true

      # Fetch only the pre-push commit so the diff works on the shallow clone.
      # A missed ping is not worth failing a finished deploy over.
      - name: Notify IndexNow of changed URLs
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          python3 scripts/submit_indexnow.py --before "$BEFORE" --after "$GITHUB_SHA"
