name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# A new push waits for the running deploy instead of canceling it: a deploy of this
# size takes longer than the gap between pushes, so canceling meant nothing went live.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Embed new resource files
        run: python3 scripts/embed_resources.py

      - name: Repair slide breakdown viewers
        run: python3 scripts/repair_slide_breakdown_viewers.py

      - name: Apply cybersecurity red theme
        run: python3 scripts/apply_cyber_red_theme.py

      - name: Build and optimize static site
        run: |
          python3 scripts/install_breakdown_language.py
          node scripts/build-course-manifest.js
          node scripts/build-search-index.js
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          python3 scripts/build_ai_slide_contexts.py
          python3 scripts/optimize_site_html.py

      # SE371 used a legacy builder whose main-content selector stopped matching
      # after the site shell migration. Rebuild its seven chapter routes from
      # the current SE371 chrome so they cannot silently become listing clones.
      - name: Rebuild SE371 dedicated viewers
        run: python3 scripts/fix_se371_viewers.py

      # Generated pages sometimes inherit canonical/OG/hreflang URLs from the
      # template page. The filesystem route is authoritative, so normalize all
      # folder-page URLs after every HTML generator/optimizer has finished.
      - name: Normalize canonical page URLs
        run: python3 scripts/normalize_page_urls.py

      - name: Finalize slide breakdown viewers
        run: python3 scripts/repair_slide_breakdown_viewers.py

      - name: Validate final slide breakdown viewers
        run: python3 scripts/validate_slide_breakdown_viewers.py

      # The final viewer/SEO repair steps above can change which canonical URLs
      # belong in the sitemap. Rebuild it from the final deployable HTML, then
      # validate that exact sitemap rather than the earlier optimizer snapshot.
      - name: Synchronize academic sidebar and site shell
        run: |
          python3 scripts/build_academic_sidebar.py
          python3 scripts/sync_site_shell.py

      - name: Rebuild final sitemap
        run: python3 scripts/check_sitemap.py --write

      - name: Validate final static site
        run: |
          python3 scripts/verify_site_routes.py
          python3 scripts/check_site_links.py
          python3 scripts/check_seo_metadata.py
          python3 scripts/check_sitemap.py
          python3 scripts/build_indexing_manifest.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test indexing edge rules
        run: node --test workers/indexing/src/index.test.js

      # qpdf recompresses PDF structure and Flate streams losslessly. It does not
      # downsample, rasterize, or recompress embedded images; originals are kept
      # whenever the optimized candidate is not smaller or fails validation.
      - name: Compress PDFs losslessly
        run: python3 scripts/compress_pdfs_losslessly.py docs

      - name: Seal paid course content before publishing
        run: python3 scripts/secure_ethics_content.py --seal --check

      - name: Report deployment artifact size
        run: |
          du -sh docs
          find docs -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

  # Cloudflare Pages copy of the same build (see CLOUDFLARE-MIGRATION.md). It runs
  # next to the GitHub Pages deploy, from the same sealed artifact, and a failure here
  # never blocks GitHub Pages. The free plan allows 20,000 files of up to 25 MiB.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v5
        with:
          name: github-pages

      - name: Unpack the built site
        run: |
          mkdir site
          tar -xf artifact.tar -C site

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing; skipping."
            exit 0
          fi
          find site \( -name '.DS_Store' -o -name '.render-stamp' \) -type f -delete
          files=$(find site -type f | wc -l)
          echo "Files to upload: $files"
          oversized=$(find site -type f -size +25M -print)
          if [ -n "$oversized" ]; then
            printf '%s\\n' "$oversized" | sed 's/^/::error::Cloudflare Pages cannot upload files over 25 MiB: /'
            echo "::error::Move oversized assets to object storage or reduce them below 25 MiB before deploying to Cloudflare Pages."
            exit 1
          fi
          if [ "$files" -gt 20000 ]; then
            echo "::error::$files files is over the Cloudflare Pages limit of 20,000."
            exit 1
          fi
          # The Pages project is provisioned separately. Do not run "project create"
          # on every deployment: it fails when the project already exists.
          npx --yes wrangler@4.151.1 pages deploy site --project-name shoug-tech-site --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

  # Firebase Hosting preview for a safe hosting comparison. This does not
  # change the production domain or replace the existing deployments.
  firebase-preview:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the built site
        uses: actions/download-artifact@v5
        with:
          name: github-pages

      - name: Restore the built site
        run: |
          mkdir -p docs
          tar -xf artifact.tar -C docs

      - name: Deploy Firebase Hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHOUG_TECH }}
          projectId: shoug-tech
          channelId: codex-preview-${{ github.run_id }}
          expires: 7d

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Notify IndexNow of changed URLs
        run: >-
          python3 scripts/submit_indexnow.py
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
