<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>t</title>
  </head>
  <body>
    <pre id="o"></pre>
    <iframe
      id="f"
      style="width: 1280px; height: 900px"
      src="/academics/software-engineering/se423/extra-resources/final-roadmap/final-roadmap.html"
    ></iframe>
    <script>
      var f = document.getElementById("f"),
        o = [];
      function log(s) {
        o.push(s);
        document.getElementById("o").textContent = o.join("\n");
      }
      f.onload = function () {
        var w = f.contentWindow,
          errs = [];
        w.onerror = function (m) {
          errs.push(m);
        };
        setTimeout(function () {
          var d = f.contentDocument;
          var stats = [].map
            .call(
              d.querySelectorAll(".hero b, .stat b, [class*=stat] b"),
              function (b) {
                return b.parentNode.textContent.replace(/\s+/g, " ").trim();
              },
            )
            .slice(0, 4);
          log("stats: " + stats.join(" | "));
          var t = d.body.innerText;
          log(
            "level 02 heading: " +
              (t.match(/LVL_02[^\n]*\n[^\n]*/) || [""])[0].replace(
                /\n/g,
                " / ",
              ),
          );
          log(
            "coverage not-started count: " +
              (t.match(/Not started\s*(\d+)/) || [])[1],
          );
          var box = [].filter.call(
            d.querySelectorAll("details, [data-group], .group, button"),
            function (e) {
              return (
                /Stakeholders and communication/.test(e.textContent) &&
                e.textContent.length < 4000
              );
            },
          )[0];
          if (box) {
            box.click && box.click();
            if (box.tagName === "DETAILS") box.open = true;
          }
          setTimeout(function () {
            var g = [].filter.call(d.querySelectorAll("*"), function (e) {
              return (
                e.children.length > 2 &&
                /Stakeholders and communication/.test(e.textContent) &&
                /Register vs management plan/.test(e.textContent) &&
                e.textContent.length < 3000
              );
            })[0];
            log(
              "ch8 group: " +
                (g
                  ? g.innerText.replace(/\s+/g, " ").slice(0, 600)
                  : "NOT FOUND"),
            );
            log(
              "look-alike titles: " +
                [].map
                  .call(d.querySelectorAll("h3"), function (h) {
                    return h.textContent.trim();
                  })
                  .filter(function (x) {
                    return / vs /.test(x);
                  })
                  .join(" | "),
            );
            log(
              "recovery topic present: " +
                /A project in trouble/.test(t + d.body.textContent) +
                "  Ch 1.2–1.3 label: " +
                /Ch 1\.2–1\.3/.test(d.body.textContent),
            );
            var links = [].map
              .call(d.querySelectorAll("a[href]"), function (a) {
                return a.getAttribute("href");
              })
              .filter(function (h) {
                return /cheat-sheet.html#ch8|stakeholders|chapter-8|10-stakeholders/.test(
                  h,
                );
              });
            log(
              "ch8 links: " +
                links.length +
                " e.g. " +
                links.slice(0, 6).join(" , "),
            );
            log(errs.length ? "ERR " + errs : "no JS errors");
          }, 500);
        }, 1500);
      };
    </script>
  </body>
</html>
