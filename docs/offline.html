    <title>Offline — SHOUG.TECH</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/styles/a11y.css" />
    <style>
      :root {
        --bg: #050508;
        --surface: rgba(18, 18, 26, 0.85);
        --accent: #ff2a4b;
        --purple: #b829ea;
        --text: #f8f7fb;
        --dim: #8f8b9a;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        text-align: center;
      }

      .card {
        width: min(520px, 100%);
        border: 1px solid rgba(184, 41, 234, 0.24);
        background: var(--surface);
        padding: 46px 34px;
      }

      .tag {
        display: inline-block;
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        padding: 6px 12px;
        margin-bottom: 22px;
      }

      h1 {
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        margin-bottom: 14px;
      }

      p {
        color: var(--dim);
        font-size: 0.82rem;
        line-height: 1.7;
        margin-bottom: 26px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      a,
      button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        height: 38px;
        padding: 0 20px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      a:hover,
      button:hover {
        background: var(--accent);
        color: var(--bg);
      }

      .ghost {
        border-color: rgba(184, 41, 234, 0.34);
        color: var(--dim);
      }

      .ghost:hover {
        background: rgba(184, 41, 234, 0.1);
        color: var(--accent);
      }
    </style>
