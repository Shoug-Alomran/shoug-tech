<!doctype html>
<html lang="en" data-sg-styled>
  <head>
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/shoug-apple-touch-icon-v4.png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Mistakes | SHOUG.TECH</title>
    <meta
      name="description"
      content="Questions you missed on SHOUG.TECH quizzes, brought back after 1, 3 and 7 days until you get them right."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://shoug-tech.com/academics/review/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="/javascripts/html-theme-sync.js"></script>
    <style>
      :root {
        --bg: #f6f4fb;
        --surface: #ffffff;
        --border: rgba(22, 17, 31, 0.14);
        --text: #16111f;
        --muted: #5f566c;
        --accent: #9b1fd0;
        --good: #0f8a6c;
        --bad: #d61f45;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --sans: "Inter", system-ui, sans-serif;
      }
      html[data-theme="dark"] {
        --bg: #07040d;
        --surface: #110a1c;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f8f7fb;
        --muted: #a99fb5;
        --accent: #c75cf0;
        --good: #41d6c3;
        --bad: #ff536f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        overflow-x: clip;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 16px/1.6 var(--sans);
      }
      .wrap {
        width: min(1200px, 100%);
        margin: 0 auto;
        padding: 0 clamp(16px, 3vw, 32px);
      }
      .topbar {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .topbar .wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 60px;
        flex-wrap: wrap;
      }
      .brand {
        font: 700 0.8rem var(--mono);
        letter-spacing: 0.08em;
        color: var(--text);
        text-decoration: none;
      }
      .brand b {
        color: var(--accent);
      }
      .topbar-end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn {
        font: 600 0.85rem/1 var(--sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hero {
        padding: clamp(28px, 5vw, 56px) 0 20px;
      }
      .eyebrow {
        font: 700 0.72rem var(--mono);
        letter-spacing: 0.14em;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        line-height: 1.15;
        margin: 8px 0 10px;
      }
      .lede {
        color: var(--muted);
        margin: 0;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 22px 0 6px;
      }
      .stat {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 12px;
        padding: 10px 14px;
        font: 600 0.85rem var(--sans);
      }
      .stat b {
        font: 700 1.1rem var(--mono);
        color: var(--accent);
        margin-right: 6px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 18px 0;
      }
      select {
        font: 500 0.9rem var(--sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 12px;
      }
      .cards {
        display: grid;
        gap: 14px;
        padding-bottom: 60px;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 14px;
        padding: clamp(16px, 2.5vw, 24px);
      }
      .card-meta {
        font: 700 0.7rem var(--mono);
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .card-meta a {
        color: var(--accent);
      }
      .card-q {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 8px 0 14px;
      }
      .answer {
        border-top: 1px dashed var(--border);
        padding-top: 12px;
        margin-bottom: 14px;
      }
      .answer p {
        margin: 0 0 8px;
      }
      .answer .lab {
        font: 700 0.7rem var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-right: 6px;
      }
      .answer .right .lab {
        color: var(--good);
      }
      .answer .yours .lab {
        color: var(--bad);
      }
      .answer .why {
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .empty {
        border: 1px dashed var(--border);
        border-radius: 14px;
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }
      .empty a {
        color: var(--accent);
      }
      @media (max-width: 480px) {
        .actions .btn {
          flex: 1 1 auto;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="/academics/"><b>SHOUG.TECH</b> // REVIEW</a>
        <div class="topbar-end">
          <div data-page-search-host></div>
          <button class="btn" type="button" onclick="toggleTheme()">
            <span data-theme-label>Dark</span>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <div class="eyebrow">Spaced repetition</div>
        <h1>Review mistakes</h1>
        <p class="lede">
          Questions you missed on quizzes come back after 1 day. Get one right
          and it waits 3 days, then 7. After three right answers in a row it is
          retired. Saved in this browser only.
        </p>
        <div class="stats" id="stats"></div>
      </section>
      <div class="controls">
        <label for="course">Course</label>
        <select id="course"></select>
        <button class="btn" type="button" id="show-all">Review all now</button>
        <button class="btn" type="button" id="clear">Clear everything</button>
      </div>
      <div class="cards" id="cards" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        "use strict";
        var KEY = "shoug-quiz-mistakes",
          DAY = 86400000,
          STEPS = [1, 3, 7],
          showAll = false;
        function read() {
          try {
            var v = JSON.parse(localStorage.getItem(KEY));
            return Array.isArray(v) ? v : [];
          } catch (e) {
            return [];
          }
        }
        function write(list) {
          try {
            localStorage.setItem(KEY, JSON.stringify(list));
          } catch (e) {}
        }
        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }
        var courseSel = document.getElementById("course"),
          cardsEl = document.getElementById("cards"),
          statsEl = document.getElementById("stats");

        function update(id, fn) {
          write(
            read()
              .map(function (m) {
                return m.id === id ? fn(m) : m;
              })
              .filter(Boolean),
          );
          render();
        }

        function card(m) {
          var c = el("article", "card"),
            meta = el("div", "card-meta"),
            link = el("a", "", m.quiz || "Quiz");
          link.href = m.page;
          meta.appendChild(document.createTextNode((m.course || "") + " · "));
          meta.appendChild(link);
          c.appendChild(meta);
          c.appendChild(el("p", "card-q", m.q));
          var ans = el("div", "answer");
          ans.hidden = true;
          if (m.correct) {
            var r = el("p", "right");
            r.appendChild(el("span", "lab", "Answer"));
            r.appendChild(document.createTextNode(m.correct));
            ans.appendChild(r);
          }
          if (m.chosen) {
            var y = el("p", "yours");
            y.appendChild(el("span", "lab", "You said"));
            y.appendChild(document.createTextNode(m.chosen));
            ans.appendChild(y);
          }
          if (m.explain) ans.appendChild(el("p", "why", m.explain));
          if (!m.correct && !m.explain) {
            var go = el("p", "why");
            var a = el("a", "", "Open the quiz to check the answer");
            a.href = m.page;
            go.appendChild(a);
            ans.appendChild(go);
          }
          c.appendChild(ans);
          var acts = el("div", "actions"),
            reveal = el("button", "btn primary", "Show answer"),
            got = el("button", "btn", "I got it right"),
            miss = el("button", "btn", "I missed it again");
          [reveal, got, miss].forEach(function (b) {
            b.type = "button";
          });
          got.hidden = miss.hidden = true;
          reveal.addEventListener("click", function () {
            ans.hidden = false;
            reveal.hidden = true;
            got.hidden = miss.hidden = false;
          });
          got.addEventListener("click", function () {
            update(m.id, function (x) {
              var box = (x.box || 0) + 1;
              if (box >= STEPS.length) return null;
              x.box = box;
              x.due = Date.now() + STEPS[box] * DAY;
              return x;
            });
          });
          miss.addEventListener("click", function () {
            update(m.id, function (x) {
              x.box = 0;
              x.due = Date.now() + DAY;
              return x;
            });
          });
          acts.appendChild(reveal);
          acts.appendChild(got);
          acts.appendChild(miss);
          c.appendChild(acts);
          return c;
        }

        function render() {
          var all = read(),
            now = Date.now(),
            courses = {},
            chosen = courseSel.value;
          all.forEach(function (m) {
            if (m.course) courses[m.course] = (courses[m.course] || 0) + 1;
          });
          courseSel.innerHTML = "";
          [["", "All courses"]]
            .concat(
              Object.keys(courses)
                .sort()
                .map(function (k) {
                  return [k, k + " (" + courses[k] + ")"];
                }),
            )
            .forEach(function (o) {
              var opt = el("option", "", o[1]);
              opt.value = o[0];
              courseSel.appendChild(opt);
            });
          courseSel.value = courses[chosen] ? chosen : "";
          var scoped = all.filter(function (m) {
              return !courseSel.value || m.course === courseSel.value;
            }),
            due = scoped
              .filter(function (m) {
                return showAll || m.due <= now;
              })
              .sort(function (a, b) {
                return a.due - b.due;
              }),
            later =
              scoped.length -
              scoped.filter(function (m) {
                return m.due <= now;
              }).length;
          statsEl.innerHTML = "";
          [
            [
              scoped.filter(function (m) {
                return m.due <= now;
              }).length,
              "due now",
            ],
            [later, "coming back later"],
            [scoped.length, "saved"],
          ].forEach(function (s) {
            var d = el("div", "stat");
            d.appendChild(el("b", "", String(s[0])));
            d.appendChild(document.createTextNode(s[1]));
            statsEl.appendChild(d);
          });
          cardsEl.innerHTML = "";
          if (!due.length) {
            var e = el("div", "empty");
            if (!all.length) {
              e.appendChild(
                document.createTextNode(
                  "No missed questions yet. Take a quiz from any course and the ones you get wrong will show up here. ",
                ),
              );
              var a = el("a", "", "Browse courses");
              a.href = "/academics/";
              e.appendChild(a);
            } else
              e.textContent =
                "Nothing due right now. " +
                later +
                " question" +
                (later === 1 ? "" : "s") +
                " will come back on schedule, or press Review all now.";
            cardsEl.appendChild(e);
            return;
          }
          due.forEach(function (m) {
            cardsEl.appendChild(card(m));
          });
        }

        courseSel.addEventListener("change", render);
        document
          .getElementById("show-all")
          .addEventListener("click", function () {
            showAll = !showAll;
            this.textContent = showAll ? "Only what's due" : "Review all now";
            render();
          });
        document.getElementById("clear").addEventListener("click", function () {
          if (confirm("Delete every saved mistake from this browser?")) {
            write([]);
            render();
          }
        });
        render();
      })();
    </script>
  </body>
</html>
