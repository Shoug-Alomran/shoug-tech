    <style>
      :root {
        --bg: #f7f6f2;
        --ink: #1d1d1f;
        --muted: #6b6b70;
        --line: #c9c6bd;
        --card: #ffffff;
        --hl: #ffe58a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171a;
          --ink: #ececec;
          --muted: #9a9aa2;
          --line: #44464d;
          --card: #202226;
          --hl: #7a6414;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      h1 {
        font-size: 17px;
        margin: 0 12px 0 0;
      }
      button,
      input {
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      input {
        min-width: 200px;
      }
      .legend {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-left: auto;
      }
      .legend span b {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      #wrap {
        overflow: auto;
        padding: 24px 16px 80px;
      }
      #tree {
        transform-origin: 0 0;
        width: max-content;
      }

      /* horizontal tree */
      .branch {
        display: flex;
        align-items: center;
      }
      .kids {
        display: flex;
        flex-direction: column;
        margin-left: 18px;
        position: relative;
      }
      .kids::before {
        content: "";
        position: absolute;
        left: -18px;
        top: 50%;
        width: 18px;
        border-top: 2px solid var(--line);
      }
      .kid {
        position: relative;
        padding: 4px 0 4px 18px;
      }
      .kid::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-left: 2px solid var(--line);
      }
      .kid::after {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 18px;
        border-top: 2px solid var(--line);
      }
      .kid:first-child::before {
        top: 50%;
      }
      .kid:last-child::before {
        bottom: 50%;
      }
      .kid:only-child::before {
        display: none;
      }
      .collapsed > .kids,
      .collapsed > .node > .det {
        display: none;
      }

      .node {
        position: relative;
        background: var(--card);
        border: 2px solid hsl(var(--h) 55% 55%);
        border-radius: 10px;
        padding: 6px 10px;
        max-width: 330px;
        cursor: pointer;
        user-select: none;
      }
      .node .t {
        font-weight: 600;
      }
      .node .tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 6px;
      }
      .node .tog {
        display: inline-block;
        min-width: 16px;
        margin-left: 6px;
        color: hsl(var(--h) 60% 45%);
        font-weight: 700;
      }
      .node .det {
        margin: 6px 0 2px;
        padding-left: 16px;
        font-size: 12.5px;
      }
      .node .det li {
        margin: 2px 0;
      }
      .lv0 {
        background: hsl(var(--h) 40% 25%);
        color: #fff;
        border-color: transparent;
        font-size: 17px;
        padding: 10px 16px;
      }
      .lv0 .tog {
        color: #fff;
      }
      .lv1 {
        background: hsl(var(--h) 65% 50%);
        color: #fff;
        border-color: transparent;
      }
      .lv1 .tag {
        color: #ffffffcc;
      }
      .lv1 .tog {
        color: #fff;
      }
      .lv2 {
        background: hsl(var(--h) 70% 92%);
      }
      @media (prefers-color-scheme: dark) {
        .lv2 {
          background: hsl(var(--h) 35% 22%);
        }
      }
      .lv3 {
        border-style: solid;
        border-width: 1.5px;
      }
      .lv4 {
        border-style: dashed;
        border-width: 1.5px;
      }
      .off {
        opacity: 0.55;
      }
      .match {
        box-shadow: 0 0 0 4px var(--hl);
      }
      code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
    </style>

                  "2nd hex digit even = unicast, odd = multicast",
                  "All F = broadcast; source always unicast",
                ],

              {

          {

      let uid = 0;
      function build(n, lvl, hue, inheritOff) {
        const h = n.h ?? hue;
        const off = n.off || inheritOff;
        const br = document.createElement("div");
        br.className = "branch" + (lvl >= 1 ? " collapsed" : "");
        const node = document.createElement("div");
        node.className = "node lv" + Math.min(lvl, 4) + (off ? " off" : "");
        node.style.setProperty("--h", h);
        const hasMore = (n.c && n.c.length) || (n.d && n.d.length);
        node.innerHTML = `<span class="t"></span>${n.g ? `<span class="tag"></span>` : ""}${hasMore ? `<span class="tog">+</span>` : ""}`;
        node.querySelector(".t").textContent = n.t;
        if (n.g) node.querySelector(".tag").textContent = n.g;
        if (n.d) {
          const ul = document.createElement("ul");
          ul.className = "det";
          n.d.forEach((x) => {
            const li = document.createElement("li");
            li.textContent = x;
            ul.appendChild(li);
          });
          node.appendChild(ul);
        }
        node.dataset.text = (
          n.t +
          " " +
          (n.g || "") +
          " " +
          (n.d || []).join(" ")
        ).toLowerCase();
        br.appendChild(node);
        if (n.c) {
          const kids = document.createElement("div");
          kids.className = "kids";
          n.c.forEach((ch) => {
            const k = document.createElement("div");
            k.className = "kid";
            k.appendChild(build(ch, lvl + 1, h, off));
            kids.appendChild(k);
          });
          br.appendChild(kids);
        }
        if (hasMore) {
          node.addEventListener("click", () => {
            br.classList.toggle("collapsed");
            sync(br);
          });
        }
        return br;
      }
      function sync(br) {
        const tog = br.querySelector(":scope > .node .tog");
        if (tog)
          tog.textContent = br.classList.contains("collapsed") ? "+" : "−";
      }
      const tree = document.getElementById("tree");
      const root = build(DATA, 0, 220, false);
      root.classList.remove("collapsed");
      tree.appendChild(root);
      const all = () => [...tree.querySelectorAll(".branch")];
      all().forEach(sync);

      document.getElementById("ex").onclick = () => {
        all().forEach((b) => {
          b.classList.remove("collapsed");
          sync(b);
        });
      };
      function layersOnly() {
        all().forEach((b, i) => {
          b.classList.toggle("collapsed", b !== root);
          sync(b);
        });
      }
      document.getElementById("co").onclick = layersOnly;

      let z = 1;
      const setZ = () => (tree.style.transform = `scale(${z})`);
      document.getElementById("zi").onclick = () => {
        z = Math.min(1.6, z + 0.1);
        setZ();
      };
      document.getElementById("zo").onclick = () => {
        z = Math.max(0.4, z - 0.1);
        setZ();
      };

      document.getElementById("q").addEventListener("input", (e) => {
        const q = e.target.value.trim().toLowerCase();
        tree
          .querySelectorAll(".match")
          .forEach((n) => n.classList.remove("match"));
        if (!q) {
          layersOnly();
          return;
        }
        all().forEach((b) => {
          b.classList.add("collapsed");
        });
        let first = null;
        tree.querySelectorAll(".node").forEach((n) => {
          if (n.dataset.text.includes(q)) {
            n.classList.add("match");
            first = first || n;
            let b = n.parentElement;
            // open this node's own details, and all ancestors
            b.classList.remove("collapsed");
            while (b && b !== tree) {
              if (b.classList.contains("branch"))
                b.classList.remove("collapsed");
              b = b.parentElement;
            }
          }
        });
        all().forEach(sync);
        if (first)
          first.scrollIntoView({
            block: "center",
            inline: "center",
            behavior: "smooth",
          });
      });
    </script>
