    <script id="cs331-theme-preload">
      (function () {
        var keys = [
          "shoug-theme",
          "cs331-study-theme",
          "cs331-mindmap-theme",
          "cs331-chapter-mindmap-theme",
        ];
        function normalize(value) {
          if (value === "slate" || value === "dark") return "dark";
          if (value === "default" || value === "light") return "light";
          return null;
        }
        function parentTheme() {
          try {
            if (
              window.parent &&
              window.parent !== window &&
              window.parent.document
            ) {
              var el = window.parent.document.documentElement;
              return normalize(
                el.getAttribute("data-md-color-scheme") ||
                  el.dataset.theme ||
                  el.getAttribute("data-theme"),
              );
            }
          } catch (e) {}
          return null;
        }
        function savedTheme() {
          for (var i = 0; i < keys.length; i++) {
            var value = normalize(localStorage.getItem(keys[i]));
            if (value) return value;
          }
          return null;
        }
        var systemTheme =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme =
          parentTheme() || savedTheme() || systemTheme;
        try {
          localStorage.setItem(
            "shoug-theme",
            document.documentElement.dataset.theme,
          );
        } catch (_e) {}
      })();
    </script>

    <script>
      const mindMapData = {
        id: "interconnecting-devices",
        title: "Interconnecting Devices and VLANs",
        summary:
          "Network devices connect, extend, segment, and route traffic at different layers.",
        description:
          "<p>Network devices connect, extend, segment, and route traffic at different layers.</p>",
        children: [
          {
            id: "int-layer-devices",
            title: "Devices by Layer",
            summary:
              "A device role is easiest to remember by the layer where it operates.",
            description:
              "<p>A device role is easiest to remember by the layer where it operates.</p>",
            children: [
              {
                id: "int-repeater-hub",
                title: "Repeater and Hub",
                summary:
                  "Repeaters regenerate signals; hubs repeat bits to all ports and do not filter traffic.",
                description:
                  "<p>Repeaters regenerate signals; hubs repeat bits to all ports and do not filter traffic.</p>",
              },
              {
                id: "int-bridge-switch",
                title: "Bridge and Switch",
                summary:
                  "Bridges and switches operate at the data link layer and use MAC addresses.",
                description:
                  "<p>Bridges and switches operate at the data link layer and use MAC addresses.</p>",
              },
              {
                id: "int-router",
                title: "Router",
                summary:
                  "Routers operate at the network layer and forward packets using IP addresses.",
                description:
                  "<p>Routers operate at the network layer and forward packets using IP addresses.</p>",
              },
            ],
          },
          {
            id: "int-domains",
            title: "Domains and Segmentation",
            summary:
              "Interconnection changes collision and broadcast behavior.",
            description:
              "<p>Interconnection changes collision and broadcast behavior.</p>",
            children: [
              {
                id: "int-collision",
                title: "Collision Domains",
                summary:
                  "A switch separates collision domains per port; a hub keeps devices in the same collision domain.",
                description:
                  "<p>A switch separates collision domains per port; a hub keeps devices in the same collision domain.</p>",
              },
              {
                id: "int-broadcast",
                title: "Broadcast Domains",
                summary:
                  "Routers separate broadcast domains; switches usually forward broadcasts within a VLAN.",
                description:
                  "<p>Routers separate broadcast domains; switches usually forward broadcasts within a VLAN.</p>",
              },
              {
                id: "int-segmentation",
                title: "Segmentation Benefit",
                summary:
                  "Segmentation improves performance, organization, and control by limiting where traffic goes.",
                description:
                  "<p>Segmentation improves performance, organization, and control by limiting where traffic goes.</p>",
              },
            ],
          },
          {
            id: "int-vlans",
            title: "VLANs",
            summary: "VLANs create logical LANs on switched infrastructure.",
            description:
              "<p>VLANs create logical LANs on switched infrastructure.</p>",
            children: [
              {
                id: "int-vlan-purpose",
                title: "Purpose of VLANs",
                summary:
                  "VLANs group devices logically, even if they connect to different physical switch ports.",
                description:
                  "<p>VLANs group devices logically, even if they connect to different physical switch ports.</p>",
              },
              {
                id: "int-access-trunk",
                title: "Access vs Trunk Ports",
                summary:
                  "Access ports carry one VLAN for end devices; trunk ports carry multiple VLANs between switches.",
                description:
                  "<p>Access ports carry one VLAN for end devices; trunk ports carry multiple VLANs between switches.</p>",
              },
              {
                id: "int-tagging",
                title: "Frame Tagging",
                summary:
                  "Trunk links tag frames so switches know which VLAN each frame belongs to.",
                description:
                  "<p>Trunk links tag frames so switches know which VLAN each frame belongs to.</p>",
              },
            ],
          },
          {
            id: "int-routing-vlans",
            title: "Routing Between VLANs",
            summary:
              "Different VLANs need network-layer routing to communicate.",
            description:
              "<p>Different VLANs need network-layer routing to communicate.</p>",
            children: [
              {
                id: "int-router-on-stick",
                title: "Router-on-a-Stick",
                summary:
                  "One router interface can route between VLANs using subinterfaces and trunk tagging.",
                description:
                  "<p>One router interface can route between VLANs using subinterfaces and trunk tagging.</p>",
              },
              {
                id: "int-layer3-switch",
                title: "Layer-3 Switch",
                summary:
                  "A multilayer switch can perform switching and routing functions in one device.",
                description:
                  "<p>A multilayer switch can perform switching and routing functions in one device.</p>",
              },
              {
                id: "int-security",
                title: "VLAN Security Note",
                summary:
                  "VLANs help segmentation, but routing and policies still need proper access control.",
                description:
                  "<p>VLANs help segmentation, but routing and policies still need proper access control.</p>",
              },
            ],
          },
        ],
      };
      const state = {
        expanded: new Set([mindMapData.id]),
        active: mindMapData.id,
        matches: new Set(),
        scale: 1,
        panX: 80,
        panY: 120,
        dragging: false,
        lastX: 0,
        lastY: 0,
      };
      const viewport = document.getElementById("viewport"),
        world = document.getElementById("world"),
        nodesEl = document.getElementById("nodes"),
        linksEl = document.getElementById("links"),
        panel = document.getElementById("panel"),
        panelTitle = document.getElementById("panelTitle"),
        panelBody = document.getElementById("panelBody"),
        searchInput = document.getElementById("searchInput"),
        searchResults = document.getElementById("searchResults");
      const nodeMap = new Map(),
        parentMap = new Map(),
        layout = new Map(),
        C = { xGap: 330, yGap: 92, nodeW: 250, rootW: 285 };
      function index(n, p = null, d = 0) {
        n.depth = d;
        nodeMap.set(n.id, n);
        if (p) parentMap.set(n.id, p.id);
        (n.children || []).forEach((c) => index(c, n, d + 1));
      }
      function leaf(n) {
        return !n.children || !n.children.length;
      }
      function exp(n) {
        return state.expanded.has(n.id);
      }
      function tree(n, d = 0, c = { y: 0 }) {
        let y;
        if (exp(n) && !leaf(n)) {
          const ys = n.children.map((ch) => tree(ch, d + 1, c));
          y = (Math.min(...ys) + Math.max(...ys)) / 2;
        } else {
          y = c.y;
          c.y += C.yGap;
        }
        layout.set(n.id, { x: d * C.xGap, y, depth: d });
        return y;
      }
      function visible(n = mindMapData, a = []) {
        a.push(n);
        if (exp(n) && n.children) n.children.forEach((ch) => visible(ch, a));
        return a;
      }
      function conns(n = mindMapData, a = []) {
        if (exp(n) && n.children)
          n.children.forEach((ch) => {
            a.push([n, ch]);
            conns(ch, a);
          });
        return a;
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[ch],
        );
      }
      function strip(h) {
        const d = document.createElement("div");
        d.innerHTML = h;
        return d.textContent || "";
      }
      function render() {
        layout.clear();
        tree(mindMapData);
        const ns = visible();
        linksEl.innerHTML = conns()
          .map(([a, b]) => {
            const pa = layout.get(a.id),
              pb = layout.get(b.id),
              aw = a.depth === 0 ? C.rootW : C.nodeW,
              x1 = pa.x + aw,
              y1 = pa.y + 30,
              x2 = pb.x,
              y2 = pb.y + 30,
              m = (x1 + x2) / 2;
            return `<path class="connector" d="M ${x1} ${y1} C ${m} ${y1}, ${m} ${y2}, ${x2} ${y2}"></path>`;
          })
          .join("");
        nodesEl.innerHTML = ns
          .map((n) => {
            const p = layout.get(n.id),
              cl = ["node"];
            if (n.depth === 0) cl.push("root");
            if (leaf(n)) cl.push("leaf");
            if (exp(n) && !leaf(n)) cl.push("expanded");
            if (state.active === n.id) cl.push("active");
            if (state.matches.has(n.id)) cl.push("match");
            return `<div class="${cl.join(" ")}" data-id="${n.id}" style="left:${p.x}px;top:${p.y}px"><div class="node-title"><span class="chev">${leaf(n) ? "i" : "›"}</span><span>${esc(n.title)}</span></div><div class="node-desc">${esc(n.summary || "")}</div></div>`;
          })
          .join("");
        nodesEl.querySelectorAll(".node").forEach(
          (el) =>
            (el.onclick = (e) => {
              e.stopPropagation();
              select(el.dataset.id, true);
            }),
        );
        apply();
      }
      function select(id, user = false) {
        const n = nodeMap.get(id);
        state.active = id;
        if (leaf(n)) openPanel(n);
        else if (user) {
          state.expanded.has(id)
            ? state.expanded.delete(id)
            : state.expanded.add(id);
          closePanel();
        }
        render();
      }
      function openPanel(n) {
        panelTitle.textContent = n.title;
        panelBody.innerHTML = n.description || `<p>${esc(n.summary || "")}</p>`;
        panel.classList.add("open");
      }
      function closePanel() {
        panel.classList.remove("open");
      }
      function ancestors(id) {
        const a = [];
        let c = id;
        while (parentMap.has(c)) {
          c = parentMap.get(c);
          a.push(c);
        }
        return a;
      }
      function focus(id) {
        ancestors(id).forEach((a) => state.expanded.add(a));
        state.active = id;
        render();
        const p = layout.get(id),
          r = viewport.getBoundingClientRect();
        state.panX = r.width / 2 - (p.x + 120) * state.scale;
        state.panY = r.height / 2 - (p.y + 30) * state.scale;
        apply();
        if (leaf(nodeMap.get(id))) openPanel(nodeMap.get(id));
      }
      function apply() {
        world.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;
      }
      function zoom(v) {
        state.scale = Math.min(1.8, Math.max(0.45, v));
        apply();
      }
      function expandAll() {
        nodeMap.forEach((n) => {
          if (!leaf(n)) state.expanded.add(n.id);
        });
        render();
      }
      function collapseAll() {
        state.expanded = new Set([mindMapData.id]);
        closePanel();
        render();
      }
      function search(q) {
        q = q.trim().toLowerCase();
        state.matches.clear();
        searchResults.innerHTML = "";
        if (!q) {
          searchResults.style.display = "none";
          render();
          return;
        }
        const res = [];
        nodeMap.forEach((n) => {
          if (
            `${n.title} ${n.summary || ""} ${strip(n.description || "")}`
              .toLowerCase()
              .includes(q)
          ) {
            state.matches.add(n.id);
            res.push(n);
          }
        });
        searchResults.innerHTML =
          res
            .map(
              (n) =>
                `<div class="result" data-id="${n.id}"><strong>${esc(n.title)}</strong><small>${esc(n.summary || "")}</small></div>`,
            )
            .join("") || '<div class="result">No matches</div>';
        searchResults.style.display = "block";
        searchResults.querySelectorAll("[data-id]").forEach(
          (el) =>
            (el.onclick = () => {
              searchResults.style.display = "none";
              focus(el.dataset.id);
            }),
        );
        render();
      }
      function exportPng() {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="100%" height="100%" fill="#0f172a"/><text x="40" y="70" fill="#e5eefc" font-family="Arial" font-size="34" font-weight="700">${esc(mindMapData.title)}</text><text x="40" y="115" fill="#94a3b8" font-family="Arial" font-size="18">Export from CS331 chapter mind map</text></svg>`;
        const img = new Image(),
          url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = 1200;
          c.height = 700;
          const x = c.getContext("2d");
          x.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          const a = document.createElement("a");
          a.download = "interconnecting-devices-mindmap.png";
          a.href = c.toDataURL("image/png");
          a.click();
        };
        img.src = url;
      }
      function initTheme() {
        const s =
          localStorage.getItem("shoug-theme") ||
          localStorage.getItem("cs331-mindmap-theme") ||
          localStorage.getItem("ethcs303-mindmap-theme") ||
          "dark";
        document.documentElement.dataset.theme = s;
        document.getElementById("themeToggle").textContent =
          s === "dark" ? "Light" : "Dark";
      }
      index(mindMapData);
      render();
      initTheme();
      document.getElementById("zoomIn").onclick = () =>
        zoom(state.scale + 0.12);
      document.getElementById("zoomOut").onclick = () =>
        zoom(state.scale - 0.12);
      document.getElementById("resetView").onclick = () => {
        state.scale = 1;
        state.panX = 80;
        state.panY = 120;
        apply();
      };
      document.getElementById("expandAll").onclick = expandAll;
      document.getElementById("collapseAll").onclick = collapseAll;
      document.getElementById("exportPng").onclick = exportPng;
      document.getElementById("closePanel").onclick = closePanel;
      document.getElementById("themeToggle").onclick = () => {
        const n =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = n;
        localStorage.setItem("cs331-chapter-mindmap-theme", n);
        document.getElementById("themeToggle").textContent =
          n === "dark" ? "Light" : "Dark";
      };
      searchInput.oninput = (e) => search(e.target.value);
      viewport.onmousedown = (e) => {
        if (e.target.closest(".node")) return;
        state.dragging = true;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        viewport.classList.add("dragging");
      };
      window.onmousemove = (e) => {
        if (!state.dragging) return;
        state.panX += e.clientX - state.lastX;
        state.panY += e.clientY - state.lastY;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        apply();
      };
      window.onmouseup = () => {
        state.dragging = false;
        viewport.classList.remove("dragging");
      };
      viewport.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          zoom(state.scale + (e.deltaY < 0 ? 0.08 : -0.08));
        },
        { passive: false },
      );
    </script>

    <script id="cs331-theme-sync">
      (function () {
        var root = document.documentElement;
        var keys = [
          "shoug-theme",
          "cs331-study-theme",
          "cs331-mindmap-theme",
          "cs331-chapter-mindmap-theme",
        ];
        function normalize(value) {
          if (value === "slate" || value === "dark") return "dark";
          if (value === "default" || value === "light") return "light";
          return null;
        }
        function parentTheme() {
          try {
            if (
              window.parent &&
              window.parent !== window &&
              window.parent.document
            ) {
              var el = window.parent.document.documentElement;
              return normalize(
                el.getAttribute("data-md-color-scheme") ||
                  el.dataset.theme ||
                  el.getAttribute("data-theme"),
              );
            }
          } catch (e) {}
          return null;
        }
        function savedTheme() {
          for (var i = 0; i < keys.length; i++) {
            var value = normalize(localStorage.getItem(keys[i]));
            if (value) return value;
          }
          return null;
        }
        function buttonLabel(button, theme) {
          if (!button) return;
          if (button.id === "themeBtn") {
            button.textContent =
              theme === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
          } else {
            button.textContent = theme === "dark" ? "Light mode" : "Dark mode";
          }
        }
        function updateButtons(theme) {
          document
            .querySelectorAll("#themeToggle, #themeBtn")
            .forEach(function (button) {
              buttonLabel(button, theme);
            });
        }
        function applyTheme(theme, persist) {
          theme = normalize(theme) || "dark";
          root.dataset.theme = theme;
          root.setAttribute("data-theme", theme);
          try {
            localStorage.setItem(
              "shoug-theme",
              document.documentElement.getAttribute("data-theme"),
            );
          } catch (_e) {}
          if (persist)
            keys.forEach(function (key) {
              localStorage.setItem(key, theme);
            });
          updateButtons(theme);
        }
        function currentTheme() {
          return (
            normalize(root.dataset.theme || root.getAttribute("data-theme")) ||
            "dark"
          );
        }
        applyTheme(parentTheme() || savedTheme() || currentTheme(), false);
        document
          .querySelectorAll("#themeToggle, #themeBtn")
          .forEach(function (button) {
            button.addEventListener("click", function () {
              window.setTimeout(function () {
                applyTheme(currentTheme(), true);
              }, 0);
            });
          });
        try {
          if (
            window.parent &&
            window.parent !== window &&
            window.parent.document
          ) {
            var parentRoot = window.parent.document.documentElement;
            new MutationObserver(function () {
              var theme = parentTheme();
              if (theme) applyTheme(theme, false);
            }).observe(parentRoot, {
              attributes: true,
              attributeFilter: ["data-md-color-scheme", "data-theme"],
            });
          }
        } catch (e) {}
      })();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
  </body>
