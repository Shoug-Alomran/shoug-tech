    <script>
      const mindmapData = [
        {
          title: "Conceptual Design Overview",
          icon: "🗄️",
          level: 0,
          open: true,
          content: [
            {
              title: "Purpose",
              color: "green",
              items: [
                "Design database BEFORE implementation",
                "Agree on structure before deciding on implementation",
                "Consider: entities to model, relationships, constraints",
                "Achieve good design using formal measures",
                "ER diagrams can be translated to relational schema",
              ],
            },
            {
              title: "Key Questions",
              color: "blue",
              items: [
                "What entities should be part of the application?",
                "How should they be linked?",
                "What-rules/constraints-exist-in-the-domain",
                "How to achieve good designs?",
              ],
            },
          ],
        },
        {
          title: "Schemas and Instances",
          icon: "📦",
          level: 0,
          open: true,
          content: [
            {
              title: "Schema (Logical Structure)",
              items: [
                "Database design - the structure",
                "Example: Student takes Course",
                "Logical schema: design at logical level",
                "Physical schema: design at storage level",
                "External schema: views for different users",
                "Schema changes very infrequently",
              ],
            },
            {
              title: "Instance (Data State)",
              color: "green",
              items: [
                "The actual data at a particular moment in time",
                "Filling database with data = creating instances",
                "Database state changes every time updated",
                "Database instance: current snapshot of all data",
              ],
            },
          ],
        },
        {
          title: "Entities and Entity Types",
          icon: "⬜",
          level: 0,
          open: true,
          content: [
            {
              title: "Entity",
              items: [
                "Real world object distinguishable from other objects",
                "Usually represented as NOUNS",
                "Examples: specific student, course, project",
                "Has attributes that describe it",
              ],
            },
            {
              title: "Entity Type (Entity Set)",
              color: "green",
              items: [
                "Collection of similar entities",
                "Example: EMPLOYEE is entity set for all employees",
                "All entities in set have same attributes",
                "Each has a KEY attribute (unique identifier)",
                "Displayed as RECTANGLE in ER diagrams",
              ],
            },
            {
              title: "ER Notation",
              isDiagram: true,
              content: "[EMPLOYEE] ← Rectangle represents entity type",
            },
          ],
        },
        {
          title: "Attributes",
          icon: "⭕",
          level: 0,
          open: true,
          children: [
            {
              title: "Simple vs Composite",
              icon: "⭕",
              level: 1,
              content: [
                {
                  title: "Simple Attributes",
                  color: "blue",
                  items: [
                    "Single atomic value",
                    "Cannot be divided further",
                    "Examples: SSN, Sex, Age",
                    "Displayed as OVAL in ER diagrams",
                  ],
                },
                {
                  title: "Composite Attributes",
                  color: "purple",
                  items: [
                    "Can be divided into smaller parts",
                    "Forms a hierarchy",
                    "Example: Name(FirstName, MiddleName, LastName)",
                    "Example: Address(Street(Number, Name), City, State, Zip)",
                    "Components shown connected to parent oval",
                  ],
                },
              ],
            },
            {
              title: "Single vs Multi-valued",
              icon: "⭕",
              level: 1,
              content: [
                {
                  title: "Single-valued",
                  color: "blue",
                  items: [
                    "One value per entity",
                    "Most common type",
                    "Example: DateOfBirth, SSN",
                  ],
                },
                {
                  title: "Multi-valued Attributes",
                  color: "purple",
                  items: [
                    "Set of values for same entity",
                    "Example: Colors of a car - {Color}",
                    "Example: College degrees - {CollegeDegree}",
                    "May have bounds: {Color}1..3 (min 1, max 3)",
                    "Displayed as DOUBLE OVAL in ER diagrams",
                  ],
                },
              ],
            },
            {
              title: "Stored vs Derived",
              icon: "⭕",
              level: 1,
              content: [
                {
                  title: "Stored Attributes",
                  color: "blue",
                  items: [
                    "Value stored in database",
                    "Example: BirthDate",
                    "Base value from which others derived",
                  ],
                },
                {
                  title: "Derived Attributes",
                  color: "purple",
                  items: [
                    "Value can be calculated from other attributes",
                    "Example: Age (derived from BirthDate and current date)",
                    "Example: Number_of_employees (count from relationships)",
                    "Displayed as DASHED OVAL in ER diagrams",
                  ],
                },
              ],
            },
            {
              title: "Complex Attributes",
              icon: "⭕",
              level: 1,
              content: [
                {
                  title: "Complex (Nested)",
                  color: "pink",
                  items: [
                    "Combination of composite and multi-valued",
                    "Can be nested arbitrarily (though rare)",
                    "Example: {PreviousDegrees(College, Year, Degree, Field)}",
                    "Multiple degrees, each with 4 components",
                    "Generally NOT a good design technique",
                  ],
                },
              ],
            },
          ],
        },
        {
          title: "Keys",
          icon: "🔑",
          level: 0,
          open: true,
          content: [
            {
              title: "Super-key",
              items: [
                "Set of attributes SK where no two tuples have same SK value",
                "Uniquely identifies entity",
                "Example: {State, Reg#, SerialNo} for CAR",
              ],
            },
            {
              title: "Key (Candidate Key)",
              color: "green",
              items: [
                "MINIMAL super-key",
                "Removing any attribute → no longer a super-key",
                "Example: {State, Reg#} and {SerialNo} are keys for CAR",
                "Key ⊂ Super-key (all keys are super-keys)",
              ],
            },
            {
              title: "Primary Key",
              color: "blue",
              items: [
                "One candidate key chosen arbitrarily",
                "UNDERLINED in ER diagrams",
                "Provides tuple identity",
                "Used to reference tuple from another tuple",
                "Rule: Choose smallest key (in terms of attributes)",
              ],
            },
            {
              title: "Key Notation",
              isDiagram: true,
              content: "[SSN] ← Underlined = Primary Key",
            },
          ],
        },
        {
          title: "Relationships",
          icon: "🔗",
          level: 0,
          open: true,
          content: [
            {
              title: "Relationship Definition",
              items: [
                "Associates 2+ entities with specific meaning",
                "Usually represented as VERBS",
                "Example: EMPLOYEE 'works on' PROJECT",
                "Example: EMPLOYEE 'manages' DEPARTMENT",
                "Can have attributes (especially M:N)",
              ],
            },
            {
              title: "Relationship Type",
              color: "green",
              items: [
                "Groups relationships of same type",
                "Schema description of relationship",
                "Identifies: name, participating entities, constraints",
                "Displayed as DIAMOND in ER diagrams",
              ],
            },
            {
              title: "ER Notation",
              isDiagram: true,
              content: "[EMPLOYEE]  -  -  ◊WORKS_ON◊  -  -  [PROJECT]",
            },
          ],
          children: [
            {
              title: "Relationship Degree (Arity)",
              icon: "🌳",
              level: 1,
              content: [
                {
                  title: "Unary (Recursive)",
                  color: "blue",
                  items: [
                    "Relates entity to itself",
                    "Also called self-referencing relationship",
                    "Example: EMPLOYEE supervises EMPLOYEE",
                    "Role names needed to distinguish participations",
                    "Example: supervisor role vs. subordinate role",
                  ],
                },
                {
                  title: "Binary",
                  color: "purple",
                  items: [
                    "Most common type",
                    "Relates two entity types",
                    "Example: EMPLOYEE works_for DEPARTMENT",
                    "Example: STUDENT enrolls_in COURSE",
                  ],
                },
                {
                  title: "Ternary (n-ary)",
                  color: "pink",
                  items: [
                    "Relates three or more entity types",
                    "Example: SUPPLIER supplies PART to PROJECT",
                    "NOT equivalent to multiple binary relationships",
                    "Constraints harder to specify (n > 2)",
                    "Can sometimes use weak entity instead",
                  ],
                },
              ],
            },
            {
              title: "Cardinality Constraints",
              icon: "⚠️",
              level: 1,
              content: [
                {
                  title: "One-to-One (1:1)",
                  items: [
                    "Entity in A → at most 1 entity in B",
                    "Entity in B → at most 1 entity in A",
                    "Example: EMPLOYEE manages DEPARTMENT",
                    "One employee manages at most one department",
                    "One department is managed by at most one employee",
                  ],
                },
                {
                  title: "One-to-Many (1:N)",
                  color: "green",
                  items: [
                    "Entity in A → any number of entities in B",
                    "Entity in B → at most 1 entity in A",
                    "Example: DEPARTMENT has EMPLOYEES",
                    "One department has many employees",
                    "One employee works for one department",
                  ],
                },
                {
                  title: "Many-to-One (N:1)",
                  color: "blue",
                  items: [
                    "Opposite of 1:N",
                    "Entity in A → at most 1 entity in B",
                    "Entity in B → any number in A",
                    "Example: EMPLOYEES work_for DEPARTMENT",
                  ],
                },
                {
                  title: "Many-to-Many (M:N)",
                  color: "purple",
                  items: [
                    "Entity in A → any number in B",
                    "Entity in B → any number in A",
                    "Example: EMPLOYEE works_on PROJECT",
                    "Employee works on many projects",
                    "Project has many employees working on it",
                  ],
                },
                {
                  title: "Notation Examples",
                  isDiagram: true,
                  content: `1:1 → [E]  - 1 -  ◊REL◊  - 1 -  [D]
1:N → [D]  - 1 -  ◊REL◊  - N -  [E]
M:N → [E]  - M -  ◊REL◊  - N -  [P]`,
                },
              ],
            },
            {
              title: "Participation Constraints",
              icon: "⚠️",
              level: 1,
              content: [
                {
                  title: "Total Participation",
                  items: [
                    "Every entity MUST participate in relationship",
                    "Existence dependency",
                    "Displayed as DOUBLE LINE in ER diagrams",
                    "Example: Every student MUST be enrolled in ≥1 course",
                    "Also called mandatory participation",
                  ],
                },
                {
                  title: "Partial Participation",
                  color: "green",
                  items: [
                    "Entity MAY OR MAY NOT participate",
                    "No existence dependency",
                    "Displayed as SINGLE LINE in ER diagrams",
                    "Example: Course may have 0 enrollments",
                    "Also called optional participation",
                  ],
                },
                {
                  title: "Notation",
                  isDiagram: true,
                  content: `[COURSE]  -  ◊enrolls◊ == [STUDENT]
    ↑single      ↑double (total)`,
                },
              ],
            },
            {
              title: "(Min, Max) Notation",
              icon: "⚠️",
              level: 1,
              content: [
                {
                  title: "Alternative Constraint Notation",
                  items: [
                    "Each entity participates in min to max instances",
                    "Default: (0,n) - no constraint",
                    "Must have: min ≤ max, min ≥ 0, max ≥ 1",
                    "Derived from mini-world constraints",
                  ],
                },
                {
                  title: "Examples",
                  color: "blue",
                  items: [
                    "EMPLOYEE (0,1) MANAGES DEPARTMENT (1,1)",
                    "→ Employee manages 0 or 1 department",
                    "→ Department managed by exactly 1 employee",
                    "EMPLOYEE (1,1) WORKS_FOR DEPARTMENT (0,n)",
                    "→ Employee works for exactly 1 department",
                    "→ Department has 0 to n employees",
                  ],
                },
                {
                  title: "Reading (min,max)",
                  color: "purple",
                  items: [
                    "Read numbers NEXT to entity type",
                    "Look AWAY from entity type",
                    "Example: (1,1) next to EMPLOYEE in MANAGES",
                    "→ Each employee can manage 1 to 1 departments",
                  ],
                },
              ],
            },
          ],
        },
        {
          title: "Weak Entity Types",
          icon: "📦",
          level: 0,
          open: true,
          content: [
            {
              title: "Definition",
              items: [
                "Entity WITHOUT a key attribute",
                "Identification-dependent on another entity",
                "Must participate in identifying relationship (total)",
                "Identified by: partial key + owner entity key",
                "Cannot exist without owner entity",
              ],
            },
            {
              title: "Components",
              color: "green",
              items: [
                "Owner (Identifying) Entity: Strong entity",
                "Weak Entity: Dependent entity",
                "Identifying Relationship: Connects them",
                "Partial Key: Attribute(s) that partially identify",
              ],
            },
            {
              title: "Example: DEPENDENT",
              color: "blue",
              items: [
                "DEPENDENT is weak entity",
                "EMPLOYEE is owner entity",
                "DEPENDENT_OF is identifying relationship",
                "Dependent_name is partial key",
                "Identified by: (SSN, Dependent_name)",
              ],
            },
            {
              title: "ER Notation",
              isDiagram: true,
              content: `╔══════════╗  ═══╬═══  ╔═══════════╗
║ EMPLOYEE ║ 1     N  ║ DEPENDENT ║
╚══════════╝ DEPENDENT_OF ╚═══════════╝
↑double lines = weak entity
↑double diamond = identifying relationship`,
            },
          ],
        },
        {
          title: "ER Diagram Conventions",
          icon: "📋",
          level: 0,
          open: true,
          content: [
            {
              title: "Naming Conventions",
              items: [
                "NOUNS for entity types and attributes",
                "VERBS for relationship types",
                "Choose names that convey meaning",
                "Read diagrams left-to-right, top-to-bottom",
                "Entity types: UPPERCASE",
                "Attributes: Capitalized",
                "Role names: lowercase",
              ],
            },
            {
              title: "Notation Summary",
              color: "green",
              items: [
                "Rectangle = Entity Type",
                "Double Rectangle = Weak Entity",
                "Oval = Attribute",
                "Double Oval = Multi-valued Attribute",
                "Dashed Oval = Derived Attribute",
                "Diamond = Relationship",
                "Double Diamond = Identifying Relationship",
                "Underline-=-Primary-Key-/-Partial-Key-(dashed)",
              ],
            },
          ],
        },
        {
          title: "Example: COMPANY Database",
          icon: "🏢",
          level: 0,
          content: [
            {
              title: "Requirements",
              items: [
                "Company organized into DEPARTMENTS",
                "Each department: name, number, manager, start date, locations",
                "Department controls PROJECTs",
                "Each project: name, number, single location",
                "EMPLOYEE: SSN, address, salary, sex, birthdate",
                "Employee works for 1 department, works on several projects",
                "Track-hours/week-on-each-project",
                "Track direct supervisor",
                "Each employee has DEPENDENTs",
                "Dependent: name, sex, birthdate, relationship",
              ],
            },
            {
              title: "Entity Types Identified",
              color: "green",
              items: [
                "DEPARTMENT",
                "PROJECT",
                "EMPLOYEE",
                "DEPENDENT (weak entity)",
              ],
            },
            {
              title: "Relationship Types",
              color: "blue",
              items: [
                "WORKS_FOR: EMPLOYEE to DEPARTMENT (N:1)",
                "MANAGES: EMPLOYEE to DEPARTMENT (1:1)",
                "CONTROLS: DEPARTMENT to PROJECT (1:N)",
                "WORKS_ON: EMPLOYEE to PROJECT (M:N)",
                "SUPERVISION: EMPLOYEE to EMPLOYEE (1:N, recursive)",
                "DEPENDENTS_OF: EMPLOYEE to DEPENDENT (1:N, identifying)",
              ],
            },
          ],
        },
        {
          title: "Design Guidelines",
          icon: "💡",
          level: 0,
          content: [
            {
              title: "Best Practices",
              items: [
                "Entity vs Attribute: Use entity if has multiple attributes or relationships",
                "Entity vs Relationship: Model as relationship if associates entities",
                "Binary vs Ternary: Use binary when possible, ternary when needed",
                "Avoid redundancy: Don't store same info in multiple places",
                "Choose appropriate cardinalities: Reflect real-world constraints",
                "Use weak entities: When entity depends on another for identification",
              ],
            },
          ],
        },
      ];

      function createContentBox(box) {
        if (box.isDiagram) {
          return `
                    <div class="diagram-box">
                        <div class="diagram-title">
                            📊 ${box.title}
                        </div>
                        <div class="diagram-content">${box.content}</div>
                    </div>
                `;
        }

        return `
                <div class="content-box">
                    <div class="content-title ${box.color || ""}">${box.title}</div>
                    <ul class="content-list">
                        ${box.items.map((item) => `<li>${item}</li>`).join("")}
                    </ul>
                </div>
            `;
      }

      function createNode(node) {
        const hasChildren = node.children && node.children.length > 0;
        const hasContent = node.content && node.content.length > 0;
        const showChevron = hasChildren || hasContent;

        let html = `
                <div class="node level-${node.level} ${node.open ? "open" : ""}" data-node-id="${Math.random()}">
                    <div class="node-header">
                        ${showChevron ? '<span class="chevron">▶</span>' : ""}
                        <span class="icon">${node.icon}</span>
                        <span class="node-title">${node.title}</span>
                    </div>
                    <div class="node-content">
            `;

        if (hasContent) {
          html += node.content.map((box) => createContentBox(box)).join("");
        }

        if (hasChildren) {
          html += node.children.map((child) => createNode(child)).join("");
        }

        html += `
                    </div>
                </div>
            `;

        return html;
      }

      // Render mind map
      const mindmapContainer = document.getElementById("mindmap");
      mindmapContainer.innerHTML = mindmapData
        .map((node) => createNode(node))
        .join("");

      // Add click handlers
      document.querySelectorAll(".node-header").forEach((header) => {
        header.addEventListener("click", (e) => {
          const node = e.currentTarget.parentElement;
          node.classList.toggle("open");
        });
      });
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
  </body>
</html>
