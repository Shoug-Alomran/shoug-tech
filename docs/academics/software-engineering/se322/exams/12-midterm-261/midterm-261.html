    <style>
      :root {
        --bg: #f7f8fa;
        --card: #fff;
        --text: #2d3035;
        --muted: #666d76;
        --border: #d9dde3;
        --soft: #f4f5f7;
        --good: #6b9b70;
        --goodbg: #eaf4ea;
        --bad: #c85b4e;
        --badbg: #fff0ec;
        --note: #8a622d;
        --notebg: #fff1df;
        --accent: #59636f;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      html[data-theme="dark"] {
        --bg: #17191d;
        --card: #22252b;
        --text: #f2f3f5;
        --muted: #b4bac3;
        --border: #3b4048;
        --soft: #2a2e35;
        --good: #8bc391;
        --goodbg: #203326;
        --bad: #ef8a7d;
        --badbg: #3a2423;
        --note: #e1b875;
        --notebg: #392f20;
        --accent: #d2d7de;
        --shadow: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        line-height: 1.42;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .topin {
        max-width: 1180px;
        margin: auto;
        padding: 14px clamp(14px, 3vw, 28px);
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        font-weight: 750;
        font-size: clamp(16px, 2.5vw, 22px);
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        font: inherit;
      }
      .iconbtn,
      .submit,
      .navbtn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
      }
      .iconbtn:hover,
      .navbtn:hover {
        background: var(--soft);
      }
      .submit {
        background: var(--text);
        color: var(--card);
        font-weight: 700;
        border-color: var(--text);
      }
      .wrap {
        max-width: 1180px;
        margin: 24px auto 80px;
        padding: 0 clamp(12px, 3vw, 28px);
      }
      .progress {
        height: 6px;
        background: var(--border);
        border-radius: 99px;
        overflow: hidden;
        margin: 12px 0 22px;
      }
      .bar {
        height: 100%;
        width: 0;
        background: var(--good);
        transition: 0.3s;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
        margin: 0 0 22px;
      }
      .qhead {
        padding: 22px clamp(18px, 3vw, 30px) 8px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-start;
      }
      .qnum {
        font-size: clamp(20px, 3vw, 27px);
        font-weight: 700;
      }
      .mark {
        text-align: right;
        white-space: nowrap;
        color: var(--muted);
      }
      .status.good {
        color: var(--good);
      }
      .status.bad {
        color: var(--bad);
      }
      .qbody {
        padding: 10px clamp(18px, 3vw, 30px) 26px;
        font-size: clamp(16px, 2vw, 19px);
      }
      .prompt {
        font-weight: 700;
        margin-bottom: 4px;
      }
      .normal {
        font-weight: 400;
      }
      .instruction {
        color: var(--muted);
        margin-bottom: 16px;
      }
      .option {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 34px;
        gap: 12px;
        align-items: center;
        padding: 13px 12px;
        border-radius: 10px;
        margin: 5px 0;
        cursor: pointer;
      }
      .option:hover {
        background: var(--soft);
      }
      .option input {
        width: 22px;
        height: 22px;
        accent-color: var(--good);
      }
      .letter {
        display: inline-block;
        width: 34px;
        color: var(--muted);
      }
      .feedback {
        display: none;
        padding: 18px clamp(18px, 3vw, 30px);
        border-top: 1px solid var(--border);
        background: var(--notebg);
        color: var(--note);
      }
      .feedback.good {
        background: var(--goodbg);
        color: var(--good);
      }
      .feedback.bad {
        background: var(--badbg);
        color: var(--bad);
      }
      .feedback.show {
        display: block;
      }
      .matchrow {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(210px, 0.8fr);
        gap: 18px;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
      }
      select,
      input[type="text"],
      textarea {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: var(--soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      select.correct,
      input.correct,
      textarea.correct {
        border-color: var(--good);
        outline: 2px solid color-mix(in srgb, var(--good) 25%, transparent);
      }
      select.wrong,
      input.wrong,
      textarea.wrong {
        border-color: var(--bad);
        outline: 2px solid color-mix(in srgb, var(--bad) 20%, transparent);
      }
      .mini {
        display: none;
        margin-top: 8px;
        font-size: 14px;
      }
      .mini.show {
        display: block;
      }
      .mini.good {
        color: var(--good);
      }
      .mini.bad {
        color: var(--bad);
      }
      .scenario {
        font-weight: 400;
        margin: 6px 0 16px;
      }
      .fieldrow {
        display: grid;
        grid-template-columns: minmax(180px, 0.45fr) minmax(0, 1fr);
        gap: 14px;
        margin: 10px 0;
        align-items: center;
      }
      .placeholder {
        border: 2px dashed var(--border);
        border-radius: 16px;
        min-height: 230px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        color: var(--muted);
        background: var(--soft);
      }
      .solution-img {
        display: none;
        max-width: 100%;
        height: auto;
        max-height: 70vh;
        object-fit: contain;
        margin: 16px auto 0;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .solution-img.show {
        display: block;
      }
      .bottom {
        position: sticky;
        bottom: 0;
        background: color-mix(in srgb, var(--bg) 94%, transparent);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
      }
      .bottomin {
        max-width: 1180px;
        margin: auto;
        padding: 12px clamp(14px, 3vw, 28px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .score {
        font-weight: 700;
      }
      @media (max-width: 700px) {
        .matchrow,
        .fieldrow {
          grid-template-columns: 1fr;
        }
        .qhead {
          padding-top: 18px;
        }
        .mark {
          font-size: 13px;
        }
        .top .sub {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="topin">
        <div>
          <div class="title">SE322 — Midterm 261 Practice Exam</div>
          <div class="sub">
            Interactive reconstruction from your exam screenshots
          </div>
        </div>
        <div class="actions">
          <button class="iconbtn" id="theme" aria-label="Toggle theme">
            ◐ Theme
          </button>
        </div>
      </div>
    </header>
    <main class="wrap">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div id="exam"></div>
    </main>
    <footer class="bottom">
      <div class="bottomin">
        <div class="score" id="score">Not submitted</div>
        <button class="submit" id="submit">Submit all questions</button>
      </div>
    </footer>
    <script>
      const Q = [
        {
          id: 1,
          type: "multi",
          points: 1,
          prompt:
            "Which FOUR of the following are key tasks performed during the Software Architecture Design effort?",
          instruction: "Select four answers.",
          options: [
            ["a", "Designing individual algorithms"],
            ["b", "Identifying architectural styles and patterns"],
            ["c", "Performing unit testing"],
            ["d", "Identifying appropriate architectural views"],
            ["e", "Installing the software on end-user devices"],
            ["f", "Maintaining the operational software"],
            ["g", "Preparing user training materials"],
            ["h", "Identifying the system’s major components and interfaces"],
            ["i", "Writing the source code for system components"],
            ["j", "Identifying stakeholders’ concerns and quality attributes"],
            ["k", "Creating the project budget and staff schedule"],
            ["l", "Debugging implementation errors"],
          ],
          answer: ["b", "d", "h", "j"],
          explanation:
            "Software architecture design focuses on stakeholders and quality attributes, architectural views, architectural styles/patterns, and the system’s major components and interfaces. Algorithm design, coding, testing, deployment, maintenance, training, budgeting, and debugging belong to other activities.",
        },
        {
          id: 2,
          type: "multi",
          points: 1,
          prompt:
            "Which FOUR of the following are considered major Software Design Challenges?",
          instruction: "Select four answers.",
          options: [
            ["a", "Estimating project development cost"],
            ["b", "Fast and ever-changing technology"],
            ["c", "Selecting a programming language"],
            ["d", "Inconsistent development processes"],
            ["e", "Managing software test data"],
            ["f", "Configuring deployment servers"],
            ["g", "Managing design influences"],
            ["h", "Requirements volatility"],
          ],
          answer: ["b", "d", "g", "h"],
          explanation:
            "The four major design challenges tested here are requirements volatility, inconsistent development processes, fast and ever-changing technology, and managing design influences.",
        },
        {
          id: 3,
          type: "multi",
          points: 1,
          prompt:
            "Which TWO of the following are the main major activities in the Software Design Process?",
          instruction: "Select two answers.",
          options: [
            ["a", "Construction Design"],
            ["b", "Software Design Documentation"],
            ["c", "Detailed Design"],
            ["d", "Software Testing"],
            ["e", "Human-Computer Interface Design"],
            ["f", "Requirements Analysis"],
            ["g", "Management Activities"],
            ["h", "Software Architecture"],
          ],
          answer: ["c", "h"],
          explanation:
            "The two major activities are Software Architecture and Detailed Design.",
        },
        {
          id: 4,
          type: "single",
          points: 0.5,
          prompt:
            "A student rejects a valid design because she assumes a component can only be used in the same way she has seen it used before. Which concept best explains this limitation?",
          instruction: "Select one:",
          options: [
            ["a", "Validation"],
            ["b", "Modularization"],
            ["c", "Abstraction"],
            ["d", "Functional fixedness"],
          ],
          answer: "d",
          explanation:
            "Functional fixedness restricts problem solving by tying thinking to familiar uses or assumptions.",
        },
        {
          id: 5,
          type: "tf",
          points: 0.5,
          prompt:
            "Heartbeat is a performance tactic used to reduce response time.",
          instruction: "Answer",
          options: [
            ["true", "True"],
            ["false", "False"],
          ],
          answer: "false",
          explanation:
            "Heartbeat is an availability tactic used for fault detection. It monitors whether a component is still functioning; it is not a performance tactic for reducing response time.",
        },
        {
          id: 6,
          type: "matching",
          points: 3.5,
          prompt:
            "Match each software design scenario with the most suitable architectural style.",
          instruction: "Use each architectural style once.",
          choices: [
            "Layered Architecture",
            "Pipe-and-Filter Architecture",
            "Broker Architecture",
            "Blackboard Architecture",
            "Model-View-Controller (MVC)",
            "Client-Server Architecture",
            "Peer-to-Peer Architecture",
          ],
          items: [
            [
              "A payroll application must allow the user interface, salary-calculation rules, and data-storage technology to evolve with minimal impact on one another. For example, replacing the database should not require rewriting payroll policies, and interface code should not contain persistence logic.",
              "Layered Architecture",
            ],
            [
              "A security-log application receives raw events from many systems. One processing unit extracts fields, another normalizes timestamps, another removes sensitive values, and another calculates summaries. The processing units are designed so that individual transformations can be changed independently.",
              "Pipe-and-Filter Architecture",
            ],
            [
              "A hospital application sends requests to several types of laboratory equipment supplied by different vendors. Equipment can be replaced or added over time, but the clinical application should continue using the same request format and should not need vendor-specific logic.",
              "Broker Architecture",
            ],
            [
              "A speech-understanding application combines several kinds of reasoning. Some components propose possible sounds, others suggest words, and others evaluate grammar and context. Partial interpretations are repeatedly added and reconsidered until the application settles on the most plausible sentence.",
              "Blackboard Architecture",
            ],
            [
              "A museum ticketing application presents booking information differently on desktop browsers and self-service screens. Actions such as selecting a visit time or cancelling a reservation change the booking information, and whichever interface is in use then reflects the updated state.",
              "Model-View-Controller (MVC)",
            ],
            [
              "A classroom response application allows hundreds of students to submit answers from their phones while an instructor watches the results on a dashboard. Scores and question status must come from one authoritative course session so that every participant sees consistent information.",
              "Client-Server Architecture",
            ],
            [
              "A neighborhood emergency-messaging application is intended to work when Internet access is unavailable. Nearby phones exchange and relay messages with one another, and communication should not depend on any single phone remaining active for the whole emergency.",
              "Peer-to-Peer Architecture",
            ],
          ],
          explanation:
            "Layered separates responsibilities; Pipe-and-Filter chains independent transformations; Broker hides vendor/service-specific communication; Blackboard combines partial solutions through a shared knowledge structure; MVC separates model, views, and interaction control; Client-Server uses an authoritative centralized service; Peer-to-Peer lets peers communicate without depending on one central node.",
        },
        {
          id: 7,
          type: "blanks",
          points: 2,
          prompt: "Select the most suitable term for each blank.",
          instruction:
            "Word Bank: Functional, Sequential, Communicational, Temporal, Data, Stamp, Control, Common",
          choices: [
            "Functional",
            "Sequential",
            "Communicational",
            "Temporal",
            "Data",
            "Stamp",
            "Control",
            "Common",
          ],
          items: [
            [
              "When several operations in a module work on the same input data or contribute to the same output, this is ___ cohesion.",
              "Communicational",
            ],
            [
              "When module elements are grouped because they need to execute at approximately the same time, this is ___ cohesion.",
              "Temporal",
            ],
            [
              "When one module sends information that determines or controls the internal behavior of another module, this is ___ coupling.",
              "Control",
            ],
            [
              "When multiple modules directly access the same global data, this is ___ coupling.",
              "Common",
            ],
          ],
          explanations: [
            "Communicational cohesion occurs when operations use the same input data or contribute to the same output.",
            "Temporal cohesion groups elements because they execute at approximately the same time.",
            "Control coupling occurs when one module passes information that controls the internal behavior of another module.",
            "Common coupling occurs when multiple modules share or directly access the same global data.",
          ],
        },
        {
          id: 8,
          type: "tf",
          points: 0.5,
          prompt:
            "The '+1' view represents the database structure of the system.",
          instruction: "Answer",
          options: [
            ["true", "True"],
            ["false", "False"],
          ],
          answer: "false",
          explanation:
            "False. In Kruchten’s 4+1 model, the '+1' represents scenarios or use cases that illustrate and validate the other architectural views; it is not the database structure.",
        },
        {
          id: 9,
          type: "drawing",
          points: 0,
          prompt: "Drawing / diagram question",
          instruction:
            "The screenshot for Question 9 was not included. This card is intentionally left as a replaceable placeholder rather than inventing an exam question.",
          solutionImage: "q9-solution.png",
          explanation:
            "Replace the placeholder with the original Question 9 text. Put the correct diagram image in the same folder as this HTML file and name it q9-solution.png. It will be revealed after submission.",
        },
        {
          id: 10,
          type: "scenario",
          points: 3,
          prompt: "Quality Attribute Scenario – Online Voting System",
          body: "During an election, thousands of eligible voters access the Online Voting System to submit their votes. While the system is operating under heavy election-day traffic, a voter submits a vote for a selected candidate. The system must validate the voter, securely record the vote, prevent duplicate voting, and display a confirmation message. The complete voting transaction must be processed within 4 seconds for at least 95% of voting requests.",
          instruction:
            "Identify the six elements of the quality attribute scenario:",
          fields: [
            ["source", "a. Source of stimulus", "eligible voters"],
            [
              "stimulus",
              "b. Stimulus",
              "submitting a vote for a selected candidate",
            ],
            ["environment", "c. Environment", "heavy election-day traffic"],
            ["artifact", "d. Artifact", "Online Voting System"],
            [
              "response",
              "e. Response",
              "validate the voter, securely record the vote, prevent duplicate voting, and display a confirmation message",
            ],
            [
              "measure",
              "f. Response measure",
              "processed within 4 seconds for at least 95% of voting requests",
            ],
          ],
          explanation:
            "A quality attribute scenario identifies who/what causes the event (source), what happens (stimulus), the operating conditions (environment), the affected system element (artifact), what the system does (response), and a measurable success criterion (response measure).",
        },
      ];
      const root = document.getElementById("exam");
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      function shell(q, inner) {
        return `<section class="card" id="q${q.id}"><div class="qhead"><div class="qnum">Question ${q.id}</div><div class="mark"><div class="status"></div><div>${q.points ? `Mark ${q.points.toFixed(2)}` : ""}</div></div></div><div class="qbody">${inner}</div><div class="feedback"></div></section>`;
      }
      function opts(q, type) {
        return q.options
          .map(
            ([v, t]) =>
              `<label class="option"><span><span class="letter">${type === "tf" ? "" : v + "."}</span>${esc(t)}</span><input type="${type === "multi" ? "checkbox" : "radio"}" name="q${q.id}" value="${v}"></label>`,
          )
          .join("");
      }
      Q.forEach((q) => {
        let x = "";
        if (q.type === "multi" || q.type === "single" || q.type === "tf")
          x = `<div class="prompt">${esc(q.prompt)}</div><div class="instruction">${esc(q.instruction)}</div>${opts(q, q.type)}`;
        if (q.type === "matching")
          x =
            `<div class="prompt">${esc(q.prompt)}</div><div class="instruction">${esc(q.instruction)}</div>` +
            q.items
              .map(
                (it, i) =>
                  `<div class="matchrow"><div>${esc(it[0])}</div><div><select data-i="${i}"><option value="">Choose…</option>${q.choices.map((c) => `<option>${esc(c)}</option>`).join("")}</select><div class="mini"></div></div></div>`,
              )
              .join("");
        if (q.type === "blanks")
          x =
            `<div class="prompt">${esc(q.prompt)}</div><div class="instruction"><b>${esc(q.instruction.split(":")[0])}:</b>${esc(q.instruction.split(":").slice(1).join(":"))}</div>` +
            q.items
              .map(
                (it, i) =>
                  `<div style="margin:18px 0"><div>${i + 1}. ${esc(it[0]).replace("___", `<select data-i="${i}" style="width:auto;min-width:180px"><option value="">Choose…</option>${q.choices.map((c) => `<option>${c}</option>`).join("")}</select>`)}</div><div class="mini"></div></div>`,
              )
              .join("");
        if (q.type === "drawing")
          x = `<div class="prompt">${esc(q.prompt)}</div><div class="instruction">${esc(q.instruction)}</div><div class="placeholder"><div><b>Question / diagram placeholder</b><br><br>Add the original Question 9 here.<br>The solution image filename is <code>${q.solutionImage}</code>.</div></div><img class="solution-img" src="${q.solutionImage}" alt="Correct solution image" onerror="this.style.display='none'">`;
        if (q.type === "scenario")
          x =
            `<div class="prompt">${esc(q.prompt)}</div><div class="scenario">${esc(q.body)}</div><div class="instruction">${esc(q.instruction)}</div>` +
            q.fields
              .map(
                ([k, l, a]) =>
                  `<div class="fieldrow"><label for="q10-${k}">${esc(l)}</label><textarea id="q10-${k}" data-key="${k}" rows="2" placeholder="Type your answer…"></textarea></div>`,
              )
              .join("");
        root.insertAdjacentHTML("beforeend", shell(q, x));
      });
      function norm(s) {
        return s
          .toLowerCase()
          .replace(/[^a-z0-9%]+/g, " ")
          .trim();
      }
      function textClose(user, ans, key) {
        let u = norm(user),
          a = norm(ans);
        if (!u) return false;
        const groups = {
          source: ["eligible voter", "voter"],
          stimulus: ["submit", "vote", "candidate"],
          environment: ["heavy", "election", "traffic"],
          artifact: ["online voting system", "voting system"],
          response: ["validate", "record", "duplicate", "confirmation"],
          measure: ["4 second", "95%"],
        };
        const req = groups[key] || [];
        return req.every((w) => u.includes(norm(w)));
      }
      function setFB(card, ok, msg) {
        const f = card.querySelector(".feedback");
        f.className = "feedback show " + (ok ? "good" : "bad");
        f.innerHTML = `<b>${ok ? "Correct" : "Review this answer"}</b><br>${esc(msg)}`;
        const s = card.querySelector(".status");
        s.className = "status " + (ok ? "good" : "bad");
        s.textContent = ok ? "Correct" : "Incorrect";
      }
      document.getElementById("submit").onclick = () => {
        let earned = 0,
          total = 0,
          answered = 0,
          gradable = 0;
        Q.forEach((q) => {
          const card = document.getElementById("q" + q.id);
          if (q.points) total += q.points;
          if (["multi", "single", "tf"].includes(q.type)) {
            gradable++;
            let chosen = [...card.querySelectorAll("input:checked")].map(
              (x) => x.value,
            );
            let ans = Array.isArray(q.answer) ? q.answer : [q.answer];
            let ok =
              chosen.length === ans.length &&
              chosen.every((x) => ans.includes(x));
            if (chosen.length) answered++;
            if (ok) earned += q.points;
            setFB(card, ok, q.explanation);
          }
          if (q.type === "matching") {
            gradable++;
            let correct = 0,
              filled = 0;
            card.querySelectorAll("select").forEach((s, i) => {
              let ok = s.value === q.items[i][1];
              if (s.value) filled++;
              if (ok) correct++;
              s.className = ok ? "correct" : "wrong";
              let m = s.parentElement.querySelector(".mini");
              m.className = "mini show " + (ok ? "good" : "bad");
              m.textContent = ok
                ? "✓ Correct"
                : "Correct answer: " + q.items[i][1];
            });
            if (filled) answered++;
            let ok = correct === q.items.length;
            earned += q.points * (correct / q.items.length);
            setFB(card, ok, q.explanation);
          }
          if (q.type === "blanks") {
            gradable++;
            let correct = 0,
              filled = 0;
            card.querySelectorAll("select").forEach((s, i) => {
              let ok = s.value === q.items[i][1];
              if (s.value) filled++;
              if (ok) correct++;
              s.className = ok ? "correct" : "wrong";
              let m = s.closest("div[style]").querySelector(".mini");
              m.className = "mini show " + (ok ? "good" : "bad");
              m.textContent = ok
                ? "✓ Correct"
                : q.explanations[i] + " Correct answer: " + q.items[i][1] + ".";
            });
            if (filled) answered++;
            let ok = correct === q.items.length;
            earned += q.points * (correct / q.items.length);
            setFB(
              card,
              ok,
              ok
                ? "All four terms are correct."
                : "Review the explanations shown under each incorrect blank.",
            );
          }
          if (q.type === "scenario") {
            gradable++;
            let correct = 0,
              filled = 0;
            q.fields.forEach(([k, l, a]) => {
              let el = card.querySelector(`[data-key="${k}"]`);
              let ok = textClose(el.value, a, k);
              if (el.value.trim()) filled++;
              if (ok) correct++;
              el.className = ok ? "correct" : "wrong";
            });
            if (filled) answered++;
            let ok = correct === q.fields.length;
            earned += q.points * (correct / q.fields.length);
            let solution = q.fields.map((x) => `${x[1]}: ${x[2]}`).join(" | ");
            setFB(
              card,
              ok,
              (ok ? "All six scenario elements are correct. " : "") +
                q.explanation +
                " Correct solution — " +
                solution,
            );
          }
          if (q.type === "drawing") {
            card.querySelector(".solution-img").classList.add("show");
            let f = card.querySelector(".feedback");
            f.className = "feedback show";
            f.innerHTML = "<b>Solution area</b><br>" + esc(q.explanation);
          }
        });
        earned = Math.round(earned * 100) / 100;
        document.getElementById("score").textContent =
          `Score: ${earned} / ${total}`;
        document.getElementById("bar").style.width = "100%";
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      document.getElementById("theme").onclick = () => {
        const d = document.documentElement;
        const next = d.dataset.theme === "dark" ? "light" : "dark";
        d.dataset.theme = next;
        localStorage.setItem("se322-theme", next);
      };
      const saved = localStorage.getItem("se322-theme");
      if (saved) document.documentElement.dataset.theme = saved;
      else if (matchMedia("(prefers-color-scheme:dark)").matches)
        document.documentElement.dataset.theme = "dark";
    </script>
  </body>
</html>
