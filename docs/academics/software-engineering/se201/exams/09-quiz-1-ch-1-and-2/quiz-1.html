    <script>
      /* Theme resolution, in priority order:
             1. the stored site preference (what the toggle writes);
             2. the embedding page -- these quizzes are iframed by their wrapper,
                and the wrapper only marks itself when it is in LIGHT mode, so an
                unmarked same-origin parent means the site's dark chrome;
             3. the OS preference, for the standalone URL.
           It runs before first paint, and re-asserts afterwards because the
           shared theme scripts fall back to the OS setting and would otherwise
           leave a light quiz sitting inside a dark page. */
      (function () {
        var root = document.documentElement;

        function parentTheme() {
          try {
            if (!window.parent || window.parent === window) return null;
            var pdoc = window.parent.document;
            if (!pdoc) return null;
            var body = pdoc.body;
            if (body && body.classList.contains("shoug-light-mode"))
              return "light";
            var attr =
              (body && body.getAttribute("data-theme")) ||
              pdoc.documentElement.getAttribute("data-theme");
            if (attr === "dark" || attr === "light") return attr;
            var scheme =
              (body && body.getAttribute("data-md-color-scheme")) ||
              pdoc.documentElement.getAttribute("data-md-color-scheme");
            if (scheme) return scheme === "slate" ? "dark" : "light";
            return "dark";
          } catch (e) {
            return null; // cross-origin: fall through to the OS setting
          }
        }

        function stored() {
          try {
            var saved =
              localStorage.getItem("shoug-theme") ||
              localStorage.getItem("theme");
            if (saved === "dark" || saved === "light") return saved;
          } catch (e) {}
          return null;
        }

        function resolve() {
          var saved = stored();
          if (saved) return saved;
          var inherited = parentTheme();
          if (inherited) {
            /* Record what the embedding page is showing: the shared theme
                       scripts read this key, and without it their first toggle
                       just re-applies the theme already on screen. */
            try {
              localStorage.setItem("shoug-theme", inherited);
              localStorage.setItem("theme", inherited);
            } catch (e) {}
            return inherited;
          }
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        function apply() {
          var theme = resolve();
          if (root.getAttribute("data-theme") !== theme)
            root.setAttribute("data-theme", theme);
          if (root.style.colorScheme !== theme) root.style.colorScheme = theme;
        }

        apply();
        if (window.MutationObserver) {
          new MutationObserver(apply).observe(root, {
            attributes: true,
            attributeFilter: ["data-theme"],
          });
        }
        document.addEventListener("DOMContentLoaded", apply);
        window.addEventListener("load", apply);
      })();
    </script>

    <script>
      (function () {
        var questions = [
          {
            id: "q1",
            type: "mcq",
            tag: "generated",
            question:
              "It is practically possible to derive a complete set of stable software requirements in a changing environment.",
            options: ["True", "False"],
            correct: 1,
            explanation:
              "Requirements change frequently in modern environments, making it impractical to derive a complete stable set.",
          },
          {
            id: "q2",
            type: "mcq",
            tag: "generated",
            question: "Software does not deteriorate over time; it wears out.",
            options: ["True", "False"],
            correct: 1,
            explanation:
              "Software doesn't physically wear out, but it deteriorates as changes accumulate and the environment evolves.",
          },
          {
            id: "q3",
            type: "mcq",
            tag: "past exam",
            question:
              "In generic products, the specification of what the software should do is owned by the customer of the software and they make decisions on required software changes.",
            options: ["True", "False"],
            correct: 1,
            explanation:
              "In generic products, the specification is owned by the software developer, not the customer.",
          },
          {
            id: "q4",
            type: "mcq",
            tag: "past exam",
            question:
              "In the Unified Process model, requirements are determined iteratively and may span more than one phase of the process.",
            options: ["True", "False"],
            correct: 0,
            explanation:
              "The Unified Process is iterative and requirements are refined across multiple phases.",
          },
          {
            id: "q5",
            type: "mcq",
            tag: "past exam",
            question:
              "The Incremental model combines the elements of linear and parallel process flow.",
            options: ["True", "False"],
            correct: 0,
            explanation:
              "The Incremental model does combine linear progression with parallel development of increments.",
          },
          {
            id: "q6",
            type: "mcq",
            tag: "generated",
            question:
              "Scaling up is concerned with using agile methods for large systems that cannot be developed by a small team.",
            options: ["True", "False"],
            correct: 0,
            explanation:
              "Scaling agile methods for large, complex systems is indeed a significant challenge.",
          },

          {
            id: "q7",
            type: "mcq",
            tag: "past exam",
            question: "What is the primary focus of software engineering?",
            options: [
              "Network management",
              "Hardware development",
              "Software production and maintenance",
              "Database Administration",
            ],
            correct: 2,
            explanation:
              "Software engineering focuses on all aspects of software production from specification to maintenance.",
          },
          {
            id: "q8",
            type: "mcq",
            tag: "past exam",
            question:
              "Which of the following is NOT considered an attribute of good software?",
            options: [
              "Maintainability",
              "Unpredictability",
              "Efficiency",
              "Dependability",
            ],
            correct: 1,
            explanation:
              "Good software should be predictable and reliable. Unpredictability is a negative attribute.",
          },
          {
            id: "q9",
            type: "mcq",
            tag: "past exam",
            question:
              "What percentage of software costs are typically attributed to development?",
            options: ["70%", "40%", "50%", "60%"],
            correct: 3,
            explanation:
              "Roughly 60% of software costs are development costs, 40% are testing costs.",
          },
          {
            id: "q10",
            type: "mcq",
            tag: "past exam",
            question:
              "Which of the following best describes customized products in software engineering?",
            options: [
              "Software developed for mass market distribution",
              "Open-source software",
              "Free software available for public use",
              "Software commissioned by a specific customer to meet their needs",
            ],
            correct: 3,
            explanation:
              "Customized products are commissioned by specific customers for their particular needs.",
          },
          {
            id: "q11",
            type: "mcq",
            tag: "past exam",
            question:
              "What is one of the key challenges faced by software engineering?",
            options: [
              "Limited availability of programming languages",
              "Decreased demand for software",
              "Increasing simplicity of systems",
              "Coping with increasing diversity in systems",
            ],
            correct: 3,
            explanation:
              "Software engineers must cope with increasing diversity, reduced delivery times, and developing trustworthy software.",
          },
          {
            id: "q12",
            type: "mcq",
            tag: "past exam",
            question:
              "Which principle is NOT part of professional ethical responsibilities in software engineering?",
            options: [
              "Honesty",
              "Competence",
              "Profit maximization at all costs",
              "Confidentiality",
            ],
            correct: 2,
            explanation:
              "Professional ethics prioritize honesty, competence, and confidentiality over pure profit maximization.",
          },
          {
            id: "q13",
            type: "mcq",
            tag: "past exam",
            question:
              "Which of the following is NOT one of the main activities in a software process?",
            options: [
              "Marketing",
              "Communication",
              "Specification",
              "Validation",
            ],
            correct: 0,
            explanation:
              "The fundamental software engineering activities are specification, development, validation, and evolution.",
          },

          {
            id: "q51",
            type: "essay",
            tag: "generated",
            question:
              "Define a software process and list its four fundamental activities.",
            keywords: [
              "specification",
              "development",
              "validation",
              "evolution",
              "structured",
              "activities",
            ],
            modelAnswer:
              "A software process is a structured set of activities required to develop a software system. The four fundamental activities are: (1) Software specification - defining what the system should do; (2) Software development - designing and implementing the system; (3) Software validation - checking that it does what the customer wants; (4) Software evolution - changing the system in response to changing customer needs.",
          },
        ];

        var state = {
          answers: {},
          submitted: false,
          essayScores: {},
          scorePct: 0,
        };

        var elQuestions = document.getElementById("questions");
        var elSubmitBtn = document.getElementById("submitBtn");
        var elSubmitWrap = document.getElementById("submitWrap");
        var elScoreBox = document.getElementById("scoreBox");
        var elScorePct = document.getElementById("scorePct");
        var elScoreLabel = document.getElementById("scoreLabel");
        var elRetake = document.getElementById("retakeBtn");

        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (m) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[m];
          });
        }

        function pill(tag) {
          if (!tag) return "";
          var cls = tag === "past exam" ? "pill past" : "pill gen";
          return '<span class="' + cls + '">' + esc(tag) + "</span>";
        }

        function render() {
          var html = "";
          for (var i = 0; i < questions.length; i++) {
            var q = questions[i];
            var userVal = state.answers[q.id];

            html += '<div class="qCard">';
            html += '<div class="qHead">';
            html += '<div class="num">' + (i + 1) + "</div>";
            html += '<div style="flex:1;">';
            html += '<div class="qTextRow">';
            html += '<div class="qText">' + esc(q.question) + "</div>";
            html += pill(q.tag);
            html += "</div>";

            if (q.type === "mcq") {
              html += '<div class="options">';
              for (var j = 0; j < q.options.length; j++) {
                var opt = q.options[j];
                var checked = userVal === j ? " checked" : "";
                var disabled = state.submitted ? " disabled" : "";

                var cls = "opt";
                if (state.submitted) {
                  cls += " disabled";
                  if (j === q.correct) cls += " correct";
                  else if (userVal === j && j !== q.correct) cls += " wrong";
                }

                html += '<label class="' + cls + '">';
                html +=
                  '<input type="radio" name="' +
                  q.id +
                  '" value="' +
                  j +
                  '"' +
                  checked +
                  disabled +
                  ">";
                html += '<span style="flex:1;">' + esc(opt) + "</span>";
                html += "</label>";
              }
              html += "</div>";
            }

            if (q.type === "essay") {
              var tDisabled = state.submitted ? " disabled" : "";
              var val = state.answers[q.id] || "";
              html += '<div style="margin-top:14px;">';
              html +=
                '<textarea data-essay="' +
                q.id +
                '" placeholder="Type your answer here..."' +
                tDisabled +
                ">" +
                esc(val) +
                "</textarea>";
              html += "</div>";

              if (state.submitted) {
                var es = state.essayScores[q.id];
                if (es) {
                  var pct = Number(es.percentage);
                  var scoreCls = pct >= 70 ? "good" : pct >= 50 ? "mid" : "bad";
                  html += '<div class="essayPanel">';
                  html += '<div class="essayScore ' + scoreCls + '">';
                  html +=
                    '<div class="kv"><div class="label">Your Score:</div><div class="val">' +
                    esc(es.percentage) +
                    "%</div></div>";
                  html +=
                    '<div style="font-size:13px;color:var(--text-3);">Keywords found: ' +
                    es.matchedKeywords.length +
                    " / " +
                    es.totalKeywords +
                    "</div>";
                  html +=
                    '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">';
                  html +=
                    '<div style="font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px;">Keyword Analysis:</div>';
                  html += '<div class="kwRow">';
                  for (var k = 0; k < q.keywords.length; k++) {
                    var kw = q.keywords[k];
                    var found = es.matchedKeywords.indexOf(kw) !== -1;
                    html +=
                      '<span class="kw ' +
                      (found ? "found" : "miss") +
                      '">' +
                      (found ? "✓" : "✗") +
                      " " +
                      esc(kw) +
                      "</span>";
                  }
                  html += "</div>";
                  html +=
                    '<div style="font-size:12px;color:var(--text-3);margin-top:8px;">✓ = Found &nbsp;|&nbsp; ✗ = Missing</div>';
                  html += "</div>";
                  html += "</div>";
                  html +=
                    '<div class="model"><div style="font-weight:700;margin-bottom:6px;">Model Answer:</div><div>' +
                    esc(q.modelAnswer) +
                    "</div></div>";
                  html += "</div>";
                }
              }
            }

            if (state.submitted && q.explanation) {
              html +=
                '<div class="explain"><span style="font-weight:700;">Explanation: </span>' +
                esc(q.explanation) +
                "</div>";
            }

            html += "</div>";
            html += "</div>";
            html += "</div>";
          }

          elQuestions.innerHTML = html;

          elSubmitWrap.style.display = state.submitted ? "none" : "block";
          elScoreBox.style.display = state.submitted ? "block" : "none";

          // Attach listeners for MCQ radios
          var radios = elQuestions.querySelectorAll('input[type="radio"]');
          for (var r = 0; r < radios.length; r++) {
            radios[r].addEventListener("change", function (e) {
              if (state.submitted) return;
              var qid = e.target.name;
              var idx = parseInt(e.target.value, 10);
              state.answers[qid] = idx;
            });
          }

          // Attach listeners for essays
          var essays = elQuestions.querySelectorAll("textarea[data-essay]");
          for (var t = 0; t < essays.length; t++) {
            essays[t].addEventListener("input", function (e) {
              if (state.submitted) return;
              var qid2 = e.target.getAttribute("data-essay");
              state.answers[qid2] = e.target.value;
            });
          }
        }

        function getEssayScore(qid) {
          var q = null;
          for (var i = 0; i < questions.length; i++) {
            if (questions[i].id === qid) {
              q = questions[i];
              break;
            }
          }
          if (!q || q.type !== "essay") return null;

          var ans = String(state.answers[qid] || "").toLowerCase();
          var matched = [];
          for (var k = 0; k < q.keywords.length; k++) {
            var kw = String(q.keywords[k]).toLowerCase();
            if (ans.indexOf(kw) !== -1) matched.push(q.keywords[k]);
          }
          var score = matched.length / q.keywords.length;
          return {
            score: score,
            percentage: String(Math.round(score * 100)),
            matchedKeywords: matched,
            totalKeywords: q.keywords.length,
          };
        }

        function calculateScore() {
          var total = 0;
          var max = questions.length;
          var essayScores = {};

          for (var i = 0; i < questions.length; i++) {
            var q = questions[i];
            if (q.type === "mcq") {
              if (state.answers[q.id] === q.correct) total += 1;
            } else {
              var es = getEssayScore(q.id);
              essayScores[q.id] = es;
              total += es.score;
            }
          }
          return { total: total, max: max, essayScores: essayScores };
        }

        function labelFor(p) {
          if (p >= 90) return "Excellent!";
          if (p >= 80) return "Very Good!";
          if (p >= 70) return "Good";
          if (p >= 60) return "Pass";
          return "Need Improvement";
        }

        function submit() {
          var res = calculateScore();
          state.essayScores = res.essayScores;
          state.scorePct = (res.total / res.max) * 100;
          state.submitted = true;

          elScorePct.textContent = state.scorePct.toFixed(1) + "%";
          elScoreLabel.textContent = labelFor(state.scorePct);

          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function reset() {
          state.answers = {};
          state.submitted = false;
          state.essayScores = {};
          state.scorePct = 0;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        elSubmitBtn.addEventListener("click", submit);
        elRetake.addEventListener("click", reset);

        render();
      })();
    </script>
    <script src="/javascripts/standalone-theme.js"></script>
