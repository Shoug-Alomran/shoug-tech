    <script>
      /* Theme resolution, in priority order:
             1. the stored site preference (what the toggle writes);
             2. the embedding page -- these pages are iframed by their wrapper,
                and the wrapper only marks itself when it is in LIGHT mode, so an
                unmarked same-origin parent means the site's dark chrome;
             3. the OS preference, for the standalone URL.
           It runs before first paint, and re-asserts afterwards because the
           shared theme scripts fall back to the OS setting and would otherwise
           leave a light page sitting inside a dark one. */
      (function () {
        var root = document.documentElement;

        function parentTheme() {
          try {
            if (!window.parent || window.parent === window) return null;
            var pdoc = window.parent.document;
            if (!pdoc) return null;
            var body = pdoc.body;
            if (body && body.classList.contains("shoug-light-mode"))
              return "light";
            var attr =
              (body && body.getAttribute("data-theme")) ||
              pdoc.documentElement.getAttribute("data-theme");
            if (attr === "dark" || attr === "light") return attr;
            var scheme =
              (body && body.getAttribute("data-md-color-scheme")) ||
              pdoc.documentElement.getAttribute("data-md-color-scheme");
            if (scheme) return scheme === "slate" ? "dark" : "light";
            return "dark";
          } catch (e) {
            return null; // cross-origin: fall through to the OS setting
          }
        }

        function stored() {
          try {
            var saved =
              localStorage.getItem("shoug-theme") ||
              localStorage.getItem("theme");
            if (saved === "dark" || saved === "light") return saved;
          } catch (e) {}
          return null;
        }

        function resolve() {
          var saved = stored();
          if (saved) return saved;
          var inherited = parentTheme();
          if (inherited) {
            /* Record what the embedding page is showing: the shared theme
                       scripts read this key, and without it their first toggle
                       just re-applies the theme already on screen. */
            try {
              localStorage.setItem("shoug-theme", inherited);
              localStorage.setItem("theme", inherited);
            } catch (e) {}
            return inherited;
          }
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        function apply() {
          var theme = resolve();
          if (root.getAttribute("data-theme") !== theme)
            root.setAttribute("data-theme", theme);
          if (root.style.colorScheme !== theme) root.style.colorScheme = theme;
        }

        apply();
        if (window.MutationObserver) {
          new MutationObserver(apply).observe(root, {
            attributes: true,
            attributeFilter: ["data-theme"],
          });
        }
        document.addEventListener("DOMContentLoaded", apply);
        window.addEventListener("load", apply);
      })();
    </script>

    <script>
      const questions = [
        {
          id: 1,
          type: "mcq",
          past: true,
          text: "A good Software Requirements Specification (SRS) should avoid:",
          options: [
            "Describing functional behavior",
            "Stating measurable constraints",
            "Mixing design decisions with requirements",
            "Identifying external interfaces",
          ],
          answer: 2,
          explanation:
            "An SRS states WHAT the system should do, not HOW. Design decisions (architecture, implementation choices) belong in design documents, not the SRS. All other options are valid contents of a good SRS.",
        },
        {
          id: 2,
          type: "mcq",
          past: true,
          text: "If every requirement in the SRS has only one possible interpretation, the SRS is said to be:",
          options: ["Correct", "Unambiguous", "Consistent", "Verifiable"],
          answer: 1,
          explanation:
            "Unambiguous means each requirement has exactly one interpretation. Verifiable means it can be tested. Consistent means no contradictions. These are all distinct quality properties of a good SRS.",
        },
        {
          id: 3,
          type: "mcq",
          past: true,
          text: "The phrase 'The interface shall load quickly' violates which characteristic of good requirements?",
          options: [
            "Feasibility",
            "Verifiability",
            "Consistency",
            "Completeness",
          ],
          answer: 1,
          explanation:
            "'Load quickly' cannot be measured or tested  -  there's no threshold. A verifiable version would be: 'The interface shall load within 3 seconds on a standard broadband connection.' This is a classic exam question.",
        },
        {
          id: 4,
          type: "mcq",
          past: false,
          text: "Which section of the SRS template is used to document the logical data model (e.g., a UML class diagram or ER diagram)?",
          options: [
            "§2 Overall Description",
            "§3 System Features",
            "§4 Data Requirements",
            "§5 External Interface Requirements",
          ],
          answer: 2,
          explanation:
            "§4-Data-Requirements-contains:-4.1-Logical-data-model-(ER/UML-diagrams),-4.2-Data-dictionary,-4.3-Reports,-and-4.4-Data-acquisition,-integrity,-retention,-and-disposal.",
        },
        {
          id: 5,
          type: "mcq",
          past: false,
          text: "Where do design and implementation constraints (e.g., 'the system must be built in Python') belong in the SRS template?",
          options: [
            "§1.2 Document Conventions",
            "§2.4 Design and Implementation Constraints",
            "§6 Quality Attributes",
            "§8 Other Requirements",
          ],
          answer: 1,
          explanation:
            "§2.4 Design and Implementation Constraints records factors that restrict developer options, such as programming language requirements, required code libraries, and their rationale. Beware of including unnecessary constraints.",
        },
        {
          id: 6,
          type: "mcq",
          past: false,
          text: "A member of the Movie Shop system must be able to login to access member-only services. Where does this belong in the SRS?",
          options: [
            "§3 System Features  -  as a separate use case 'Login'",
            "§6.3 Security  -  as a non-functional security requirement",
            "§2.3 Operating Environment",
            "§4 Data Requirements",
          ],
          answer: 1,
          explanation:
            "Login is a security (non-functional) requirement, not a use case. It is an access control mechanism. Adding 'Login'-as-a-separate-system-feature/use-case-is-a-common-mistake-in-SE311-assignments.",
        },
        {
          id: 7,
          type: "mcq",
          past: true,
          text: "Which requirement best expresses a data-quality constraint? (Past Exam: Major-2 Term 251)",
          options: [
            "The system shall respond within 3 seconds",
            "Each employee record shall contain a valid, unique national-ID number",
            "The system shall encrypt all communications",
            "The interface shall be user-friendly",
          ],
          answer: 1,
          explanation:
            "A data-quality constraint restricts the content or format of stored data. Option B specifies that each record must have a valid, unique national-ID  -  a concrete, verifiable data rule. Option A is performance, C is security, D is vague usability.",
        },
        {
          id: 8,
          type: "mcq",
          past: false,
          text: "In the SRS template, which section addresses accommodations for visually impaired users?",
          options: [
            "§2.2 User Classes and Characteristics",
            "§5.1 User Interfaces",
            "§6.1 Usability",
            "§7 Internationalization and Localization",
          ],
          answer: 1,
          explanation:
            "§5.1 User Interfaces includes accommodations for users who are visually impaired, color blind, or have other limitations. It also covers fonts, screen resolution constraints, button labels, and shortcut keys.",
        },
        {
          id: 9,
          type: "mcq",
          past: false,
          text: "Functional requirements organized by use case, user class, or process flow are all valid alternatives to organizing by:",
          options: [
            "Data model",
            "System feature",
            "Quality attribute",
            "Interface type",
          ],
          answer: 1,
          explanation:
            "§3 System Features shows functional requirements organized by system feature  -  but the slides note that organization by use case, user class, process flow, or functional area are equally valid. There is no single right choice.",
        },
        {
          id: 10,
          type: "mcq",
          past: false,
          text: "Which of the following belongs in Appendix A: Glossary rather than §4.2 Data Dictionary?",
          options: [
            "Data type and length of the 'memberNumber' field",
            "Allowed values for the 'genre' attribute",
            "Definition of the term 'Nonmember' as used in the SRS",
            "Format of the 'returnDate' field",
          ],
          answer: 2,
          explanation:
            "The Glossary defines specialized terms, acronyms, and abbreviations used in the SRS. Data definitions (types, lengths, formats, constraints) belong in the Data Dictionary, not the glossary. This is explicitly stated in the chapter.",
        },
        {
          id: 11,
          type: "tf",
          past: false,
          text: "An SRS is a design document that describes both what the system should do and how it should do it.",
          answer: false,
          explanation:
            "FALSE. An SRS describes WHAT the system should do, NOT how it should do it. The 'how' belongs in design documents. This is one of the most fundamental principles of requirements specification.",
        },
        {
          id: 12,
          type: "tf",
          past: false,
          text: "Internationalization and localization requirements (§7) can be reused across multiple projects.",
          answer: true,
          explanation:
            "TRUE.-The-slides-explicitly-state-that-i18n/L10n-requirements-'could well be reusable across projects.' Organizations may maintain a shared enterprise-level i18n document that individual projects reference.",

        {
          id: 13,
          type: "tf",
          past: false,
          text: "In the SRS template, quality requirements (§6) only need to be stated in general terms  -  they don't need to be measurable.",
          answer: false,
          explanation:
            "FALSE. Quality requirements must be specific, quantitative, and verifiable. Vague statements like 'the system should be fast' are not acceptable  -  they must include measurable thresholds to be testable.",
        },
        {
          id: 14,
          type: "tf",
          past: false,
          text: "The same information can be duplicated in multiple sections of the SRS if it is relevant to both.",
          answer: false,
          explanation:
            "FALSE. The SRS final tips explicitly state: 'Avoid duplicating information in multiple sections even if it could logically fit in more than one. Instead, pick one section and use cross-references and hyperlinks.'",
        },
        {
          id: 15,
          type: "tf",
          past: true,
          text: "Agile methods argue that producing a detailed SRS is essential and should always be done before development begins.",
          answer: false,
          explanation:
            "FALSE. The course slides note that 'many agile methods argue that producing an SRS is a waste of time as requirements change so quickly.' Agile prefers working software and continuous collaboration over comprehensive documentation.",

        {
          id: 16,
          type: "written",
          past: true,
          text: "Explain the two types of ambiguity found in the following requirements, and rewrite each to be clear:\n(a) 'Vacation requests of up to 5 days do not require approval. Vacation requests of 5 to 10 days require supervisor approval.'\n(b) 'The system shall allow the user to search using a name and/or email.'",
          keywords: [
            ["boundary", "overlap", "overlapping", "5 days", "both", "unclear"],
            ["and/or", "ambiguous", "either", "both", "one or both", "unclear"],
            [
              "rewrite",
              "1 to 4",
              "1-4",
              "five to ten",
              "5 to 10",
              "either a name",
              "name or email",
              "name an email",
            ],
          ],
          minKeywords: 3,
          mockAnswer:
            "(a)-Type:-Boundary/Overlap-Ambiguity- - -it-is-unclear-what-happens-for-exactly-5-days-since-both-clauses-include-5.\nRewrite:-'Vacation requests of 1 to 4 days do not require approval. Vacation requests of 5 to 10 days require supervisor approval.'\n\n(b)-Type:-And/Or-Ambiguity- - -it-is-unclear-whether-the-user-must-enter-both-name-AND-email,-or-can-enter-either-one,-or-both.\nRewrite:-'The system shall allow the user to search using either a name, an email, or both.'",
          explanation:
            "This-is-directly-from-Major-2-Term-251.-Two-key-ambiguity-types:-(1)-Boundary/Overlap- - -overlapping-ranges-leave-a-specific-value-(5-days)-in-two-categories-simultaneously.-(2)-And/Or-ambiguity- - -'and/or' is inherently vague; requirements must explicitly list all valid combinations.",
        },
        {
          id: 17,
          type: "written",
          past: true,
          text: "Requirements should be traceable to two different things. What are these two things, and why is each important?",
          keywords: [
            [
              "source",
              "stakeholder",
              "backward",
              "origin",
              "business goal",
              "necessary",
            ],
            [
              "forward",
              "implementation",
              "design",
              "test",
              "code",
              "verified",
              "verifiable",
            ],
          ],
          minKeywords: 2,
          mockAnswer:
            "Requirements should be traceable to:\n1. Their SOURCE (backward traceability)  -  linking each requirement back to the stakeholder or business goal that requested it. This ensures every requirement is necessary and justified.\n2. Their IMPLEMENTATION (forward traceability)  -  linking each requirement to the design decisions, code, and test cases that implement and verify it. This ensures every requirement is actually built and tested.",
          explanation:
            "From Major-2 Term 251. Bidirectional traceability is essential for requirements management. Backward traceability proves a requirement is needed (no gold-plating). Forward traceability proves it was implemented and tested.",
        },
        {
          id: 18,
          type: "written",
          past: false,
          text: "Differentiate between the Data Dictionary (§4.2) and the Glossary (Appendix A) in an SRS. Give one example of what belongs in each.",
          keywords: [
            [
              "data dictionary",
              "attributes",
              "data type",
              "type",
              "length",
              "format",
              "values",
              "field",
              "structure",
            ],
            [
              "glossary",
              "term",
              "acronym",
              "definition",
              "abbreviation",
              "specialized",
            ],
          ],
          minKeywords: 2,
          mockAnswer:
            "The Data Dictionary (§4.2) defines the technical details of data elements  -  their name, data type, length, format, and valid values. It describes how data is structured in the system.\nExample: 'copyNumber: Integer, uniquely identifies a physical rental copy, e.g., 001 - 999.'\n\nThe Glossary (Appendix A) defines the meaning of specialized terms, acronyms, and abbreviations used throughout the SRS.\nExample: 'Member: A customer who has paid the annual membership fee and has a membership number and password.'\n\nThe slides explicitly note: 'Data definitions belong in the data dictionary, not the glossary.'",
          explanation:
            "A common confusion in practice. The data dictionary is technical and precise (types, lengths, constraints). The glossary is semantic  -  it explains the meaning of domain terms so all readers share the same understanding.",
        },
        {
          id: 19,
          type: "written",
          past: false,
          text: "List four challenges faced during requirements prioritization and briefly explain each.",
          keywords: [
            [
              "conflict",
              "conflicting",
              "stakeholder",
              "competing",
              "different goals",
            ],
            ["resources", "budget", "time", "limited", "constraints"],
            [
              "ambiguous",
              "unclear",
              "vague",
              "incomplete",
              "poorly understood",
            ],
            ["change", "changing", "evolve", "evolving", "dynamic"],
          ],
          minKeywords: 3,
          mockAnswer:
            "1. Conflicting Stakeholder Interests  -  different stakeholders have different goals (e.g., management wants cost reduction while users want more features), making it hard to agree on priorities.\n2. Limited Resources  -  time, budget, and technical capacity are constrained, so not all requirements can be implemented at once.\n3. Unclear or Ambiguous Requirements  -  vague requirements are hard to assess for importance or feasibility accurately.\n4. Changing Requirements  -  requirements evolve due to market changes, regulations, or user feedback, requiring constant re-prioritization.",
          explanation:
            "From Major-2 Term 251. These four challenges appear directly in the course material. In exams, you need at least the names and a brief justification for each. Partial credit is given per challenge identified.",
        },
        {
          id: 20,
          type: "written",
          past: false,
          text: "List two benefits of having a shared Data Dictionary across a software project team.",
          keywords: [
            [
              "consistent",
              "consistency",
              "same definition",
              "uniform",
              "shared understanding",
              "agree",
            ],
            [
              "communication",
              "communicate",
              "reference",
              "common",
              "stakeholders",
              "developers",
              "analysts",
              "misunderstanding",
            ],
          ],
          minKeywords: 2,
          mockAnswer:
            "1. Consistency  -  all team members (developers, analysts, testers, stakeholders) use the same definitions, data types, and constraints for data elements, reducing misunderstandings and implementation errors.\n2. Improved Communication  -  the data dictionary acts as a single source of truth and common reference point, making it easier to discuss, design, and maintain the system accurately across different roles.",
          explanation:
            "From Major-2 Term 251. These two benefits are explicitly listed in the course slides. Shared artifacts reduce ambiguity and act as a 'contract' among team members about what data means and how it is structured.",
        },
      ];

      let answered = new Array(questions.length).fill(false);
      let correctCount = 0;
      let wrongCount = 0;
      let selectedAnswers = new Array(questions.length).fill(null);

      function buildQuiz() {
        const container = document.getElementById("quiz-container");
        container.innerHTML = "";
        answered = new Array(questions.length).fill(false);
        correctCount = 0;
        wrongCount = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        updateScore();

        questions.forEach((q, idx) => {
          const card = document.createElement("div");
          card.className = "q-card";
          card.id = "q-" + idx;
          card.style.animationDelay = idx * 0.04 + "s";

          const typeLbl =
            q.type === "mcq"
              ? '<span class="tag mcq">MCQ</span>'
              : q.type === "tf"
                ? '<span class="tag tf">True-/-False</span>'
                : '<span class="tag written">Written</span>';
          const pastLbl = q.past
            ? '<span class="tag past">Past-Exam</span>'
            : "";
          const qTextFormatted = q.text.replace(/\n/g, "<br>");

          let bodyHTML = "";

          if (q.type === "mcq") {
            bodyHTML =
              `<div class="options">` +
              q.options
                .map(
                  (opt, i) =>
                    `<div class="opt" id="opt-${idx}-${i}" onclick="selectMCQ(${idx},${i})">
            <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
            <span>${opt}</span>
          </div>`,
                )
                .join("") +
              `</div>`;
          } else if (q.type === "tf") {
            bodyHTML = `<div class="tf-options">
        <button class="tf-btn" id="tf-${idx}-true" onclick="selectTF(${idx}, true)">True</button>
        <button class="tf-btn" id="tf-${idx}-false" onclick="selectTF(${idx}, false)">False</button>
      </div>`;
          } else {
            const kw = q.keywords.flat().slice(0, 8).join(", ");
            bodyHTML = `
        <textarea class="written-area" id="written-${idx}" placeholder="Type your answer here..." oninput="selectWritten(${idx})"></textarea>
        <div class="keyword-hint">Key concepts to address: <em>${kw}${q.keywords.flat().length > 8 ? "..." : ""}</em></div>
        <div id="kw-display-${idx}" style="margin-top:0.4rem;"></div>
        <div class="mock-answer-wrap">
          <button class="mock-toggle" onclick="toggleMock(${idx})">Show model answer</button>
          <div class="mock-answer" id="mock-${idx}">${q.mockAnswer.replace(/\n/g, "<br>")}</div>
        </div>`;
          }

          bodyHTML += `<button class="check-btn" id="check-${idx}" onclick="checkAnswer(${idx})" ${q.type === "written" ? "" : "disabled"}>Check Answer</button>`;
          bodyHTML += `<div class="feedback" id="fb-${idx}"><span class="fb-title" id="fb-title-${idx}"></span><span class="fb-body" id="fb-body-${idx}"></span></div>`;

          card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${q.id}</span>
        <span class="q-text">${qTextFormatted}</span>
        ${typeLbl}${pastLbl}
      </div>
      <div class="q-body">${bodyHTML}</div>`;
          container.appendChild(card);
        });

        document.getElementById("resultPanel").classList.remove("visible");
      }

      function selectMCQ(qIdx, optIdx) {
        if (answered[qIdx]) return;
        selectedAnswers[qIdx] = optIdx;
        const q = questions[qIdx];
        q.options.forEach((_, i) => {
          const el = document.getElementById(`opt-${qIdx}-${i}`);
          el.classList.remove("selected");
        });
        document
          .getElementById(`opt-${qIdx}-${optIdx}`)
          .classList.add("selected");
        document.getElementById(`check-${qIdx}`).disabled = false;
      }

      function selectTF(qIdx, val) {
        if (answered[qIdx]) return;
        selectedAnswers[qIdx] = val;
        document.getElementById(`tf-${qIdx}-true`).classList.remove("selected");
        document
          .getElementById(`tf-${qIdx}-false`)
          .classList.remove("selected");
        document.getElementById(`tf-${qIdx}-${val}`).classList.add("selected");
        document.getElementById(`check-${qIdx}`).disabled = false;
      }

      function selectWritten(qIdx) {
        const val = document.getElementById(`written-${qIdx}`).value.trim();
        selectedAnswers[qIdx] = val;
        if (!answered[qIdx]) {
          document.getElementById(`check-${qIdx}`).disabled = val.length < 5;
        }
      }

      function checkAnswer(qIdx) {
        if (answered[qIdx]) return;
        const q = questions[qIdx];
        answered[qIdx] = true;
        document.getElementById(`check-${qIdx}`).disabled = true;

        let isCorrect = false;
        let isPartial = false;
        const fb = document.getElementById(`fb-${qIdx}`);
        const fbTitle = document.getElementById(`fb-title-${qIdx}`);
        const fbBody = document.getElementById(`fb-body-${qIdx}`);

        if (q.type === "mcq") {
          const sel = selectedAnswers[qIdx];
          isCorrect = sel === q.answer;
          q.options.forEach((_, i) => {
            const el = document.getElementById(`opt-${qIdx}-${i}`);
            el.classList.add("disabled");
            el.classList.remove("selected");
            if (i === q.answer) el.classList.add("correct-ans");
            else if (i === sel && !isCorrect) el.classList.add("wrong-ans");
          });
        } else if (q.type === "tf") {
          const sel = selectedAnswers[qIdx];
          isCorrect = sel === q.answer;
          ["true", "false"].forEach((v) => {
            const el = document.getElementById(`tf-${qIdx}-${v}`);
            el.classList.add("disabled");
            el.classList.remove("selected");
            const boolV = v === "true";
            if (boolV === q.answer) el.classList.add("correct-ans");
            else if (boolV === sel && !isCorrect) el.classList.add("wrong-ans");
          });
        } else {
          const userText = (selectedAnswers[qIdx] || "").toLowerCase();
          document.getElementById(`written-${qIdx}`).classList.add("disabled");
          document.getElementById(`written-${qIdx}`).disabled = true;

          let groupsHit = 0;
          const displayEl = document.getElementById(`kw-display-${qIdx}`);
          displayEl.innerHTML =
            '<div style="font-size:0.78rem;color:var(--text3);font-family:var(--mono);margin-bottom:0.3rem;">Keywords-detected:</div>';

          q.keywords.forEach((group) => {
            const hit = group.some((kw) => userText.includes(kw.toLowerCase()));
            if (hit) groupsHit++;
            const span = document.createElement("span");
            span.className = "keyword-found " + (hit ? "hit" : "miss");
            span.textContent = group[0];
            displayEl.appendChild(span);
          });

          if (groupsHit >= q.minKeywords) {
            isCorrect = true;
          } else if (groupsHit >= Math.floor(q.minKeywords / 2)) {
            isPartial = true;
          }
        }

        fb.classList.remove("correct", "wrong", "partial");
        if (isCorrect) {
          fb.classList.add("correct", "visible");
          fbTitle.textContent = "Correct!";
          fbBody.textContent = q.explanation;
          correctCount++;
        } else if (isPartial) {
          fb.classList.add("partial", "visible");
          fbTitle.textContent = "Partially correct  -  keep going!";
          fbBody.textContent =
            "You covered some key concepts but missed others. Review the model answer.  -  " +
            q.explanation;
        } else {
          fb.classList.add("wrong", "visible");
          fbTitle.textContent = "Not quite.";
          fbBody.textContent = q.explanation;
          wrongCount++;
        }

        updateScore();
        updateProgress();
      }

      function submitAll() {
        questions.forEach((_, idx) => {
          if (!answered[idx] && selectedAnswers[idx] !== null) checkAnswer(idx);
          else if (!answered[idx]) {
            answered[idx] = true;
            const fb = document.getElementById(`fb-${idx}`);
            const fbTitle = document.getElementById(`fb-title-${idx}`);
            const fbBody = document.getElementById(`fb-body-${idx}`);
            fb.classList.add("wrong", "visible");
            fbTitle.textContent = "Not answered.";
            fbBody.textContent = questions[idx].explanation;
            wrongCount++;
            updateScore();
            updateProgress();
          }
        });

        const resultPanel = document.getElementById("resultPanel");
        resultPanel.classList.add("visible");
        const pct = Math.round((correctCount / questions.length) * 100);
        document.getElementById("finalScore").textContent = correctCount;
        document.getElementById("finalGrade").textContent =
          pct >= 90
            ? "Excellent  -  A"
            : pct >= 80
              ? "Great  -  B"
              : pct >= 70
                ? "Good  -  C"
                : pct >= 60
                  ? "Passing  -  D"
                  : "Needs Review  -  F";
        document.getElementById("finalGrade").style.color =
          pct >= 80
            ? "var(--correct)"
            : pct >= 60
              ? "var(--partial)"
              : "var(--wrong)";
        resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function updateScore() {
        document.getElementById("sc-correct").textContent = correctCount;
        document.getElementById("sc-wrong").textContent = wrongCount;
        const graded = correctCount + wrongCount;
        const pct = graded > 0 ? Math.round((correctCount / graded) * 100) : 0;
        document.getElementById("sc-pct").textContent = pct + "%";
      }

      function updateProgress() {
        const done = answered.filter(Boolean).length;
        const pct = Math.round((done / questions.length) * 100);
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progressText").textContent =
          done + "-/-" + questions.length + " answered";
        document.getElementById("progressPct").textContent = pct + "%";
      }

      function toggleMock(idx) {
        const el = document.getElementById("mock-" + idx);
        el.classList.toggle("visible");
      }

      function restartQuiz() {
        document.getElementById("resultPanel").classList.remove("visible");
        correctCount = 0;
        wrongCount = 0;
        buildQuiz();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      buildQuiz();
    </script>
    <script src="/javascripts/quiz-mistakes.js" defer></script>
  </body>
</html>
