        p.textContent = text;
        element.appendChild(p);
      }

      const msgs = document.getElementById("messages");
      const date = new Date();
      window.addEventListener("load", () => {
        appendTextElementTo(msgs, "Window Load event fired: " + date);
      });

        appendTextElementTo(
          msgs,
          "Document DOMContentLoaded event fired: " + date,
        );
      });
