    <style>
      .container {
        display: grid;
        grid-gap: 10px;
        grid-template-columns: repeat(2, 150px);
        grid-template-rows: repeat(
          2,
          auto
        ); /* auto : size determined by actual content */
        background-color: #fff;
        color: #444;
      }

      .box {
        background-color: #444;
        color: #fff;
        border-radius: 5px;
        padding: 20px;
        font-size: 150%;
      }

      .c {
        grid-row: 2;
        grid-column: 1;
      }

      .d {
        grid-row: 2;
        grid-column: 2;
        display: grid;
        grid-gap: 10px;
        grid-template-columns: 1fr 1fr;
      }

      .box1 {
        background-color: #ccc;
        color: #444;
      }
      .e {
        grid-column: 1 / 3;
      }

      .f {
        grid-column: 1;
        grid-row: 2;
      }

      .g {
        grid-column: 2;
        grid-row: 2;
      }
    </style>
