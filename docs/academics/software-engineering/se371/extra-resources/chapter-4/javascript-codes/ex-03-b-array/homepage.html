    <script>
      function myfun() {
        const countries = ["KSA", "Japan", "Oman"];
        document.write('<table border="1"><tr><th>Country</th></tr>');
        for (let c of countries) {
          document.write("<tr><td>" + c + "</td></tr>");
        }
        document.write("</table>");

        const twoWeeks = [
          ["Mon", "Tue", "Wed", "Thu", "Fri"],
          ["Mon", "Tue", "Wed"],
        ];

        let text = "";
        // outer loop will iterate our rows, inner loop iterate our columns
        for (let row of twoWeeks) {
          for (let day of row) {
            text += day;
            console.log(day);
          }
        }
      }
    </script>
