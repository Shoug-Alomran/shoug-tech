<h1 class="shoug-visually-hidden">2 Example Form Input Control | SE371 Web Engineering Resource</h1>
    <h2>Fill the form</h2>
    
    <form action="action-page.html">
      <label for="fname">First name:</label><br>
      <input type="text" id="fname" name="fname-var"><br><br>

      
      <label for="lname">Last name:</label><br>
      <input type="text" id="lname" name="lname-var" ><br><br>
      
      <label for="email-id">Email id:</label><br>
      <input type="email" id="email-id" name="email-var" required><br><br>
      
      <label for="pass-id">Password</label><br>
      <input type="password" id="pass-id" name="pass-var"><br><br>
      
      <label for="search-id">Search school</label><br>
      <input type="search" id="search-id" name="Search-var" placeholder= 'PSU'><br><br>
      
      <label for="url-id">url school</label><br>
      <input type="url" id="url-id" name="url-var" placeholder= 'http://www...'><br><br>
      
      <label for="phone">Enter a phone number:</label><br>
      <input type="tel" id="phone" name="phone" placeholder="123-45-678" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" required>
      <small>Format: 123-45-678</small><br><br>

      <label for="cmntbox"/> Comment box </label><br>
      <textarea id="cmntbox" placeholder="comments here"></textarea><br><br>
     
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </form>
