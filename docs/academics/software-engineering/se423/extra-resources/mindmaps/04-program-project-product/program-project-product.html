<!doctype html>
<html lang="en">
  <script>
    !(function () {

    })();
  </script>

  <head>
    <link

    <link

    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"

    />
    <meta charset="UTF-8" />

    <title>SE423 · Chapter 1 Mindmap — Program, Project or Product?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1f2937;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #3fb950;
        --accent3: #d2a8ff;
        --accent4: #ffa657;
        --accent5: #ff7b72;
        --accent6: #79c0ff;
        --node-root: #1a2744;
        --node-root-border: #58a6ff;
        --node-l1: #1a2a1e;
        --node-l1-border: #3fb950;
        --node-l2: #2a1f3d;
        --node-l2-border: #d2a8ff;
        --node-l3: #2a1f18;
        --node-l3-border: #ffa657;
        --node-selected: #0d2442;
        --node-selected-border: #58a6ff;
        --shadow: rgba(0, 0, 0, 0.5);
        --connector: #30363d;
        --panel-bg: #161b22;
        --panel-border: #30363d;
        --toolbar-bg: rgba(13, 17, 23, 0.92);
        --search-bg: #21262d;
        --search-border: #30363d;
        --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="light"] {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --surface2: #f0f2f5;
        --border: #d0d7de;
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent2: #1a7f37;
        --accent3: #8250df;
        --accent4: #bc4c00;
        --accent5: #cf222e;
        --accent6: #0550ae;
        --node-root: #dbeafe;
        --node-root-border: #0969da;
        --node-l1: #dcfce7;
        --node-l1-border: #1a7f37;
        --node-l2: #ede9fe;
        --node-l2-border: #8250df;
        --node-l3: #fff7ed;
        --node-l3-border: #bc4c00;
        --node-selected: #bfdbfe;
        --node-selected-border: #0969da;
        --shadow: rgba(0, 0, 0, 0.12);
        --connector: #c8d1da;
        --panel-bg: #ffffff;
        --panel-border: #d0d7de;
        --toolbar-bg: rgba(246, 248, 250, 0.92);
        --search-bg: #f6f8fa;
        --search-border: #d0d7de;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        transition:
          background var(--transition),
          color var(--transition);
        user-select: none;
      }

      /* TOOLBAR */
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--toolbar-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        height: 56px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      .toolbar-brand {
        font-family: "DM Serif Display", serif;
        font-size: 16px;
        color: var(--text);
        white-space: nowrap;
        margin-right: 8px;
        letter-spacing: -0.3px;
      }

      .toolbar-brand span {
        color: var(--accent);
      }

      .toolbar-sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
      }

      #search-wrap {
        position: relative;
        flex: 1;
        max-width: 280px;
      }

      #search-wrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.5;
        pointer-events: none;
      }

      #search {
        width: 100%;
        background: var(--search-bg);
        border: 1px solid var(--search-border);
        border-radius: 8px;
        padding: 6px 12px 6px 34px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.2s,
          background var(--transition);
      }

      #search:focus {
        border-color: var(--accent);
      }

      #search::placeholder {
        color: var(--text-muted);
      }

      .tb-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 11px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.1s;
        white-space: nowrap;
      }

      .tb-btn:hover {
        background: var(--border);
        transform: translateY(-1px);
      }

      .tb-btn:active {
        transform: translateY(0);
      }

      .tb-btn svg {
        flex-shrink: 0;
      }

      #theme-toggle {
        font-size: 16px;
        padding: 6px 10px;
      }

      #search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 32px var(--shadow);
        z-index: 200;
        max-height: 260px;
        overflow-y: auto;
        display: none;
      }

      .sr-item {
        padding: 9px 14px;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sr-item:last-child {
        border-bottom: none;
      }

      .sr-item:hover {
        background: var(--surface2);
      }

      .sr-item .sr-path {
        font-size: 11px;
        color: var(--text-muted);
      }

      .sr-item mark {
        background: transparent;
        color: var(--accent);
        font-weight: 600;
      }

      /* CANVAS */
      #canvas-wrap {
        position: fixed;
        top: 56px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        cursor: grab;
      }

      #canvas-wrap.grabbing {
        cursor: grabbing;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 4000px;
        height: 4000px;
        transform-origin: 0 0;
      }

      #svg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* NODES */
      .node {
        position: absolute;
        border-radius: 14px;
        border: 2px solid;
        cursor: pointer;
        transition:
          box-shadow 0.25s,
          transform 0.25s,
          background 0.25s,
          border-color 0.25s,
          opacity 0.25s;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        max-width: 220px;
        min-width: 120px;
      }

      .node:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 24px var(--shadow);
        z-index: 10;
      }

      .node.root {
        background: var(--node-root);
        border-color: var(--node-root-border);
        font-family: "DM Serif Display", serif;
        font-size: 15px;
        min-width: 160px;
        max-width: 240px;
        box-shadow:
          0 0 0 4px rgba(88, 166, 255, 0.15),
          0 4px 20px var(--shadow);
      }

      .node.level-1 {
        background: var(--node-l1);
        border-color: var(--node-l1-border);
        font-size: 13px;
        font-weight: 500;
      }

      .node.level-2 {
        background: var(--node-l2);
        border-color: var(--node-l2-border);
        font-size: 12.5px;
      }

      .node.level-3 {
        background: var(--node-l3);
        border-color: var(--node-l3-border);
        font-size: 12px;
      }

      .node.selected {
        background: var(--node-selected) !important;
        border-color: var(--node-selected-border) !important;
        box-shadow:
          0 0 0 3px rgba(88, 166, 255, 0.3),
          0 6px 24px var(--shadow) !important;
        z-index: 20;
      }

      .node.highlighted {
        box-shadow:
          0 0 0 3px var(--accent4),
          0 4px 16px var(--shadow) !important;
      }

      .node-text {
        flex: 1;
        line-height: 1.35;
        word-break: break-word;
      }

      .chevron {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        opacity: 0.6;
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.2s;
      }

      .node.expanded .chevron {
        transform: rotate(90deg);
        opacity: 1;
      }

      .leaf-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
        transition: background 0.2s;
      }

      .node.selected .leaf-dot,
      .node:hover .leaf-dot {
        background: var(--accent);
      }

      /* CONNECTOR LINES */
      .connector {
        fill: none;
        stroke: var(--connector);
        stroke-width: 1.5;
        transition: stroke var(--transition);
      }

      /* PANEL */
      #panel {
        position: fixed;
        top: 56px;
        right: -440px;
        width: 420px;
        bottom: 0;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
        z-index: 90;
        display: flex;
        flex-direction: column;
        transition:
          right 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          background var(--transition),
          border-color var(--transition);
        box-shadow: -8px 0 40px var(--shadow);
      }

      #panel.open {
        right: 0;
      }

      #panel-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      #panel-title {
        font-family: "DM Serif Display", serif;
        font-size: 20px;
        line-height: 1.3;
        flex: 1;
        color: var(--text);
      }

      #panel-close {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        transition:
          color 0.2s,
          background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      #panel-close:hover {
        color: var(--text);
        background: var(--surface2);
      }

      #panel-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        line-height: 1.75;
        font-size: 14px;
        color: var(--text);
      }

      #panel-body p {
        margin-bottom: 14px;
      }

      #panel-body ol,
      #panel-body ul {
        margin: 0 0 14px;
        padding-left: 20px;
      }

      #panel-body li {
        margin-bottom: 8px;
        padding-left: 2px;
      }

      #panel-body li::marker {
        color: var(--accent);
        font-weight: 600;
      }

      #panel-body .xref-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 8px;
        margin: 0 0 8px;
        padding-top: 10px;
        border-top: 1px dashed var(--border);
      }

      #panel-body .xref-line .panel-tag {
        margin: 0;
      }

      #panel-body .xref {
        color: var(--accent);
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        text-align: left;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      #panel-body strong {
        color: var(--accent);
        font-weight: 600;
      }

      #panel-body em {
        color: var(--accent3);
        font-style: italic;
      }

      .panel-tag {
        display: inline-block;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 14px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* ZOOM BADGE */
      #zoom-badge {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 12px;
        color: var(--text-muted);
        z-index: 50;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      /* FOOTER */
      #footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--toolbar-bg);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        z-index: 100;
        font-size: 12px;
        color: var(--text-muted);
        gap: 6px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      #footer span {
        font-weight: 600;
        color: var(--text);
        font-family: "DM Serif Display", serif;
        letter-spacing: 0.2px;
      }

      /* SCROLLBAR */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      /* NODE ANIMATION */
      @keyframes nodeIn {
        from {
          opacity: 0;
          transform: translateX(-12px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .node {
        animation: nodeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      /* ─────────────────────────────────────────────
           PDF EXPORT SHEET (landscape, fully expanded)
           ───────────────────────────────────────────── */
      #print-sheet {
        display: none;
      }

      #print-sheet.measuring {
        display: block;
        position: fixed;
        top: 0;
        left: -20000px;
        z-index: -1;
      }

      #print-inner {
        width: 1520px;
        transform-origin: top left;
        background: #ffffff;
        color: #12151a;
        font-family: "DM Sans", sans-serif;
      }

      #print-inner .ps-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 3px solid #0f172a;
        padding-bottom: 10px;
        margin-bottom: 16px;
      }

      #print-inner .ps-kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #5b6472;
      }

      #print-inner .ps-title {
        font-size: 34px;
        line-height: 1.1;
        font-weight: 800;
        color: #0f172a;
      }

      #print-inner .ps-meta {
        font-size: 11px;
        line-height: 1.5;
        text-align: right;
        white-space: nowrap;
        color: #5b6472;
      }

      #print-inner .ps-grid {
        column-width: 300px;
        column-gap: 14px;
      }

      #print-inner .ps-card {
        display: inline-block;
        width: 100%;
        margin: 0 0 14px;
        border: 1.5px solid #d8dee7;
        border-top: 5px solid var(--c, #0969da);
        border-radius: 10px;
        padding: 11px 14px 14px;
        background: #ffffff;
        break-inside: avoid;
      }

      #print-inner .ps-card-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }

      #print-inner .ps-num {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--c, #0969da);
      }

      #print-inner .ps-branch {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.25;
        color: #0f172a;
      }

      #print-inner .ps-branch-desc {
        font-size: 11px;
        line-height: 1.45;
        color: #4a5464;
        margin: 6px 0 9px;
      }

      #print-inner .ps-leaves {
        list-style: none;
        margin: 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--c, #0969da);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      #print-inner .ps-leaf {
        position: relative;
        font-size: 11.5px;
        line-height: 1.45;
        color: #1f2733;
      }

      #print-inner .ps-leaf::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 7px;
        width: 8px;
        height: 2px;
        background: var(--c, #0969da);
      }

      #print-inner .ps-group > .ps-leaf-label {
        display: block;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }

      #print-inner .ps-sub {
        list-style: none;
        margin: 5px 0 0;
        padding: 0 0 0 11px;
        border-left: 1px dashed #cdd5e0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #print-inner .ps-sub .ps-leaf {
        font-size: 10.5px;
        color: #4a5464;
      }

      #print-inner .ps-sub .ps-leaf::before {
        display: none;
      }

      #print-inner .ps-foot {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 8px;
        border-top: 1px solid #d8dee7;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: #69727f;
      }

      @media print {
        @page {
          size: A3 landscape;
          margin: 8mm;
        }

        html,
        body {
          height: auto !important;
          overflow: visible !important;
          background: #ffffff !important;
        }

        body > *:not(#print-sheet) {
          display: none !important;
        }

        #print-sheet {
          display: block !important;
          position: static !important;
          left: auto !important;
        }

        /* A transform does not shrink the layout box, so a scaled sheet
               would still paginate by its full size. Clamp it to one page. */
        #print-sheet.one-page {
          width: 1520px;
          height: 1050px;
          overflow: hidden;
        }

        #print-inner {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    
      .nest { margin: 10px 0 14px; }
      .nest-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .nest-pair .nest { margin: 0 0 10px; }
      .nest-box { --c: #888; border: 2px solid var(--c); border-radius: 8px; padding: 8px 10px 10px; background: color-mix(in srgb, var(--c) 12%, transparent); font-size: 13px; font-weight: 600; line-height: 1.3; }
      .nest-box > span { display: block; }
      .nest-box .nest-box { margin-top: 8px; }
      .nest-product, .c-product { --c: #2f7fd6; }
      .nest-program, .c-program { --c: #9a4fd6; }
      .nest-project, .c-project { --c: #d9752b; }
      b.c-product, b.c-program, b.c-project { color: var(--c); }
      .nest-link { display: inline-block; margin: 2px 6px 2px 0; font-size: 13px; font-weight: 600; color: inherit; text-underline-offset: 2px; }
      #panel details, .panel details { margin-top: 10px; }
      #panel summary, .panel summary { cursor: pointer; font-weight: 600; }

      #forms-strip { position: fixed; top: 56px; left: 0; right: 0; z-index: 50; padding: 8px clamp(10px, 2vw, 24px) 10px; background: var(--panel-bg); border-bottom: 1px solid var(--border); }
      #forms-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
      #forms-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
      #forms-cards[hidden] { display: none; }
      .forms-card { appearance: none; display: flex; flex-direction: column; justify-content: flex-start; width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      .forms-card:hover { border-color: var(--c, currentColor); }
      .forms-card:focus-visible, #forms-toggle:focus-visible { outline: 2px solid #2f7fd6; outline-offset: 2px; }
      .forms-name { display: block; font-size: 13px; font-weight: 700; }
      .forms-clue { display: block; font-size: 12px; opacity: 0.8; }
      .forms-card .nest { margin: 6px 0; }
      .forms-card .nest-box { padding: 3px 8px 5px; font-size: 12px; }
      .forms-card .nest-box .nest-box { margin-top: 3px; }
      #canvas-wrap { top: calc(56px + var(--strip-h, 0px)); }
      #panel { width: min(420px, 100vw); right: -100vw; z-index: 90; }
      @media (max-width: 720px) {
        #forms-bar { flex-wrap: wrap; }
        #forms-cards { grid-template-columns: 1fr; }
      }
      @media print { #forms-strip { display: none; } #canvas-wrap { top: 0; } }
</style>

    <script>
      // ─────────────────────────────────────────────
      // DATA
      // ─────────────────────────────────────────────
      const DATA = {"id": "root", "label": "Program, Project or Product? Who sits inside whom", "desc": "<span class=\"panel-tag\">How to read the names</span><p><b>The word before “within” is the inner box. The word after “within” is the outer box.</b></p><p>So “program management within a product life cycle” means a program inside a product’s life, and “product management within a program” means a whole product inside a program.</p><p>Colors stay the same everywhere: <b class=\"c-product\">product</b>, <b class=\"c-program\">program</b>, <b class=\"c-project\">project</b>.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-50\">Slide 50</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-51\">Slide 51</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-52\">Slide 52</a></p>", "children": [{"id": "words", "label": "First, the 3 words", "desc": "<span class=\"panel-tag\">Why they get confused</span><p>They look alike, but each answers a different question. Project: what are we doing right now? Program: which related work do we coordinate? Product: what lives on for years?</p>", "children": [{"id": "w-project", "label": "Project", "desc": "<span class=\"panel-tag\">Meaning</span><p>A <b class=\"c-project\">temporary</b> effort that creates a <b>unique</b> result. It ends.</p><span class=\"panel-tag\">Test</span><p>Does it end? Is it one of a kind? Two yeses means it’s a project.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-25\">Slide 25</a></p>"}, {"id": "w-program", "label": "Program", "desc": "<span class=\"panel-tag\">Meaning</span><p><b class=\"c-program\">Related</b> projects, subsidiary programs and program activities, managed together to get benefits you wouldn’t get separately.</p><span class=\"panel-tag\">Test</span><p>Remove the coordination. Does anything get lost? If yes, it’s a program.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-25\">Slide 25</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-50\">Slide 50</a></p>"}, {"id": "w-product", "label": "Product", "desc": "<span class=\"panel-tag\">Meaning</span><p>An artifact that is <b class=\"c-product\">produced</b>, <b>quantifiable</b>, and either an end item or a component.</p><span class=\"panel-tag\">Remember</span><p><b>EQuiP</b>: End item or component, Quantifiable, Produced.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-46\">Slide 46</a></p>"}, {"id": "w-pm", "label": "Project vs. product management", "desc": "<span class=\"panel-tag\">The real exam question</span><p>The instructor asked for this difference on the midterm, and used the two words on purpose.</p><ul><li><b class=\"c-project\">Project management</b> delivers one temporary piece of work, then the team disbands.</li><li><b class=\"c-product\">Product management</b> combines people, data, processes and business systems to create, maintain and develop a product for its whole life cycle.</li></ul><span class=\"panel-tag\">Remember</span><p>Project ends. Product lives on. A project is one episode, and the product is the whole series.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-47\">Slide 47</a></p>"}]}, {"id": "forms", "label": "The 3 forms", "desc": "<span class=\"panel-tag\">The whole idea</span><p>Product management can exist in different forms, “including but not limited to” these three. Only what’s inside what changes.</p><p><b>1.</b> Program inside a product</p><div class=\"nest\"><div class=\"nest-box nest-product\"><span>Product life cycle</span><div class=\"nest-box nest-program\"><span>Program</span><div class=\"nest-box nest-project\"><span>Projects</span></div></div></div></div><p><b>2.</b> Project inside a product</p><div class=\"nest\"><div class=\"nest-box nest-product\"><span>Product life cycle</span><div class=\"nest-box nest-project\"><span>Individual projects</span></div></div></div><p><b>3.</b> Product inside a program</p><div class=\"nest\"><div class=\"nest-box nest-program\"><span>Program</span><div class=\"nest-box nest-product\"><span>Full product life cycle</span></div></div></div><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-50\">Slide 50</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-51\">Slide 51</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-52\">Slide 52</a></p>", "children": [{"id": "form-1", "label": "1. Program within a product life cycle", "desc": "<span class=\"panel-tag\">What sits where</span><div class=\"nest\"><div class=\"nest-box nest-product\"><span>Product life cycle</span><div class=\"nest-box nest-program\"><span>Program</span><div class=\"nest-box nest-project\"><span>Related projects</span></div></div></div></div><span class=\"panel-tag\">When</span><p>For <b>very large or long-running products</b>, when one or more life cycle phases are complex enough to need a set of programs and projects working together.</p><span class=\"panel-tag\">Includes</span><ul><li>Related projects</li><li>Subsidiary programs</li><li>Program activities</li></ul><span class=\"panel-tag\">Slide example</span><p>Modernizing the <b>product</b> after years of product launch.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-50\">Slide 50</a></p>", "children": [{"id": "f1-clue", "label": "Clue: very large, set of programs and projects", "desc": "<span class=\"panel-tag\">Spot it in a question</span><p>The product is the outer box, and it needs <b class=\"c-program\">coordinated</b> work. Look for: very large, long-running, a complex phase, many projects that depend on each other.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-50\">Slide 50</a></p>"}]}, {"id": "form-2", "label": "2. Project within a product life cycle", "desc": "<span class=\"panel-tag\">What sits where</span><div class=\"nest\"><div class=\"nest-box nest-product\"><span>Product life cycle</span><div class=\"nest-box nest-project\"><span>One project, as needed</span></div></div></div><span class=\"panel-tag\">When</span><p>The product is developed and matured as an <b>ongoing business activity</b>. <b>Portfolio governance charters individual projects</b> as needed for enhancements, improvements or other unique outcomes.</p><span class=\"panel-tag\">Slide example</span><p>Modernizing the <b>UI</b> after years of product launch.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-51\">Slide 51</a></p>", "children": [{"id": "f2-clue", "label": "Clue: ongoing activity, individual projects", "desc": "<span class=\"panel-tag\">Spot it in a question</span><p>The product just keeps running, with no big program around it. One specific change gets its own project, which closes while the product continues. To charter means to formally authorize.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-51\">Slide 51</a></p>"}]}, {"id": "form-3", "label": "3. Product within a program", "desc": "<span class=\"panel-tag\">What sits where</span><div class=\"nest\"><div class=\"nest-box nest-program\"><span>Program</span><div class=\"nest-box nest-product\"><span>Full product life cycle</span></div></div></div><span class=\"panel-tag\">When</span><p>The <b>full product life cycle</b> is applied within the purview and boundaries of a given program. The containers flip: the program is the outer box.</p><span class=\"panel-tag\">Slide example</span><p>Developing a <b>POC</b> (proof of concept) to showcase potential directions of a given program.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-52\">Slide 52</a></p>", "children": [{"id": "f3-clue", "label": "Clue: POC, full life cycle inside a program", "desc": "<span class=\"panel-tag\">Spot it in a question</span><p>The product is born, used and finished inside the program, and doesn’t outlive it. A POC is the slide’s example because it’s built to help decide, then put away.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-52\">Slide 52</a></p>"}]}]}, {"id": "apart", "label": "Don’t mix them up", "desc": "<span class=\"panel-tag\">Where the traps are</span><p>The instructor uses near-identical words on purpose. These are the pairs most likely to catch you.</p>", "children": [{"id": "a-modern", "label": "Modernizing the product vs. the UI", "desc": "<span class=\"panel-tag\">Almost the same example</span><p>The slides use nearly the same example for two different forms:</p><ul><li>Modernizing the whole <b>product</b> means a set of programs and projects, so it’s <b class=\"c-program\">form 1</b>.</li><li>Modernizing just the <b>UI</b> is one chartered project, so it’s <b class=\"c-project\">form 2</b>.</li></ul><span class=\"panel-tag\">Ask</span><p>Is this one piece of work, or many that depend on each other?</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-50\">Slide 50</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-51\">Slide 51</a></p>"}, {"id": "a-flip", "label": "Program within product vs. product within program", "desc": "<span class=\"panel-tag\">Same words, flipped</span><div class=\"nest-pair\"><div class=\"nest\"><div class=\"nest-box nest-product\"><span>Product</span><div class=\"nest-box nest-program\"><span>Program</span></div></div></div><div class=\"nest\"><div class=\"nest-box nest-program\"><span>Program</span><div class=\"nest-box nest-product\"><span>Product</span></div></div></div></div><p><b>Which one outlives the other?</b> In form 1 the product outlives the program. In form 3 the program outlives the product.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-50\">Slide 50</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-52\">Slide 52</a></p>"}, {"id": "a-word", "label": "Project vs. product in the question", "desc": "<span class=\"panel-tag\">Read twice</span><p>On the real midterm the question said <b>product</b> management and it was easy to read it as <b>project</b> management. Underline that word before answering.</p>"}, {"id": "a-size", "label": "Biggest product first", "desc": "<span class=\"panel-tag\">Quick order</span><ol><li>Program in a product: the largest product</li><li>Project in a product</li><li>Product in a program: the smallest product</li></ol><span class=\"panel-tag\">Note</span><p>This order is a study aid. The slides don’t rank them.</p>"}, {"id": "a-test", "label": "Try it yourself", "desc": "<span class=\"panel-tag\">Practice, written for this map</span><p>Which form is each one?</p><ol><li>A university’s long-running student system needs infrastructure, security and data migration replaced together, over years.</li><li>A live app gets one new payment screen, funded as a single project.</li><li>A large program builds a small demo to compare two technical directions, then drops it.</li></ol><details><summary>Show the answers</summary><ol><li>Form 1: a large, long-running product with a set of dependent work.</li><li>Form 2: one chartered project in an ongoing product.</li><li>Form 3: a whole product life inside a program, like a POC.</li></ol></details>"}]}, {"id": "life", "label": "One product, many projects", "desc": "<span class=\"panel-tag\">The picture to remember</span><p>Slide 49 shows one product with seven projects, grouped into two programs, all under portfolio governance.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-49\">Slide 49</a></p>", "children": [{"id": "l-any", "label": "Can start at any point", "desc": "<span class=\"panel-tag\">What slide 48 says</span><ul><li>Product management may start programs or projects at any point in the life cycle.</li><li>The first product may begin as a deliverable of a program or project.</li><li>New programs or projects may add or improve components, attributes or capabilities that create more value.</li><li>In some instances, a program can cover the product’s full life cycle.</li></ul><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-48\">Slide 48</a></p>"}, {"id": "l-1", "label": "Introduction: Project 1", "desc": "<span class=\"panel-tag\">Slide 49</span><p><b class=\"c-project\">Project 1</b>: initial creation, under Program A.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-49\">Slide 49</a></p>"}, {"id": "l-2", "label": "Growth: Projects 2–3", "desc": "<span class=\"panel-tag\">Slide 49</span><p><b class=\"c-project\">Project 2</b>: more features. <b class=\"c-project\">Project 3</b>: additions. Both are under Program A.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-49\">Slide 49</a></p>"}, {"id": "l-3", "label": "Maturity: Projects 4–6", "desc": "<span class=\"panel-tag\">Slide 49</span><p><b class=\"c-project\">Projects 4, 5 and 6</b>: revisions, under Program B.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-49\">Slide 49</a></p>"}, {"id": "l-4", "label": "Retirement: Project 7", "desc": "<span class=\"panel-tag\">Slide 49</span><p><b class=\"c-project\">Project 7</b>: retirement, under Program B. Retiring a product is a project too.</p><span class=\"panel-tag\">Remember</span><p><b>I Got My Reward</b>: Introduction, Growth, Maturity, Retirement.</p><p class=\"xref-line\"><span class=\"panel-tag\">Slides</span><a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-47\">Slide 47</a> <a class=\"nest-link\" target=\"_top\" href=\"../../../annotated-slides/01-introduction/#slide-49\">Slide 49</a></p>"}]}]};

      // ─────────────────────────────────────────────
      // STATE
      // ─────────────────────────────────────────────
      const state = {
        expanded: new Set(["root", "forms"]),
        selected: null,
        panX: 0,
        panY: 0,
        scale: 1,
        dragging: false,
        dragStartX: 0,
        dragStartY: 0,
        dragStartPanX: 0,
        dragStartPanY: 0,
      };

      const NODE_W = 200;
      const NODE_H = 44;
      const H_GAP = 80;
      const V_GAP = 28;

      function estimateNodeHeight(node) {
        const text = String(node.label || "");
        const charsPerLine = node._level === 0 ? 22 : 18;
        const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
        return Math.max(NODE_H, 24 + lines * 22);
      }

      // ─────────────────────────────────────────────
      // LAYOUT ENGINE
      // ─────────────────────────────────────────────
      function shiftSubtree(node, deltaY) {
        node._y += deltaY;
        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach((child) => shiftSubtree(child, deltaY));
        }
      }

      function computeLayout(node, level = 0, x = 100, y = 0) {
        node._level = level;
        node._x = x;
        node._y = y;
        node._w = NODE_W;
        node._h = estimateNodeHeight(node);

        if (!node.children || !state.expanded.has(node.id)) {
          node._subtreeH = node._h;
          return node._subtreeH;
        }

        const childX = x + NODE_W + H_GAP;
        let totalH = 0;
        node.children.forEach((child) => {
          totalH += computeLayout(child, level + 1, childX, 0);
          totalH += V_GAP;
        });
        totalH -= V_GAP;

        let cy = y + node._h / 2 - totalH / 2;
        node.children.forEach((child) => {
          const nextY = cy + child._subtreeH / 2 - child._h / 2;
          shiftSubtree(child, nextY - child._y);
          cy += child._subtreeH + V_GAP;
        });

        node._subtreeH = Math.max(node._h, totalH);
        return node._subtreeH;
      }

      // ─────────────────────────────────────────────
      // RENDER
      // ─────────────────────────────────────────────
      const canvas = document.getElementById("canvas");
      const svgLayer = document.getElementById("svg-layer");
      let nodeEls = {};

      function render() {
        computeLayout(DATA, 0, 100, 2000);
        renderNodes(DATA);
        renderConnectors(DATA);
      }

      function renderNodes(node) {
        let el = nodeEls[node.id];
        if (!el) {
          el = document.createElement("div");
          el.className = "node";
          el.dataset.id = node.id;
          el.innerHTML = buildNodeHTML(node);
          el.addEventListener("click", () => onNodeClick(node));
          canvas.appendChild(el);
          nodeEls[node.id] = el;
        }

        const levelClass =
          node._level === 0 ? "root" : `level-${Math.min(node._level, 3)}`;
        el.className = `node ${levelClass}${state.selected === node.id ? " selected" : ""}${state.expanded.has(node.id) ? " expanded" : ""}`;
        el.style.left = node._x + "px";
        el.style.top = node._y + "px";
        el.style.width = node._w + "px";
        el.style.minHeight = node._h + "px";
        el.style.display = "flex";

        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach(renderNodes);
        }

        // Remove orphaned children
        if (!node.children || !state.expanded.has(node.id)) {
          collapseChildren(node);
        }
      }

      function buildNodeHTML(node) {
        const isParent = node.children && node.children.length > 0;
        const icon = isParent
          ? `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`
          : `<div class="leaf-dot"></div>`;
        return `<div class="node-text">${node.label}</div>${icon}`;
      }

      function collapseChildren(node) {
        if (!node.children) return;
        node.children.forEach((child) => {
          if (nodeEls[child.id]) {
            nodeEls[child.id].style.display = "none";
          }
          collapseChildren(child);
        });
      }

      function renderConnectors(node) {
        svgLayer.innerHTML = "";
        drawConnectors(node);
      }

      function drawConnectors(node) {
        if (!node.children || !state.expanded.has(node.id)) return;
        node.children.forEach((child) => {
          const x1 = node._x + node._w;
          const y1 = node._y + node._h / 2;
          const x2 = child._x;
          const y2 = child._y + child._h / 2;
          const cx1 = x1 + (x2 - x1) * 0.55;
          const cx2 = x2 - (x2 - x1) * 0.55;
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path.setAttribute("class", "connector");
          path.setAttribute(
            "d",
            `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`,
          );
          svgLayer.appendChild(path);
          drawConnectors(child);
        });
      }

      // ─────────────────────────────────────────────
      // INTERACTION
      // ─────────────────────────────────────────────
      function onNodeClick(node) {
        if (node.children && node.children.length > 0) {
          if (state.expanded.has(node.id)) {
            state.expanded.delete(node.id);
          } else {
            state.expanded.add(node.id);
          }
          state.selected = node.id;
          render();
          if (node.desc) openPanel(node);
        } else {
          state.selected = node.id;
          render();
          openPanel(node);
        }
      }

      function openPanel(node) {
        document.getElementById("panel-title").textContent = node.label;
        const body = document.getElementById("panel-body");
        body.innerHTML = node.desc || `<p>No description available.</p>`;
        // cross-references: jump to the linked node and show its panel
        body.querySelectorAll("[data-goto]").forEach((a) =>
          a.addEventListener("click", () => {
            const id = a.getAttribute("data-goto");
            const find = (n) =>
              n.id === id ? n : (n.children || []).map(find).find(Boolean);
            const target = find(DATA);
            if (!target) return;
            navigateTo(id);
            openPanel(target);
          }),
        );
        document.getElementById("panel").classList.add("open");
      }

      function closePanel() {
        document.getElementById("panel").classList.remove("open");
        state.selected = null;
        render();
      }

      // ─────────────────────────────────────────────
      // PAN & ZOOM
      // ─────────────────────────────────────────────
      const wrap = document.getElementById("canvas-wrap");

      function applyTransform() {
        canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
        document.getElementById("zoom-badge").textContent =
          Math.round(state.scale * 100) + "%";
      }

      wrap.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node")) return;
        state.dragging = true;
        state.dragStartX = e.clientX;
        state.dragStartY = e.clientY;
        state.dragStartPanX = state.panX;
        state.dragStartPanY = state.panY;
        wrap.classList.add("grabbing");
      });

      window.addEventListener("mousemove", (e) => {
        if (!state.dragging) return;
        state.panX = state.dragStartPanX + (e.clientX - state.dragStartX);
        state.panY = state.dragStartPanY + (e.clientY - state.dragStartY);
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        state.dragging = false;
        wrap.classList.remove("grabbing");
      });

      wrap.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.1 : -0.1;
          state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
          applyTransform();
        },
        { passive: false },
      );

      function zoom(delta) {
        state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
        applyTransform();
      }

      function resetView() {
        state.panX = 0;
        state.panY = 0;
        state.scale = 1;
        applyTransform();
      }

      // ─────────────────────────────────────────────
      // EXPAND / COLLAPSE ALL
      // ─────────────────────────────────────────────
      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children) node.children.forEach((c) => collectIds(c, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => state.expanded.add(id));
        render();
      }

      function collapseAll() {
        state.expanded.clear();
        state.expanded.add("root");
        render();
      }

      // ─────────────────────────────────────────────
      // SEARCH
      // ─────────────────────────────────────────────
      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("search-results");

      function flatNodes(node, path = [], results = []) {
        results.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((c) =>
            flatNodes(c, [...path, node.label], results),
          );
        return results;
      }

      const allNodes = flatNodes(DATA);

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        // Clear highlights
        Object.values(nodeEls).forEach((el) =>
          el.classList.remove("highlighted"),
        );

        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = allNodes.filter(({ node }) =>
          node.label.toLowerCase().includes(q),
        );
        if (matches.length === 0) {
          searchResults.innerHTML =
            '<div class="sr-item" style="cursor:default;color:var(--text-muted)">No results found</div>';
          searchResults.style.display = "block";
          return;
        }

        searchResults.innerHTML = matches
          .slice(0, 10)
          .map(({ node, path }) => {
            const hl = node.label.replace(
              new RegExp(`(${q})`, "gi"),
              "<mark>$1</mark>",
            );
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${hl}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");

        searchResults.querySelectorAll(".sr-item[data-id]").forEach((el) => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            navigateTo(id);
            searchResults.style.display = "none";
            searchInput.value = "";
          });
        });

        matches.forEach(({ node }) => {
          if (nodeEls[node.id]) nodeEls[node.id].classList.add("highlighted");
        });

        searchResults.style.display = "block";
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      function navigateTo(id) {
        // Expand path to node
        function findPath(node, targetId, path = []) {
          if (node.id === targetId) return [...path, node.id];
          if (node.children) {
            for (const c of node.children) {
              const r = findPath(c, targetId, [...path, node.id]);
              if (r) return r;
            }
          }
          return null;
        }
        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => state.expanded.add(pid));
        state.selected = id;
        render();
        // Center on node
        setTimeout(() => {
          function findNode(node, id) {
            if (node.id === id) return node;
            if (node.children)
              for (const c of node.children) {
                const r = findNode(c, id);
                if (r) return r;
              }
            return null;
          }
          const n = findNode(DATA, id);
          if (n) {
            const vpW = wrap.clientWidth;
            const vpH = wrap.clientHeight;
            state.panX = vpW / 2 - (n._x + n._w / 2) * state.scale;
            state.panY = vpH / 2 - (n._y + n._h / 2) * state.scale;
            applyTransform();
          }
        }, 100);
      }

      // ─────────────────────────────────────────────
      // THEME
      // ─────────────────────────────────────────────
      const themeBtn = document.getElementById("theme-toggle");
      let isDark = true;

      function applyTheme(dark) {
        document.body.dataset.theme = dark ? "dark" : "light";
        themeBtn.textContent = dark ? "Light" : "Dark";
        localStorage.setItem("mm-theme", dark ? "dark" : "light");
        try {
          localStorage.setItem("shoug-theme", dark ? "dark" : "light");
        } catch (_e) {}
      }

      themeBtn.addEventListener("click", () => {
        isDark = !isDark;
        applyTheme(isDark);
      });

      // Restore
      const saved =
        localStorage.getItem("shoug-theme") || localStorage.getItem("mm-theme");
      if (saved === "light") {
        isDark = false;
        applyTheme(false);
      }

      // ─────────────────────────────────────────────
      // EXPORT — LANDSCAPE PDF (every node expanded)
      // ─────────────────────────────────────────────
      const PRINT_PAGE_W = 1520; // A3 landscape content box @96dpi
      const PRINT_PAGE_H = 1050;
      const PRINT_ACCENTS = [
        "#0969da",
        "#1a7f37",
        "#8250df",
        "#bc4c00",
        "#cf222e",
        "#0550ae",
      ];

      function psEscape(text) {
        const d = document.createElement("div");
        d.textContent = text == null ? "" : String(text);
        return d.innerHTML;
      }

      function psDesc(html) {
        const d = document.createElement("div");
        d.innerHTML = html || "";
        const tag = d.querySelector(".panel-tag");
        if (tag) tag.remove();
        return d.textContent.replace(/\s+/g, " ").trim();
      }

      function psLeaves(nodes) {
        return (nodes || [])
          .map((node) => {
            const text = psDesc(node.desc) || node.label;
            if (node.children && node.children.length) {
              // A grouping node (e.g. "Examples") keeps its own label as a
              // heading so the nesting still reads on paper.
              return (
                `<li class="ps-leaf ps-group"><span class="ps-leaf-label">${psEscape(node.label)}</span>` +
                `<ul class="ps-sub">${psLeaves(node.children)}</ul></li>`
              );
            }
            return `<li class="ps-leaf">${psEscape(text)}</li>`;
          })
          .join("");
      }

      function printKicker() {
        const parts = document.title
          .split("—")
          .map((s) => s.trim())
          .filter(Boolean);
        return (
          parts.find((p) => /[A-Z]{2,4}\s?\d{3}|chapter/i.test(p)) ||
          parts[parts.length - 1] ||
          ""
        );
      }

      function buildPrintSheet() {
        const old = document.getElementById("print-sheet");
        if (old) old.remove();

        const cards = (DATA.children || [])
          .map((branch, i) => {
            const color = PRINT_ACCENTS[i % PRINT_ACCENTS.length];
            const intro = psDesc(branch.desc);
            return `<section class="ps-card" style="--c:${color}">
                    <div class="ps-card-head">
                        <span class="ps-num">${String(i + 1).padStart(2, "0")}</span>
                        <h2 class="ps-branch">${psEscape(branch.label)}</h2>
                    </div>
                    ${intro ? `<p class="ps-branch-desc">${psEscape(intro)}</p>` : ""}
                    <ul class="ps-leaves">${psLeaves(branch.children)}</ul>
                </section>`;
          })
          .join("");

        const sheet = document.createElement("div");
        sheet.id = "print-sheet";
        sheet.innerHTML = `<div id="print-inner">
                <header class="ps-head">
                    <div>
                        <div class="ps-kicker">${psEscape(printKicker())}</div>
                        <h1 class="ps-title">${psEscape(DATA.label)}</h1>
                    </div>
                    <div class="ps-meta">Full mindmap — all branches expanded</div>
                </header>
                <div class="ps-grid">${cards}</div>
                <div class="ps-foot"><span>Made by Shoug Alomran</span><span>shoug-tech.com</span></div>
            </div>`;
        document.body.appendChild(sheet);
        return sheet;
      }

      async function exportPDF() {
        expandAll();
        const sheet = buildPrintSheet();
        const inner = sheet.querySelector("#print-inner");

        // Measure off-screen, then binary-search the largest scale that still
        // fits one landscape page — sparse maps grow, dense ones shrink.
        sheet.classList.add("measuring");
        try {
          await document.fonts.ready;
        } catch (_e) {}
        await new Promise((r) => requestAnimationFrame(r));

        const fits = (s) => {
          inner.style.transform = "none";
          inner.style.width = PRINT_PAGE_W / s + "px";
          return inner.scrollHeight <= PRINT_PAGE_H / s;
        };

        let lo = 0.45,
          hi = 1.75;
        if (!fits(lo))
          hi = lo; // even the floor overflows: accept it
        else if (fits(hi)) lo = hi;
        else {
          for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            if (fits(mid)) lo = mid;
            else hi = mid;
          }
        }
        const onePage = fits(lo); // false only if even the floor overflows
        inner.style.width = PRINT_PAGE_W / lo + "px";
        inner.style.transform = `scale(${lo})`;
        sheet.classList.toggle("one-page", onePage);
        sheet.classList.remove("measuring");

        window.addEventListener("afterprint", () => sheet.remove(), {
          once: true,
        });
        window.print();
      }

      // ─────────────────────────────────────────────
      // INIT
      // ─────────────────────────────────────────────
      function init() {
        render();
        // Center on the root: the layout puts it at a fixed y, so a
        // hard-coded pan clips the first branch as soon as a map has
        // more branches than the page this template came from.
        state.panX = 40;
        state.panY = wrap.clientHeight / 2 - (DATA._y + DATA._h / 2);
        applyTransform();
      }

      init();
    </script>

    <script>
      // The comparison stays on screen above the map. Each card opens that form's details.
      (function () {
        const strip = document.getElementById("forms-strip");
        const toggle = document.getElementById("forms-toggle");
        const cards = document.getElementById("forms-cards");
        function fit() {
          document.documentElement.style.setProperty("--strip-h", strip.offsetHeight + "px");
        }
        function setOpen(open) {
          cards.hidden = !open;
          toggle.textContent = open ? "Hide the 3 forms" : "Show the 3 forms";
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          fit();
        }
        toggle.addEventListener("click", () => setOpen(cards.hidden));
        cards.querySelectorAll("[data-form]").forEach((card) => {
          card.addEventListener("click", () => {
            const forms = DATA.children.find((c) => c.id === "forms");
            const node = forms.children.find((c) => c.id === card.dataset.form);
            state.selected = node.id;
            render();
            openPanel(node);
          });
        });
        window.addEventListener("resize", fit);
        setOpen(window.innerWidth >= 900);
      })();
    </script>
    <script src="/javascripts/mindmap-controls.js"></script>
  </body>
</html>
