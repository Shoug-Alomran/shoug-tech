<!doctype html>
<html lang="en">
  <script>
    !(function () {
      var t = localStorage.getItem("shoug-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <head>
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/shoug-apple-touch-icon-v4.png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Management — Mindmap</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1f2937;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #3fb950;
        --accent3: #d2a8ff;
        --accent4: #ffa657;
        --accent5: #ff7b72;
        --accent6: #79c0ff;
        --node-root: #1a2744;
        --node-root-border: #58a6ff;
        --node-l1: #1a2a1e;
        --node-l1-border: #3fb950;
        --node-l2: #2a1f3d;
        --node-l2-border: #d2a8ff;
        --node-l3: #2a1f18;
        --node-l3-border: #ffa657;
        --node-selected: #0d2442;
        --node-selected-border: #58a6ff;
        --shadow: rgba(0, 0, 0, 0.5);
        --connector: #30363d;
        --panel-bg: #161b22;
        --panel-border: #30363d;
        --toolbar-bg: rgba(13, 17, 23, 0.92);
        --search-bg: #21262d;
        --search-border: #30363d;
        --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="light"] {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --surface2: #f0f2f5;
        --border: #d0d7de;
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent2: #1a7f37;
        --accent3: #8250df;
        --accent4: #bc4c00;
        --accent5: #cf222e;
        --accent6: #0550ae;
        --node-root: #dbeafe;
        --node-root-border: #0969da;
        --node-l1: #dcfce7;
        --node-l1-border: #1a7f37;
        --node-l2: #ede9fe;
        --node-l2-border: #8250df;
        --node-l3: #fff7ed;
        --node-l3-border: #bc4c00;
        --node-selected: #bfdbfe;
        --node-selected-border: #0969da;
        --shadow: rgba(0, 0, 0, 0.12);
        --connector: #c8d1da;
        --panel-bg: #ffffff;
        --panel-border: #d0d7de;
        --toolbar-bg: rgba(246, 248, 250, 0.92);
        --search-bg: #f6f8fa;
        --search-border: #d0d7de;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        transition:
          background var(--transition),
          color var(--transition);
        user-select: none;
      }

      /* TOOLBAR */
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--toolbar-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        height: 56px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      .toolbar-brand {
        font-family: "DM Serif Display", serif;
        font-size: 16px;
        color: var(--text);
        white-space: nowrap;
        margin-right: 8px;
        letter-spacing: -0.3px;
      }

      .toolbar-brand span {
        color: var(--accent);
      }

      .toolbar-sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
      }

      #search-wrap {
        position: relative;
        flex: 1;
        max-width: 280px;
      }

      #search-wrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.5;
        pointer-events: none;
      }

      #search {
        width: 100%;
        background: var(--search-bg);
        border: 1px solid var(--search-border);
        border-radius: 8px;
        padding: 6px 12px 6px 34px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.2s,
          background var(--transition);
      }

      #search:focus {
        border-color: var(--accent);
      }

      #search::placeholder {
        color: var(--text-muted);
      }

      .tb-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 11px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.1s;
        white-space: nowrap;
      }

      .tb-btn:hover {
        background: var(--border);
        transform: translateY(-1px);
      }

      .tb-btn:active {
        transform: translateY(0);
      }

      .tb-btn svg {
        flex-shrink: 0;
      }

      #theme-toggle {
        font-size: 16px;
        padding: 6px 10px;
      }

      #search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 32px var(--shadow);
        z-index: 200;
        max-height: 260px;
        overflow-y: auto;
        display: none;
      }

      .sr-item {
        padding: 9px 14px;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sr-item:last-child {
        border-bottom: none;
      }

      .sr-item:hover {
        background: var(--surface2);
      }

      .sr-item .sr-path {
        font-size: 11px;
        color: var(--text-muted);
      }

      .sr-item mark {
        background: transparent;
        color: var(--accent);
        font-weight: 600;
      }

      /* CANVAS */
      #canvas-wrap {
        position: fixed;
        top: 56px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        cursor: grab;
      }

      #canvas-wrap.grabbing {
        cursor: grabbing;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 4000px;
        height: 4000px;
        transform-origin: 0 0;
      }

      #svg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* NODES */
      .node {
        position: absolute;
        border-radius: 14px;
        border: 2px solid;
        cursor: pointer;
        transition:
          box-shadow 0.25s,
          transform 0.25s,
          background 0.25s,
          border-color 0.25s,
          opacity 0.25s;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        max-width: 220px;
        min-width: 120px;
      }

      .node:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 24px var(--shadow);
        z-index: 10;
      }

      .node.root {
        background: var(--node-root);
        border-color: var(--node-root-border);
        font-family: "DM Serif Display", serif;
        font-size: 15px;
        min-width: 160px;
        max-width: 240px;
        box-shadow:
          0 0 0 4px rgba(88, 166, 255, 0.15),
          0 4px 20px var(--shadow);
      }

      .node.level-1 {
        background: var(--node-l1);
        border-color: var(--node-l1-border);
        font-size: 13px;
        font-weight: 500;
      }

      .node.level-2 {
        background: var(--node-l2);
        border-color: var(--node-l2-border);
        font-size: 12.5px;
      }

      .node.level-3 {
        background: var(--node-l3);
        border-color: var(--node-l3-border);
        font-size: 12px;
      }

      .node.selected {
        background: var(--node-selected) !important;
        border-color: var(--node-selected-border) !important;
        box-shadow:
          0 0 0 3px rgba(88, 166, 255, 0.3),
          0 6px 24px var(--shadow) !important;
        z-index: 20;
      }

      .node.highlighted {
        box-shadow:
          0 0 0 3px var(--accent4),
          0 4px 16px var(--shadow) !important;
      }

      .node-text {
        flex: 1;
        line-height: 1.35;
        word-break: break-word;
      }

      .chevron {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        opacity: 0.6;
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.2s;
      }

      .node.expanded .chevron {
        transform: rotate(90deg);
        opacity: 1;
      }

      .leaf-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
        transition: background 0.2s;
      }

      .node.selected .leaf-dot,
      .node:hover .leaf-dot {
        background: var(--accent);
      }

      /* CONNECTOR LINES */
      .connector {
        fill: none;
        stroke: var(--connector);
        stroke-width: 1.5;
        transition: stroke var(--transition);
      }

      /* PANEL */
      #panel {
        position: fixed;
        top: 56px;
        right: -440px;
        width: 420px;
        bottom: 0;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
        z-index: 90;
        display: flex;
        flex-direction: column;
        transition:
          right 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          background var(--transition),
          border-color var(--transition);
        box-shadow: -8px 0 40px var(--shadow);
      }

      #panel.open {
        right: 0;
      }

      #panel-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      #panel-title {
        font-family: "DM Serif Display", serif;
        font-size: 20px;
        line-height: 1.3;
        flex: 1;
        color: var(--text);
      }

      #panel-close {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        transition:
          color 0.2s,
          background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      #panel-close:hover {
        color: var(--text);
        background: var(--surface2);
      }

      #panel-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        line-height: 1.75;
        font-size: 14px;
        color: var(--text);
      }

      #panel-body p {
        margin-bottom: 14px;
      }

      #panel-body ol,
      #panel-body ul {
        margin: 0 0 14px;
        padding-left: 20px;
      }

      #panel-body li {
        margin-bottom: 8px;
        padding-left: 2px;
      }

      #panel-body li::marker {
        color: var(--accent);
        font-weight: 600;
      }

      #panel-body .xref-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 8px;
        margin: 0 0 8px;
        padding-top: 10px;
        border-top: 1px dashed var(--border);
      }

      #panel-body .xref-line .panel-tag {
        margin: 0;
      }

      #panel-body .xref {
        color: var(--accent);
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        text-align: left;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      #panel-body strong {
        color: var(--accent);
        font-weight: 600;
      }

      #panel-body em {
        color: var(--accent3);
        font-style: italic;
      }

      .panel-tag {
        display: inline-block;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 14px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* ZOOM BADGE */
      #zoom-badge {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 12px;
        color: var(--text-muted);
        z-index: 50;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      /* FOOTER */
      #footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--toolbar-bg);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        z-index: 100;
        font-size: 12px;
        color: var(--text-muted);
        gap: 6px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      #footer span {
        font-weight: 600;
        color: var(--text);
        font-family: "DM Serif Display", serif;
        letter-spacing: 0.2px;
      }

      /* SCROLLBAR */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      /* NODE ANIMATION */
      @keyframes nodeIn {
        from {
          opacity: 0;
          transform: translateX(-12px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .node {
        animation: nodeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      /* ─────────────────────────────────────────────
           PDF EXPORT SHEET (landscape, fully expanded)
           ───────────────────────────────────────────── */
      #print-sheet {
        display: none;
      }

      #print-sheet.measuring {
        display: block;
        position: fixed;
        top: 0;
        left: -20000px;
        z-index: -1;
      }

      #print-inner {
        width: 1520px;
        transform-origin: top left;
        background: #ffffff;
        color: #12151a;
        font-family: "DM Sans", sans-serif;
      }

      #print-inner .ps-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 3px solid #0f172a;
        padding-bottom: 10px;
        margin-bottom: 16px;
      }

      #print-inner .ps-kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #5b6472;
      }

      #print-inner .ps-title {
        font-size: 34px;
        line-height: 1.1;
        font-weight: 800;
        color: #0f172a;
      }

      #print-inner .ps-meta {
        font-size: 11px;
        line-height: 1.5;
        text-align: right;
        white-space: nowrap;
        color: #5b6472;
      }

      #print-inner .ps-grid {
        column-width: 300px;
        column-gap: 14px;
      }

      #print-inner .ps-card {
        display: inline-block;
        width: 100%;
        margin: 0 0 14px;
        border: 1.5px solid #d8dee7;
        border-top: 5px solid var(--c, #0969da);
        border-radius: 10px;
        padding: 11px 14px 14px;
        background: #ffffff;
        break-inside: avoid;
      }

      #print-inner .ps-card-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }

      #print-inner .ps-num {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--c, #0969da);
      }

      #print-inner .ps-branch {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.25;
        color: #0f172a;
      }

      #print-inner .ps-branch-desc {
        font-size: 11px;
        line-height: 1.45;
        color: #4a5464;
        margin: 6px 0 9px;
      }

      #print-inner .ps-leaves {
        list-style: none;
        margin: 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--c, #0969da);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      #print-inner .ps-leaf {
        position: relative;
        font-size: 11.5px;
        line-height: 1.45;
        color: #1f2733;
      }

      #print-inner .ps-leaf::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 7px;
        width: 8px;
        height: 2px;
        background: var(--c, #0969da);
      }

      #print-inner .ps-group > .ps-leaf-label {
        display: block;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }

      #print-inner .ps-sub {
        list-style: none;
        margin: 5px 0 0;
        padding: 0 0 0 11px;
        border-left: 1px dashed #cdd5e0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #print-inner .ps-sub .ps-leaf {
        font-size: 10.5px;
        color: #4a5464;
      }

      #print-inner .ps-sub .ps-leaf::before {
        display: none;
      }

      #print-inner .ps-foot {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 8px;
        border-top: 1px solid #d8dee7;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: #69727f;
      }

      @media print {
        @page {
          size: A3 landscape;
          margin: 8mm;
        }

        html,
        body {
          height: auto !important;
          overflow: visible !important;
          background: #ffffff !important;
        }

        body > *:not(#print-sheet) {
          display: none !important;
        }

        #print-sheet {
          display: block !important;
          position: static !important;
          left: auto !important;
        }

        /* A transform does not shrink the layout box, so a scaled sheet
               would still paginate by its full size. Clamp it to one page. */
        #print-sheet.one-page {
          width: 1520px;
          height: 1050px;
          overflow: hidden;
        }

        #print-inner {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>

    <script>
      // ─────────────────────────────────────────────
      // DATA
      // ─────────────────────────────────────────────
      const DATA = {
        "id": "root",
        "label": "Change Management",
        "children": [
          {
            "id": "why",
            "label": "Why Change Happens",
            "desc": "<span class=\"panel-tag\">Overview</span><p>A key problem for organizations is implementing and managing change to their current projects and legacy systems.</p><p><strong>Reality check:</strong> the average project sees roughly <strong>25% requirements change</strong>. An overly detailed spec or a longer requirements phase is not the fix &mdash; the fix is a disciplined process, not a longer upfront guess.</p>",
            "children": [
              {
                "id": "why-mnemonic",
                "label": "\"NEW BREAKs it, so we RE-fix it\"",
                "desc": "<span class=\"panel-tag\">Memory Hook</span><ul><li><strong>N</strong>ew requirements emerge</li><li><strong>E</strong>nvironment (business) changes</li><li><strong>W</strong>orn-out equipment must be accommodated</li><li><strong>B</strong>ugs (errors) must be repaired, <strong>R</strong>isks mitigated</li><li>P<strong>E</strong>rformance/reliability must improve</li></ul>"
              },
              {
                "id": "why-new-req",
                "label": "New Requirements",
                "desc": "<span class=\"panel-tag\">Driver</span><p>Emerge while the software is under development or already being used.</p>"
              },
              {
                "id": "why-biz-env",
                "label": "Business Environment",
                "desc": "<span class=\"panel-tag\">Driver</span><p>The environment the software operates in changes over time.</p>"
              },
              {
                "id": "why-errors",
                "label": "Errors & Risk",
                "desc": "<span class=\"panel-tag\">Driver</span><p>Errors must be repaired and risks mitigated as they're discovered.</p>"
              },
              {
                "id": "why-equipment",
                "label": "New Equipment",
                "desc": "<span class=\"panel-tag\">Driver</span><p>New hardware/equipment must be accommodated by the system.</p>"
              },
              {
                "id": "why-performance",
                "label": "Performance",
                "desc": "<span class=\"panel-tag\">Driver</span><p>Performance or reliability may have to be improved.</p>"
              }
            ]
          },
          {
            "id": "icc",
            "label": "Integrated Change Control",
            "desc": "<span class=\"panel-tag\">Key Term</span><p>A process concerned with project change requests, carried out from project inception through completion. All changes must be carefully controlled to maintain the integrity and consistency of the project plan.</p><p>Covers: reviewing/approving requested changes, managing changes when they occur, controlling scope/cost/budget/schedule/quality, and controlling changes to requirements, design, code and documentation.</p>",
            "children": [
              {
                "id": "icc-5rs",
                "label": "The 5 R's",
                "desc": "<span class=\"panel-tag\">Memory Hook</span><p><strong>Recognize</strong> &rarr; <strong>Request</strong> &rarr; <strong>Rate</strong> &rarr; <strong>Report</strong> &rarr; <strong>Rule</strong>.</p><ol><li>Need for change is recognized</li><li>Change request submitted as RFC or ECO</li><li>Developer/PM team rates it (impact & desirability)</li><li>A change report is generated</li><li>CCB rules: deny or proceed</li></ol>"
              },
              {
                "id": "icc-approved",
                "label": "If Approved — 7 Steps",
                "desc": "<span class=\"panel-tag\">Workflow</span><ol><li>Queue & ECO generated</li><li>Individuals assigned to affected configuration objects</li><li>Check-out & change made</li><li>Change audited</li><li>New baseline established</li><li>Steps 6&ndash;7: If SCI: SQA & testing, then check-in</li></ol>"
              },
              {
                "id": "icc-sci",
                "label": "For Software Configuration Items (SCI)",
                "desc": "<span class=\"panel-tag\">Process</span><ol><li>Promote SCI for the next release</li><li>Rebuild the version (include changes, audit, V&V/testing)</li><li>Distribute the new version</li></ol>"
              },
              {
                "id": "icc-cvc",
                "label": "Change & Version Control",
                "desc": "<span class=\"panel-tag\">Config. Mgmt Plan</span><p>Items placed under change/version control: code (product source), documents (requirements, design, test plans, user guides), plans & databases, test scripts, infrastructure scripts, and the software development plan.</p>"
              },
              {
                "id": "icc-tooling",
                "label": "Tooling",
                "desc": "<span class=\"panel-tag\">Tools</span><p>Use a change management system (often COTS) with a change tracking system. Integrated together, this combo is called <strong>Comprehensive Software Change Management</strong> &mdash; SCM (source code management) + issue/defect tracking software.</p>"
              }
            ]
          },
          {
            "id": "ccb",
            "label": "Change Control Board (CCB)",
            "desc": "<span class=\"panel-tag\">Key Term</span><p>A formally chartered group responsible for reviewing, evaluating, approving, delaying, or rejecting changes to the project, and for recording and communicating such decisions.</p>",
            "children": [
              {
                "id": "ccb-cpm-ccm",
                "label": "CPM vs. CCM Impact",
                "desc": "<span class=\"panel-tag\">Scheduling Impact</span><p><strong>CPM:</strong> changes on the critical path have the greatest impact; off it, less. <strong>CCM:</strong> changes require buffer adjustments &mdash; usually less severe than CPM.</p>"
              },
              {
                "id": "ccb-creep",
                "label": "Creeping Requirements",
                "desc": "<span class=\"panel-tag\">Data Point</span><p>As a % of original scope, creep climbs steeply with project size: ~1&ndash;2% at 10 function points up to ~50% at 100,000 function points.</p>"
              }
            ]
          },
          {
            "id": "agile-cc",
            "label": "Agile Change Control",
            "desc": "<span class=\"panel-tag\">Key Term</span><p>Not controlled by a CCB and PM. <strong>Product</strong> changes are owned by the <strong>customer</strong>; <strong>process</strong> changes are owned by the <strong>team</strong>; the PM <strong>facilitates</strong> discussion.</p><p>Integrated Change Control maps to \"continuous backlog management\" in agile.</p>",
            "children": [
              {
                "id": "agile-vs-plan",
                "label": "Plan-Driven vs. Agile Table",
                "desc": "<span class=\"panel-tag\">Comparison</span><ul><li><strong>Change control:</strong> formal & structured (plan-driven) vs. informal & flexible (agile)</li><li><strong>Change impact analysis:</strong> thorough vs. limited/none</li><li><strong>Implementation:</strong> after CCB approval vs. quickly & frequently</li><li><strong>Documentation:</strong> well-tracked vs. may not be tracked</li></ul>"
              },
              {
                "id": "agile-scrum-freeze",
                "label": "Scrum Freezes the Sprint Backlog",
                "desc": "<span class=\"panel-tag\">Detail</span><p>Scrum allows changes to the Product Backlog at any time, but manages risk by freezing the current Sprint Backlog. Stakeholder communication is key either way.</p>"
              }
            ]
          },
          {
            "id": "strategies",
            "label": "Software Change Strategies",
            "desc": "<span class=\"panel-tag\">Memory Hook</span><p>\"Maintain the skeleton, Move the skeleton, or Mend the skeleton.\" These may be applied separately or together.</p>",
            "children": [
              {
                "id": "strat-maint",
                "label": "Software Maintenance",
                "desc": "<span class=\"panel-tag\">Strategy</span><p>Changes made in response to changed requirements, but the fundamental software structure is stable.</p>"

              {

          {
            "id": "lehman",
            "label": "Lehman's Laws",
            "desc": "<span class=\"panel-tag\">Key Term</span><p>8 laws describing how large systems age. Applicable mainly to large, tailored systems developed by large organizations &mdash; applicability elsewhere not firmly established.</p>",
            "children": [
              {
                "id": "lehman-change",
                "label": "Theme 1 — Change Dynamics",
                "desc": "<span class=\"panel-tag\">Laws</span><p><strong>Continuing change:</strong> a program must change or become progressively less useful. <strong>Continuing growth:</strong> functionality must keep increasing to maintain user satisfaction.</p>"
              },
              {
                "id": "lehman-decay",
                "label": "Theme 2 — Structural Decay",
                "desc": "<span class=\"panel-tag\">Laws</span><p><strong>Increasing complexity:</strong> structure becomes more complex as a program changes. <strong>Declining quality:</strong> quality declines unless the system is actively adapted to its changing environment.</p>"
              },
              {
                "id": "lehman-regularity",
                "label": "Theme 3 — System Regularity",
                "desc": "<span class=\"panel-tag\">Laws</span><p><strong>Large program evolution:</strong> size/release-timing are ~invariant. <strong>Organizational stability:</strong> rate of development ~constant. <strong>Conservation of familiarity:</strong> incremental change per release ~constant. <strong>Feedback system:</strong> evolution involves feedback for improvement.</p>"
              }
            ]
          },
          {
            "id": "maintenance",
            "label": "Software Maintenance",
            "desc": "<span class=\"panel-tag\">Key Term</span><p>Modifying a program after it's put into use. Does not normally involve major architecture changes &mdash; implemented by modifying/adding components. Systems must be maintained to remain useful as their environment changes.</p>",
            "children": [
              {
                "id": "maint-cap",
                "label": "Wear the CAP",
                "desc": "<span class=\"panel-tag\">Memory Hook</span><p><strong>C</strong>orrective &mdash; fix a fault. <strong>A</strong>daptive &mdash; fit a new environment (OS/hardware). <strong>P</strong>erfective &mdash; add/modify functionality.</p>"

                "id": "maint-dist",
                "label": "Distribution of Effort",
                "desc": "<span class=\"panel-tag\">Data Point</span><p>Perfective (functionality add/modify): <strong>65%</strong>. Adaptive: <strong>18%</strong>. Corrective (fault repair): <strong>17%</strong>. Most maintenance is really continued development.</p>"

              {
                "id": "maint-cost",
                "label": "Maintenance Cost",
                "desc": "<span class=\"panel-tag\">Data Point</span><p>Usually <strong>2&times; to 100&times;</strong> development cost. Increases over time as maintenance corrupts the software structure, making further maintenance harder.</p>",
                "children": [

          {

                "label": "Process Metrics",
                "desc": "<span class=\"panel-tag\">Detail</span><p># requests for corrective maintenance, average impact-analysis time, average time to implement a change, # outstanding change requests. Rising values signal declining maintainability.</p>"

            ]
          },
          {
            "id": "arch-evo",
            "label": "Architecture Evolution",
            "desc": "<span class=\"panel-tag\">Key Term</span><p>Converting legacy systems from a centralized architecture to client-server. Ideally: clear separation between UI, system services, and system data management.</p>",
            "children": [
              {
                "id": "arch-drivers",
                "label": "Change Drivers",
                "desc": "<span class=\"panel-tag\">Drivers</span><p>Hardware costs (servers cheaper than mainframes), UI expectations (CLI &rarr; GUI), distributed access (geographically separated users).</p>"
              },
              {
                "id": "arch-factors",
                "label": "Distribution Factors",
                "desc": "<span class=\"panel-tag\">Factors</span><ul><li>Business importance</li><li>System age (older = harder to modify)</li><li>System structure (modular = easier)</li><li>Hardware procurement policies</li></ul>"

          },
          {
            "id": "rollout",
            "label": "Rollout, Shipping & Training",
            "desc": "<span class=\"panel-tag\">Overview</span><p>\"Other Aspects\" of change management: roll-out, training, documentation, migration, maintenance & support.</p>",
            "children": [
              {
                "id": "rollout-checklist",
                "label": "Release Checklist",
                "desc": "<span class=\"panel-tag\">Practice</span><p>Organize activities by group (Engineering, QA, Documentation, Operations), often with sign-off. Roll-out needs a very detailed plan, often scheduled on a specific day.</p>"

          {
            "id": "migration",

              {

                  },
                  {
                    "id": "recovery-process",
                    "label": "Process & Product Steps",
                    "desc": "<span class=\"panel-tag\">Steps</span><ul><li>Fix classic mistakes</li><li>Create miniature milestones</li><li>Stabilize requirements</li><li>Raise the bar on change requests</li><li>Trim the feature set</li></ul>"

                ]

                "id": "closing-resource-leveling",

            "children": [
              {
                "id": "tip-rfc-eco",
                "label": "RFC vs. ECO Order",

              },
              {
                "id": "tip-maint-types",
                "label": "Corrective/Adaptive/Perfective",
                "desc": "<span class=\"panel-tag\">Common Mistake</span><p>Porting to a new OS/hardware = Adaptive. Fixing a fault = Corrective. Adding/modifying functionality = Perfective (~65% of effort).</p>"

      // ─────────────────────────────────────────────
      // STATE
      // ─────────────────────────────────────────────
      const state = {
        expanded: new Set(["root"]),
        selected: null,
        panX: 0,
        panY: 0,
        scale: 1,
        dragging: false,
        dragStartX: 0,
        dragStartY: 0,
        dragStartPanX: 0,
        dragStartPanY: 0,
      };

      const NODE_W = 200;
      const NODE_H = 44;
      const H_GAP = 80;
      const V_GAP = 28;

      function estimateNodeHeight(node) {
        const text = String(node.label || "");
        const charsPerLine = node._level === 0 ? 22 : 18;
        const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
        return Math.max(NODE_H, 24 + lines * 22);
      }

      // ─────────────────────────────────────────────
      // LAYOUT ENGINE
      // ─────────────────────────────────────────────
      function shiftSubtree(node, deltaY) {
        node._y += deltaY;
        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach((child) => shiftSubtree(child, deltaY));
        }
      }

      function computeLayout(node, level = 0, x = 100, y = 0) {
        node._level = level;
        node._x = x;
        node._y = y;
        node._w = NODE_W;
        node._h = estimateNodeHeight(node);

        if (!node.children || !state.expanded.has(node.id)) {
          node._subtreeH = node._h;
          return node._subtreeH;
        }

        const childX = x + NODE_W + H_GAP;
        let totalH = 0;
        node.children.forEach((child) => {
          totalH += computeLayout(child, level + 1, childX, 0);
          totalH += V_GAP;
        });
        totalH -= V_GAP;

        let cy = y + node._h / 2 - totalH / 2;
        node.children.forEach((child) => {
          const nextY = cy + child._subtreeH / 2 - child._h / 2;
          shiftSubtree(child, nextY - child._y);
          cy += child._subtreeH + V_GAP;
        });

        node._subtreeH = Math.max(node._h, totalH);
        return node._subtreeH;
      }

      // ─────────────────────────────────────────────
      // RENDER
      // ─────────────────────────────────────────────
      const canvas = document.getElementById("canvas");
      const svgLayer = document.getElementById("svg-layer");
      let nodeEls = {};

      function render() {
        computeLayout(DATA, 0, 100, 2000);
        renderNodes(DATA);
        renderConnectors(DATA);
      }

      function renderNodes(node) {
        let el = nodeEls[node.id];
        if (!el) {
          el = document.createElement("div");
          el.className = "node";
          el.dataset.id = node.id;
          el.innerHTML = buildNodeHTML(node);
          el.addEventListener("click", () => onNodeClick(node));
          canvas.appendChild(el);
          nodeEls[node.id] = el;
        }

        const levelClass =
          node._level === 0 ? "root" : `level-${Math.min(node._level, 3)}`;
        el.className = `node ${levelClass}${state.selected === node.id ? " selected" : ""}${state.expanded.has(node.id) ? " expanded" : ""}`;
        el.style.left = node._x + "px";
        el.style.top = node._y + "px";
        el.style.width = node._w + "px";
        el.style.minHeight = node._h + "px";
        el.style.display = "flex";

        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach(renderNodes);
        }

        // Remove orphaned children
        if (!node.children || !state.expanded.has(node.id)) {
          collapseChildren(node);
        }
      }

      function buildNodeHTML(node) {
        const isParent = node.children && node.children.length > 0;
        const icon = isParent
          ? `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`
          : `<div class="leaf-dot"></div>`;
        return `<div class="node-text">${node.label}</div>${icon}`;
      }

      function collapseChildren(node) {
        if (!node.children) return;
        node.children.forEach((child) => {
          if (nodeEls[child.id]) {
            nodeEls[child.id].style.display = "none";
          }
          collapseChildren(child);
        });
      }

      function renderConnectors(node) {
        svgLayer.innerHTML = "";
        drawConnectors(node);
      }

      function drawConnectors(node) {
        if (!node.children || !state.expanded.has(node.id)) return;
        node.children.forEach((child) => {
          const x1 = node._x + node._w;
          const y1 = node._y + node._h / 2;
          const x2 = child._x;
          const y2 = child._y + child._h / 2;
          const cx1 = x1 + (x2 - x1) * 0.55;
          const cx2 = x2 - (x2 - x1) * 0.55;
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path.setAttribute("class", "connector");
          path.setAttribute(
            "d",
            `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`,
          );
          svgLayer.appendChild(path);
          drawConnectors(child);
        });
      }

      // ─────────────────────────────────────────────
      // INTERACTION
      // ─────────────────────────────────────────────
      function onNodeClick(node) {
        if (node.children && node.children.length > 0) {
          if (state.expanded.has(node.id)) {
            state.expanded.delete(node.id);
          } else {
            state.expanded.add(node.id);
          }
          state.selected = node.id;
          render();
        } else {
          state.selected = node.id;
          render();
          openPanel(node);
        }
      }

      function openPanel(node) {
        document.getElementById("panel-title").textContent = node.label;
        const body = document.getElementById("panel-body");
        body.innerHTML = node.desc || `<p>No description available.</p>`;
        // cross-references: jump to the linked node and show its panel
        body.querySelectorAll("[data-goto]").forEach((a) =>
          a.addEventListener("click", () => {
            const id = a.getAttribute("data-goto");
            const find = (n) =>
              n.id === id ? n : (n.children || []).map(find).find(Boolean);
            const target = find(DATA);
            if (!target) return;
            navigateTo(id);
            openPanel(target);
          }),
        );
        document.getElementById("panel").classList.add("open");
      }

      function closePanel() {
        document.getElementById("panel").classList.remove("open");
        state.selected = null;
        render();
      }

      // ─────────────────────────────────────────────
      // PAN & ZOOM
      // ─────────────────────────────────────────────
      const wrap = document.getElementById("canvas-wrap");

      function applyTransform() {
        canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
        document.getElementById("zoom-badge").textContent =
          Math.round(state.scale * 100) + "%";
      }

      wrap.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node")) return;
        state.dragging = true;
        state.dragStartX = e.clientX;
        state.dragStartY = e.clientY;
        state.dragStartPanX = state.panX;
        state.dragStartPanY = state.panY;
        wrap.classList.add("grabbing");
      });

      window.addEventListener("mousemove", (e) => {
        if (!state.dragging) return;
        state.panX = state.dragStartPanX + (e.clientX - state.dragStartX);
        state.panY = state.dragStartPanY + (e.clientY - state.dragStartY);
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        state.dragging = false;
        wrap.classList.remove("grabbing");
      });

      wrap.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.1 : -0.1;
          state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
          applyTransform();
        },
        { passive: false },
      );

      function zoom(delta) {
        state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
        applyTransform();
      }

      function resetView() {
        state.panX = 0;
        state.panY = 0;
        state.scale = 1;
        applyTransform();
      }

      // ─────────────────────────────────────────────
      // EXPAND / COLLAPSE ALL
      // ─────────────────────────────────────────────
      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children) node.children.forEach((c) => collectIds(c, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => state.expanded.add(id));
        render();
      }

      function collapseAll() {
        state.expanded.clear();
        state.expanded.add("root");
        render();
      }

      // ─────────────────────────────────────────────
      // SEARCH
      // ─────────────────────────────────────────────
      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("search-results");

      function flatNodes(node, path = [], results = []) {
        results.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((c) =>
            flatNodes(c, [...path, node.label], results),
          );
        return results;
      }

      const allNodes = flatNodes(DATA);

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        // Clear highlights
        Object.values(nodeEls).forEach((el) =>
          el.classList.remove("highlighted"),
        );

        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = allNodes.filter(({ node }) =>
          node.label.toLowerCase().includes(q),
        );
        if (matches.length === 0) {
          searchResults.innerHTML =
            '<div class="sr-item" style="cursor:default;color:var(--text-muted)">No results found</div>';
          searchResults.style.display = "block";
          return;
        }

        searchResults.innerHTML = matches
          .slice(0, 10)
          .map(({ node, path }) => {
            const hl = node.label.replace(
              new RegExp(`(${q})`, "gi"),
              "<mark>$1</mark>",
            );
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${hl}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");

        searchResults.querySelectorAll(".sr-item[data-id]").forEach((el) => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            navigateTo(id);
            searchResults.style.display = "none";
            searchInput.value = "";
          });
        });

        matches.forEach(({ node }) => {
          if (nodeEls[node.id]) nodeEls[node.id].classList.add("highlighted");
        });

        searchResults.style.display = "block";
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      function navigateTo(id) {
        // Expand path to node
        function findPath(node, targetId, path = []) {
          if (node.id === targetId) return [...path, node.id];
          if (node.children) {
            for (const c of node.children) {
              const r = findPath(c, targetId, [...path, node.id]);
              if (r) return r;
            }
          }
          return null;
        }
        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => state.expanded.add(pid));
        state.selected = id;
        render();
        // Center on node
        setTimeout(() => {
          function findNode(node, id) {
            if (node.id === id) return node;
            if (node.children)
              for (const c of node.children) {
                const r = findNode(c, id);
                if (r) return r;
              }
            return null;
          }
          const n = findNode(DATA, id);
          if (n) {
            const vpW = wrap.clientWidth;
            const vpH = wrap.clientHeight;
            state.panX = vpW / 2 - (n._x + n._w / 2) * state.scale;
            state.panY = vpH / 2 - (n._y + n._h / 2) * state.scale;
            applyTransform();
          }
        }, 100);
      }

      // ─────────────────────────────────────────────
      // THEME
      // ─────────────────────────────────────────────
      const themeBtn = document.getElementById("theme-toggle");
      let isDark = true;

      function applyTheme(dark) {
        document.body.dataset.theme = dark ? "dark" : "light";
        themeBtn.textContent = dark ? "🌙" : "☀️";
        localStorage.setItem("mm-theme", dark ? "dark" : "light");
        try {
          localStorage.setItem("shoug-theme", dark ? "dark" : "light");
        } catch (_e) {}
      }

      themeBtn.addEventListener("click", () => {
        isDark = !isDark;
        applyTheme(isDark);
      });

      // Restore
      const saved =
        localStorage.getItem("shoug-theme") || localStorage.getItem("mm-theme");
      if (saved === "light") {
        isDark = false;
        applyTheme(false);
      }

      // ─────────────────────────────────────────────
      // EXPORT — LANDSCAPE PDF (every node expanded)
      // ─────────────────────────────────────────────
      const PRINT_PAGE_W = 1520; // A3 landscape content box @96dpi
      const PRINT_PAGE_H = 1050;
      const PRINT_ACCENTS = [
        "#0969da",
        "#1a7f37",
        "#8250df",
        "#bc4c00",
        "#cf222e",
        "#0550ae",
      ];

      function psEscape(text) {
        const d = document.createElement("div");
        d.textContent = text == null ? "" : String(text);
        return d.innerHTML;
      }

      function psDesc(html) {
        const d = document.createElement("div");
        d.innerHTML = html || "";
        const tag = d.querySelector(".panel-tag");
        if (tag) tag.remove();
        return d.textContent.replace(/\s+/g, " ").trim();
      }

      function psLeaves(nodes) {
        return (nodes || [])
          .map((node) => {
            const text = psDesc(node.desc) || node.label;
            if (node.children && node.children.length) {
              // A grouping node (e.g. "Examples") keeps its own label as a
              // heading so the nesting still reads on paper.
              return (
                `<li class="ps-leaf ps-group"><span class="ps-leaf-label">${psEscape(node.label)}</span>` +
                `<ul class="ps-sub">${psLeaves(node.children)}</ul></li>`
              );
            }
            return `<li class="ps-leaf">${psEscape(text)}</li>`;
          })
          .join("");
      }

      function printKicker() {
        const parts = document.title
          .split("—")
          .map((s) => s.trim())
          .filter(Boolean);
        return (
          parts.find((p) => /[A-Z]{2,4}\s?\d{3}|chapter/i.test(p)) ||
          parts[parts.length - 1] ||
          ""
        );
      }

      function buildPrintSheet() {
        const old = document.getElementById("print-sheet");
        if (old) old.remove();

        const cards = (DATA.children || [])
          .map((branch, i) => {
            const color = PRINT_ACCENTS[i % PRINT_ACCENTS.length];
            const intro = psDesc(branch.desc);
            return `<section class="ps-card" style="--c:${color}">
                    <div class="ps-card-head">
                        <span class="ps-num">${String(i + 1).padStart(2, "0")}</span>
                        <h2 class="ps-branch">${psEscape(branch.label)}</h2>
                    </div>
                    ${intro ? `<p class="ps-branch-desc">${psEscape(intro)}</p>` : ""}
                    <ul class="ps-leaves">${psLeaves(branch.children)}</ul>
                </section>`;
          })
          .join("");

        const sheet = document.createElement("div");
        sheet.id = "print-sheet";
        sheet.innerHTML = `<div id="print-inner">
                <header class="ps-head">
                    <div>
                        <div class="ps-kicker">${psEscape(printKicker())}</div>
                        <h1 class="ps-title">${psEscape(DATA.label)}</h1>
                    </div>
                    <div class="ps-meta">Full mindmap — all branches expanded</div>
                </header>
                <div class="ps-grid">${cards}</div>
                <div class="ps-foot"><span>Made by Shoug Alomran</span><span>shoug-tech.com</span></div>
            </div>`;
        document.body.appendChild(sheet);
        return sheet;
      }

      async function exportPDF() {
        expandAll();
        const sheet = buildPrintSheet();
        const inner = sheet.querySelector("#print-inner");

        // Measure off-screen, then binary-search the largest scale that still
        // fits one landscape page — sparse maps grow, dense ones shrink.
        sheet.classList.add("measuring");
        try {
          await document.fonts.ready;
        } catch (_e) {}
        await new Promise((r) => requestAnimationFrame(r));

        const fits = (s) => {
          inner.style.transform = "none";
          inner.style.width = PRINT_PAGE_W / s + "px";
          return inner.scrollHeight <= PRINT_PAGE_H / s;
        };

        let lo = 0.45,
          hi = 1.75;
        if (!fits(lo))
          hi = lo; // even the floor overflows: accept it
        else if (fits(hi)) lo = hi;
        else {
          for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            if (fits(mid)) lo = mid;
            else hi = mid;
          }
        }
        const onePage = fits(lo); // false only if even the floor overflows
        inner.style.width = PRINT_PAGE_W / lo + "px";
        inner.style.transform = `scale(${lo})`;
        sheet.classList.toggle("one-page", onePage);
        sheet.classList.remove("measuring");

        window.addEventListener("afterprint", () => sheet.remove(), {
          once: true,
        });
        window.print();
      }

      // ─────────────────────────────────────────────
      // INIT
      // ─────────────────────────────────────────────
      function init() {
        render();
        // Center on the root: the layout puts it at a fixed y, so a
        // hard-coded pan clips the first branch as soon as a map has
        // more branches than the page this template came from.
        state.panX = 40;
        state.panY = wrap.clientHeight / 2 - (DATA._y + DATA._h / 2);
        applyTransform();
      }

      init();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
  </body>
</html>
