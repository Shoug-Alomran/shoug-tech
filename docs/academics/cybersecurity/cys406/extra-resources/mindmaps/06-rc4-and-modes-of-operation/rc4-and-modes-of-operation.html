    <title>RC4 &amp; Modes of Operation — CYS406 Mindmap</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1f2937;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #3fb950;
        --accent3: #ff9aa8;
        --accent4: #ffa657;
        --accent5: #ff7b72;
        --accent6: #79c0ff;
        --node-root: #1a2744;
        --node-root-border: #58a6ff;
        --node-l1: #1a2a1e;
        --node-l1-border: #3fb950;
        --node-l2: #3a1c22;
        --node-l2-border: #ff9aa8;
        --node-l3: #2a1f18;
        --node-l3-border: #ffa657;
        --node-selected: #0d2442;
        --node-selected-border: #58a6ff;
        --shadow: rgba(0, 0, 0, 0.5);
        --connector: #30363d;
        --panel-bg: #161b22;
        --panel-border: #30363d;
        --toolbar-bg: rgba(13, 17, 23, 0.92);
        --search-bg: #21262d;
        --search-border: #30363d;
        --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="light"] {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --surface2: #f0f2f5;
        --border: #d0d7de;
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent2: #1a7f37;
        --accent3: #a40e26;
        --accent4: #bc4c00;
        --accent5: #cf222e;
        --accent6: #0550ae;
        --node-root: #dbeafe;
        --node-root-border: #0969da;
        --node-l1: #dcfce7;
        --node-l1-border: #1a7f37;
        --node-l2: #fde8ec;
        --node-l2-border: #a40e26;
        --node-l3: #fff7ed;
        --node-l3-border: #bc4c00;
        --node-selected: #bfdbfe;
        --node-selected-border: #0969da;
        --shadow: rgba(0, 0, 0, 0.12);
        --connector: #c8d1da;
        --panel-bg: #ffffff;
        --panel-border: #d0d7de;
        --toolbar-bg: rgba(246, 248, 250, 0.92);
        --search-bg: #f6f8fa;
        --search-border: #d0d7de;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        transition:
          background var(--transition),
          color var(--transition);
        user-select: none;
      }

      /* TOOLBAR */
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--toolbar-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        height: 56px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      .toolbar-brand {
        font-family: "DM Serif Display", serif;
        font-size: 16px;
        color: var(--text);
        white-space: nowrap;
        margin-right: 8px;
        letter-spacing: -0.3px;
      }

      .toolbar-brand span {
        color: var(--accent);
      }

      .toolbar-sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
      }

      #search-wrap {
        position: relative;
        flex: 1;
        max-width: 280px;
      }

      #search-wrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.5;
        pointer-events: none;
      }

      #search {
        width: 100%;
        background: var(--search-bg);
        border: 1px solid var(--search-border);
        border-radius: 8px;
        padding: 6px 12px 6px 34px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.2s,
          background var(--transition);
      }

      #search:focus {
        border-color: var(--accent);
      }

      #search::placeholder {
        color: var(--text-muted);
      }

      .tb-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 11px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.1s;
        white-space: nowrap;
      }

      .tb-btn:hover {
        background: var(--border);
        transform: translateY(-1px);
      }

      .tb-btn:active {
        transform: translateY(0);
      }

      .tb-btn svg {
        flex-shrink: 0;
      }

      #theme-toggle {
        font-size: 16px;
        padding: 6px 10px;
      }

      #search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 32px var(--shadow);
        z-index: 200;
        max-height: 260px;
        overflow-y: auto;
        display: none;
      }

      .sr-item {
        padding: 9px 14px;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sr-item:last-child {
        border-bottom: none;
      }

      .sr-item:hover {
        background: var(--surface2);
      }

      .sr-item .sr-path {
        font-size: 11px;
        color: var(--text-muted);
      }

      .sr-item mark {
        background: transparent;
        color: var(--accent);
        font-weight: 600;
      }

      /* CANVAS */
      #canvas-wrap {
        position: fixed;
        top: 56px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        cursor: grab;
      }

      #canvas-wrap.grabbing {
        cursor: grabbing;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 4000px;
        height: 4000px;
        transform-origin: 0 0;
      }

      #svg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* NODES */
      .node {
        position: absolute;
        border-radius: 14px;
        border: 2px solid;
        cursor: pointer;
        transition:
          box-shadow 0.25s,
          transform 0.25s,
          background 0.25s,
          border-color 0.25s,
          opacity 0.25s;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        max-width: 220px;
        min-width: 120px;
      }

      .node:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 24px var(--shadow);
        z-index: 10;
      }

      .node.root {
        background: var(--node-root);
        border-color: var(--node-root-border);
        font-family: "DM Serif Display", serif;
        font-size: 15px;
        min-width: 160px;
        max-width: 240px;
        box-shadow:
          0 0 0 4px rgba(88, 166, 255, 0.15),
          0 4px 20px var(--shadow);
      }

      .node.level-1 {
        background: var(--node-l1);
        border-color: var(--node-l1-border);
        font-size: 13px;
        font-weight: 500;
      }

      .node.level-2 {
        background: var(--node-l2);
        border-color: var(--node-l2-border);
        font-size: 12.5px;
      }

      .node.level-3 {
        background: var(--node-l3);
        border-color: var(--node-l3-border);
        font-size: 12px;
      }

      .node.selected {
        background: var(--node-selected) !important;
        border-color: var(--node-selected-border) !important;
        box-shadow:
          0 0 0 3px rgba(88, 166, 255, 0.3),
          0 6px 24px var(--shadow) !important;
        z-index: 20;
      }

      .node.highlighted {
        box-shadow:
          0 0 0 3px var(--accent4),
          0 4px 16px var(--shadow) !important;
      }

      .node-text {
        flex: 1;
        line-height: 1.35;
        word-break: break-word;
      }

      .chevron {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        opacity: 0.6;
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.2s;
      }

      .node.expanded .chevron {
        transform: rotate(90deg);
        opacity: 1;
      }

      .leaf-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
        transition: background 0.2s;
      }

      .node.selected .leaf-dot,
      .node:hover .leaf-dot {
        background: var(--accent);
      }

      /* CONNECTOR LINES */
      .connector {
        fill: none;
        stroke: var(--connector);
        stroke-width: 1.5;
        transition: stroke var(--transition);
      }

      /* PANEL */
      #panel {
        position: fixed;
        top: 56px;
        right: -440px;
        width: 420px;
        bottom: 0;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
        z-index: 90;
        display: flex;
        flex-direction: column;
        transition:
          right 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          background var(--transition),
          border-color var(--transition);
        box-shadow: -8px 0 40px var(--shadow);
      }

      #panel.open {
        right: 0;
      }

      #panel-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      #panel-title {
        font-family: "DM Serif Display", serif;
        font-size: 20px;
        line-height: 1.3;
        flex: 1;
        color: var(--text);
      }

      #panel-close {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        transition:
          color 0.2s,
          background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      #panel-close:hover {
        color: var(--text);
        background: var(--surface2);
      }

      #panel-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        line-height: 1.75;
        font-size: 14px;
        color: var(--text);
      }

      #panel-body p {
        margin-bottom: 14px;
      }

      #panel-body strong {
        color: var(--accent);
        font-weight: 600;
      }

      #panel-body em {
        color: var(--accent3);
        font-style: italic;
      }

      .panel-tag {
        display: inline-block;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 14px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* ZOOM BADGE */
      #zoom-badge {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 12px;
        color: var(--text-muted);
        z-index: 50;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      /* FOOTER */
      #footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--toolbar-bg);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        z-index: 100;
        font-size: 12px;
        color: var(--text-muted);
        gap: 6px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      #footer span {
        font-weight: 600;
        color: var(--text);
        font-family: "DM Serif Display", serif;
        letter-spacing: 0.2px;
      }

      /* SCROLLBAR */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      /* NODE ANIMATION */
      @keyframes nodeIn {
        from {
          opacity: 0;
          transform: translateX(-12px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .node {
        animation: nodeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      /* ─────────────────────────────────────────────
           PDF EXPORT SHEET (landscape, fully expanded)
           ───────────────────────────────────────────── */
      #print-sheet {
        display: none;
      }

      #print-sheet.measuring {
        display: block;
        position: fixed;
        top: 0;
        left: -20000px;
        z-index: -1;
      }

      #print-inner {
        width: 1520px;
        transform-origin: top left;
        background: #ffffff;
        color: #12151a;
        font-family: "DM Sans", sans-serif;
      }

      #print-inner .ps-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 3px solid #0f172a;
        padding-bottom: 10px;
        margin-bottom: 16px;
      }

      #print-inner .ps-kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #5b6472;
      }

      #print-inner .ps-title {
        font-size: 34px;
        line-height: 1.1;
        font-weight: 800;
        color: #0f172a;
      }

      #print-inner .ps-meta {
        font-size: 11px;
        line-height: 1.5;
        text-align: right;
        white-space: nowrap;
        color: #5b6472;
      }

      #print-inner .ps-grid {
        column-width: 300px;
        column-gap: 14px;
      }

      #print-inner .ps-card {
        display: inline-block;
        width: 100%;
        margin: 0 0 14px;
        border: 1.5px solid #d8dee7;
        border-top: 5px solid var(--c, #0969da);
        border-radius: 10px;
        padding: 11px 14px 14px;
        background: #ffffff;
        break-inside: avoid;
      }

      #print-inner .ps-card-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }

      #print-inner .ps-num {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--c, #0969da);
      }

      #print-inner .ps-branch {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.25;
        color: #0f172a;
      }

      #print-inner .ps-branch-desc {
        font-size: 11px;
        line-height: 1.45;
        color: #4a5464;
        margin: 6px 0 9px;
      }

      #print-inner .ps-leaves {
        list-style: none;
        margin: 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--c, #0969da);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      #print-inner .ps-leaf {
        position: relative;
        font-size: 11.5px;
        line-height: 1.45;
        color: #1f2733;
      }

      #print-inner .ps-leaf::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 7px;
        width: 8px;
        height: 2px;
        background: var(--c, #0969da);
      }

      #print-inner .ps-group > .ps-leaf-label {
        display: block;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }

      #print-inner .ps-sub {
        list-style: none;
        margin: 5px 0 0;
        padding: 0 0 0 11px;
        border-left: 1px dashed #cdd5e0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #print-inner .ps-sub .ps-leaf {
        font-size: 10.5px;
        color: #4a5464;
      }

      #print-inner .ps-sub .ps-leaf::before {
        display: none;
      }

      #print-inner .ps-foot {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 8px;
        border-top: 1px solid #d8dee7;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: #69727f;
      }

      @media print {
        @page {
          size: A3 landscape;
          margin: 8mm;
        }

        html,
        body {
          height: auto !important;
          overflow: visible !important;
          background: #ffffff !important;
        }

        body > *:not(#print-sheet) {
          display: none !important;
        }

        #print-sheet {
          display: block !important;
          position: static !important;
          left: auto !important;
        }

        /* A transform does not shrink the layout box, so a scaled sheet
               would still paginate by its full size. Clamp it to one page. */
        #print-sheet.one-page {
          width: 1520px;
          height: 1050px;
          overflow: hidden;
        }

        #print-inner {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>

    <script>
      // ─────────────────────────────────────────────

      // ─────────────────────────────────────────────
      const DATA = {
        id: "root",
        label: "RC4 & Modes of Operation",
        desc: '<span class="panel-tag">CYS406 · Chapter 6</span><p>A comprehensive concept map for <strong>RC4 &amp; Modes of Operation</strong>. Expand branches, select a node for detail, search topics, zoom, pan, or export the full map as a PDF.</p>',
        children: [
          {
            id: "branch-1",
            label: "Random Numbers & PRNGs",
            desc: '<span class="panel-tag">Core Concept</span><p>Cryptography leans on random numbers everywhere: authentication protocols (to stop replay attacks), temporary session keys, public-key generation, and stream-cipher keys. For all of these uses, the numbers must be:</p>',
            children: [
              {
                id: "branch-1-detail-1",

              {
                id: "branch-1-detail-2",

                id: "branch-1-detail-3",

          },
          {

            label: "Stream Cipher Structure & Properties",

            children: [
              {
                id: "branch-2-detail-1",
                label: "Why key reuse breaks everything: If C1…",
                desc: '<span class="panel-tag">Key Detail</span><p>Why key reuse breaks everything: If C1 = P1 ⊕ K and C2 = P2 ⊕ K, then C1 ⊕ C2 = P1 ⊕ P2 — the keystream cancels out entirely, leaking a relationship between the two plaintexts that statistical/language analysis can crack.</p>',

              {
                id: "branch-2-detail-3",
                label: "Speed: Usually simpler and faster than block…",

                label: "Golden Rule: Must NEVER reuse the same…",
                desc: '<span class="panel-tag">Key Detail</span><p>Golden Rule: Must NEVER reuse the same key — otherwise cryptanalysis becomes trivially easy (two ciphertexts XORed together cancel the keystream, exposing the XOR of the two plaintexts).</p>',

            ],
          },
          {
            id: "branch-3",
            label: "RC4 — Overview",
            desc: '<span class="panel-tag">Core Concept</span><p>RC4 is the classic example of a stream cipher covered in this chapter.</p>',
            children: [
              {
                id: "branch-3-detail-1",

                desc: '<span class="panel-tag">Key Detail</span><p>Origin: A proprietary cipher owned by RSA Data Security Inc. Designed by Ron Rivest — simple but effective.</p>',

              {
                id: "branch-3-detail-2",
                label:
                  "Structure: Variable key size, byte-oriented stream cipher",
                desc: '<span class="panel-tag">Key Detail</span><p>Structure: Variable key size, byte-oriented stream cipher.</p>',
              },
              {
                id: "branch-3-detail-3",
                label: "Adoption: Widely used historically — web SSL/TLS,…",
                desc: '<span class="panel-tag">Key Detail</span><p>Adoption: Widely used historically — web SSL/TLS, wireless WEP/WPA.</p>',
              },
              {
                id: "branch-3-detail-4",
                label: "Core idea: The key forms a random…",
                desc: '<span class="panel-tag">Key Detail</span><p>Core idea: The key forms a random permutation of all 256 possible byte values; that permutation is then used to scramble the input, one byte at a time.</p>',
              },
            ],
          },
          {
            id: "branch-4",
            label: "RC4 Key Schedule Algorithm (KSA)",
            desc: '<span class="panel-tag">Core Concept</span><p>RC4 keeps an internal state array S of 256 numbers (0…255). The KSA scrambles S using the key before any encryption happens.</p>',
            children: [
              {
                id: "branch-4-detail-1",
                label: "Initialize S: S[i] = i for i…",
                desc: '<span class="panel-tag">Key Detail</span><p>Initialize S: S[i] = i for i = 0…255 (identity permutation to start).</p>',
              },
              {
                id: "branch-4-detail-2",
                label: "Build T from the key: T[i] =…",
                desc: '<span class="panel-tag">Key Detail</span><p>Build T from the key: T[i] = K[i mod keylen] — the key is repeated cyclically to fill all 256 slots.</p>',
              },
              {
                id: "branch-4-detail-3",
                label: "Scramble S with j: For each i,…",
                desc: '<span class="panel-tag">Key Detail</span><p>Scramble S with j: For each i, update j using S[i] and T[i], then swap S[i] and S[j]. After all 256 iterations, S is a key-dependent random permutation.</p>',
              },
            ],
          },
          {
            id: "branch-5",
            label: "RC4 Encryption — The PRGA",
            desc: '<span class="panel-tag">Core Concept</span><p>Once S is scrambled, encryption continues shuffling the array to generate a fresh keystream byte for every message byte.</p>',
            children: [
              {
                id: "branch-5-detail-1",
                label: "Once S is scrambled, encryption continues shuffling…",
                desc: '<span class="panel-tag">Key Detail</span><p>Once S is scrambled, encryption continues shuffling the array to generate a fresh keystream byte for every message byte.</p>',
              },
            ],
          },
          {
            id: "branch-6",
            label: "RC4 Example — Simplified 3-bit Version",
            desc: '<span class="panel-tag">Core Concept</span><p>To make the algorithm tractable by hand, the slides shrink RC4 down: instead of a 256-byte state, use 8 × 3-bit values (S can hold 0–7).</p>',
            children: [
              {
                id: "branch-6-detail-1",
                label: "The point of the shrunk example: The…",
                desc: '<span class="panel-tag">Key Detail</span><p>The point of the shrunk example: The 8×3-bit toy version exists purely so you can trace the KSA and PRGA by hand on an exam without doing 256 iterations. The logic is identical to real RC4 — only N (256 → 8) and the byte width (8 bits → 3 bits) change.</p>',
              },
            ],
          },
          {
            id: "branch-7",
            label: "RC4 Security",
            desc: '<span class="panel-tag">Core Concept</span><p>Core concepts, distinctions, and defensive implications of RC4 Security.</p>',
            children: [
              {
                id: "branch-7-detail-1",
                label: "Claimed secure: RC4 is claimed secure against…",
                desc: '<span class="panel-tag">Key Detail</span><p>Claimed secure: RC4 is claimed secure against known attacks — there has been analysis, but nothing considered practically exploitable against the core algorithm itself.</p>',
              },
              {
                id: "branch-7-detail-2",
                label: "Never reuse a key: As a stream…",
                desc: '<span class="panel-tag">Key Detail</span><p>Never reuse a key: As a stream cipher, RC4 must never reuse the same key (see Section 02&#x27;s golden rule).</p>',
              },
              {
                id: "branch-7-detail-3",
                label: "The WEP lesson: WEP's real-world weakness was…",
                desc: '<span class="panel-tag">Key Detail</span><p>The WEP lesson: WEP&#x27;s real-world weakness was not a flaw in RC4 the algorithm — it was in how WEP generated the per-packet keys fed into RC4 (short, reused/predictable IVs). The lesson: a cipher can be sound while its surrounding key-management protocol is broken.</p>',
              },
            ],
          },
          {
            id: "branch-8",
            label: "Modes of Operation — Why We Need Them",
            desc: '<span class="panel-tag">Core Concept</span><p>Block ciphers (like DES: 64-bit blocks, 56-bit key) only know how to encrypt one fixed-size block at a time. Real messages are arbitrary length — e.g. 1000 bytes — so we need a systematic way to chain many block encryptions together. NIST SP 800-38A defines 5 standard modes, covering both block-oriented and stream-oriented use cases, and any of them can be used with any block cipher.</p>',
            children: [
              {
                id: "branch-8-detail-1",
                label: "Message padding: The last block of a…",
                desc: '<span class="panel-tag">Key Detail</span><p>Message padding: The last block of a message is often shorter than the cipher&#x27;s block size. Options: pad with a known non-data value (e.g. nulls), or pad the last block plus a count of the pad size (e.g. [b1 b2 b3 0 0 0 0 5] means 3 real data bytes + 5 bytes of pad+count). Padding may require an entire extra block. Some modes (the stream modes below) avoid this problem entirely.</p>',
              },
            ],
          },
          {
            id: "branch-9",
            label: "Electronic Codebook (ECB)",
            desc: '<span class="panel-tag">Core Concept</span><p>The message is broken into independent blocks, each encrypted with the same key: Ci = E K (Pi) . Each block is essentially &quot;looked up&quot; like a codebook entry — hence the name — and each block is encoded completely independently of every other block.</p>',
            children: [
              {
                id: "branch-9-detail-1",
                label: "ECB's big weakness: Repeated plaintext blocks produce…",
                desc: '<span class="panel-tag">Key Detail</span><p>ECB&#x27;s big weakness: Repeated plaintext blocks produce identical ciphertext blocks (if aligned to block boundaries) — a serious problem for data like graphics or messages that barely change, since patterns leak straight through (&quot;codebook analysis&quot;). ECB is really only suitable for encrypting a few independent values, e.g. a session key.</p>',
              },
            ],
          },
          {
            id: "branch-10",
            label: "Cipher Block Chaining (CBC)",
            desc: '<span class="panel-tag">Core Concept</span><p>Each ciphertext block is chained into the next plaintext block before encryption, so blocks are no longer independent:</p>',
            children: [
              {
                id: "branch-10-detail-1",
                label: "Strength: Because each ciphertext block depends on…",
                desc: '<span class="panel-tag">Key Detail</span><p>Strength: Because each ciphertext block depends on every block before it, any change to a block affects all following ciphertext blocks — a useful integrity side-effect.</p>',
              },
              {
                id: "branch-10-detail-2",
                label: "IV handling matters: The IV must be…",
                desc: '<span class="panel-tag">Key Detail</span><p>IV handling matters: The IV must be known to both sender and receiver. If sent in the clear, an attacker can flip bits of the first plaintext block and adjust the IV to compensate. Fix: either use a fixed IV (as in EFTPOS) or send the IV encrypted in ECB mode before the rest of the message.</p>',
              },
            ],
          },
          {
            id: "branch-11",
            label:
              "Stream Modes of Operation — Turning a Block Cipher into a PRNG",
            desc: '<span class="panel-tag">Core Concept</span><p>Sometimes we need to operate on units smaller than a full block (e.g. real-time data). The stream modes convert a block cipher into a stream cipher by using it as a pseudorandom number generator:</p>',
            children: [
              {
                id: "branch-11-detail-1",
                label: "CTR as PRNG: X i = E…",
                desc: '<span class="panel-tag">Key Detail</span><p>CTR as PRNG: X i = E K [V i ] — encrypts a counter value.</p>',
              },
              {
                id: "branch-11-detail-2",
                label: "OFB as PRNG: X i = E…",
                desc: '<span class="panel-tag">Key Detail</span><p>OFB as PRNG: X i = E K [X i-1 ] — encrypts the previous output.</p>',
              },
              {
                id: "branch-11-detail-3",
                label: "Cipher Feedback (CFB)",
                desc: '<span class="panel-tag">Key Detail</span><p>Cipher Feedback (CFB)</p>',
              },
              {
                id: "branch-11-detail-4",
                label: "Output Feedback (OFB)",
                desc: '<span class="panel-tag">Key Detail</span><p>Output Feedback (OFB)</p>',
              },
            ],
          },
          {
            id: "branch-12",
            label: "Cipher Feedback (CFB)",
            desc: '<span class="panel-tag">Core Concept</span><p>The message is treated as a stream of bits added to the output of the block cipher; the result is fed back for the next stage (hence &quot;feedback&quot;).</p>',
            children: [
              {
                id: "branch-12-detail-1",
                label: "Error propagation: CFB is appropriate when data…",
                desc: '<span class="panel-tag">Key Detail</span><p>Error propagation: CFB is appropriate when data arrives in bits/bytes and is the most common stream mode, but errors propagate for several blocks after the point of error.</p>',
              },
            ],
          },
          {
            id: "branch-13",
            label: "Output Feedback (OFB)",
            desc: '<span class="panel-tag">Core Concept</span><p>The message is treated as a stream of bits; the output of the cipher is XORed with the message, and that output is then fed back for the next stage — but the feedback path is independent of the message, so it can be computed in advance.</p>',
            children: [
              {
                id: "branch-13-detail-1",
                label: "Used for: stream encryption on noisy channels",
                desc: '<span class="panel-tag">Key Detail</span><p>Used for: stream encryption on noisy channels.</p>',
              },
              {
                id: "branch-13-detail-2",
                label: "Bit errors in transmission do not propagate…",
                desc: '<span class="panel-tag">Key Detail</span><p>Bit errors in transmission do not propagate — a corrupted ciphertext bit only corrupts the corresponding plaintext bit.</p>',
              },
            ],
          },
          {
            id: "branch-14",
            label: "Counter (CTR)",
            desc: '<span class="panel-tag">Core Concept</span><p>A &quot;new&quot; mode (though proposed early on), similar to OFB but it encrypts a counter value rather than a feedback chain:</p>',
            children: [
              {
                id: "branch-14-detail-1",
                label: "Efficiency",
                desc: '<span class="panel-tag">Key Detail</span><p>Efficiency</p>',
              },
              {
                id: "branch-14-detail-2",
                label: "Caveats: Provably as secure as the other…",
                desc: '<span class="panel-tag">Key Detail</span><p>Caveats: Provably as secure as the other modes, but you must never reuse a key/counter combination, or security can break down (same failure mode as OFB key/IV reuse).</p>',
              },
              {
                id: "branch-14-detail-3",
                label: "Can do parallel encryption in hardware or…",
                desc: '<span class="panel-tag">Key Detail</span><p>Can do parallel encryption in hardware or software</p>',
              },
              {
                id: "branch-14-detail-4",
                label: "Can pre-process keystream in advance",
                desc: '<span class="panel-tag">Key Detail</span><p>Can pre-process keystream in advance</p>',
              },
              {
                id: "branch-14-detail-5",
                label: "Supports random-access processing of blocks",
                desc: '<span class="panel-tag">Key Detail</span><p>Supports random-access processing of blocks</p>',
              },
            ],
          },
          {
            id: "branch-15",
            label: "Modes Side-by-Side",
            desc: '<span class="panel-tag">Core Concept</span><p>Core concepts, distinctions, and defensive implications of Modes Side-by-Side.</p>',
            children: [],
          },
        ],
      };

      // ─────────────────────────────────────────────
      // STATE
      // ─────────────────────────────────────────────
      const state = {
        expanded: new Set(["root"]),
        selected: null,
        panX: 0,
        panY: 0,
        scale: 1,
        dragging: false,
        dragStartX: 0,
        dragStartY: 0,
        dragStartPanX: 0,
        dragStartPanY: 0,
      };

      const NODE_W = 200;
      const NODE_H = 44;
      const H_GAP = 80;
      const V_GAP = 28;

      function estimateNodeHeight(node) {
        const text = String(node.label || "");
        const charsPerLine = node._level === 0 ? 22 : 18;
        const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
        return Math.max(NODE_H, 24 + lines * 22);
      }

      // ─────────────────────────────────────────────
      // LAYOUT ENGINE
      // ─────────────────────────────────────────────
      function shiftSubtree(node, deltaY) {
        node._y += deltaY;
        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach((child) => shiftSubtree(child, deltaY));
        }
      }

      function computeLayout(node, level = 0, x = 100, y = 0) {
        node._level = level;
        node._x = x;
        node._y = y;
        node._w = NODE_W;
        node._h = estimateNodeHeight(node);

        if (!node.children || !state.expanded.has(node.id)) {
          node._subtreeH = node._h;
          return node._subtreeH;
        }

        const childX = x + NODE_W + H_GAP;
        let totalH = 0;
        node.children.forEach((child) => {
          totalH += computeLayout(child, level + 1, childX, 0);
          totalH += V_GAP;
        });
        totalH -= V_GAP;

        let cy = y + node._h / 2 - totalH / 2;
        node.children.forEach((child) => {
          const nextY = cy + child._subtreeH / 2 - child._h / 2;
          shiftSubtree(child, nextY - child._y);
          cy += child._subtreeH + V_GAP;
        });

        node._subtreeH = Math.max(node._h, totalH);
        return node._subtreeH;
      }

      // ─────────────────────────────────────────────
      // RENDER
      // ─────────────────────────────────────────────
      const canvas = document.getElementById("canvas");
      const svgLayer = document.getElementById("svg-layer");
      let nodeEls = {};

      function render() {
        computeLayout(DATA, 0, 100, 2000);
        renderNodes(DATA);
        renderConnectors(DATA);
      }

      function renderNodes(node) {
        let el = nodeEls[node.id];
        if (!el) {
          el = document.createElement("div");
          el.className = "node";
          el.dataset.id = node.id;
          el.innerHTML = buildNodeHTML(node);
          el.addEventListener("click", () => onNodeClick(node));
          canvas.appendChild(el);
          nodeEls[node.id] = el;
        }

        const levelClass =
          node._level === 0 ? "root" : `level-${Math.min(node._level, 3)}`;
        el.className = `node ${levelClass}${state.selected === node.id ? " selected" : ""}${state.expanded.has(node.id) ? " expanded" : ""}`;
        el.style.left = node._x + "px";
        el.style.top = node._y + "px";
        el.style.width = node._w + "px";
        el.style.minHeight = node._h + "px";
        el.style.display = "flex";

        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach(renderNodes);
        }

        // Remove orphaned children
        if (!node.children || !state.expanded.has(node.id)) {
          collapseChildren(node);
        }
      }

      function buildNodeHTML(node) {
        const isParent = node.children && node.children.length > 0;
        const icon = isParent
          ? `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`
          : `<div class="leaf-dot"></div>`;
        return `<div class="node-text">${node.label}</div>${icon}`;
      }

      function collapseChildren(node) {
        if (!node.children) return;
        node.children.forEach((child) => {
          if (nodeEls[child.id]) {
            nodeEls[child.id].style.display = "none";
          }
          collapseChildren(child);
        });
      }

      function renderConnectors(node) {
        svgLayer.innerHTML = "";
        drawConnectors(node);
      }

      function drawConnectors(node) {
        if (!node.children || !state.expanded.has(node.id)) return;
        node.children.forEach((child) => {
          const x1 = node._x + node._w;
          const y1 = node._y + node._h / 2;
          const x2 = child._x;
          const y2 = child._y + child._h / 2;
          const cx1 = x1 + (x2 - x1) * 0.55;
          const cx2 = x2 - (x2 - x1) * 0.55;
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path.setAttribute("class", "connector");
          path.setAttribute(
            "d",
            `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`,
          );
          svgLayer.appendChild(path);
          drawConnectors(child);
        });
      }

      // ─────────────────────────────────────────────
      // INTERACTION
      // ─────────────────────────────────────────────
      function onNodeClick(node) {
        if (node.children && node.children.length > 0) {
          if (state.expanded.has(node.id)) {
            state.expanded.delete(node.id);
          } else {
            state.expanded.add(node.id);
          }
          state.selected = node.id;
          render();
        } else {
          state.selected = node.id;
          render();
          openPanel(node);
        }
      }

      function openPanel(node) {
        document.getElementById("panel-title").textContent = node.label;
        document.getElementById("panel-body").innerHTML =
          node.desc || `<p>No description available.</p>`;
        document.getElementById("panel").classList.add("open");
      }

      function closePanel() {
        document.getElementById("panel").classList.remove("open");
        state.selected = null;
        render();
      }

      // ─────────────────────────────────────────────
      // PAN & ZOOM
      // ─────────────────────────────────────────────
      const wrap = document.getElementById("canvas-wrap");

      function applyTransform() {
        canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
        document.getElementById("zoom-badge").textContent =
          Math.round(state.scale * 100) + "%";
      }

      wrap.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node")) return;
        state.dragging = true;
        state.dragStartX = e.clientX;
        state.dragStartY = e.clientY;
        state.dragStartPanX = state.panX;
        state.dragStartPanY = state.panY;
        wrap.classList.add("grabbing");
      });

      window.addEventListener("mousemove", (e) => {
        if (!state.dragging) return;
        state.panX = state.dragStartPanX + (e.clientX - state.dragStartX);
        state.panY = state.dragStartPanY + (e.clientY - state.dragStartY);
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        state.dragging = false;
        wrap.classList.remove("grabbing");
      });

      wrap.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.1 : -0.1;
          state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
          applyTransform();
        },
        { passive: false },
      );

      function zoom(delta) {
        state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
        applyTransform();
      }

      function resetView() {
        state.panX = 0;
        state.panY = 0;
        state.scale = 1;
        applyTransform();
      }

      // ─────────────────────────────────────────────
      // EXPAND / COLLAPSE ALL
      // ─────────────────────────────────────────────
      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children) node.children.forEach((c) => collectIds(c, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => state.expanded.add(id));
        render();
      }

      function collapseAll() {
        state.expanded.clear();
        state.expanded.add("root");
        render();
      }

      // ─────────────────────────────────────────────
      // SEARCH
      // ─────────────────────────────────────────────
      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("search-results");

      function flatNodes(node, path = [], results = []) {
        results.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((c) =>
            flatNodes(c, [...path, node.label], results),
          );
        return results;
      }

      const allNodes = flatNodes(DATA);

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        // Clear highlights
        Object.values(nodeEls).forEach((el) =>
          el.classList.remove("highlighted"),
        );

        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = allNodes.filter(({ node }) =>
          node.label.toLowerCase().includes(q),
        );
        if (matches.length === 0) {
          searchResults.innerHTML =
            '<div class="sr-item" style="cursor:default;color:var(--text-muted)">No results found</div>';
          searchResults.style.display = "block";
          return;
        }

        searchResults.innerHTML = matches
          .slice(0, 10)
          .map(({ node, path }) => {
            const hl = node.label.replace(
              new RegExp(`(${q})`, "gi"),
              "<mark>$1</mark>",
            );
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${hl}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");

        searchResults.querySelectorAll(".sr-item[data-id]").forEach((el) => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            navigateTo(id);
            searchResults.style.display = "none";
            searchInput.value = "";
          });
        });

        matches.forEach(({ node }) => {
          if (nodeEls[node.id]) nodeEls[node.id].classList.add("highlighted");
        });

        searchResults.style.display = "block";
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      function navigateTo(id) {
        // Expand path to node
        function findPath(node, targetId, path = []) {
          if (node.id === targetId) return [...path, node.id];
          if (node.children) {
            for (const c of node.children) {
              const r = findPath(c, targetId, [...path, node.id]);
              if (r) return r;
            }
          }
          return null;
        }
        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => state.expanded.add(pid));
        state.selected = id;
        render();
        // Center on node
        setTimeout(() => {
          function findNode(node, id) {
            if (node.id === id) return node;
            if (node.children)
              for (const c of node.children) {
                const r = findNode(c, id);
                if (r) return r;
              }
            return null;
          }
          const n = findNode(DATA, id);
          if (n) {
            const vpW = wrap.clientWidth;
            const vpH = wrap.clientHeight;
            state.panX = vpW / 2 - (n._x + n._w / 2) * state.scale;
            state.panY = vpH / 2 - (n._y + n._h / 2) * state.scale;
            applyTransform();
          }
        }, 100);
      }

      // ─────────────────────────────────────────────
      // THEME
      // ─────────────────────────────────────────────
      const themeBtn = document.getElementById("theme-toggle");
      let isDark = true;

      function applyTheme(dark) {
        document.body.dataset.theme = dark ? "dark" : "light";
        themeBtn.textContent = dark ? "🌙" : "☀️";
        localStorage.setItem("mm-theme", dark ? "dark" : "light");
        try {
          localStorage.setItem("shoug-theme", dark ? "dark" : "light");
        } catch (_e) {}
      }

      themeBtn.addEventListener("click", () => {
        isDark = !isDark;
        applyTheme(isDark);
      });

      // Restore
      const saved =
        localStorage.getItem("shoug-theme") || localStorage.getItem("mm-theme");
      if (saved === "light") {
        isDark = false;
        applyTheme(false);
      }

      // ─────────────────────────────────────────────
      // EXPORT — LANDSCAPE PDF (every node expanded)
      // ─────────────────────────────────────────────
      const PRINT_PAGE_W = 1520; // A3 landscape content box @96dpi
      const PRINT_PAGE_H = 1050;
      const PRINT_ACCENTS = [
        "#0969da",
        "#1a7f37",
        "#a40e26",
        "#bc4c00",
        "#cf222e",
        "#0550ae",
      ];

      function psEscape(text) {
        const d = document.createElement("div");
        d.textContent = text == null ? "" : String(text);
        return d.innerHTML;
      }

      function psDesc(html) {
        const d = document.createElement("div");
        d.innerHTML = html || "";
        const tag = d.querySelector(".panel-tag");
        if (tag) tag.remove();
        return d.textContent.replace(/\s+/g, " ").trim();
      }

      function psLeaves(nodes) {
        return (nodes || [])
          .map((node) => {
            const text = psDesc(node.desc) || node.label;
            if (node.children && node.children.length) {
              // A grouping node (e.g. "Examples") keeps its own label as a
              // heading so the nesting still reads on paper.
              return (
                `<li class="ps-leaf ps-group"><span class="ps-leaf-label">${psEscape(node.label)}</span>` +
                `<ul class="ps-sub">${psLeaves(node.children)}</ul></li>`
              );
            }
            return `<li class="ps-leaf">${psEscape(text)}</li>`;
          })
          .join("");
      }

      function printKicker() {
        const parts = document.title
          .split("—")
          .map((s) => s.trim())
          .filter(Boolean);
        return (
          parts.find((p) => /[A-Z]{2,4}\s?\d{3}|chapter/i.test(p)) ||
          parts[parts.length - 1] ||
          ""
        );
      }

      function buildPrintSheet() {
        const old = document.getElementById("print-sheet");
        if (old) old.remove();

        const cards = (DATA.children || [])
          .map((branch, i) => {
            const color = PRINT_ACCENTS[i % PRINT_ACCENTS.length];
            const intro = psDesc(branch.desc);
            return `<section class="ps-card" style="--c:${color}">
                    <div class="ps-card-head">
                        <span class="ps-num">${String(i + 1).padStart(2, "0")}</span>
                        <h2 class="ps-branch">${psEscape(branch.label)}</h2>
                    </div>
                    ${intro ? `<p class="ps-branch-desc">${psEscape(intro)}</p>` : ""}
                    <ul class="ps-leaves">${psLeaves(branch.children)}</ul>
                </section>`;
          })
          .join("");

        const sheet = document.createElement("div");
        sheet.id = "print-sheet";
        sheet.innerHTML = `<div id="print-inner">
                <header class="ps-head">
                    <div>
                        <div class="ps-kicker">${psEscape(printKicker())}</div>
                        <h1 class="ps-title">${psEscape(DATA.label)}</h1>
                    </div>
                    <div class="ps-meta">Full mindmap — all branches expanded</div>
                </header>
                <div class="ps-grid">${cards}</div>
                <div class="ps-foot"><span>Made by Shoug Alomran</span><span>shoug-tech.com</span></div>
            </div>`;
        document.body.appendChild(sheet);
        return sheet;
      }

      async function exportPDF() {
        expandAll();
        const sheet = buildPrintSheet();
        const inner = sheet.querySelector("#print-inner");

        // Measure off-screen, then binary-search the largest scale that still
        // fits one landscape page — sparse maps grow, dense ones shrink.
        sheet.classList.add("measuring");
        try {
          await document.fonts.ready;
        } catch (_e) {}
        await new Promise((r) => requestAnimationFrame(r));

        const fits = (s) => {
          inner.style.transform = "none";
          inner.style.width = PRINT_PAGE_W / s + "px";
          return inner.scrollHeight <= PRINT_PAGE_H / s;
        };

        let lo = 0.45,
          hi = 1.75;
        if (!fits(lo))
          hi = lo; // even the floor overflows: accept it
        else if (fits(hi)) lo = hi;
        else {
          for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            if (fits(mid)) lo = mid;
            else hi = mid;
          }
        }
        const onePage = fits(lo); // false only if even the floor overflows
        inner.style.width = PRINT_PAGE_W / lo + "px";
        inner.style.transform = `scale(${lo})`;
        sheet.classList.toggle("one-page", onePage);
        sheet.classList.remove("measuring");

        window.addEventListener("afterprint", () => sheet.remove(), {
          once: true,
        });
        window.print();
      }

      // ─────────────────────────────────────────────
      // INIT
      // ─────────────────────────────────────────────
      function init() {
        render();
        // Center on the root: the layout puts it at a fixed y, so a
        // hard-coded pan clips the first branch as soon as a map has
        // more branches than the page this template came from.
        state.panX = 40;
        state.panY = wrap.clientHeight / 2 - (DATA._y + DATA._h / 2);
        applyTransform();
      }

      init();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
  </body>
</html>
