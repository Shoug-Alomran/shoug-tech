    <title>Protection of Information Assets — CYS401 Mindmap</title>
    <link

      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1f2937;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #3fb950;
        --accent3: #ff9aa8;
        --accent4: #ffa657;
        --accent5: #ff7b72;
        --accent6: #79c0ff;
        --node-root: #1a2744;
        --node-root-border: #58a6ff;
        --node-l1: #1a2a1e;
        --node-l1-border: #3fb950;
        --node-l2: #3a1c22;
        --node-l2-border: #ff9aa8;
        --node-l3: #2a1f18;
        --node-l3-border: #ffa657;
        --node-selected: #0d2442;
        --node-selected-border: #58a6ff;
        --shadow: rgba(0, 0, 0, 0.5);
        --connector: #30363d;
        --panel-bg: #161b22;
        --panel-border: #30363d;
        --toolbar-bg: rgba(13, 17, 23, 0.92);
        --search-bg: #21262d;
        --search-border: #30363d;
        --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="light"] {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --surface2: #f0f2f5;
        --border: #d0d7de;
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent2: #1a7f37;
        --accent3: #a40e26;
        --accent4: #bc4c00;
        --accent5: #cf222e;
        --accent6: #0550ae;
        --node-root: #dbeafe;
        --node-root-border: #0969da;
        --node-l1: #dcfce7;
        --node-l1-border: #1a7f37;
        --node-l2: #fde8ec;
        --node-l2-border: #a40e26;
        --node-l3: #fff7ed;
        --node-l3-border: #bc4c00;
        --node-selected: #bfdbfe;
        --node-selected-border: #0969da;
        --shadow: rgba(0, 0, 0, 0.12);
        --connector: #c8d1da;
        --panel-bg: #ffffff;
        --panel-border: #d0d7de;
        --toolbar-bg: rgba(246, 248, 250, 0.92);
        --search-bg: #f6f8fa;
        --search-border: #d0d7de;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        transition:
          background var(--transition),
          color var(--transition);
        user-select: none;
      }

      /* TOOLBAR */
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--toolbar-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        height: 56px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      .toolbar-brand {
        font-family: "DM Serif Display", serif;
        font-size: 16px;
        color: var(--text);
        white-space: nowrap;
        margin-right: 8px;
        letter-spacing: -0.3px;
      }

      .toolbar-brand span {
        color: var(--accent);
      }

      .toolbar-sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
      }

      #search-wrap {
        position: relative;
        flex: 1;
        max-width: 280px;
      }

      #search-wrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.5;
        pointer-events: none;
      }

      #search {
        width: 100%;
        background: var(--search-bg);
        border: 1px solid var(--search-border);
        border-radius: 8px;
        padding: 6px 12px 6px 34px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.2s,
          background var(--transition);
      }

      #search:focus {
        border-color: var(--accent);
      }

      #search::placeholder {
        color: var(--text-muted);
      }

      .tb-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 11px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.1s;
        white-space: nowrap;
      }

      .tb-btn:hover {
        background: var(--border);
        transform: translateY(-1px);
      }

      .tb-btn:active {
        transform: translateY(0);
      }

      .tb-btn svg {
        flex-shrink: 0;
      }

      #theme-toggle {
        font-size: 16px;
        padding: 6px 10px;
      }

      #search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 32px var(--shadow);
        z-index: 200;
        max-height: 260px;
        overflow-y: auto;
        display: none;
      }

      .sr-item {
        padding: 9px 14px;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sr-item:last-child {
        border-bottom: none;
      }

      .sr-item:hover {
        background: var(--surface2);
      }

      .sr-item .sr-path {
        font-size: 11px;
        color: var(--text-muted);
      }

      .sr-item mark {
        background: transparent;
        color: var(--accent);
        font-weight: 600;
      }

      /* CANVAS */
      #canvas-wrap {
        position: fixed;
        top: 56px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        cursor: grab;
      }

      #canvas-wrap.grabbing {
        cursor: grabbing;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 4000px;
        height: 4000px;
        transform-origin: 0 0;
      }

      #svg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* NODES */
      .node {
        position: absolute;
        border-radius: 14px;
        border: 2px solid;
        cursor: pointer;
        transition:
          box-shadow 0.25s,
          transform 0.25s,
          background 0.25s,
          border-color 0.25s,
          opacity 0.25s;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        max-width: 220px;
        min-width: 120px;
      }

      .node:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 24px var(--shadow);
        z-index: 10;
      }

      .node.root {
        background: var(--node-root);
        border-color: var(--node-root-border);
        font-family: "DM Serif Display", serif;
        font-size: 15px;
        min-width: 160px;
        max-width: 240px;
        box-shadow:
          0 0 0 4px rgba(88, 166, 255, 0.15),
          0 4px 20px var(--shadow);
      }

      .node.level-1 {
        background: var(--node-l1);
        border-color: var(--node-l1-border);
        font-size: 13px;
        font-weight: 500;
      }

      .node.level-2 {
        background: var(--node-l2);
        border-color: var(--node-l2-border);
        font-size: 12.5px;
      }

      .node.level-3 {
        background: var(--node-l3);
        border-color: var(--node-l3-border);
        font-size: 12px;
      }

      .node.selected {
        background: var(--node-selected) !important;
        border-color: var(--node-selected-border) !important;
        box-shadow:
          0 0 0 3px rgba(88, 166, 255, 0.3),
          0 6px 24px var(--shadow) !important;
        z-index: 20;
      }

      .node.highlighted {
        box-shadow:
          0 0 0 3px var(--accent4),
          0 4px 16px var(--shadow) !important;
      }

      .node-text {
        flex: 1;
        line-height: 1.35;
        word-break: break-word;
      }

      .chevron {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        opacity: 0.6;
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.2s;
      }

      .node.expanded .chevron {
        transform: rotate(90deg);
        opacity: 1;
      }

      .leaf-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
        transition: background 0.2s;
      }

      .node.selected .leaf-dot,
      .node:hover .leaf-dot {
        background: var(--accent);
      }

      /* CONNECTOR LINES */
      .connector {
        fill: none;
        stroke: var(--connector);
        stroke-width: 1.5;
        transition: stroke var(--transition);
      }

      /* PANEL */
      #panel {
        position: fixed;
        top: 56px;
        right: -440px;
        width: 420px;
        bottom: 0;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
        z-index: 90;
        display: flex;
        flex-direction: column;
        transition:
          right 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          background var(--transition),
          border-color var(--transition);
        box-shadow: -8px 0 40px var(--shadow);
      }

      #panel.open {
        right: 0;
      }

      #panel-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      #panel-title {
        font-family: "DM Serif Display", serif;
        font-size: 20px;
        line-height: 1.3;
        flex: 1;
        color: var(--text);
      }

      #panel-close {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        transition:
          color 0.2s,
          background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      #panel-close:hover {
        color: var(--text);
        background: var(--surface2);
      }

      #panel-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        line-height: 1.75;
        font-size: 14px;
        color: var(--text);
      }

      #panel-body p {
        margin-bottom: 14px;
      }

      #panel-body strong {
        color: var(--accent);
        font-weight: 600;
      }

      #panel-body em {
        color: var(--accent3);
        font-style: italic;
      }

      .panel-tag {
        display: inline-block;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 14px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* ZOOM BADGE */
      #zoom-badge {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 12px;
        color: var(--text-muted);
        z-index: 50;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      /* FOOTER */
      #footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--toolbar-bg);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        z-index: 100;
        font-size: 12px;
        color: var(--text-muted);
        gap: 6px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      #footer span {
        font-weight: 600;
        color: var(--text);
        font-family: "DM Serif Display", serif;
        letter-spacing: 0.2px;
      }

      /* SCROLLBAR */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      /* NODE ANIMATION */
      @keyframes nodeIn {
        from {
          opacity: 0;
          transform: translateX(-12px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .node {
        animation: nodeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      /* ─────────────────────────────────────────────
           PDF EXPORT SHEET (landscape, fully expanded)
           ───────────────────────────────────────────── */
      #print-sheet {
        display: none;
      }

      #print-sheet.measuring {
        display: block;
        position: fixed;
        top: 0;
        left: -20000px;
        z-index: -1;
      }

      #print-inner {
        width: 1520px;
        transform-origin: top left;
        background: #ffffff;
        color: #12151a;
        font-family: "DM Sans", sans-serif;
      }

      #print-inner .ps-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 3px solid #0f172a;
        padding-bottom: 10px;
        margin-bottom: 16px;
      }

      #print-inner .ps-kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #5b6472;
      }

      #print-inner .ps-title {
        font-size: 34px;
        line-height: 1.1;
        font-weight: 800;
        color: #0f172a;
      }

      #print-inner .ps-meta {
        font-size: 11px;
        line-height: 1.5;
        text-align: right;
        white-space: nowrap;
        color: #5b6472;
      }

      #print-inner .ps-grid {
        column-width: 300px;
        column-gap: 14px;
      }

      #print-inner .ps-card {
        display: inline-block;
        width: 100%;
        margin: 0 0 14px;
        border: 1.5px solid #d8dee7;
        border-top: 5px solid var(--c, #0969da);
        border-radius: 10px;
        padding: 11px 14px 14px;
        background: #ffffff;
        break-inside: avoid;
      }

      #print-inner .ps-card-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }

      #print-inner .ps-num {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--c, #0969da);
      }

      #print-inner .ps-branch {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.25;
        color: #0f172a;
      }

      #print-inner .ps-branch-desc {
        font-size: 11px;
        line-height: 1.45;
        color: #4a5464;
        margin: 6px 0 9px;
      }

      #print-inner .ps-leaves {
        list-style: none;
        margin: 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--c, #0969da);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      #print-inner .ps-leaf {
        position: relative;
        font-size: 11.5px;
        line-height: 1.45;
        color: #1f2733;
      }

      #print-inner .ps-leaf::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 7px;
        width: 8px;
        height: 2px;
        background: var(--c, #0969da);
      }

      #print-inner .ps-group > .ps-leaf-label {
        display: block;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }

      #print-inner .ps-sub {
        list-style: none;
        margin: 5px 0 0;
        padding: 0 0 0 11px;
        border-left: 1px dashed #cdd5e0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #print-inner .ps-sub .ps-leaf {
        font-size: 10.5px;
        color: #4a5464;
      }

      #print-inner .ps-sub .ps-leaf::before {
        display: none;
      }

      #print-inner .ps-foot {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 8px;
        border-top: 1px solid #d8dee7;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: #69727f;
      }

      @media print {
        @page {
          size: A3 landscape;
          margin: 8mm;
        }

        html,
        body {
          height: auto !important;
          overflow: visible !important;
          background: #ffffff !important;
        }

        body > *:not(#print-sheet) {
          display: none !important;
        }

        #print-sheet {
          display: block !important;
          position: static !important;
          left: auto !important;
        }

        /* A transform does not shrink the layout box, so a scaled sheet
               would still paginate by its full size. Clamp it to one page. */
        #print-sheet.one-page {
          width: 1520px;
          height: 1050px;
          overflow: hidden;
        }

        #print-inner {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>

    <!-- TOOLBAR -->
    <div id="toolbar">
      <div class="toolbar-brand">Mind<span>Map</span></div>
      <div class="toolbar-sep"></div>

      <div id="search-wrap">

    <script>

      const DATA = {
        id: "root",
        label: "Protection of Information Assets",
        desc: '<span class="panel-tag">CYS401 · Chapter 4</span><p>A comprehensive concept map for <strong>Protection of Information Assets</strong>.</p><p>Expand a branch to see its concepts, then select any node for the full explanation and a worked example. You can search topics, zoom, pan, and export the map.</p>',
        children: [
          {
            id: "branch-1",
            label: "Information Assets",
            desc: '<span class="panel-tag">Core Concept</span><p>An information asset is any information with value to the organisation, together with the infrastructure that supports it.</p>',
            children: [
              {
                id: "branch-1-detail-1",
                label: "Definition",
                desc: '<span class="panel-tag">Foundation</span><p>An information asset is any information that has value to an organization, <strong>regardless of its form</strong>. Assets support organizational missions and decision-making, which is what gives them value in the first place.</p><p><strong>In everyday terms:</strong> A customer list is an asset whether it lives in a database, a spreadsheet, or a notebook behind the counter.</p>',
              },
              {
                id: "branch-1-detail-2",
                label: "Primary Assets",
                desc: '<span class="panel-tag">Classification</span><p>Primary information assets are the data itself: customer and student records, financial records, research data, intellectual property, source code, emails and reports, and databases.</p><p><strong>In everyday terms:</strong> For a university, these are the things that would still matter if every server were replaced tomorrow: the records themselves, not the machines holding them.</p>',
              },
              {
                id: "branch-1-detail-3",
                label: "Supporting Assets",
                desc: '<span class="panel-tag">Classification</span><p>Supporting information assets are the infrastructure that stores or processes the data: software such as operating systems and ERP or LMS platforms, hardware such as servers and USB drives, network equipment such as routers and firewalls, people such as employees and contractors, and physical facilities such as data centres.</p><p><strong>In everyday terms:</strong> Student records are the primary asset; the Oracle database and the server running it are supporting assets. Primary assets are what you protect, supporting assets are what you use to protect them.</p>',
              },
              {
                id: "branch-1-detail-4",
                label: "Information Lifecycle",
                desc: '<span class="panel-tag">Process</span><p>The lifecycle runs Creation → Storage → Retrieval → Usage → Disposal, and security controls must be applied at <strong>every</strong> stage. Disposal is the stage organisations forget, which is why old hard drives cause breaches.</p><p><strong>In everyday terms:</strong> A medical file is carefully protected for seven years and then thrown in a skip. Four lifecycle stages handled perfectly, one ignored, and the outcome is the same as never protecting it.</p>',
              },
            ],
          },
          {
            id: "branch-2",
            label: "Why Protect Assets",
            desc: '<span class="panel-tag">Core Concept</span><p>The reasons map directly onto the CIA triad, and onto business, legal, and reputational consequences.</p>',
            children: [
              {
                id: "branch-2-detail-1",
                label: "Confidentiality Loss",
                desc: '<span class="panel-tag">Consequence</span><p>Losing confidentiality causes privacy violations, legal penalties, and reputational damage. A leaked student database violates PDPL and FERPA, which converts a technical failure into a legal one.</p><p><strong>In everyday terms:</strong> Customers forgive an outage in a week. They remember a leak of their personal data for years, which is why this loss costs the most long-term.</p>',
              },
              {
                id: "branch-2-detail-2",
                label: "Integrity Loss",
                desc: '<span class="panel-tag">Consequence</span><p>Losing integrity causes incorrect decisions and operational failures. An attacker modifying financial records leads to wrong business decisions made confidently on false data.</p><p><strong>In everyday terms:</strong> A corrupted inventory count means a shop orders stock it already has and runs out of what it needs — nothing looks broken, and every decision made from the data is wrong.</p>',
              },
              {
                id: "branch-2-detail-3",
                label: "Availability Loss",
                desc: '<span class="panel-tag">Consequence</span><p>Losing availability causes service disruption and business continuity failure. A DDoS attack taking down online banking costs millions per hour.</p><p><strong>In everyday terms:</strong> An airline booking system down for six hours strands passengers worldwide, and the data was never touched.</p>',
              },
              {
                id: "branch-2-detail-4",
                label: "A Business Issue",
                desc: "<span class=\"panel-tag\">Key Point</span><p>Protecting information assets is a strategic, legal, and governance requirement, not merely a technical concern. Senior leadership must be involved — this cannot be delegated entirely to the IT department.</p><p><strong>In everyday terms:</strong> If asked why we protect information assets, answer with all three: business value, legal compliance, and reputation. Answering only 'because hackers exist' loses the marks.</p>",
              },
            ],
          },
          {
            id: "branch-3",
            label: "Governance vs Management",
            desc: '<span class="panel-tag">Core Concept</span><p>A classic exam distinction: governance directs and oversees, management executes.</p>',
            children: [
              {
                id: "branch-3-detail-1",
                label: "Security Governance",
                desc: "<span class=\"panel-tag\">Definition</span><p>Security governance is the collection of practices related to supporting, defining, and directing the security efforts of an organization. Corporate governance is 'doing the right things for the organization and doing things the right way, independent of personal interests'.</p>",
              },
              {
                id: "branch-3-detail-2",
                label: "Governance Is Strategic",
                desc: "<span class=\"panel-tag\">Governance</span><p>Governance focuses on direction, accountability, oversight, and control. It is owned by the Board of Directors, senior leadership, and governance committees, and it asks <strong>'are we doing the right things?'</strong> Typical outputs are approving enterprise security policies and defining acceptable risk levels.</p><p><strong>In everyday terms:</strong> The board deciding 'we will never store customer card numbers ourselves' is governance — one sentence that shapes years of technical work.</p>",
              },
              {
                id: "branch-3-detail-3",
                label: "Management Is Tactical",
                desc: "<span class=\"panel-tag\">Management</span><p>Management focuses on execution, operations, monitoring, and incident response. It is owned by CISOs, security managers, analysts, and technical staff, and it asks <strong>'are we doing things right?'</strong> Typical outputs are deploying firewalls, monitoring incidents, and running vulnerability scans.</p><p><strong>In everyday terms:</strong> The security team choosing which payment provider to integrate, and configuring it correctly, is management carrying out that board decision.</p>",
              },
              {
                id: "branch-3-detail-4",
                label: "Telling Them Apart",
                desc: "<span class=\"panel-tag\">Exam Tip</span><p>The exam question 'which of these is governance, not management?' is answered by looking for <strong>oversight and direction at board level</strong>. Approving an enterprise security policy is governance; running a vulnerability scan, deploying a firewall, and monitoring logs are all management.</p>",
              },
              {
                id: "branch-3-detail-5",
                label: "Third-Party Governance",
                desc: '<span class="panel-tag">Governance</span><p>When using ASPs or cloud providers, organizations <strong>remain accountable</strong> for data protection even when outsourcing. Due diligence must be performed before engaging any vendor, and contracts and SLAs must clearly define security responsibilities.</p><p><strong>In everyday terms:</strong> You can outsource the work, but you cannot outsource the blame. If a supplier leaks your customers\' data, your customers — and the regulator — come to you.</p>',
              },
            ],
          },
          {
            id: "branch-4",
            label: "Due Care vs Due Diligence",
            desc: '<span class="panel-tag">Core Concept</span><p>Both are needed to avoid legal negligence, and they are not the same thing.</p>',
            children: [
              {
                id: "branch-4-detail-1",
                label: "Due Care",
                desc: '<span class="panel-tag">Definition</span><p>Due care is taking reasonable steps to protect assets by following accepted security practices, demonstrating <strong>responsible operation</strong>. Examples are enforcing strong password policies, applying security patches, and using antivirus and firewalls.</p><p><strong>In everyday terms:</strong> Servicing your car on schedule is due care — doing the standard, expected things a reasonable owner does.</p>',
              },
              {
                id: "branch-4-detail-2",
                label: "Due Diligence",
                desc: '<span class="panel-tag">Definition</span><p>Due diligence is actively identifying and analysing risks, which goes further than due care and demonstrates <strong>proactive risk management</strong>. Examples are conducting risk assessments, auditing third-party providers, and reviewing incident history and vulnerabilities.</p><p><strong>In everyday terms:</strong> Researching a car model\'s known defects and crash-test results before buying it is due diligence — investigating rather than merely maintaining.</p>',
              },
              {
                id: "branch-4-detail-3",
                label: "The Shorthand",
                desc: "<span class=\"panel-tag\">Memory Hook</span><p>Due Care = <em>'we did the basics.'</em> Due Diligence = <em>'we actively investigated risks.'</em> Both are required, and courts examine both when deciding whether an organisation was negligent.</p><p><strong>In everyday terms:</strong> Servicing your car on schedule is due care; researching the model's known defects before buying it is due diligence.</p>",
              },
              {
                id: "branch-4-detail-4",
                label: "Governance Frameworks",
                desc: '<span class="panel-tag">Reference</span><p>Organizations structure governance with formal frameworks: NIST 800-53 and NIST 800-100, primarily for government and military but widely adopted, and ISO/IEC 27014, whose governance process is Evaluate → Direct → Monitor → Communicate → Assure.</p><p><strong>In everyday terms:</strong> The ISO/IEC 27014 cycle is deliberately a loop — Evaluate, Direct, Monitor, Communicate, Assure — because governance is ongoing oversight rather than a one-off approval.</p>',
              },
            ],
          },
          {
            id: "branch-5",
            label: "Information Classification",
            desc: '<span class="panel-tag">Core Concept</span><p>Classification applies the right level of control — not too little, which is risk, and not too much, which is waste.</p>',
            children: [
              {
                id: "branch-5-detail-1",
                label: "Why Classify",
                desc: "<span class=\"panel-tag\">Purpose</span><p>Classification helps apply appropriate security controls. The guiding question is always <strong>'what is the worst possible impact if this information is disclosed, altered, or destroyed?'</strong></p><p><strong>In everyday terms:</strong> Encrypting the lunch menu with the same rigour as payroll wastes money and trains staff to ignore the rules; that is why over-classifying is a real failure, not a safe choice.</p>",
              },
              {
                id: "branch-5-detail-2",
                label: "Government Levels",
                desc: '<span class="panel-tag">Scheme</span><p>The government and military scheme has four levels: <strong>Top Secret</strong> where disclosure causes exceptionally grave damage to national security, <strong>Secret</strong> where it causes serious damage, <strong>Confidential</strong> where it causes damage, and <strong>Unclassified</strong> which can generally be distributed publicly.</p><p><strong>In everyday terms:</strong> Notice the levels are defined by <em>consequence of disclosure</em>, not by subject matter — which is how the same document can change level over time.</p>',
              },
              {
                id: "branch-5-detail-3",
                label: "Commercial Levels",
                desc: '<span class="panel-tag">Scheme</span><p>The four common commercial levels are <strong>Public</strong> (marketing materials, price lists, public website), <strong>Internal Only</strong> (org charts, sales playbooks), <strong>Confidential</strong> (vendor contracts, employee reviews), and <strong>Restricted</strong> (IP, credit cards, SSNs, PHI).</p><p><strong>In everyday terms:</strong> Your workplace already uses a version of this: the public website, the internal wiki, the salary spreadsheet, and the customer payment records sit at four visibly different levels of care.</p>',
              },
              {
                id: "branch-5-detail-4",
                label: "No Universal Standard",
                desc: "<span class=\"panel-tag\">Key Point</span><p>Commercial systems have no universal standard — each company creates its own. The more regulated the industry, such as healthcare or banking, the more complex the classification scheme tends to be.</p><p><strong>In everyday terms:</strong> This is why an 'Internal' label means different things at two companies, and why merging two firms always produces a painful classification-mapping exercise.</p>",
              },
              {
                id: "branch-5-detail-5",
                label: "PII",
                desc: "<span class=\"panel-tag\">Special Data</span><p>Personally Identifiable Information is any information that can identify an individual: name, national ID or SSN, biometrics, date of birth, or mother's maiden name. It is always treated as Restricted.</p><p><strong>In everyday terms:</strong> Mother's maiden name is on the list because it has been used as a password reset question for decades — which is exactly why it stopped being safe.</p>",
              },
              {
                id: "branch-5-detail-6",
                label: "PHI",
                desc: '<span class="panel-tag">Special Data</span><p>Protected Health Information is health-related data linked to a specific person, received by healthcare providers, health plans, and insurers. It carries the heaviest legal protection of the three special types.</p><p><strong>In everyday terms:</strong> A prescription record reveals conditions someone may not have told their own family, which is why the law treats it more strictly than a bank balance.</p>',
              },
              {
                id: "branch-5-detail-7",
                label: "Proprietary Data",
                desc: '<span class="panel-tag">Special Data</span><p>Proprietary data gives competitive advantage: source code, technical plans, internal processes, trade secrets, patents, and copyrights. Its value comes precisely from competitors not having it.</p><p><strong>In everyday terms:</strong> A restaurant\'s recipes are proprietary data. They are worth nothing to a criminal and everything to a competitor across the street.</p>',
              },
              {
                id: "branch-5-detail-8",
                label: "Marking Data",
                desc: "<span class=\"panel-tag\">Practice</span><p>Physical labels are stickers or stamps on physical media and folders indicating classification level. Electronic labels are headers, footers, and watermarks embedded in files, with the added benefit that they appear automatically on printed copies.</p><p><strong>In everyday terms:</strong> The 'CONFIDENTIAL' watermark that survives printing is doing real work: it means a page left on a shared printer still announces how it should be handled.</p>",
              },
            ],
          },
          {
            id: "branch-6",
            label: "Data in All States",
            desc: '<span class="panel-tag">Core Concept</span><p>Data at rest, in transit, and in use each need their own distinct controls.</p>',
            children: [
              {
                id: "branch-6-detail-1",
                label: "Data at Rest",
                desc: '<span class="panel-tag">State</span><p>Data at rest is stored data on hard drives, databases, backup tapes, USB drives, and NAS systems. Controls are encryption such as AES-256, strong access controls and authentication, secure storage facilities, environmental controls such as HVAC and fire suppression, and physical locks.</p><p><strong>In everyday terms:</strong> Your phone\'s full-disk encryption means a thief holding the device still cannot read your photos — the data is at rest and protected.</p>',
              },
              {
                id: "branch-6-detail-2",
                label: "Data in Transit",
                desc: '<span class="panel-tag">State</span><p>Data in transit is moving across a network — being uploaded, downloaded, or emailed. Controls are encrypted communication channels such as TLS/SSL, secure protocols such as HTTPS, SFTP, and VPN, network monitoring with IDS/IPS, and digital signatures for integrity.</p><p><strong>In everyday terms:</strong> For data in transit, always think encryption protocols. The padlock icon in your browser is exactly this control.</p>',
              },
              {
                id: "branch-6-detail-3",
                label: "Data in Use",
                desc: '<span class="panel-tag">State</span><p>Data in use is actively being processed in memory or RAM, or currently opened by a user. Controls are access control and authentication, endpoint security such as EDR and antivirus, memory protection, screen privacy filters, and user activity monitoring.</p><p><strong>In everyday terms:</strong> A screen privacy filter is a data-in-use control: the file is encrypted on disk and encrypted in transit, and completely readable to the person sitting behind you on the plane.</p>',
              },
              {
                id: "branch-6-detail-4",
                label: "Hospital Walkthrough",
                desc: '<span class="panel-tag">Worked Example</span><p>One scenario covering all three: a patient database stored on a server is <strong>at rest</strong> and protected with AES-256; a doctor emailing a prescription puts it <strong>in transit</strong> protected by TLS; and a doctor reading the file on screen puts it <strong>in use</strong>, protected by access control and screen locks.</p><p><strong>In everyday terms:</strong> Know at least two specific controls per state — that is how the exam asks this.</p>',
              },
            ],
          },
          {
            id: "branch-7",
            label: "Retention & Disposal",
            desc: '<span class="panel-tag">Core Concept</span><p>Deleting a file is not enough, and the ordered list of disposal methods is examined directly.</p>',
            children: [
              {
                id: "branch-7-detail-1",
                label: "Record Retention",
                desc: '<span class="panel-tag">Policy</span><p>Organizations must retain records for as long as needed for business operations, legal compliance, and audits. Retention periods are set by organizational policy, industry standards, or law — commonly three years, seven years, or indefinitely — and once the period expires the records must be securely destroyed.</p><p><strong>In everyday terms:</strong> Keeping data longer than required is a liability, not caution: you cannot leak records you no longer hold.</p>',
              },
              {
                id: "branch-7-detail-2",
                label: "Data Recovery Risk",
                desc: "<span class=\"panel-tag\">Risk</span><p>Data recovery is the process of retrieving lost or deleted data from storage, which means a forensic attacker can recover files you believe you deleted.</p><p><strong>In everyday terms:</strong> Free recovery tools can restore photos from a 'wiped' memory card in minutes — which is why second-hand phones and cameras leak so much personal data.</p>",
              },
              {
                id: "branch-7-detail-3",
                label: "Data Remanence Risk",
                desc: '<span class="panel-tag">Risk</span><p>Data remanence is residual data that remains on media after it was supposedly erased. Even formatting does not eliminate it, because formatting rewrites the index rather than the content.</p><p><strong>In everyday terms:</strong> Deleting a file is like tearing the contents page out of a book. Every page is still there; only the way of finding them is gone.</p>',
              },
              {
                id: "branch-7-detail-4",
                label: "1. Erasing",
                desc: '<span class="panel-tag">Disposal Method</span><p>Erasing is simply performing a delete operation — the equivalent of dragging to the trash bin. Everything is still recoverable, so this is not a disposal method for anything sensitive.</p>',
              },
              {
                id: "branch-7-detail-5",
                label: "2. Formatting",
                desc: '<span class="panel-tag">Disposal Method</span><p>Formatting puts a new file structure over the old data. It is slightly better than erasing but still recoverable in most cases, and not secure enough for sensitive data.</p>',
              },
              {
                id: "branch-7-detail-6",
                label: "3. Clearing",
                desc: '<span class="panel-tag">Disposal Method</span><p>Clearing, or overwriting, prepares media for reuse by overwriting storage with random data, for example to the DoD 5220.22-M standard. Cleared data <strong>cannot be recovered using traditional tools</strong>, making it safe for internal reuse.</p><p><strong>In everyday terms:</strong> This is the point where the book analogy ends: clearing writes new text over every page rather than removing the index.</p>',
              },
              {
                id: "branch-7-detail-7",
                label: "4. Purging",
                desc: '<span class="panel-tag">Disposal Method</span><p>Purging is a more intense form of clearing, using degaussing or multiple overwrites, and it prepares media for reuse in <strong>less-secure environments</strong>. Degaussing uses magnetic fields to erase magnetic media such as HDDs and tapes, and critically it does <strong>not</strong> work on SSDs.</p><p><strong>In everyday terms:</strong> The SSD exception is a favourite exam trap: an SSD has no magnetic domains, so a degausser passes over it and changes nothing at all.</p>',
              },
              {
                id: "branch-7-detail-8",
                label: "5. Destruction",
                desc: '<span class="panel-tag">Disposal Method</span><p>Destruction is the final stage: physically destroying the media by shredding, crushing, or incineration. It is the most secure method and is used for highly sensitive data that must never be recovered.</p><p><strong>In everyday terms:</strong> Hospitals shred old drives holding patient records rather than wiping and reselling them, because PHI is Restricted and the residual risk of reuse is not worth the resale value.</p>',
              },
              {
                id: "branch-7-detail-9",
                label: "6. Declassification",
                desc: '<span class="panel-tag">Disposal Method</span><p>Declassification is any process that purges media or a system in preparation for reuse in an <strong>unclassified</strong> environment. It must be formally approved rather than assumed.</p>',
              },
              {
                id: "branch-7-detail-10",
                label: "Method Ranking",
                desc: '<span class="panel-tag">Exam Tip</span><p>The ranking to memorise: Erasing and Formatting leave data <strong>still recoverable</strong>; Clearing is safe for <strong>internal</strong> reuse; Purging is safe for <strong>external</strong> reuse; Destruction is <strong>final and permanent</strong>.</p><p><strong>In everyday terms:</strong> The practical rule of thumb: if the drive is leaving your control, clearing is not enough — purge it or destroy it.</p>',
              },
              {
                id: "branch-7-detail-11",
                label: "Paper Disposal",
                desc: '<span class="panel-tag">Practice</span><p>Cross-cut shredding is recommended for paper documents containing any sensitive data. Regular bin disposal is <strong>never</strong> acceptable for classified or confidential paper records.</p><p><strong>In everyday terms:</strong> Cross-cut rather than strip-cut matters: strip-shredded pages have been reassembled by hand before, and cross-cut makes that impractical.</p>',
              },
            ],
          },
          {
            id: "branch-8",
            label: "Data Protection Laws",
            desc: '<span class="panel-tag">Core Concept</span><p>Non-compliance means heavy fines, criminal penalties, and loss of stakeholder trust.</p>',
            children: [
              {
                id: "branch-8-detail-1",
                label: "Why Laws Matter",
                desc: '<span class="panel-tag">Context</span><p>Laws and regulations require organizations to protect personal and sensitive data, implement security controls, and report breaches. This converts security from a recommendation into a legal obligation with measurable penalties.</p>',
              },
              {
                id: "branch-8-detail-2",
                label: "GDPR",
                desc: '<span class="panel-tag">EU</span><p>The General Data Protection Regulation is the EU legal framework for collecting and processing personal data of EU residents. It applies <strong>globally</strong> — any website with EU visitors must comply regardless of where it is based — carries heavy fines, covers names, location, IP addresses, health and financial data, and requires explicit consent and breach notification.</p><p><strong>In everyday terms:</strong> Every cookie consent banner you click through exists because of GDPR, including on sites that are not based in Europe at all.</p>',
              },
              {
                id: "branch-8-detail-3",
                label: "PDPL",

              },
              {

                label: "S-T-O Mnemonic",
                desc: '<span class="panel-tag">Memory Hook</span><p>Remember <strong>S-T-O</strong>: Strategy (WHY) → Tactics (WHAT) → Operations (HOW). This maps directly onto Senior Management → Middle Management → Implementation Team.</p>',
              },
              {
                id: "branch-10-detail-7",
                label: "The InfoSec Team",
                desc: '<span class="panel-tag">Structure</span><p>The security team must be <strong>autonomous</strong> rather than buried inside IT, and the CISO leads it and reports directly to senior management. The security management plan defines security roles, how security will be managed, who is responsible, how to test effectiveness, policy development, risk analysis, and required security education.</p><p><strong>In everyday terms:</strong> A security team inside IT is being asked to audit its own manager, which is why the course insists on autonomy.</p>',
              },

          },
        ],
      };

      // ─────────────────────────────────────────────
      // STATE
      // ─────────────────────────────────────────────
      const state = {
        expanded: new Set(["root"]),
        selected: null,
        panX: 0,
        panY: 0,
        scale: 1,
        dragging: false,
        dragStartX: 0,
        dragStartY: 0,
        dragStartPanX: 0,
        dragStartPanY: 0,
      };

      const NODE_W = 200;
      const NODE_H = 44;
      const H_GAP = 80;
      const V_GAP = 28;

      function estimateNodeHeight(node) {
        const text = String(node.label || "");
        const charsPerLine = node._level === 0 ? 22 : 18;
        const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
        return Math.max(NODE_H, 24 + lines * 22);
      }

      // ─────────────────────────────────────────────
      // LAYOUT ENGINE
      // ─────────────────────────────────────────────
      function shiftSubtree(node, deltaY) {
        node._y += deltaY;
        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach((child) => shiftSubtree(child, deltaY));
        }
      }

      function computeLayout(node, level = 0, x = 100, y = 0) {
        node._level = level;
        node._x = x;
        node._y = y;
        node._w = NODE_W;
        node._h = estimateNodeHeight(node);

        if (!node.children || !state.expanded.has(node.id)) {
          node._subtreeH = node._h;
          return node._subtreeH;
        }

        const childX = x + NODE_W + H_GAP;
        let totalH = 0;
        node.children.forEach((child) => {
          totalH += computeLayout(child, level + 1, childX, 0);
          totalH += V_GAP;
        });
        totalH -= V_GAP;

        let cy = y + node._h / 2 - totalH / 2;
        node.children.forEach((child) => {
          const nextY = cy + child._subtreeH / 2 - child._h / 2;
          shiftSubtree(child, nextY - child._y);
          cy += child._subtreeH + V_GAP;
        });

        node._subtreeH = Math.max(node._h, totalH);
        return node._subtreeH;
      }

      // ─────────────────────────────────────────────
      // RENDER
      // ─────────────────────────────────────────────
      const canvas = document.getElementById("canvas");
      const svgLayer = document.getElementById("svg-layer");
      let nodeEls = {};

      function render() {
        computeLayout(DATA, 0, 100, 2000);
        renderNodes(DATA);
        renderConnectors(DATA);
      }

      function renderNodes(node) {
        let el = nodeEls[node.id];
        if (!el) {
          el = document.createElement("div");
          el.className = "node";
          el.dataset.id = node.id;
          el.innerHTML = buildNodeHTML(node);
          el.addEventListener("click", () => onNodeClick(node));
          canvas.appendChild(el);
          nodeEls[node.id] = el;
        }

        const levelClass =
          node._level === 0 ? "root" : `level-${Math.min(node._level, 3)}`;
        el.className = `node ${levelClass}${state.selected === node.id ? " selected" : ""}${state.expanded.has(node.id) ? " expanded" : ""}`;
        el.style.left = node._x + "px";
        el.style.top = node._y + "px";
        el.style.width = node._w + "px";
        el.style.minHeight = node._h + "px";
        el.style.display = "flex";

        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach(renderNodes);
        }

        // Remove orphaned children
        if (!node.children || !state.expanded.has(node.id)) {
          collapseChildren(node);
        }
      }

      function buildNodeHTML(node) {
        const isParent = node.children && node.children.length > 0;
        const icon = isParent
          ? `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`
          : `<div class="leaf-dot"></div>`;
        return `<div class="node-text">${node.label}</div>${icon}`;
      }

      function collapseChildren(node) {
        if (!node.children) return;
        node.children.forEach((child) => {
          if (nodeEls[child.id]) {
            nodeEls[child.id].style.display = "none";
          }
          collapseChildren(child);
        });
      }

      function renderConnectors(node) {
        svgLayer.innerHTML = "";
        drawConnectors(node);
      }

      function drawConnectors(node) {
        if (!node.children || !state.expanded.has(node.id)) return;
        node.children.forEach((child) => {
          const x1 = node._x + node._w;
          const y1 = node._y + node._h / 2;
          const x2 = child._x;
          const y2 = child._y + child._h / 2;
          const cx1 = x1 + (x2 - x1) * 0.55;
          const cx2 = x2 - (x2 - x1) * 0.55;
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path.setAttribute("class", "connector");
          path.setAttribute(
            "d",
            `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`,
          );
          svgLayer.appendChild(path);
          drawConnectors(child);
        });
      }

      // ─────────────────────────────────────────────
      // INTERACTION
      // ─────────────────────────────────────────────
      function onNodeClick(node) {
        if (node.children && node.children.length > 0) {
          if (state.expanded.has(node.id)) {
            state.expanded.delete(node.id);
          } else {
            state.expanded.add(node.id);
          }
          state.selected = node.id;
          render();
        } else {
          state.selected = node.id;
          render();
          openPanel(node);
        }
      }

      function openPanel(node) {
        document.getElementById("panel-title").textContent = node.label;
        document.getElementById("panel-body").innerHTML =
          node.desc || `<p>No description available.</p>`;
        document.getElementById("panel").classList.add("open");
      }

      function closePanel() {
        document.getElementById("panel").classList.remove("open");
        state.selected = null;
        render();
      }

      // ─────────────────────────────────────────────
      // PAN & ZOOM
      // ─────────────────────────────────────────────
      const wrap = document.getElementById("canvas-wrap");

      function applyTransform() {
        canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
        document.getElementById("zoom-badge").textContent =
          Math.round(state.scale * 100) + "%";
      }

      wrap.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node")) return;
        state.dragging = true;
        state.dragStartX = e.clientX;
        state.dragStartY = e.clientY;
        state.dragStartPanX = state.panX;
        state.dragStartPanY = state.panY;
        wrap.classList.add("grabbing");
      });

      window.addEventListener("mousemove", (e) => {
        if (!state.dragging) return;
        state.panX = state.dragStartPanX + (e.clientX - state.dragStartX);
        state.panY = state.dragStartPanY + (e.clientY - state.dragStartY);
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        state.dragging = false;
        wrap.classList.remove("grabbing");
      });

      wrap.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.1 : -0.1;
          state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
          applyTransform();
        },
        { passive: false },
      );

      function zoom(delta) {
        state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
        applyTransform();
      }

      function resetView() {
        state.panX = 0;
        state.panY = 0;
        state.scale = 1;
        applyTransform();
      }

      // ─────────────────────────────────────────────
      // EXPAND / COLLAPSE ALL
      // ─────────────────────────────────────────────
      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children) node.children.forEach((c) => collectIds(c, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => state.expanded.add(id));
        render();
      }

      function collapseAll() {
        state.expanded.clear();
        state.expanded.add("root");
        render();
      }

      // ─────────────────────────────────────────────
      // SEARCH
      // ─────────────────────────────────────────────
      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("search-results");

      function flatNodes(node, path = [], results = []) {
        results.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((c) =>
            flatNodes(c, [...path, node.label], results),
          );
        return results;
      }

      const allNodes = flatNodes(DATA);

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        // Clear highlights
        Object.values(nodeEls).forEach((el) =>
          el.classList.remove("highlighted"),
        );

        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = allNodes.filter(({ node }) =>
          node.label.toLowerCase().includes(q),
        );
        if (matches.length === 0) {
          searchResults.innerHTML =
            '<div class="sr-item" style="cursor:default;color:var(--text-muted)">No results found</div>';
          searchResults.style.display = "block";
          return;
        }

        searchResults.innerHTML = matches
          .slice(0, 10)
          .map(({ node, path }) => {
            const hl = node.label.replace(
              new RegExp(`(${q})`, "gi"),
              "<mark>$1</mark>",
            );
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${hl}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");

        searchResults.querySelectorAll(".sr-item[data-id]").forEach((el) => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            navigateTo(id);
            searchResults.style.display = "none";
            searchInput.value = "";
          });
        });

        matches.forEach(({ node }) => {
          if (nodeEls[node.id]) nodeEls[node.id].classList.add("highlighted");
        });

        searchResults.style.display = "block";
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      function navigateTo(id) {
        // Expand path to node
        function findPath(node, targetId, path = []) {
          if (node.id === targetId) return [...path, node.id];
          if (node.children) {
            for (const c of node.children) {
              const r = findPath(c, targetId, [...path, node.id]);
              if (r) return r;
            }
          }
          return null;
        }
        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => state.expanded.add(pid));
        state.selected = id;
        render();
        // Center on node
        setTimeout(() => {
          function findNode(node, id) {
            if (node.id === id) return node;
            if (node.children)
              for (const c of node.children) {
                const r = findNode(c, id);
                if (r) return r;
              }
            return null;
          }
          const n = findNode(DATA, id);
          if (n) {
            const vpW = wrap.clientWidth;
            const vpH = wrap.clientHeight;
            state.panX = vpW / 2 - (n._x + n._w / 2) * state.scale;
            state.panY = vpH / 2 - (n._y + n._h / 2) * state.scale;
            applyTransform();
          }
        }, 100);
      }

      // ─────────────────────────────────────────────
      // THEME
      // ─────────────────────────────────────────────
      const themeBtn = document.getElementById("theme-toggle");
      let isDark = true;

      function applyTheme(dark) {
        document.body.dataset.theme = dark ? "dark" : "light";
        themeBtn.textContent = dark ? "🌙" : "☀️";
        localStorage.setItem("mm-theme", dark ? "dark" : "light");
        try {
          localStorage.setItem("shoug-theme", dark ? "dark" : "light");
        } catch (_e) {}
      }

      themeBtn.addEventListener("click", () => {
        isDark = !isDark;
        applyTheme(isDark);
      });

      // Restore
      const saved =
        localStorage.getItem("shoug-theme") || localStorage.getItem("mm-theme");
      if (saved === "light") {
        isDark = false;
        applyTheme(false);
      }

      // ─────────────────────────────────────────────
      // EXPORT — LANDSCAPE PDF (every node expanded)
      // ─────────────────────────────────────────────
      const PRINT_PAGE_W = 1520; // A3 landscape content box @96dpi
      const PRINT_PAGE_H = 1050;
      const PRINT_ACCENTS = [
        "#0969da",
        "#1a7f37",
        "#a40e26",
        "#bc4c00",
        "#cf222e",
        "#0550ae",
      ];

      function psEscape(text) {
        const d = document.createElement("div");
        d.textContent = text == null ? "" : String(text);
        return d.innerHTML;
      }

      function psDesc(html) {
        const d = document.createElement("div");
        d.innerHTML = html || "";
        const tag = d.querySelector(".panel-tag");
        if (tag) tag.remove();
        return d.textContent.replace(/\s+/g, " ").trim();
      }

      function psLeaves(nodes) {
        return (nodes || [])
          .map((node) => {
            const text = psDesc(node.desc) || node.label;
            if (node.children && node.children.length) {
              // A grouping node (e.g. "Examples") keeps its own label as a
              // heading so the nesting still reads on paper.
              return (
                `<li class="ps-leaf ps-group"><span class="ps-leaf-label">${psEscape(node.label)}</span>` +
                `<ul class="ps-sub">${psLeaves(node.children)}</ul></li>`
              );
            }
            return `<li class="ps-leaf">${psEscape(text)}</li>`;
          })
          .join("");
      }

      function printKicker() {
        const parts = document.title
          .split("—")
          .map((s) => s.trim())
          .filter(Boolean);
        return (
          parts.find((p) => /[A-Z]{2,4}\s?\d{3}|chapter/i.test(p)) ||
          parts[parts.length - 1] ||
          ""
        );
      }

      function buildPrintSheet() {
        const old = document.getElementById("print-sheet");
        if (old) old.remove();

        const cards = (DATA.children || [])
          .map((branch, i) => {
            const color = PRINT_ACCENTS[i % PRINT_ACCENTS.length];
            const intro = psDesc(branch.desc);
            return `<section class="ps-card" style="--c:${color}">
                    <div class="ps-card-head">
                        <span class="ps-num">${String(i + 1).padStart(2, "0")}</span>
                        <h2 class="ps-branch">${psEscape(branch.label)}</h2>
                    </div>
                    ${intro ? `<p class="ps-branch-desc">${psEscape(intro)}</p>` : ""}
                    <ul class="ps-leaves">${psLeaves(branch.children)}</ul>
                </section>`;
          })
          .join("");

        const sheet = document.createElement("div");
        sheet.id = "print-sheet";
        sheet.innerHTML = `<div id="print-inner">
                <header class="ps-head">
                    <div>
                        <div class="ps-kicker">${psEscape(printKicker())}</div>
                        <h1 class="ps-title">${psEscape(DATA.label)}</h1>
                    </div>
                    <div class="ps-meta">Full mindmap — all branches expanded</div>
                </header>
                <div class="ps-grid">${cards}</div>
                <div class="ps-foot"><span>Made by Shoug Alomran</span><span>shoug-tech.com</span></div>
            </div>`;
        document.body.appendChild(sheet);
        return sheet;
      }

      async function exportPDF() {
        expandAll();
        const sheet = buildPrintSheet();
        const inner = sheet.querySelector("#print-inner");

        // Measure off-screen, then binary-search the largest scale that still
        // fits one landscape page — sparse maps grow, dense ones shrink.
        sheet.classList.add("measuring");
        try {
          await document.fonts.ready;
        } catch (_e) {}
        await new Promise((r) => requestAnimationFrame(r));

        const fits = (s) => {
          inner.style.transform = "none";
          inner.style.width = PRINT_PAGE_W / s + "px";
          return inner.scrollHeight <= PRINT_PAGE_H / s;
        };

        let lo = 0.45,
          hi = 1.75;
        if (!fits(lo))
          hi = lo; // even the floor overflows: accept it
        else if (fits(hi)) lo = hi;
        else {
          for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            if (fits(mid)) lo = mid;
            else hi = mid;
          }
        }
        const onePage = fits(lo); // false only if even the floor overflows
        inner.style.width = PRINT_PAGE_W / lo + "px";
        inner.style.transform = `scale(${lo})`;
        sheet.classList.toggle("one-page", onePage);
        sheet.classList.remove("measuring");

        window.addEventListener("afterprint", () => sheet.remove(), {
          once: true,
        });
        window.print();
      }

      // ─────────────────────────────────────────────
      // INIT
      // ─────────────────────────────────────────────
      function init() {
        render();
        // Center on the root: the layout puts it at a fixed y, so a
        // hard-coded pan clips the first branch as soon as a map has
        // more branches than the page this template came from.
        state.panX = 40;
        state.panY = wrap.clientHeight / 2 - (DATA._y + DATA._h / 2);
        applyTransform();
      }

      init();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
  </body>
</html>
