    <title>Cyber Security Foundations and Principles — CYS401 Mindmap</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1f2937;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #3fb950;
        --accent3: #ff9aa8;
        --accent4: #ffa657;
        --accent5: #ff7b72;
        --accent6: #79c0ff;
        --node-root: #1a2744;
        --node-root-border: #58a6ff;
        --node-l1: #1a2a1e;
        --node-l1-border: #3fb950;
        --node-l2: #3a1c22;
        --node-l2-border: #ff9aa8;
        --node-l3: #2a1f18;
        --node-l3-border: #ffa657;
        --node-selected: #0d2442;
        --node-selected-border: #58a6ff;
        --shadow: rgba(0, 0, 0, 0.5);
        --connector: #30363d;
        --panel-bg: #161b22;
        --panel-border: #30363d;
        --toolbar-bg: rgba(13, 17, 23, 0.92);
        --search-bg: #21262d;
        --search-border: #30363d;
        --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="light"] {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --surface2: #f0f2f5;
        --border: #d0d7de;
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent2: #1a7f37;
        --accent3: #a40e26;
        --accent4: #bc4c00;
        --accent5: #cf222e;
        --accent6: #0550ae;
        --node-root: #dbeafe;
        --node-root-border: #0969da;
        --node-l1: #dcfce7;
        --node-l1-border: #1a7f37;
        --node-l2: #fde8ec;
        --node-l2-border: #a40e26;
        --node-l3: #fff7ed;
        --node-l3-border: #bc4c00;
        --node-selected: #bfdbfe;
        --node-selected-border: #0969da;
        --shadow: rgba(0, 0, 0, 0.12);
        --connector: #c8d1da;
        --panel-bg: #ffffff;
        --panel-border: #d0d7de;
        --toolbar-bg: rgba(246, 248, 250, 0.92);
        --search-bg: #f6f8fa;
        --search-border: #d0d7de;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        transition:
          background var(--transition),
          color var(--transition);
        user-select: none;
      }

      /* TOOLBAR */
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: var(--toolbar-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        height: 56px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      .toolbar-brand {
        font-family: "DM Serif Display", serif;
        font-size: 16px;
        color: var(--text);
        white-space: nowrap;
        margin-right: 8px;
        letter-spacing: -0.3px;
      }

      .toolbar-brand span {
        color: var(--accent);
      }

      .toolbar-sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
      }

      #search-wrap {
        position: relative;
        flex: 1;
        max-width: 280px;
      }

      #search-wrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.5;
        pointer-events: none;
      }

      #search {
        width: 100%;
        background: var(--search-bg);
        border: 1px solid var(--search-border);
        border-radius: 8px;
        padding: 6px 12px 6px 34px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.2s,
          background var(--transition);
      }

      #search:focus {
        border-color: var(--accent);
      }

      #search::placeholder {
        color: var(--text-muted);
      }

      .tb-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 11px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.1s;
        white-space: nowrap;
      }

      .tb-btn:hover {
        background: var(--border);
        transform: translateY(-1px);
      }

      .tb-btn:active {
        transform: translateY(0);
      }

      .tb-btn svg {
        flex-shrink: 0;
      }

      #theme-toggle {
        font-size: 16px;
        padding: 6px 10px;
      }

      #search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 32px var(--shadow);
        z-index: 200;
        max-height: 260px;
        overflow-y: auto;
        display: none;
      }

      .sr-item {
        padding: 9px 14px;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sr-item:last-child {
        border-bottom: none;
      }

      .sr-item:hover {
        background: var(--surface2);
      }

      .sr-item .sr-path {
        font-size: 11px;
        color: var(--text-muted);
      }

      .sr-item mark {
        background: transparent;
        color: var(--accent);
        font-weight: 600;
      }

      /* CANVAS */
      #canvas-wrap {
        position: fixed;
        top: 56px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        cursor: grab;
      }

      #canvas-wrap.grabbing {
        cursor: grabbing;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 4000px;
        height: 4000px;
        transform-origin: 0 0;
      }

      #svg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* NODES */
      .node {
        position: absolute;
        border-radius: 14px;
        border: 2px solid;
        cursor: pointer;
        transition:
          box-shadow 0.25s,
          transform 0.25s,
          background 0.25s,
          border-color 0.25s,
          opacity 0.25s;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        max-width: 220px;
        min-width: 120px;
      }

      .node:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 24px var(--shadow);
        z-index: 10;
      }

      .node.root {
        background: var(--node-root);
        border-color: var(--node-root-border);
        font-family: "DM Serif Display", serif;
        font-size: 15px;
        min-width: 160px;
        max-width: 240px;
        box-shadow:
          0 0 0 4px rgba(88, 166, 255, 0.15),
          0 4px 20px var(--shadow);
      }

      .node.level-1 {
        background: var(--node-l1);
        border-color: var(--node-l1-border);
        font-size: 13px;
        font-weight: 500;
      }

      .node.level-2 {
        background: var(--node-l2);
        border-color: var(--node-l2-border);
        font-size: 12.5px;
      }

      .node.level-3 {
        background: var(--node-l3);
        border-color: var(--node-l3-border);
        font-size: 12px;
      }

      .node.selected {
        background: var(--node-selected) !important;
        border-color: var(--node-selected-border) !important;
        box-shadow:
          0 0 0 3px rgba(88, 166, 255, 0.3),
          0 6px 24px var(--shadow) !important;
        z-index: 20;
      }

      .node.highlighted {
        box-shadow:
          0 0 0 3px var(--accent4),
          0 4px 16px var(--shadow) !important;
      }

      .node-text {
        flex: 1;
        line-height: 1.35;
        word-break: break-word;
      }

      .chevron {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        opacity: 0.6;
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.2s;
      }

      .node.expanded .chevron {
        transform: rotate(90deg);
        opacity: 1;
      }

      .leaf-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
        transition: background 0.2s;
      }

      .node.selected .leaf-dot,
      .node:hover .leaf-dot {
        background: var(--accent);
      }

      /* CONNECTOR LINES */
      .connector {
        fill: none;
        stroke: var(--connector);
        stroke-width: 1.5;
        transition: stroke var(--transition);
      }

      /* PANEL */
      #panel {
        position: fixed;
        top: 56px;
        right: -440px;
        width: 420px;
        bottom: 0;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
        z-index: 90;
        display: flex;
        flex-direction: column;
        transition:
          right 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          background var(--transition),
          border-color var(--transition);
        box-shadow: -8px 0 40px var(--shadow);
      }

      #panel.open {
        right: 0;
      }

      #panel-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      #panel-title {
        font-family: "DM Serif Display", serif;
        font-size: 20px;
        line-height: 1.3;
        flex: 1;
        color: var(--text);
      }

      #panel-close {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        transition:
          color 0.2s,
          background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      #panel-close:hover {
        color: var(--text);
        background: var(--surface2);
      }

      #panel-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        line-height: 1.75;
        font-size: 14px;
        color: var(--text);
      }

      #panel-body p {
        margin-bottom: 14px;
      }

      #panel-body strong {
        color: var(--accent);
        font-weight: 600;
      }

      #panel-body em {
        color: var(--accent3);
        font-style: italic;
      }

      .panel-tag {
        display: inline-block;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 14px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* ZOOM BADGE */
      #zoom-badge {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 12px;
        color: var(--text-muted);
        z-index: 50;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      /* FOOTER */
      #footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--toolbar-bg);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        z-index: 100;
        font-size: 12px;
        color: var(--text-muted);
        gap: 6px;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      #footer span {
        font-weight: 600;
        color: var(--text);
        font-family: "DM Serif Display", serif;
        letter-spacing: 0.2px;
      }

      /* SCROLLBAR */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      /* NODE ANIMATION */
      @keyframes nodeIn {
        from {
          opacity: 0;
          transform: translateX(-12px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .node {
        animation: nodeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      /* ─────────────────────────────────────────────
           PDF EXPORT SHEET (landscape, fully expanded)
           ───────────────────────────────────────────── */
      #print-sheet {
        display: none;
      }

      #print-sheet.measuring {
        display: block;
        position: fixed;
        top: 0;
        left: -20000px;
        z-index: -1;
      }

      #print-inner {
        width: 1520px;
        transform-origin: top left;
        background: #ffffff;
        color: #12151a;
        font-family: "DM Sans", sans-serif;
      }

      #print-inner .ps-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 3px solid #0f172a;
        padding-bottom: 10px;
        margin-bottom: 16px;
      }

      #print-inner .ps-kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #5b6472;
      }

      #print-inner .ps-title {
        font-size: 34px;
        line-height: 1.1;
        font-weight: 800;
        color: #0f172a;
      }

      #print-inner .ps-meta {
        font-size: 11px;
        line-height: 1.5;
        text-align: right;
        white-space: nowrap;
        color: #5b6472;
      }

      #print-inner .ps-grid {
        column-width: 300px;
        column-gap: 14px;
      }

      #print-inner .ps-card {
        display: inline-block;
        width: 100%;
        margin: 0 0 14px;
        border: 1.5px solid #d8dee7;
        border-top: 5px solid var(--c, #0969da);
        border-radius: 10px;
        padding: 11px 14px 14px;
        background: #ffffff;
        break-inside: avoid;
      }

      #print-inner .ps-card-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }

      #print-inner .ps-num {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--c, #0969da);
      }

      #print-inner .ps-branch {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.25;
        color: #0f172a;
      }

      #print-inner .ps-branch-desc {
        font-size: 11px;
        line-height: 1.45;
        color: #4a5464;
        margin: 6px 0 9px;
      }

      #print-inner .ps-leaves {
        list-style: none;
        margin: 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--c, #0969da);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      #print-inner .ps-leaf {
        position: relative;
        font-size: 11.5px;
        line-height: 1.45;
        color: #1f2733;
      }

      #print-inner .ps-leaf::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 7px;
        width: 8px;
        height: 2px;
        background: var(--c, #0969da);
      }

      #print-inner .ps-group > .ps-leaf-label {
        display: block;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }

      #print-inner .ps-sub {
        list-style: none;
        margin: 5px 0 0;
        padding: 0 0 0 11px;
        border-left: 1px dashed #cdd5e0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #print-inner .ps-sub .ps-leaf {
        font-size: 10.5px;
        color: #4a5464;
      }

      #print-inner .ps-sub .ps-leaf::before {
        display: none;
      }

      #print-inner .ps-foot {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 8px;
        border-top: 1px solid #d8dee7;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: #69727f;
      }

      @media print {
        @page {
          size: A3 landscape;
          margin: 8mm;
        }

        html,
        body {
          height: auto !important;
          overflow: visible !important;
          background: #ffffff !important;
        }

        body > *:not(#print-sheet) {
          display: none !important;
        }

        #print-sheet {
          display: block !important;
          position: static !important;
          left: auto !important;
        }

        /* A transform does not shrink the layout box, so a scaled sheet
               would still paginate by its full size. Clamp it to one page. */
        #print-sheet.one-page {
          width: 1520px;
          height: 1050px;
          overflow: hidden;
        }

        #print-inner {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>

  <body data-theme="dark">
    <!-- TOOLBAR -->

      const DATA = {

        label: "Cyber Security Foundations and Principles",
        desc: '<span class="panel-tag">CYS401 · Chapter 2</span><p>A comprehensive concept map for <strong>Cyber Security Foundations and Principles</strong>.</p><p>Expand a branch to see its concepts, then select any node for the full explanation and a worked example. You can search topics, zoom, pan, and export the map.</p>',
        children: [
          {
            id: "branch-1",
            label: "Pillars & Entities",
            desc: '<span class="panel-tag">Core Concept</span><p>Security is achieved by combining people, policies, and technology, applied across the three entities every organisation must protect.</p>',
            children: [
              {
                id: "branch-1-detail-1",
                label: "People Pillar",
                desc: '<span class="panel-tag">Three Pillars</span><p>Users must understand and comply with basic data security principles: choosing strong passwords, being wary of email attachments, backing up data, and completing awareness training. This pillar fails quietly and constantly.</p><p><strong>In everyday terms:</strong> The single most effective security upgrade most families could make is not a product — it is everyone agreeing to stop reusing the same password across every site.</p>',
              },
              {
                id: "branch-1-detail-2",
                label: "Policies Pillar",
                desc: '<span class="panel-tag">Three Pillars</span><p>Organisations need a framework for handling attempted cyber attacks, responding to successful breaches, incident response, and business continuity. Policy decides what happens at 3am when something goes wrong.</p><p><strong>In everyday terms:</strong> A fire drill is a policy control. The extinguisher is technology, but knowing which stairwell to use and who counts heads outside is what actually saves people.</p>',
              },
              {
                id: "branch-1-detail-3",
                label: "Technology Pillar",
                desc: '<span class="panel-tag">Three Pillars</span><p>The technology pillar supplies the enforcement tools: firewalls and IDS/IPS, antivirus software, encryption tools, and access control systems. It executes decisions the other two pillars make.</p>',
              },
              {
                id: "branch-1-detail-4",
                label: "Endpoint Devices",
                desc: '<span class="panel-tag">Protected Entities</span><p>The first entity to protect is the endpoint: computers, smartphones, routers, and IoT devices. These are the machines people actually touch, which makes them the usual entry point.</p><p><strong>In everyday terms:</strong> Your phone is an endpoint holding your bank app, your email, and your two-factor codes — which is why losing it unlocked is worse than losing your wallet.</p>',
              },
              {
                id: "branch-1-detail-5",
                label: "Networks",
                desc: '<span class="panel-tag">Protected Entities</span><p>The second entity is the network: LANs, WANs, wireless networks, and internet connections. The network is what turns one compromised device into a compromised organisation.</p><p><strong>In everyday terms:</strong> Free café WiFi is a network you do not control, which is why banking over it without a VPN hands your traffic to whoever else is sitting there.</p>',
              },
              {
                id: "branch-1-detail-6",
                label: "Cloud & Data Centres",
                desc: '<span class="panel-tag">Protected Entities</span><p>The third entity is cloud services, servers, and storage systems. This is where the data actually lives, so it is the target with the highest value per successful attack.</p><p><strong>In everyday terms:</strong> One misconfigured cloud storage bucket can expose more records in a second than a thief could steal from an office in a year.</p>',
              },
              {
                id: "branch-1-detail-7",
                label: "Protection Technologies",
                desc: '<span class="panel-tag">Toolkit</span><p>Common protection technologies include next-generation firewalls with application awareness, DNS filtering to block malicious domains, malware protection, antivirus with signature and behaviour detection, and email security for spam and phishing.</p><p><strong>In everyday terms:</strong> DNS filtering is why a work laptop simply refuses to load a known phishing site — the block happens before the page is ever fetched.</p>',
              },
            ],
          },
          {
            id: "branch-2",
            label: "Threat, Vulnerability, Control",
            desc: '<span class="panel-tag">Core Concept</span><p>The three foundational terms, plus the relationship between them that produces risk.</p>',
            children: [
              {
                id: "branch-2-detail-1",
                label: "Vulnerability",
                desc: '<span class="panel-tag">Core Term</span><p>A vulnerability is a weakness in the security system — in procedures, design, or implementation — that might be exploited to cause loss or harm. Examples include unpatched software, weak passwords, misconfigured systems, and physical access gaps.</p><p><strong>In everyday terms:</strong> A window left unlocked is a vulnerability. It causes no harm by itself and may go unnoticed for years.</p>',
              },
              {
                id: "branch-2-detail-2",
                label: "Threat",
                desc: '<span class="panel-tag">Core Term</span><p>A threat is a set of circumstances that has the potential to cause loss or harm — a potential violation of security. Examples include malware attacks, insider threats, natural disasters, and hardware failures.</p><p><strong>In everyday terms:</strong> A burglar working your neighbourhood is a threat. They exist whether or not your window is unlocked.</p>',
              },
              {
                id: "branch-2-detail-3",
                label: "Control",
                desc: '<span class="panel-tag">Core Term</span><p>A control is an action, device, procedure, or technique that removes or reduces a vulnerability. Security patches, access controls, encryption, and security training are all controls.</p><p><strong>In everyday terms:</strong> Locking the window is a control. It does not remove the burglar, it removes the weakness the burglar was going to use.</p>',
              },
              {
                id: "branch-2-detail-4",
                label: "Exploit",
                desc: '<span class="panel-tag">Core Term</span><p>An exploit is what happens when a human — a criminal — takes advantage of a vulnerability; doing so commits an attack on the system. The exploit is the moment potential becomes actual.</p><p><strong>In everyday terms:</strong> The burglar climbing through the unlocked window is the exploit: threat and vulnerability finally meeting.</p>',
              },
              {
                id: "branch-2-detail-5",
                label: "Risk Relationship",
                desc: '<span class="panel-tag">Formula</span><p>The relationship the course states is <strong>Threat + Vulnerability − Control = Risk</strong>. The practical consequence is that you usually cannot remove threats, so you reduce risk by removing vulnerabilities and adding controls.</p><p><strong>In everyday terms:</strong> You cannot stop burglars from existing in your city, but you can lock the window — which is why almost all real security work happens on the vulnerability and control side of that equation.</p>',
              },
            ],
          },
          {
            id: "branch-3",
            label: "The Four I's",
            desc: '<span class="panel-tag">Core Concept</span><p>Threats damage assets in exactly four ways, and each one maps cleanly onto a single security property.</p>',
            children: [
              {
                id: "branch-3-detail-1",
                label: "Interruption",
                desc: '<span class="panel-tag">Four I&#x27;s</span><p>Interruption means the asset becomes unavailable or unusable. It is an attack on <strong>Availability</strong>.</p><p><strong>In everyday terms:</strong> Cutting the fibre cable to a building interrupts service without anyone reading or altering a single file.</p>',
              },
              {
                id: "branch-3-detail-2",
                label: "Interception",
                desc: '<span class="panel-tag">Four I&#x27;s</span><p>Interception means an unauthorized party gains access to an asset. It is an attack on <strong>Confidentiality</strong>.</p><p><strong>In everyday terms:</strong> Someone quietly copying your messages as they cross the network has intercepted them — nothing looks broken, which is what makes it dangerous.</p>',
              },
              {
                id: "branch-3-detail-3",
                label: "Modification",
                desc: '<span class="panel-tag">Four I&#x27;s</span><p>Modification means an unauthorized party changes an asset. It is an attack on <strong>Integrity</strong>.</p><p><strong>In everyday terms:</strong> Changing the account number on an invoice before it reaches accounts payable is modification: the document still arrives and still looks legitimate.</p>',
              },
              {
                id: "branch-3-detail-4",
                label: "Fabrication",
                desc: '<span class="panel-tag">Four I&#x27;s</span><p>Fabrication means an unauthorized party creates counterfeit assets. It is an attack on <strong>Authenticity</strong>.</p><p><strong>In everyday terms:</strong> A forged email that appears to come from your manager asking for an urgent transfer is fabricated — it was never intercepted or modified, it was invented.</p>',
              },
            ],
          },
          {
            id: "branch-4",
            label: "Threat Types",
            desc: '<span class="panel-tag">Core Concept</span><p>Threats are grouped by source, and a few named advanced types appear repeatedly on exams.</p>',
            children: [
              {
                id: "branch-4-detail-1",
                label: "Human Factor",
                desc: "<span class=\"panel-tag\">Category</span><p>Human factor threats are malicious or non-malicious and include social engineering, mistakes, and insider threats. The non-malicious half causes at least as much damage as the malicious half.</p><p><strong>In everyday terms:</strong> An employee emailing a spreadsheet to the wrong 'Ahmed' in the address book has caused a breach with no attacker involved at all.</p>",
              },
              {
                id: "branch-4-detail-2",
                label: "Environmental",
                desc: '<span class="panel-tag">Category</span><p>Environmental threats are natural or man-made: floods, fires, and power outages. They ignore every logical control you have and are handled through redundancy and recovery planning.</p><p><strong>In everyday terms:</strong> A burst water pipe above a server room defeats the world\'s best firewall configuration.</p>',
              },
              {
                id: "branch-4-detail-3",
                label: "Technical",
                desc: '<span class="panel-tag">Category</span><p>Technical threats come from hardware and software: system failures, bugs, and vulnerabilities. They are failures of the technology itself rather than of an attacker\'s intent.</p><p><strong>In everyday terms:</strong> A hard drive that simply dies after four years has destroyed availability without any malice.</p>',
              },
              {
                id: "branch-4-detail-4",
                label: "Operational",
                desc: '<span class="panel-tag">Category</span><p>Operational threats come from processes and procedures: poor practices and lack of training. They are the threats that exist because of how the organisation works.</p><p><strong>In everyday terms:</strong> Sharing one admin password across the whole IT team is an operational threat — no single person did anything wrong, but accountability is already impossible.</p>',
              },
              {
                id: "branch-4-detail-5",
                label: "Zero-Day Attack",
                desc: '<span class="panel-tag">Advanced Threat</span><p>A zero-day attack exploits a flaw that is unknown to the party responsible for patching or fixing it, so <strong>no prior knowledge</strong> of the vulnerability exists. There is no patch to apply, because nobody knows a patch is needed.</p><p><strong>In everyday terms:</strong> It is like a burglar discovering a manufacturing defect in a lock model before the lock company itself knows — every door using that lock is open, and no amount of diligent maintenance would have helped.</p>',
              },
              {
                id: "branch-4-detail-6",
                label: "Doxing",
                desc: '<span class="panel-tag">Advanced Threat</span><p>Doxing is the act of publishing private and identifying information about an individual online with intent to harm. The information is often assembled from many individually harmless public sources.</p><p><strong>In everyday terms:</strong> Combining someone\'s gym check-in posts, a photo showing their street, and a public voter record can reconstruct their home address and daily routine — none of those pieces was secret on its own.</p>',
              },
              {
                id: "branch-4-detail-7",
                label: "Reverse Social Engineering",
                desc: "<span class=\"panel-tag\">Advanced Threat</span><p>In reverse social engineering the attacker convinces the target that they have a problem, or might have one, and that the attacker is ready to help solve it. The victim then initiates contact, which makes the attacker seem trustworthy.</p><p><strong>In everyday terms:</strong> A fake 'your PC is infected' popup with a support number makes you phone the attacker. Because you made the call, you never think to verify who answered.</p>",
              },
            ],
          },
          {
            id: "branch-5",
            label: "Malware & Ransomware",
            desc: '<span class="panel-tag">Core Concept</span><p>Malware is any file or program used to harm a computer user, and each family behaves differently enough to matter.</p>',
            children: [
              {
                id: "branch-5-detail-1",
                label: "Virus",
                desc: '<span class="panel-tag">Malware Type</span><p>A virus is self-replicating code that attaches itself to files. It needs a host file and usually needs a user to run something before it spreads.</p><p><strong>In everyday terms:</strong> Like a cold that needs someone to actually shake your hand — it cannot cross the room on its own.</p>',
              },
              {
                id: "branch-5-detail-2",
                label: "Worm",
                desc: '<span class="panel-tag">Malware Type</span><p>A worm is self-propagating malware that spreads across networks without needing a host file or user action. This autonomy is why worms cause the fastest, widest outbreaks.</p><p><strong>In everyday terms:</strong> Like an airborne illness spreading through a building\'s ventilation — nobody has to touch anything for it to reach every room.</p>',
              },
              {
                id: "branch-5-detail-3",
                label: "Trojan Horse",
                desc: "<span class=\"panel-tag\">Malware Type</span><p>A Trojan horse is malware disguised as legitimate software. The user installs it deliberately, believing it is something useful.</p><p><strong>In everyday terms:</strong> A 'free video converter' that converts your files and quietly installs a remote access tool alongside them.</p>",
              },
              {
                id: "branch-5-detail-4",
                label: "Spyware & Keyloggers",
                desc: '<span class="panel-tag">Malware Type</span><p>Spyware secretly monitors user activity, and a keylogger records keyboard input specifically. Both are built to stay invisible, because their value depends on going unnoticed.</p><p><strong>In everyday terms:</strong> A keylogger captures your banking password as you type it, so encryption on the connection never gets a chance to help — the theft happened before the data was ever sent.</p>',
              },
              {
                id: "branch-5-detail-5",
                label: "Backdoor & Adware",
                desc: '<span class="panel-tag">Malware Type</span><p>A backdoor provides unauthorized access into a system, bypassing normal authentication. Adware displays unwanted advertisements and is the least harmful family, though it often arrives bundled with worse things.</p><p><strong>In everyday terms:</strong> A backdoor is a spare key hidden under the mat by someone who does not live there.</p>',
              },
              {
                id: "branch-5-detail-6",
                label: "Ransomware",
                desc: '<span class="panel-tag">Malware Type</span><p>Ransomware encrypts files and demands payment. It is unusual because it attacks availability rather than confidentiality — your data never leaves, you simply lose access to it.</p><p><strong>In everyday terms:</strong> Someone changes the lock on your own front door and sells you the new key. Nothing was stolen from inside the house.</p>',
              },
              {
                id: "branch-5-detail-7",
                label: "Malware Symptoms",
                desc: '<span class="panel-tag">Detection</span><p>Warning signs include increased CPU usage, slow computer or browser speeds, problems connecting to networks, freezing or crashing, modified or deleted files, strange new files, programs, or desktop icons, programs reconfiguring themselves, and messages being sent automatically.</p><p><strong>In everyday terms:</strong> A laptop whose fan runs loudly while you are doing nothing is often mining cryptocurrency for someone else — the symptom is the electricity bill, not a popup.</p>',
              },
              {
                id: "branch-5-detail-8",
                label: "Countermeasures",
                desc: '<span class="panel-tag">Defence</span><p>Prevention means quality antivirus with regularly updated definitions and an enabled firewall. User practice means never opening untrusted attachments and avoiding suspicious downloads. Data protection means regular backups, restore points, and offline copies.</p><p><strong>In everyday terms:</strong> The offline backup is the part people skip and the part that matters most: ransomware encrypts every drive it can reach, including the external one you left plugged in.</p>',
              },
              {
                id: "branch-5-detail-9",
                label: "Ransomware Process",
                desc: "<span class=\"panel-tag\">Attack Chain</span><p>The five stages are Infection via spam or phishing, Execution as the malware downloads its files, Encryption of your files, Notification with a ransom notice and deadline, and the Payment demand in cryptocurrency.</p><p><strong>In everyday terms:</strong> The deadline exists for the same reason 'offer ends tonight' exists in advertising — pressure stops you from thinking about restoring from backup instead.</p>",
              },
              {
                id: "branch-5-detail-10",
                label: "Famous Families",
                desc: '<span class="panel-tag">Reference</span><p>Named examples from the slides are WannaCry, Petya/NotPetya, Locky, Cerber, Bad Rabbit, Ryuk, and Dharma. WannaCry is the most cited because it spread worldwide using a known, already-patched flaw.</p><p><strong>In everyday terms:</strong> WannaCry hit organisations that simply had not installed an available update — the fix existed for months before the outbreak.</p>',
              },
            ],
          },
          {
            id: "branch-6",
            label: "Social Engineering",
            desc: '<span class="panel-tag">Core Concept</span><p>Attacks that rely on human interaction to trick users into breaking security procedures.</p>',
            children: [
              {
                id: "branch-6-detail-1",
                label: "Phishing",
                desc: "<span class=\"panel-tag\">Attack Type</span><p>Phishing uses fraudulent emails resembling reputable sources to steal sensitive data, and it is the most common form of social engineering. It scales endlessly because sending a million emails costs nothing.</p><p><strong>In everyday terms:</strong> The 'your package could not be delivered, confirm your address' SMS almost everyone has received — the attacker does not know if you ordered anything, they just know most people usually have.</p>",
              },
              {
                id: "branch-6-detail-2",
                label: "Phishing Variants",
                desc: '<span class="panel-tag">Attack Type</span><p><strong>Spear phishing</strong> targets specific individuals, <strong>whaling</strong> targets high-profile executives, <strong>angler phishing</strong> targets social media users, <strong>vishing</strong> is voice phishing by phone, and <strong>smishing</strong> is SMS phishing.</p><p><strong>In everyday terms:</strong> Spear phishing is the email that names your actual manager and your actual project — which is why it works on people who would delete generic phishing instantly.</p>',
              },
              {
                id: "branch-6-detail-3",
                label: "Baiting",
                desc: "<span class=\"panel-tag\">Attack Type</span><p>Baiting lures victims with attractive offers or rewards: free software downloads, USB drives left in car parks, and prize notifications. It exploits curiosity and the appeal of something free.</p><p><strong>In everyday terms:</strong> A USB stick labelled 'Salaries 2026' left in an office lobby gets plugged in remarkably often — the label is the entire attack.</p>",
              },
              {
                id: "branch-6-detail-4",
                label: "Pretexting",
                desc: "<span class=\"panel-tag\">Attack Type</span><p>Pretexting uses a fabricated scenario to gain the victim's trust and extract information, such as impersonating IT support, running fake surveys, or posing as an authority figure. The invented context does the work.</p><p><strong>In everyday terms:</strong> 'Hi, this is IT, we're seeing failed logins on your account, can you confirm your password so I can unlock it?' — the scenario makes handing over the password feel like cooperating.</p>",
              },
              {
                id: "branch-6-detail-5",
                label: "Tailgating",
                desc: "<span class=\"panel-tag\">Attack Type</span><p>Tailgating is an unauthorized person following an authorized person into a secure area, often using a 'forgot my badge' excuse. It defeats badge readers by exploiting politeness.</p><p><strong>In everyday terms:</strong> Someone carrying two coffees and a laptop reaches a badge door behind you. Holding it open feels like basic courtesy, and that is precisely the vulnerability.</p>",
              },
              {
                id: "branch-6-detail-6",
                label: "Pharming",
                desc: "<span class=\"panel-tag\">Attack Type</span><p>Pharming redirects users to fraudulent websites without their knowledge, using DNS cache poisoning, host file modification, or malicious code on servers. Unlike phishing, the victim does nothing wrong.</p><p><strong>In everyday terms:</strong> You type your bank's address correctly, and still land on the attacker's copy. There is no suspicious link to avoid, because you never clicked one.</p>",
              },
              {
                id: "branch-6-detail-7",
                label: "Shoulder Surfing",
                desc: '<span class="panel-tag">Attack Type</span><p>Shoulder surfing is spying directly on users to obtain passwords, PINs, or other sensitive information — at ATMs, over a shoulder at a desk, or with a phone camera. It needs no technical skill at all.</p><p><strong>In everyday terms:</strong> Standing close at a supermarket card terminal is the entire attack, and it defeats a PIN that no computer could ever guess.</p>',
              },
              {
                id: "branch-6-detail-8",
                label: "Countermeasures",
                desc: '<span class="panel-tag">Defence</span><p>Password policies cover periodic changes, complexity, lockout after failures, and secrecy. Physical security covers ID badges, access restrictions, and shredding. Training covers awareness programmes, phishing simulations, and reporting. Technical controls cover two-factor authentication, email filtering, and information classification.</p><p><strong>In everyday terms:</strong> Two-factor authentication is the control that survives the others failing: even if someone phishes your password perfectly, they still cannot log in.</p>',
              },
            ],
          },
          {
            id: "branch-7",
            label: "CIA Triad in Depth",
            desc: '<span class="panel-tag">Core Concept</span><p>Each element of the triad has its own characteristic attacks and its own protection methods.</p>',
            children: [
              {
                id: "branch-7-detail-1",
                label: "Confidentiality Defined",
                desc: '<span class="panel-tag">Confidentiality</span><p>Confidentiality is the set of measures used to ensure the secrecy of data, objects, or resources, preventing or minimising unauthorized access to data.</p><p><strong>In everyday terms:</strong> Think of it as the difference between a document being locked away and a document simply sitting on a desk — the information is identical, and only the access is controlled.</p>',
              },
              {
                id: "branch-7-detail-2",
                label: "Attacks on Confidentiality",
                desc: '<span class="panel-tag">Confidentiality</span><p>The named attacks are password theft via keyloggers or public WiFi, port scanning to discover open services, shoulder surfing, eavesdropping through man-in-the-middle, packet sniffing, and privilege escalation.</p><p><strong>In everyday terms:</strong> Port scanning is the digital equivalent of walking down a street trying every door handle to see which ones are unlocked.</p>',
              },
              {
                id: "branch-7-detail-3",
                label: "Protecting Confidentiality",
                desc: '<span class="panel-tag">Confidentiality</span><p>The protections are encryption at rest and in transit, authentication with user IDs and passwords and 2FA, biometrics such as fingerprints and iris scans, and hardware or software security tokens.</p><p><strong>In everyday terms:</strong> You use three of these before breakfast: a fingerprint to unlock your phone, TLS to load your bank, and a one-time code to confirm it is you.</p>',
              },
              {
                id: "branch-7-detail-4",
                label: "Integrity Defined",
                desc: '<span class="panel-tag">Integrity</span><p>Integrity is the assurance that information is reliable and accurate, and that data is not modified by unauthorized parties.</p><p><strong>In everyday terms:</strong> Integrity is why a bank statement you download can be trusted; without it the file would still open perfectly and quietly show the wrong numbers.</p>',
              },
              {
                id: "branch-7-detail-5",
                label: "Attacks on Integrity",
                desc: '<span class="panel-tag">Integrity</span><p>The named attacks are viruses and malware, logic bombs, unauthorized access, coding errors, and system backdoors. Note that a coding error damages integrity just as effectively as an attacker does.</p><p><strong>In everyday terms:</strong> A logic bomb is code left behind to trigger later — a departing employee setting payroll to corrupt itself sixty days after their account is disabled.</p>',
              },
              {
                id: "branch-7-detail-6",
                label: "Protecting Integrity",
                desc: '<span class="panel-tag">Integrity</span><p>The protections are file permissions and access control lists, version control to track changes, checksums and hashing to verify data, digital signatures to authenticate source and integrity, and backups to restore a correct state.</p><p><strong>In everyday terms:</strong> When a download page lists a SHA-256 checksum next to the file, that is integrity protection you can use yourself — matching hashes prove nothing altered the file in transit.</p>',
              },
              {
                id: "branch-7-detail-7",
                label: "Availability Defined",
                desc: "<span class=\"panel-tag\">Availability</span><p>Availability ensures all information is readily accessible to authorized users at all times.</p><p><strong>In everyday terms:</strong> 'At all times' is the demanding part — a service that works except on the busiest day of the year has still failed this test.</p>",
              },
              {
                id: "branch-7-detail-8",
                label: "Threats to Availability",
                desc: '<span class="panel-tag">Availability</span><p>The named threats are device failures, software errors, environmental issues such as heat, flooding, and power loss, denial-of-service attacks, and network intrusions.</p><p><strong>In everyday terms:</strong> Half of that list has no attacker in it — an air-conditioning failure in a server room takes systems down just as thoroughly as a DDoS.</p>',
              },
              {
                id: "branch-7-detail-9",
                label: "Protecting Availability",
                desc: "<span class=\"panel-tag\">Availability</span><p>The protections are redundancy across multiple systems and paths, geographically isolated backups, disaster recovery and business continuity plans, security equipment such as firewalls and proxy servers, and web application firewalls for DDoS protection.</p><p><strong>In everyday terms:</strong> Backups stored in the same building as the servers fail the 'geographically isolated' test — one fire destroys both the original and the copy.</p>",
              },
            ],
          },
          {
            id: "branch-8",
            label: "AAA Services",
            desc: '<span class="panel-tag">Core Concept</span><p>AAA is examined as five elements in this course, not three — identification through accountability.</p>',
            children: [
              {
                id: "branch-8-detail-1",
                label: "Identification",
                desc: '<span class="panel-tag">AAA Step 1</span><p>Identification is claiming to be an identity when attempting to access a secured area or system. It is only a claim, and nothing has been proven yet.</p><p><strong>In everyday terms:</strong> Typing your username is identification. Anyone can type it.</p>',
              },
              {
                id: "branch-8-detail-2",
                label: "Authentication",
                desc: '<span class="panel-tag">AAA Step 2</span><p>Authentication is proving that you are that identity, through a password, a biometric scan, or a token. This is the step that turns a claim into a verified fact.</p><p><strong>In everyday terms:</strong> Entering the password is authentication — the system now has evidence, not just an assertion.</p>',
              },
              {
                id: "branch-8-detail-3",
                label: "Authorization",
                desc: '<span class="panel-tag">AAA Step 3</span><p>Authorization defines the allow/deny permissions for resources and object access for a specific identity. It happens after identity is proven and decides what that identity may do.</p><p><strong>In everyday terms:</strong> Being a verified student lets you see your own grades; it does not let you see anyone else\'s. Same proven identity, different permissions.</p>',
              },
              {
                id: "branch-8-detail-4",
                label: "Auditing",
                desc: "<span class=\"panel-tag\">AAA Step 4</span><p>Auditing is recording a log of events and activities related to the system and its subjects. It creates the evidence trail without judging it.</p><p><strong>In everyday terms:</strong> The access log noting 'account X opened record Y at 14:32' is auditing — a fact recorded whether or not anything was wrong.</p>",
              },
              {
                id: "branch-8-detail-5",
                label: "Accounting",
                desc: '<span class="panel-tag">AAA Step 5</span><p>Accounting, or accountability, is reviewing log files to check for compliance and violations, and to hold subjects accountable for their actions. Logs nobody reads provide no accountability at all.</p><p><strong>In everyday terms:</strong> A shop with cameras that nobody ever reviews has auditing but no accounting — the footage exists and changes nothing.</p>',
              },
              {
                id: "branch-8-detail-6",
                label: "Banking Walkthrough",
                desc: '<span class="panel-tag">Worked Example</span><p>The full chain in one scenario: your account number is identification, your PIN is authentication, the accounts you may reach is authorization, the transaction log is auditing, and the bank reviewing that log for suspicious activity is accounting.</p><p><strong>In everyday terms:</strong> This is exactly what happens at every ATM you have ever used, in that order, in about four seconds.</p>',
              },
              {
                id: "branch-8-detail-7",
                label: "Five, Not Three",
                desc: '<span class="panel-tag">Exam Tip</span><p>A common mistake is assuming AAA has only three elements. For this course it has <strong>five</strong>: Identification, Authentication, Authorization, Auditing, and Accounting.</p>',
              },
            ],
          },
          {
            id: "branch-9",
            label: "Protection Mechanisms",
            desc: '<span class="panel-tag">Core Concept</span><p>Four mechanisms implement and maintain the CIA triad in practice.</p>',
            children: [
              {
                id: "branch-9-detail-1",
                label: "Layering",
                desc: '<span class="panel-tag">Mechanism</span><p>Layering, or defense in depth, is the use of multiple controls in a series — like an onion with many layers. The point is that defeating one control does not defeat the system.</p><p><strong>In everyday terms:</strong> Getting into a bank vault means passing the front door, the guard, the internal door, the vault door, and the safe deposit lock. Five failures are needed, not one.</p>',
              },
              {
                id: "branch-9-detail-2",
                label: "Layering Configurations",
                desc: '<span class="panel-tag">Mechanism</span><p>The named configurations are serial (controls in sequence), parallel (multiple controls at the same level), and the mall, bank, and airport analogies for multiple checkpoints.</p><p><strong>In everyday terms:</strong> Airport security is a serial configuration you have walked through yourself: ticket check, then ID check, then bag scan, then body scan, each independent of the last.</p>',
              },
              {
                id: "branch-9-detail-3",
                label: "Layering Benefits",
                desc: '<span class="panel-tag">Mechanism</span><p>Layering gives no single point of failure, redundancy in security controls, time delay for attackers, and multiple detection opportunities. The time delay matters as much as the blocking — it buys time to notice.</p>',
              },
              {
                id: "branch-9-detail-4",
                label: "Abstraction",
                desc: "<span class=\"panel-tag\">Mechanism</span><p>Abstraction groups similar elements into groups, classes, or roles that are assigned controls, restrictions, or permissions collectively. It exists for efficiency: you manage ten groups instead of ten thousand users.</p><p><strong>In everyday terms:</strong> A university grants library access to the 'enrolled students' group, not to 30,000 individual accounts — and a graduating student loses access by leaving the group, with no per-file cleanup.</p>",
              },
              {
                id: "branch-9-detail-5",
                label: "Abstraction Examples",
                desc: '<span class="panel-tag">Mechanism</span><p>The named examples are user groups such as Admin, User, and Guest, file permissions of read, write, and execute, network zones such as DMZ, Internal, and External, and data classification levels.</p><p><strong>In everyday terms:</strong> Windows file permissions are the version you see daily: you grant read access to a folder for a group, and every file inside inherits it without being touched.</p>',
              },
              {
                id: "branch-9-detail-6",
                label: "Data Hiding",
                desc: '<span class="panel-tag">Mechanism</span><p>Data hiding is intentionally positioning data so it is not viewable or accessible to an unauthorized subject. It differs from encryption: the subject does not know the data is there at all.</p><p><strong>In everyday terms:</strong> Encryption is a locked safe in plain view — everyone knows something valuable is inside. Data hiding is a safe behind a painting.</p>',
              },
              {
                id: "branch-9-detail-7",
                label: "Data Hiding Methods",
                desc: '<span class="panel-tag">Mechanism</span><p>The named methods are steganography (hiding data inside images or files), access controls, network segmentation, and data masking.</p><p><strong>In everyday terms:</strong> Data masking is why a support agent sees your card as **** **** **** 4471 — the full number exists in the database and simply never reaches their screen.</p>',
              },
              {
                id: "branch-9-detail-8",
                label: "Encryption",
                desc: '<span class="panel-tag">Mechanism</span><p>Encryption is the art and science of hiding the meaning or intent of a communication from unintended recipients. The three types named are symmetric (same key both ways), asymmetric (public/private key pairs), and hashing (one-way transformation).</p><p><strong>In everyday terms:</strong> The padlock in your browser\'s address bar means encryption is running on every page you load — the most-used security control in daily life and the one people notice least.</p>',
              },
            ],
          },
        ],
      };

      // ─────────────────────────────────────────────
      // STATE
      // ─────────────────────────────────────────────
      const state = {
        expanded: new Set(["root"]),
        selected: null,
        panX: 0,
        panY: 0,
        scale: 1,
        dragging: false,
        dragStartX: 0,
        dragStartY: 0,
        dragStartPanX: 0,
        dragStartPanY: 0,
      };

      const NODE_W = 200;
      const NODE_H = 44;
      const H_GAP = 80;
      const V_GAP = 28;

      function estimateNodeHeight(node) {
        const text = String(node.label || "");
        const charsPerLine = node._level === 0 ? 22 : 18;
        const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
        return Math.max(NODE_H, 24 + lines * 22);
      }

      // ─────────────────────────────────────────────
      // LAYOUT ENGINE
      // ─────────────────────────────────────────────
      function shiftSubtree(node, deltaY) {
        node._y += deltaY;
        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach((child) => shiftSubtree(child, deltaY));
        }
      }

      function computeLayout(node, level = 0, x = 100, y = 0) {
        node._level = level;
        node._x = x;
        node._y = y;
        node._w = NODE_W;
        node._h = estimateNodeHeight(node);

        if (!node.children || !state.expanded.has(node.id)) {
          node._subtreeH = node._h;
          return node._subtreeH;
        }

        const childX = x + NODE_W + H_GAP;
        let totalH = 0;
        node.children.forEach((child) => {
          totalH += computeLayout(child, level + 1, childX, 0);
          totalH += V_GAP;
        });
        totalH -= V_GAP;

        let cy = y + node._h / 2 - totalH / 2;
        node.children.forEach((child) => {
          const nextY = cy + child._subtreeH / 2 - child._h / 2;
          shiftSubtree(child, nextY - child._y);
          cy += child._subtreeH + V_GAP;
        });

        node._subtreeH = Math.max(node._h, totalH);
        return node._subtreeH;
      }

      // ─────────────────────────────────────────────
      // RENDER
      // ─────────────────────────────────────────────
      const canvas = document.getElementById("canvas");
      const svgLayer = document.getElementById("svg-layer");
      let nodeEls = {};

      function render() {
        computeLayout(DATA, 0, 100, 2000);
        renderNodes(DATA);
        renderConnectors(DATA);
      }

      function renderNodes(node) {
        let el = nodeEls[node.id];
        if (!el) {
          el = document.createElement("div");
          el.className = "node";
          el.dataset.id = node.id;
          el.innerHTML = buildNodeHTML(node);
          el.addEventListener("click", () => onNodeClick(node));
          canvas.appendChild(el);
          nodeEls[node.id] = el;
        }

        const levelClass =
          node._level === 0 ? "root" : `level-${Math.min(node._level, 3)}`;
        el.className = `node ${levelClass}${state.selected === node.id ? " selected" : ""}${state.expanded.has(node.id) ? " expanded" : ""}`;
        el.style.left = node._x + "px";
        el.style.top = node._y + "px";
        el.style.width = node._w + "px";
        el.style.minHeight = node._h + "px";
        el.style.display = "flex";

        if (node.children && state.expanded.has(node.id)) {
          node.children.forEach(renderNodes);
        }

        // Remove orphaned children
        if (!node.children || !state.expanded.has(node.id)) {
          collapseChildren(node);
        }
      }

      function buildNodeHTML(node) {
        const isParent = node.children && node.children.length > 0;
        const icon = isParent
          ? `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`
          : `<div class="leaf-dot"></div>`;
        return `<div class="node-text">${node.label}</div>${icon}`;
      }

      function collapseChildren(node) {
        if (!node.children) return;
        node.children.forEach((child) => {
          if (nodeEls[child.id]) {
            nodeEls[child.id].style.display = "none";
          }
          collapseChildren(child);
        });
      }

      function renderConnectors(node) {
        svgLayer.innerHTML = "";
        drawConnectors(node);
      }

      function drawConnectors(node) {
        if (!node.children || !state.expanded.has(node.id)) return;
        node.children.forEach((child) => {
          const x1 = node._x + node._w;
          const y1 = node._y + node._h / 2;
          const x2 = child._x;
          const y2 = child._y + child._h / 2;
          const cx1 = x1 + (x2 - x1) * 0.55;
          const cx2 = x2 - (x2 - x1) * 0.55;
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path.setAttribute("class", "connector");
          path.setAttribute(
            "d",
            `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`,
          );
          svgLayer.appendChild(path);
          drawConnectors(child);
        });
      }

      // ─────────────────────────────────────────────
      // INTERACTION
      // ─────────────────────────────────────────────
      function onNodeClick(node) {
        if (node.children && node.children.length > 0) {
          if (state.expanded.has(node.id)) {
            state.expanded.delete(node.id);
          } else {
            state.expanded.add(node.id);
          }
          state.selected = node.id;
          render();
        } else {
          state.selected = node.id;
          render();
          openPanel(node);
        }
      }

      function openPanel(node) {
        document.getElementById("panel-title").textContent = node.label;
        document.getElementById("panel-body").innerHTML =
          node.desc || `<p>No description available.</p>`;
        document.getElementById("panel").classList.add("open");
      }

      function closePanel() {
        document.getElementById("panel").classList.remove("open");
        state.selected = null;
        render();
      }

      // ─────────────────────────────────────────────
      // PAN & ZOOM
      // ─────────────────────────────────────────────
      const wrap = document.getElementById("canvas-wrap");

      function applyTransform() {
        canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
        document.getElementById("zoom-badge").textContent =
          Math.round(state.scale * 100) + "%";
      }

      wrap.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node")) return;
        state.dragging = true;
        state.dragStartX = e.clientX;
        state.dragStartY = e.clientY;
        state.dragStartPanX = state.panX;
        state.dragStartPanY = state.panY;
        wrap.classList.add("grabbing");
      });

      window.addEventListener("mousemove", (e) => {
        if (!state.dragging) return;
        state.panX = state.dragStartPanX + (e.clientX - state.dragStartX);
        state.panY = state.dragStartPanY + (e.clientY - state.dragStartY);
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        state.dragging = false;
        wrap.classList.remove("grabbing");
      });

      wrap.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.1 : -0.1;
          state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
          applyTransform();
        },
        { passive: false },
      );

      function zoom(delta) {
        state.scale = Math.max(0.2, Math.min(2.5, state.scale + delta));
        applyTransform();
      }

      function resetView() {
        state.panX = 0;
        state.panY = 0;
        state.scale = 1;
        applyTransform();
      }

      // ─────────────────────────────────────────────
      // EXPAND / COLLAPSE ALL
      // ─────────────────────────────────────────────
      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children) node.children.forEach((c) => collectIds(c, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => state.expanded.add(id));
        render();
      }

      function collapseAll() {
        state.expanded.clear();
        state.expanded.add("root");
        render();
      }

      // ─────────────────────────────────────────────
      // SEARCH
      // ─────────────────────────────────────────────
      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("search-results");

      function flatNodes(node, path = [], results = []) {
        results.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((c) =>
            flatNodes(c, [...path, node.label], results),
          );
        return results;
      }

      const allNodes = flatNodes(DATA);

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        // Clear highlights
        Object.values(nodeEls).forEach((el) =>
          el.classList.remove("highlighted"),
        );

        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = allNodes.filter(({ node }) =>
          node.label.toLowerCase().includes(q),
        );
        if (matches.length === 0) {
          searchResults.innerHTML =
            '<div class="sr-item" style="cursor:default;color:var(--text-muted)">No results found</div>';
          searchResults.style.display = "block";
          return;
        }

        searchResults.innerHTML = matches
          .slice(0, 10)
          .map(({ node, path }) => {
            const hl = node.label.replace(
              new RegExp(`(${q})`, "gi"),
              "<mark>$1</mark>",
            );
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${hl}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");

        searchResults.querySelectorAll(".sr-item[data-id]").forEach((el) => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            navigateTo(id);
            searchResults.style.display = "none";
            searchInput.value = "";
          });
        });

        matches.forEach(({ node }) => {
          if (nodeEls[node.id]) nodeEls[node.id].classList.add("highlighted");
        });

        searchResults.style.display = "block";
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      function navigateTo(id) {
        // Expand path to node
        function findPath(node, targetId, path = []) {
          if (node.id === targetId) return [...path, node.id];
          if (node.children) {
            for (const c of node.children) {
              const r = findPath(c, targetId, [...path, node.id]);
              if (r) return r;
            }
          }
          return null;
        }
        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => state.expanded.add(pid));
        state.selected = id;
        render();
        // Center on node
        setTimeout(() => {
          function findNode(node, id) {
            if (node.id === id) return node;
            if (node.children)
              for (const c of node.children) {
                const r = findNode(c, id);
                if (r) return r;
              }
            return null;
          }
          const n = findNode(DATA, id);
          if (n) {
            const vpW = wrap.clientWidth;
            const vpH = wrap.clientHeight;
            state.panX = vpW / 2 - (n._x + n._w / 2) * state.scale;
            state.panY = vpH / 2 - (n._y + n._h / 2) * state.scale;
            applyTransform();
          }
        }, 100);
      }

      // ─────────────────────────────────────────────
      // THEME
      // ─────────────────────────────────────────────
      const themeBtn = document.getElementById("theme-toggle");
      let isDark = true;

      function applyTheme(dark) {
        document.body.dataset.theme = dark ? "dark" : "light";
        themeBtn.textContent = dark ? "🌙" : "☀️";
        localStorage.setItem("mm-theme", dark ? "dark" : "light");
        try {
          localStorage.setItem("shoug-theme", dark ? "dark" : "light");
        } catch (_e) {}
      }

      themeBtn.addEventListener("click", () => {
        isDark = !isDark;
        applyTheme(isDark);
      });

      // Restore
      const saved =
        localStorage.getItem("shoug-theme") || localStorage.getItem("mm-theme");
      if (saved === "light") {
        isDark = false;
        applyTheme(false);
      }

      // ─────────────────────────────────────────────
      // EXPORT — LANDSCAPE PDF (every node expanded)
      // ─────────────────────────────────────────────
      const PRINT_PAGE_W = 1520; // A3 landscape content box @96dpi
      const PRINT_PAGE_H = 1050;
      const PRINT_ACCENTS = [
        "#0969da",
        "#1a7f37",
        "#a40e26",
        "#bc4c00",
        "#cf222e",
        "#0550ae",
      ];

      function psEscape(text) {
        const d = document.createElement("div");
        d.textContent = text == null ? "" : String(text);
        return d.innerHTML;
      }

      function psDesc(html) {
        const d = document.createElement("div");
        d.innerHTML = html || "";
        const tag = d.querySelector(".panel-tag");
        if (tag) tag.remove();
        return d.textContent.replace(/\s+/g, " ").trim();
      }

      function psLeaves(nodes) {
        return (nodes || [])
          .map((node) => {
            const text = psDesc(node.desc) || node.label;
            if (node.children && node.children.length) {
              // A grouping node (e.g. "Examples") keeps its own label as a
              // heading so the nesting still reads on paper.
              return (
                `<li class="ps-leaf ps-group"><span class="ps-leaf-label">${psEscape(node.label)}</span>` +
                `<ul class="ps-sub">${psLeaves(node.children)}</ul></li>`
              );
            }
            return `<li class="ps-leaf">${psEscape(text)}</li>`;
          })
          .join("");
      }

      function printKicker() {
        const parts = document.title
          .split("—")
          .map((s) => s.trim())
          .filter(Boolean);
        return (
          parts.find((p) => /[A-Z]{2,4}\s?\d{3}|chapter/i.test(p)) ||
          parts[parts.length - 1] ||
          ""
        );
      }

      function buildPrintSheet() {
        const old = document.getElementById("print-sheet");
        if (old) old.remove();

        const cards = (DATA.children || [])
          .map((branch, i) => {
            const color = PRINT_ACCENTS[i % PRINT_ACCENTS.length];
            const intro = psDesc(branch.desc);
            return `<section class="ps-card" style="--c:${color}">
                    <div class="ps-card-head">
                        <span class="ps-num">${String(i + 1).padStart(2, "0")}</span>
                        <h2 class="ps-branch">${psEscape(branch.label)}</h2>
                    </div>
                    ${intro ? `<p class="ps-branch-desc">${psEscape(intro)}</p>` : ""}
                    <ul class="ps-leaves">${psLeaves(branch.children)}</ul>
                </section>`;
          })
          .join("");

        const sheet = document.createElement("div");
        sheet.id = "print-sheet";
        sheet.innerHTML = `<div id="print-inner">
                <header class="ps-head">
                    <div>
                        <div class="ps-kicker">${psEscape(printKicker())}</div>
                        <h1 class="ps-title">${psEscape(DATA.label)}</h1>
                    </div>
                    <div class="ps-meta">Full mindmap — all branches expanded</div>
                </header>
                <div class="ps-grid">${cards}</div>
                <div class="ps-foot"><span>Made by Shoug Alomran</span><span>shoug-tech.com</span></div>
            </div>`;
        document.body.appendChild(sheet);
        return sheet;
      }

      async function exportPDF() {
        expandAll();
        const sheet = buildPrintSheet();
        const inner = sheet.querySelector("#print-inner");

        // Measure off-screen, then binary-search the largest scale that still
        // fits one landscape page — sparse maps grow, dense ones shrink.
        sheet.classList.add("measuring");
        try {
          await document.fonts.ready;
        } catch (_e) {}
        await new Promise((r) => requestAnimationFrame(r));

        const fits = (s) => {
          inner.style.transform = "none";
          inner.style.width = PRINT_PAGE_W / s + "px";
          return inner.scrollHeight <= PRINT_PAGE_H / s;
        };

        let lo = 0.45,
          hi = 1.75;
        if (!fits(lo))
          hi = lo; // even the floor overflows: accept it
        else if (fits(hi)) lo = hi;
        else {
          for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            if (fits(mid)) lo = mid;
            else hi = mid;
          }
        }
        const onePage = fits(lo); // false only if even the floor overflows
        inner.style.width = PRINT_PAGE_W / lo + "px";
        inner.style.transform = `scale(${lo})`;
        sheet.classList.toggle("one-page", onePage);
        sheet.classList.remove("measuring");

        window.addEventListener("afterprint", () => sheet.remove(), {
          once: true,
        });
        window.print();
      }

      // ─────────────────────────────────────────────
      // INIT
      // ─────────────────────────────────────────────
      function init() {
        render();
        // Center on the root: the layout puts it at a fixed y, so a
        // hard-coded pan clips the first branch as soon as a map has
        // more branches than the page this template came from.
        state.panX = 40;
        state.panY = wrap.clientHeight / 2 - (DATA._y + DATA._h / 2);
        applyTransform();
      }

      init();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
  </body>
</html>
