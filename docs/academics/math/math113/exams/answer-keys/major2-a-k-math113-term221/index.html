<!doctype html>
<html lang="en" data-sg-styled>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MATH113 | Model answers · Major 2 · Fall 2022 · Term 221</title>
    <meta
      name="description"
      content="Scanned model answer pages for Model answers · Major 2 · Fall 2022 · Term 221."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700;800&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"
    />
    <link rel="stylesheet" href="/styles/cs223-exam.css" />
    <script>
      (function () {
        var r = document.documentElement;
        function apply() {
          var t = null;
          try {
            t =
              localStorage.getItem("shoug-theme") ||
              localStorage.getItem("theme");
          } catch (e) {}
          if (t !== "light" && t !== "dark") {
            try {
              if (parent !== window)
                t = parent.document.body.classList.contains("shoug-light-mode")
                  ? "light"
                  : "dark";
            } catch (e) {}
          }
          if (t === "light" || t === "dark") {
            r.setAttribute("data-theme", t);
            r.style.colorScheme = t;
          }
        }
        apply();
        window.addEventListener("storage", apply);
        document.addEventListener("DOMContentLoaded", apply);
        window.addEventListener("load", apply);
      })();
    </script>
    <script src="/javascripts/standalone-theme.js"></script>
    <script src="/javascripts/html-theme-sync.js"></script>
    <link rel="stylesheet" href="/styles/site-shell.css" />
    <script defer src="/javascripts/site-palette.js"></script>
    <style>
      .ex-shell {
        max-width: none;
        width: 100%;
      }
      .ex-head {
        padding: clamp(28px, 4vw, 56px) 0 clamp(28px, 4vw, 52px);
      }
      .ex-head-top {
        margin-bottom: 18px;
      }
      .ex-head h1 {
        margin: 14px 0;
      }
      .ex-lede {
        margin: 0 0 18px;
      }
      .ex-meta {
        gap: 10px 12px;
        margin: 18px 0 0;
      }
      .ex-head .ex-search {
        width: max-content;
        max-width: 100%;
        margin-top: 24px;
      }
      .ex-head .sg-page-search {
        width: max-content !important;
        max-width: 100% !important;
      }
      .ex-bar {
        gap: 14px 20px;
        padding-top: 16px;
        padding-bottom: 16px;
      }
      .ex-progress {
        min-width: 220px;
      }
      .ex-actions {
        gap: 10px;
        margin-left: auto;
      }
      .ex-section {
        margin-top: 38px;
      }
      .math-q-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 640px), 1fr));
        gap: 26px;
        align-items: start;
        margin-top: 26px;
      }
      .math-q-grid .ex-part {
        margin: 0;
        min-width: 0;
        animation: mathExamIn 0.48s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        animation-delay: calc(var(--i, 0) * 38ms);
      }
      @keyframes mathExamIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .math-question-scan-inline {
        display: block;
        width: 100%;
        height: auto;
        max-height: 1100px;
        object-fit: contain;
        object-position: top center;
        margin: 8px auto 0;
        border: 1px solid var(--line-strong);
        background: var(--surface-2);
      }
      .math-scan-label {
        font: 700 0.7rem var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .ex-answer {
        margin-top: 18px;
      }
      .ex-selfmark {
        gap: 10px;
        margin-top: 18px;
      }
      .model-key-archive {
        margin: 30px 0;
        padding: 20px;
        border: 1px solid var(--brand-line);
        background: var(--surface);
      }
      .model-key-archive > summary {
        cursor: pointer;
        color: var(--brand);
        font: 700 0.8rem var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .model-key-page {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px dashed var(--line-strong);
      }
      .model-key-page h3 {
        font: 700 0.72rem var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      html[data-theme="light"] .sg-page-search {
        background: var(--surface) !important;
        color: var(--text) !important;
        border-color: var(--line-strong) !important;
      }
      html[data-theme="light"] .sg-page-search__input {
        background: var(--surface-2) !important;
        color: var(--text) !important;
        border-color: var(--line-strong) !important;
      }
      html[data-theme="light"] .sg-page-search__input::placeholder {
        color: var(--muted) !important;
      }
      html[data-theme="light"] .sg-page-search__count {
        color: var(--muted) !important;
      }
      html[data-theme="light"] .sg-page-search__button {
        background: var(--surface-2) !important;
        color: var(--text) !important;
        border-color: var(--line-strong) !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .math-q-grid .ex-part {
          animation: none;
        }
      }
      @media (max-width: 760px) {
        .ex-head {
          padding: 24px 0 30px;
        }
        .ex-actions {
          margin-left: 0;
        }
        .math-q-grid {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .ex-bar {
          gap: 12px;
        }
      }
      @media (max-width: 600px) {
        .math-q-grid {
          grid-template-columns: 1fr;
        }
        .ex-part-head {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main class="ex-shell">
      <header class="ex-head">
        <div class="ex-kicker">MATH113 // MODEL ANSWERS</div>
        <h1>Model answers · Major 2 · Fall 2022 · Term 221</h1>
        <p class="ex-lede">
          Model answer scan pages, shown directly with the cover sheet omitted.
        </p>
      </header>
      <section class="ex-section">
        <article class="model-key-page">
          <h2>Answer page 1</h2>
          <img
            class="math-question-scan-inline"
            src="/academics/math/math113/exams/page-images/major2-a-k-math113-term221/page-2.jpg"
            alt="Model answers · Major 2 · Fall 2022 · Term 221 answer page 2 — page 1"
            loading="lazy"
          />
        </article>
        <article class="model-key-page">
          <h2>Answer page 2</h2>
          <img
            class="math-question-scan-inline"
            src="/academics/math/math113/exams/page-images/major2-a-k-math113-term221/page-3.jpg"
            alt="Model answers · Major 2 · Fall 2022 · Term 221 answer page 3 — page 1"
            loading="lazy"
          />
        </article>
        <article class="model-key-page">
          <h2>Answer page 3</h2>
          <img
            class="math-question-scan-inline"
            src="/academics/math/math113/exams/page-images/major2-a-k-math113-term221/page-4.jpg"
            alt="Model answers · Major 2 · Fall 2022 · Term 221 answer page 4 — page 1"
            loading="lazy"
          />
        </article>
      </section>
    </main>
  </body>
</html>
