    <script>
      // DATA based on STAT101 Chapter 8 (Groebner, Shannon & Fry, Business Statistics, 10th ed.)
      const DATA = {
        id: "est_root",
        label: "Estimating Single Population Parameters",
        level: 0,
        children: [
          {
            id: "sec81",
            label: "8.1 Confidence Interval for a Population Mean",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "point_estimate",
                label: "Point Estimate",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Definition</h4><p>A <strong>point estimate</strong> is a single statistic, determined from a sample, that is used to estimate the corresponding population parameter (e.g., x̄ estimates μ, p̄ estimates p).</p><h4>The Problem With Point Estimates</h4><p>Point estimates are subject to <strong>sampling error</strong> — they are almost always at least a little bit wrong, because a different sample would almost certainly give a different x̄. A single number gives no sense of how far off it might be. This is exactly why we build confidence intervals instead of reporting a bare point estimate.</p>",
              },
              {
                id: "ci_definition",
                label: "Confidence Interval — Definition",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Definition</h4><p>A <strong>confidence interval estimate</strong> is an interval developed from a statistical sample such that, if all possible intervals of a given width were constructed, a percentage of these intervals — the <strong>confidence level</strong> — would include the true population parameter.</p><p>Every confidence interval has the same skeleton: <strong>Lower Confidence Limit ← Point Estimate → Upper Confidence Limit</strong>.</p>",
              },
              {
                id: "confidence_meaning",
                label: 'What "95% Confidence" Actually Means',
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Exam Trap</h4><p>It does NOT mean "there\'s a 95% chance μ is in this particular interval." μ is a fixed (if unknown) number — it either is or isn\'t in the interval, with no probability about it.</p><p>It means: "if we repeated this sampling process many times and built an interval each time, 95% of those intervals would capture the true μ." Always describe the confidence level as a property of the <em>procedure</em>, not of one specific interval.</p>',
              },
              {
                id: "general_ci_format",
                label: "General CI Format",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Formula</h4><p><strong>Point Estimate ± (Critical Value) × (Standard Error)</strong></p><p>Every confidence interval formula in this chapter is a variation on this same idea — only the specific point estimate and standard error change depending on whether you're estimating a mean or a proportion.</p>",
              },
              {
                id: "ci_mean_formula",
                label: "CI for a Mean (σ known)",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Formula</h4><p><strong>x̄ ± z · (σ / √n)</strong></p><p>where x̄ = sample mean, z = critical value from the standard normal table, σ = population standard deviation, n = sample size. The quantity σ/√n is the <strong>standard error of the mean</strong>.</p>",
              },
              {
                id: "critical_value_table",
                label: "Critical Value Table",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>Critical Values (z)</h4><p>80% confidence → z = 1.28</p><p>90% confidence → z = 1.645</p><p>95% confidence → z = 1.96</p><p>99% confidence → z = 2.575</p><h4>Why It Gets Bigger</h4><p>Higher confidence (99% vs 90%) means you want to "catch" the true parameter more often, so you need a wider net — a bigger z-value, and therefore a wider interval.</p><p>Critical values can be found using the standard normal table or Excel\'s NORM.S.INV function.</p>',
              },
              {
                id: "example_credit_card",
                label: "Worked Example — Credit Card Balances",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Problem</h4><p>Population distribution of credit card balances is normal with σ = $400. Construct a 95% confidence interval for μ if a random sample of n = 100 accounts has x̄ = $2,000.</p><h4>Solution</h4><p><strong>Step 1:</strong> x̄ = 2000, σ = 400, n = 100, z = 1.96.</p><p><strong>Step 2 — Standard error:</strong> σ/√n = 400/√100 = 40.</p><p><strong>Step 3 — Margin of error:</strong> e = 1.96 × 40 = 78.40.</p><p><strong>Step 4 — CI:</strong> 2000 ± 78.40 → [$1,921.60, $2,078.40].</p><p><strong>Interpretation:</strong> With 95% confidence, the population mean balance is between $1,921.60 and $2,078.40.</p>",
              },
              {
                id: "example_work_hours",
                label: "Worked Example — Student Work Hours",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Problem</h4><p>Hours worked by students is normally distributed with σ = 5 hours. Construct a 90% CI for the mean hours worked if a random sample of 64 students has x̄ = 23 hours.</p><h4>Solution</h4><p><strong>Step 1:</strong> x̄ = 23, σ = 5, n = 64, z = 1.645.</p><p><strong>Step 2 — Standard error:</strong> 5/√64 = 5/8 = 0.625.</p><p><strong>Step 3 — Margin of error:</strong> e = 1.645 × 0.625 ≈ 1.03.</p><p><strong>Step 4 — CI:</strong> 23 ± 1.03 → [21.97, 24.03] hours.</p><p><strong>Interpretation:</strong> With 90% confidence, the mean hours worked by all students is between 21.97 and 24.03 hours.</p>",
              },
              {
                id: "confidence_sample_size_effects",
                label: "Effect of Confidence Level & Sample Size",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Effect of Confidence Level (fixed n)</h4><p>Using x̄=23, σ=5, n=64: a 90% CI is narrowest, 95% is wider, 99% is widest. Increasing the confidence level increases the margin of error, because a bigger z-value is needed to "guarantee" catching μ more often.</p><h4>Effect of Sample Size (fixed confidence)</h4><p>Using x̄=2000, σ=400, 95% confidence: as n grows from 100 → 200 → 400, the interval gets narrower, because σ/√n shrinks as n grows.</p><h4>Conflicting Objectives</h4><p>You generally want: (1) a small margin of error, (2) high confidence, and (3) a small sample size — but these conflict. Shrinking the margin of error while keeping confidence high requires a larger sample.</p>',
              },
              {
                id: "mean_ci_mistake",
                label: "Common Mistake: Forgetting to Divide by √n",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  "<h4>Common Mistake</h4><p>Students often forget to divide σ by √n before multiplying by z — i.e., they compute z·σ instead of z·(σ/√n). Always compute the standard error (σ/√n) as its own step first, then multiply by the critical value to get the margin of error, and only then apply it to x̄.</p>",
              },
            ],
          },
          {
            id: "sec82",
            label: "8.2 Determining Required Sample Size",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "sample_size_idea",
                label: "The Idea — Flipping the Question",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>The Idea</h4><p>Section 8.1 assumed the sample size n was already fixed and asked "how wide is my interval?" Section 8.2 flips the question around: <strong>before</strong> collecting any data, a researcher decides how small they want the margin of error to be (and how confident they want to be), and then solves for the minimum sample size n needed to achieve that.</p>',
              },
              {
                id: "sample_size_formula",
                label: "Required Sample Size Formula",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Formula</h4><p><strong>n = (z · σ / e)²</strong></p><p>where z = critical value for the desired confidence level, σ = population standard deviation (or a reasonable estimate), e = the desired margin of error.</p><h4>Where It Comes From</h4><p>It's just the margin-of-error formula e = z·(σ/√n) solved for n: multiply both sides by √n, divide by e, then square: √n = z·σ/e → n = (z·σ/e)².</p><p><strong>Always round n UP</strong> to the next whole number — even n = 100.02 requires n = 101, because a fractional sample size doesn't exist and rounding down would under-shoot your target precision.</p>",
              },
              {
                id: "example_bank_balance",
                label: "Worked Example — Bank Checking Balance",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Problem</h4><p>A bank wants to estimate the average checking account balance. Population standard deviation is believed to be σ = $300. The bank wants 95% confidence that the sample mean is within e = $50 of the true mean. How large a sample is required?</p><h4>Solution</h4><p><strong>Step 1:</strong> z = 1.96, σ = 300, e = 50.</p><p><strong>Step 2:</strong> n = (1.96 × 300 / 50)² = (11.76)² = 138.2976.</p><p><strong>Step 3 — Round UP:</strong> n = 139.</p><p><strong>Interpretation:</strong> The bank needs a random sample of at least 139 customers to be 95% confident the sample mean is within $50 of the true population mean balance.</p>",
              },
              {
                id: "round_up_mistake",
                label: "Common Mistake: Rounding Down",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  "<h4>Common Mistake</h4><p>Never round the required sample size DOWN, even if the decimal is tiny (e.g., n = 138.02 still becomes 139, not 138). Rounding down would give a sample slightly too small to guarantee the requested margin of error at the requested confidence level.</p>",
              },
            ],
          },
          {
            id: "sec83",
            label: "8.3 Confidence Interval for a Population Proportion",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "proportion_idea",
                label: "From Means to Proportions",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>The Idea</h4><p>Sections 8.1–8.2 dealt with a population <strong>mean</strong> (a quantitative measure, like dollars or hours). Section 8.3 applies the same logic to a population <strong>proportion</strong> p — the fraction of a population with some categorical characteristic (e.g., proportion of customers who are "satisfied," or proportion of parts that are defective). The sample proportion p̄ is the point estimate of p.</p><h4>Sample Proportion Formula</h4><p><strong>p̄ = (number of items with the characteristic) / n</strong></p>',
              },
              {
                id: "proportion_ci_formula",
                label: "CI Formula for a Proportion",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Formula</h4><p><strong>p̄ ± z · √( p̄(1 − p̄) / n )</strong></p><p>where p̄ = sample proportion, z = critical value for the desired confidence level, n = sample size. The quantity √(p̄(1−p̄)/n) is the <strong>standard error of the proportion</strong>.</p>",
              },
              {
                id: "proportion_z_stat",
                label: "Z-Statistic for a Proportion",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Formula</h4><p><strong>z = (p̄ − p) / √( p(1 − p) / n )</strong></p><p>This is the proportion analog of z = (x̄ − μ)/(σ/√n) — it standardizes how far a sample proportion is from a hypothesized population proportion p, in standard-error units.</p>",
              },
              {
                id: "example_defective_parts",
                label: "Worked Example — Defective Parts",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Problem</h4><p>A quality manager samples n = 250 parts and finds 20 are defective. Construct a 95% confidence interval for the true proportion of defective parts.</p><h4>Solution</h4><p><strong>Step 1 — Point estimate:</strong> p̄ = 20/250 = 0.08.</p><p><strong>Step 2 — Standard error:</strong> √(0.08 × 0.92 / 250) ≈ 0.01716.</p><p><strong>Step 3 — Margin of error:</strong> e = 1.96 × 0.01716 ≈ 0.0336.</p><p><strong>Step 4 — CI:</strong> 0.08 ± 0.0336 → [0.0464, 0.1136], i.e., about 4.6% to 11.4%.</p><p><strong>Interpretation:</strong> With 95% confidence, the true proportion of defective parts is between about 4.6% and 11.4%.</p>",
              },
              {
                id: "proportion_sample_size_formula",
                label: "Required Sample Size for a Proportion",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Formula</h4><p><strong>n = p̄(1 − p̄) · (z / e)²</strong></p><p>Derived the same way as the mean version, using p̄(1−p̄) in place of σ². If no estimate of p̄ is available, using p̄ = 0.5 gives the most conservative (largest) required sample size, since p̄(1−p̄) is maximized at p̄ = 0.5 (0.25).</p>",
              },
              {
                id: "mean_proportion_mirror",
                label: "Mean Formulas vs Proportion Formulas",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Side-by-Side Comparison</h4><p>Every formula for a proportion mirrors the mean version with p̄(1−p̄) standing in for σ²:</p><p>Standard error: σ/√n ↔ √(p̄(1−p̄)/n)</p><p>Margin of error: z·(σ/√n) ↔ z·√(p̄(1−p̄)/n)</p><p>Z-statistic: (x̄−μ)/(σ/√n) ↔ (p̄−p)/√(p(1−p)/n)</p><p>If you memorize the mean formulas well, the proportion formulas are "free" — just swap the variance term.</p>',
              },
              {
                id: "proportion_mistake",
                label: "Common Mistake: Confusing σ with p̄(1−p̄)/n",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  "<h4>Common Mistake</h4><p>Don't confuse σ (population standard deviation of a quantitative variable) with the proportion's standard error term √(p̄(1−p̄)/n) — a proportion problem never has a given \"σ\" to plug in; the variability is built into p̄(1−p̄) itself.</p><p>Also, a proportion must always be between 0 and 1 (or 0–100%) — if your confidence interval math produces a bound below 0 or above 1, double check your arithmetic.</p>",
              },
            ],
          },
        ],
      };

      let nodes = {},
        expanded = new Set(["est_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "est_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {
        let nd = nodes[id];
        document.getElementById("ptitle").innerHTML = nd.label.replace(
          /\n/g,
          " ",
        );
        let tagDiv = document.getElementById("ptag");
        let tagMap = {
          concept: "CONCEPT",
          formula: "FORMULA",
          example: "EXAMPLE",
          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content || "<p>Core concept from STAT101 Chapter 8.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("est_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
