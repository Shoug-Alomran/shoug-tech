    <script>
      // DATA based on STAT101 Chapter 1 (Groebner, Shannon & Fry, Business Statistics, 10th ed.)
      const DATA = {
        id: "data_root",
        label: "Data Collection",
        level: 0,
        children: [
          {
            id: "sec11",
            label: "1.1 What is Business Statistics?",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "biz_stats_def",
                label: "Business Statistics Definition",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Definition</h4><p><strong>Business statistics</strong> is a collection of procedures and techniques used to convert data into meaningful information in a business environment.</p><p>The flow is always: <strong>Data → Statistical Procedures (Descriptive or Inferential) → Information.</strong></p><h4>Variables and Observations</h4><p>A data set is organized like a spreadsheet: <strong>variables</strong> are the columns (each a characteristic being measured, e.g., Units Sold), and <strong>observations</strong> are the rows (each one item/subject the data was collected on).</p>",
              },
              {
                id: "descriptive_vs_inferential",
                label: "Descriptive vs Inferential",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Descriptive Statistics</h4><p>Procedures and techniques designed to <strong>describe</strong> data that you already have — summarizing it with charts, graphs, tables, or numerical measures like the average, with no generalizing beyond it.</p><h4>Inferential Statistics</h4><p>Tools and techniques that help decision makers <strong>draw inferences</strong> from a sample about a larger population. It has two flavors: <strong>estimation</strong> (e.g., estimating average family income from a sample) and <strong>hypothesis testing</strong> (e.g., testing a claim that income exceeds $45,000).</p>",
              },
              {
                id: "beyond_data_test",
                label: 'The "Beyond the Data" Test',
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Exam Tip</h4><p>Ask yourself: "Is the conclusion limited strictly to the data in front of me, or am I making a claim about something bigger than what I measured?" If it stays within the data → descriptive. If it reaches beyond the sample to the population → inferential.</p><h4>Worked Example</h4><p><strong>Scenario A:</strong> A store manager creates a bar chart of monthly sales by department → <strong>descriptive</strong> (only summarizes data already collected).</p><p><strong>Scenario B:</strong> A pollster surveys 500 of 2 million registered voters and estimates what percentage of ALL voters support a candidate → <strong>inferential</strong> (a sample statistic is used to infer something about the whole population).</p>',
              },
              {
                id: "formula_not_inferential",
                label: 'Common Mistake: "Formula = Inferential"?',
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Common Mistake</h4><p>Students often think "using a formula" automatically means inferential statistics. Not true — computing an average, a percentage, or drawing a chart is still <strong>descriptive</strong>, even though it uses a formula. What makes something inferential is generalizing from a sample to a population, not the mere presence of arithmetic.</p>',
              },
            ],
          },
          {
            id: "sec12",
            label: "1.2 Data Collection Methods",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "experiments",
                label: "Experiments",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Definition</h4><p>An <strong>experiment</strong> is a process that produces a single outcome whose result cannot be predicted with certainty. An <strong>experimental design</strong> is a plan for performing an experiment in which the variable of interest is defined, specifying ahead of time what will be measured and how conditions will be controlled.</p><h4>Worked Example — French Fry Experiment</h4><p>A food-science team tests how blanching time (10, 15, 20, 25 min), blanching temperature (100°, 110°, 120°), and potato category (1–4) affect fry quality, running controlled trials for every combination. This is an experiment because researchers actively control input conditions rather than just observing natural behavior.</p><p><strong>Advantages:</strong> provides controls, preplanned objectives. <strong>Disadvantages:</strong> costly, time-consuming, requires planning.</p>",
              },
              {
                id: "telephone_surveys",
                label: "Telephone Surveys",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Overview</h4><p>Typical applications: political polls, market research, customer satisfaction studies, healthcare studies. <strong>Advantages:</strong> timely, relatively inexpensive. <strong>Disadvantages:</strong> poor reputation (people screen calls/don\'t answer), limited scope and length, requires trained callers.</p><h4>Major Steps</h4><p>Define the Issue → Define the Population of Interest → Develop Survey Questions → Pretest the Survey → Determine Sample Size and Sampling Method → Select Sample and Make Calls.</p><h4>Question Types</h4><p><strong>Closed-End Questions</strong> require selecting from a defined list (e.g., "preferred rental car company?"). <strong>Demographic Questions</strong> ask about respondent characteristics (e.g., gender, age).</p>',
              },
              {
                id: "written_questionnaires",
                label: "Written Questionnaires",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Overview</h4><p>Must be carefully formatted with a motivational statement of purpose; can more easily allow open-ended questions; less expensive than phone surveys. <strong>Advantages:</strong> standardized questions, electronic capture if online, allows more questions. <strong>Disadvantages:</strong> low response rate (5–10%), responses may not be timely, no chance to clarify.</p><h4>Major Steps</h4><p>Define the Issue → Define the Population of Interest → Design the Survey Instrument → Pretest the Survey → Determine Sample Size and Sampling Method → Select Sample and Send Surveys.</p><h4>Open-End Question Example</h4><p>"Under what circumstances would you favor a reduction in the capital gains tax rate?" — respondents answer in their own words, unlike a closed-end question.</p><p><strong>Typical applications:</strong> employee surveys, course/professor evaluations, customer satisfaction studies, academic research.</p>',

                    level: 3,
                    tag: "formula",
                    leaf: true,
                    content:
                      '<h4>Definition</h4><p>Decide sample size n; divide the ordered population of N individuals into groups of k individuals where <strong>k = N/n</strong>; randomly pick one individual from the first group, then take every k-th individual after that.</p><h4>Formula</h4><p><strong>k = N / n</strong> — where N = population size, n = desired sample size, k = the sampling interval ("select every k-th item").</p><h4>Worked Example</h4><p>A population has N = 64 people and we want a sample of n = 8. Then k = 64/8 = 8. We randomly pick one person from the first group of 8 (say, person #3), then take every 8th person after that: #3, #11, #19, #27, #35, #43, #51, #59.</p>',

          {

                id: "quant_vs_qual",

                level: 2,

                content:
                  "<h4>Quantitative Data</h4><p>Measurements whose values are inherently numerical. Splits into: <strong>Discrete</strong> — countable, gaps between possible values, no in-between values (e.g., number of children); <strong>Continuous</strong> — infinitely many possible values, no gaps (e.g., weight, volume).</p><h4>Qualitative Data</h4><p>Data whose measurement scale is inherently categorical (e.g., marital status, political affiliation, eye color).</p>",

      let nodes = {},
        expanded = new Set(["data_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "data_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {
        let nd = nodes[id];
        document.getElementById("ptitle").innerHTML = nd.label.replace(
          /\n/g,
          " ",
        );
        let tagDiv = document.getElementById("ptag");
        let tagMap = {
          concept: "CONCEPT",
          formula: "FORMULA",
          example: "EXAMPLE",
          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content || "<p>Core concept from STAT101 Chapter 1.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("data_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
