    <script>
      // DATA based on STAT101 Chapter 7: Introduction to Sampling Distributions
      const DATA = {
        id: "stat7_root",
        label: "Sampling Distributions",
        level: 0,
        children: [
          {
            id: "sec71",
            label: "7.1 Sampling Error",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "sampling_error",
                label: "Sampling Error vs. Non-Sampling Error",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Sampling Error</h4><p><strong>Sampling error</strong> is the difference between a measure computed from a sample (a statistic) and the corresponding measure from the population (a parameter): x̄ − μ for means, p̄ − p for proportions. It happens purely because of <em>which particular sample</em> was randomly selected — it is <strong>not</strong> a mistake.</p><h4>Non-Sampling Error</h4><p>Comes from mistakes in the data collection process itself (bad wording, non-response bias, data entry errors, a broken measuring instrument) and CAN be avoided with better survey/experiment design. If an exam question asks why a sample mean differed from the population mean assuming the survey was conducted correctly, the answer is sampling error.</p><p><strong>Big picture:</strong> if you took 200 different random samples and plotted a histogram of the sample means, you would get a bell-shaped sampling distribution centered near μ, with less spread than the raw population — and larger samples produce sampling distributions with even less variability.</p>",
              },
            ],
          },
          {
            id: "sec72",
            label: "7.2 Sampling Distribution of the Mean",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "clt",
                label: "The Central Limit Theorem",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Theorem 4: The Central Limit Theorem (CLT)</h4><p>The most important idea in this chapter. For simple random samples of n observations from a population with mean μ and standard deviation σ, <strong>regardless of the shape of the population\'s distribution</strong>, provided the sample size is large enough, the distribution of the sample means x̄ is <strong>approximately normal</strong> with:</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">μ_x̄ = μ<br>σ_x̄ = σ / √n</p><p>Even if the population is uniform, skewed, or oddly shaped, sample means pile up into a bell curve once n is big enough. This lets us use normal-distribution math (z-scores, the standard normal table) for the sample mean regardless of the population\'s shape.</p><p><strong>How large is "large enough"?</strong> A safe rule used throughout this course: <strong>if n ≥ 30</strong>, treat the sampling distribution of x̄ as approximately normal no matter what the population looks like. (If the population is already stated to be normal, the normal-based z formula works for any n, even n &lt; 30 — that\'s Theorem 3, not the CLT.)</p>',
              },
              {
                id: "z_mean_formula",
                label: "z-Score for a Sample Mean",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>Standardizing a Sample Mean</h4><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">z = (x̄ − μ) / (σ / √n)</p><p>σ/√n is the <strong>standard error of the mean</strong> — the standard deviation of the sampling distribution, NOT the raw population standard deviation.</p><h4>Spotting sample-mean wording</h4><p>"the mean of a sample of n observations," "a random sample of size n," "the average of n items" → use σ/√n. If the question is about a single individual measurement with no averaging language, use the raw σ (an ordinary normal-distribution problem, not a sampling-distribution one).</p>',
              },
              {
                id: "z_mean_example",
                label: "Worked Example: French Fry Length",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>P(x̄ Exceeds a Value)</h4><p>French fry length is normal with μ = 4.0 in, σ = 1.0 in. Probability a sample of n = 100 fries has x̄ &gt; 4.10 in?</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">σ_x̄ = 1.0/√100 = 0.10<br>z = (4.10 − 4.0)/0.10 = 1.00</p><p>P(z &gt; 1.00) = 0.5000 − 0.3413 = <strong>0.1587</strong> (≈15.9%).</p><h4>P(x̄ Below a Value)</h4><p>Same population; probability x̄ &lt; 3.85 in for n = 100:</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">z = (3.85 − 4.0)/0.10 = −1.50</p><p>P(z &lt; −1.50) = 0.5000 − 0.4332 = <strong>0.0668</strong> (≈6.68%).</p>',
              },
              {
                id: "pitfall_sqrtn",
                label: "The Most Common CLT Mistake",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Forgetting to Divide by √n</h4><p>When standardizing a <em>sample mean</em>, you must use the <strong>standard error</strong> σ/√n in the denominator — NOT the raw population standard deviation σ by itself.</p><p>Using <strong>z = (x̄ − μ)/σ</strong> instead of <strong>z = (x̄ − μ)/(σ/√n)</strong> is the single most common error on Chapter 7 exams.</p><p><strong>Always ask:</strong> "am I working with one single observation x, or an average of a sample x̄?" If it\'s a sample mean, divide σ by √n first.</p>',
              },
            ],
          },
          {
            id: "sec73",
            label: "7.3 Sampling Distribution of a Proportion",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "proportion_basics",
                label: "Population vs. Sample Proportion",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>p vs. p̄</h4><p><strong>Population proportion (p):</strong> the fraction of values in a population with a specific attribute, p = X/N.</p><p><strong>Sample proportion (p̄):</strong> the fraction of items in a sample with the attribute, p̄ = x/n.</p><p>The best estimate of the true population proportion p is the sample proportion p̄. For a sufficiently large sample, the sampling distribution of p̄ is approximately normal with mean μ_p̄ = p and standard deviation σ_p̄ = √(p(1−p)/n).</p>",
              },
              {
                id: "np_nq_condition",
                label: "The np ≥ 5 and nq ≥ 5 Condition",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Checking "Sufficiently Large" for Proportions</h4><p>The rule of thumb for proportions is different from the CLT\'s n ≥ 30: we require <strong>np ≥ 5 AND nq ≥ 5</strong> (where q = 1 − p) before treating the sampling distribution of p̄ as approximately normal.</p><p><strong>Example check:</strong> p = 0.45, n = 120 → np = 54 ≥ 5 and nq = 66 ≥ 5, so the normal approximation is valid. If either check fails, the normal approximation for p̄ is not reliable.</p>',
              },
              {
                id: "z_prop_formula",
                label: "z-Score for a Sample Proportion",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>Standardizing a Sample Proportion</h4><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">z = (p̄ − p) / √( p(1 − p) / n )</p><p>Don\'t confuse this with the mean formula — the two sampling distributions (mean vs. proportion) have different standard-error formulas: σ/√n for the mean, √(p(1−p)/n) for a proportion.</p><h4>Spotting proportion wording</h4><p>"proportion/percentage/fraction who...", "x out of n have an attribute," yes/no or success/failure categorical data → use the proportion formula, not the mean formula.</p>',
              },
              {
                id: "z_prop_example",
                label: "Worked Examples: Debit Cards & Tax Returns",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>Retail Debit Card Usage</h4><p>True p = 0.60. A store samples n = 100 purchases, observes p̄ = 0.48. Find P(p̄ ≤ 0.48).</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">σ_p̄ = √((0.60)(0.40)/100) ≈ 0.049<br>z = (0.48 − 0.60)/0.049 = −0.77</p><p>P(z &lt; −0.77) = 0.5000 − 0.2794 = <strong>0.2206</strong> (≈22.1%).</p><h4>Fraudulent Tax Returns</h4><p>IRS believes p = 0.15. In n = 200, is it unusual to see more than 40 affected (p̄ = 40/200 = 0.20)?</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">σ_p̄ = √((0.15)(0.85)/200) = 0.025<br>z = (0.20 − 0.15)/0.025 = 1.98</p><p>P(z &gt; 1.98) = 0.5000 − 0.4761 = <strong>0.0239</strong> (≈2.4% — fairly unusual).</p>',
              },
            ],
          },
        ],
      };

      let nodes = {},
        expanded = new Set(["stat7_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "stat7_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {
        let nd = nodes[id];
        document.getElementById("ptitle").innerHTML = nd.label.replace(
          /\n/g,
          " ",
        );
        let tagDiv = document.getElementById("ptag");
        let tagMap = {
          concept: "CONCEPT",
          formula: "FORMULA",
          example: "EXAMPLE",
          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content || "<p>Core concept from STAT101 Chapter 7.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("stat7_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
