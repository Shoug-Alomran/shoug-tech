    <script>
      // DATA based on STAT101 Chapter 3 — Describing Data Using Numerical Measures
      const DATA = {
        id: "nm_root",
        label: "Numerical Measures",
        level: 0,
        children: [
          {
            id: "sec31",
            label: "3.1 Measures of Center & Location",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "param_stat",
                label: "Parameter vs. Statistic",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Parameter vs. Statistic</h4><p>A <strong>parameter</strong> is computed from the entire population (Greek letters: &mu;, &sigma;, &sigma;&sup2;) and is fixed. A <strong>statistic</strong> is computed from a sample (Roman letters: x&#772;, s, s&sup2;) and varies from sample to sample.</p><p>Every measure in this chapter has both a population version and a sample version — same idea, different notation, and for variance/std. dev. a different denominator too.</p>",
              },
              {
                id: "mean",
                label: "Mean (μ / x̄)",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>Population Mean</h4><p>&mu; = ( &Sigma; x ) / N</p><h4>Sample Mean</h4><p>x&#772; = ( &Sigma; x ) / n</p><p>The mean is the arithmetic average — the "balance point" of the data. The sum of deviations from the mean always equals zero: &Sigma;(x &minus; &mu;) = 0.</p>',
              },
              {
                id: "mean_example",
                label: "Worked Example: Sample Mean",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Sample Mean of Starting Salaries</h4><p>Data (n = 7): 39,000, 44,000, 46,000, 52,000, 56,000, 60,000, 61,000</p><p>x&#772; = 358,000 / 7 = <strong>$51,142.86 ≈ $51,143</strong></p><p>This same dataset is reused throughout the whole chapter for median, quartiles, variance, standard deviation, and z-scores.</p>",
              },
              {
                id: "mean_pitfall",
                label: 'Mean Is Not Always "Best"',
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Common Mistake: Assuming the Mean Is Always the Best Center</h4><p>The mean uses every data value, which is also its weakness: it is very sensitive to outliers. Add one NFL draft pick earning $2,300,000 to our 7 graduates and the mean explodes from $51,143 to $332,250 — even though 7 of 8 people still earn about $50,000.</p><p>One extreme value can make the mean meaningless as a "typical" value. This is exactly why the median exists.</p>',
              },
              {
                id: "median",
                label: "Median",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>The Median (Md)</h4><p>The middle value of a sorted data array. Splits the distribution exactly in half: 50% at or below, 50% at or above. Unlike the mean, it is <strong>not affected by extreme values</strong>.</p><p><strong>Step 1</strong> sort the data. <strong>Step 2</strong> compute index i = (n+1)/2. <strong>Step 3</strong> if n is odd, median = value at position (n+1)/2; if n is even, median = average of the two middle values.</p>",
              },
              {
                id: "median_example",
                label: "Worked Example: Median",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Median of Starting Salaries</h4><p>Sorted (n = 7, odd): 39,000, 44,000, 46,000, <strong>52,000</strong>, 56,000, 60,000, 61,000</p><p>Position = (7+1)/2 = 4th value → Md = <strong>$52,000</strong></p><p>Mean ($51,143) vs. median ($52,000) are very close — the sample is roughly symmetric with no outliers pulling the mean away.</p>",
              },
              {
                id: "median_pitfall",
                label: "Misapplying the Index Rule",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Common Mistake: Rounding the Wrong Way</h4><p>For medians and percentiles alike: compute the index i. If i is <strong>not</strong> an integer, round UP to the next highest integer and take that position. If i <strong>is</strong> an integer, the answer is the average of the values at position i and i+1.</p><p>Students often round to the "nearest" integer instead of always rounding up — that gives the wrong position whenever i has a decimal like .5 that would round down.</p>',
              },
              {
                id: "mode",
                label: "Mode",
                level: 2,
                tag: "concept",
                leaf: true,
                content:

      let nodes = {},
        expanded = new Set(["nm_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "nm_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {
        let nd = nodes[id];
        document.getElementById("ptitle").innerHTML = nd.label.replace(
          /\n/g,
          " ",
        );
        let tagDiv = document.getElementById("ptag");
        let tagMap = {
          concept: "CONCEPT",
          formula: "FORMULA",
          example: "EXAMPLE",
          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content || "<p>Core concept from STAT101 Chapter 3.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("nm_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
