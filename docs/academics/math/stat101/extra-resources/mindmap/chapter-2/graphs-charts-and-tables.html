      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

      :root {
        --bg: #0b1120;
        --bg2: #111827;
        --bg3: #1e293b;
        --panel: #0f172a;
        --border: #2d3a5e;
        --border2: #374151;
        --text: #e2e8f0;
        --text2: #94a3b8;
        --text3: #64748b;
        --accent: #8b5cf6;
        --accent2: #a78bfa;
        --accent-dim: rgba(139, 92, 246, 0.12);
        --line: rgba(167, 139, 250, 0.4);
        --node-root-bg: #2e1a5e;
        --node-root-b: #8b5cf6;
        --node-root-t: #c4b5fd;
        --node-l1-bg: #1a2f3a;
        --node-l1-b: #22d3ee;
        --node-l1-t: #67e8f9;
        --node-l2-bg: #2a1f2f;
        --node-l2-b: #f472b6;
        --node-l2-t: #fbcfe8;
        --node-l3-bg: #2a2520;
        --node-l3-b: #facc15;
        --node-l3-t: #fef08a;
        --highlight-b: #facc15;
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
        --toolbar-h: 56px;
        --footer-h: 36px;
        --tr: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      }

      [data-theme="light"] {
        --bg: #fef9f0;
        --bg2: #ffffff;
        --bg3: #f1f5f9;
        --panel: #ffffff;
        --border: #e2e8f0;
        --border2: #cbd5e1;
        --text: #1e293b;
        --text2: #334155;
        --text3: #94a3b8;
        --accent: #6d28d9;
        --accent2: #7c3aed;
        --accent-dim: rgba(109, 40, 217, 0.08);
        --line: rgba(124, 58, 237, 0.35);
        --node-root-bg: #ede9fe;
        --node-root-b: #6d28d9;
        --node-root-t: #4c1d95;
        --node-l1-bg: #e0f2fe;
        --node-l1-b: #0891b2;
        --node-l1-t: #0e7490;
        --node-l2-bg: #fce7f3;
        --node-l2-b: #db2777;
        --node-l2-t: #be185d;
        --node-l3-bg: #fef3c7;
        --node-l3-b: #d97706;
        --node-l3-t: #b45309;
        --highlight-b: #eab308;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        transition:
          background var(--tr),
          color var(--tr);
      }

      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--toolbar-h);
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 20px;
        z-index: 100;
        backdrop-filter: blur(2px);
      }

      .tb-logo {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent2);
        white-space: nowrap;
        letter-spacing: -0.2px;
        background: var(--accent-dim);
        padding: 5px 10px;
        border-radius: 28px;
      }

      .tb-sep {
        width: 1px;
        height: 28px;
        background: var(--border);
        margin: 0 6px;
      }

      #search-wrap {
        position: relative;
        flex: 1;
        max-width: 260px;
      }

      #search {
        width: 100%;
        height: 36px;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 32px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        padding: 0 12px 0 34px;
        outline: none;
        transition: all 0.2s;
      }

      #search:focus {
        border-color: var(--accent);
        background: var(--bg2);
        box-shadow: 0 0 0 2px var(--accent-dim);
      }

      .si {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text3);
        font-size: 14px;
      }

      #sr {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
        z-index: 200;
        max-height: 260px;
        overflow-y: auto;
        display: none;
      }

      #sr.v {
        display: block;
      }

      .sri {
        padding: 10px 16px;
        cursor: pointer;
        font-size: 13px;
        color: var(--text2);
        border-bottom: 1px solid var(--border);
        transition: all 0.15s;
      }

      .sri:last-child {
        border-bottom: none;
      }

      .sri:hover {
        background: var(--accent-dim);
        color: var(--accent2);
      }

      .sri mark {
        background: none;
        color: var(--accent2);
        font-weight: 500;
      }

      .tb-btn {
        height: 34px;
        padding: 0 12px;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 28px;
        color: var(--text2);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
      }

      .tb-btn:hover {
        background: var(--accent-dim);
        color: var(--text);
        border-color: var(--accent);
      }

      .spacer {
        flex: 1;
      }

      #cw {
        position: fixed;
        top: var(--toolbar-h);
        left: 0;
        right: 0;
        bottom: var(--footer-h);
        overflow: hidden;
        cursor: grab;
      }

      #cw.panning {
        cursor: grabbing;
      }

      #canvas {
        position: absolute;
        transform-origin: 0 0;
        will-change: transform;
      }

      svg#lines {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
      }

      .node {
        position: absolute;
        border-radius: 20px;
        padding: 10px 18px;
        cursor: pointer;
        user-select: none;
        transition: all 0.2s ease;
        border: 1.5px solid;
        min-width: 150px;
        max-width: 210px;
        display: flex;
        align-items: center;
        gap: 8px;
        word-break: break-word;
        backdrop-filter: blur(2px);
      }

      .node:hover {
        transform: translateY(-2px) scale(1.02);
        filter: brightness(1.02);
        border-color: var(--accent2);
      }

      .node.root {
        background: var(--node-root-bg);
        border-color: var(--node-root-b);
        padding: 14px 24px;
        min-width: 190px;
        border-radius: 28px;
      }

      .node.root .nl {
        color: var(--node-root-t);
        font-size: 15px;
        font-weight: 700;
      }

      .node.l1 {
        background: var(--node-l1-bg);
        border-color: var(--node-l1-b);
      }

      .node.l1 .nl {
        color: var(--node-l1-t);
        font-weight: 600;
      }

      .node.l2 {
        background: var(--node-l2-bg);
        border-color: var(--node-l2-b);
      }

      .node.l3 {
        background: var(--node-l3-bg);
        border-color: var(--node-l3-b);
      }

      .node.selected {
        box-shadow:
          0 0 0 3px var(--accent),
          var(--shadow);
      }

      .node.highlighted {
        outline: 2px solid var(--highlight-b);
        outline-offset: 2px;
      }

      .nl {
        flex: 1;
        line-height: 1.4;
        font-size: 12.5px;
        font-weight: 500;
      }

      .chev {
        width: 16px;
        height: 16px;
        transition: transform 0.25s;
        opacity: 0.7;
      }

      .chev.open {
        transform: rotate(90deg);
      }

      .li {
        width: 12px;
        height: 12px;
        opacity: 0.5;
      }

      .node.entering {
        animation: nIn 0.35s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
      }

      @keyframes nIn {
        from {
          opacity: 0;
          transform: scale(0.75) translateX(-12px);
        }

        to {
          opacity: 1;
          transform: scale(1) translateX(0);
        }
      }

      #panel {
        position: fixed;
        top: var(--toolbar-h);
        right: 0;
        bottom: var(--footer-h);
        width: 380px;
        background: var(--panel);
        border-left: 1px solid var(--border);

        display: flex;
        flex-direction: column;
        box-shadow: -5px 0 28px rgba(0, 0, 0, 0.4);

      #panel.open {
        transform: translateX(0);
      }

        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        gap: 12px;

        background: rgba(34, 211, 238, 0.2);

      #ptitle {

      #pc {

        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;

      }

      #pc:hover {

      }

      #pb {

        padding: 20px;
        line-height: 1.7;
        font-size: 13.5px;
        color: var(--text2);
        scrollbar-width: thin;
      }

      #pb h4 {
        color: var(--accent2);
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 6px;
        letter-spacing: 0.3px;
      }

        margin-bottom: 8px;

        color: var(--text);

      #zc {

        bottom: calc(var(--footer-h) + 16px);

        display: flex;

      .zb {
        width: 38px;

    <script>
      // DATA based on STAT101 Chapter 2: Graphs, Charts, and Tables — Describing Your Data
      const DATA = {
        id: "stat_root",
        label: "Graphs, Charts & Tables",
        level: 0,
        children: [
          {
            id: "sec1",
            label: "2.1 Frequency Distributions & Histograms",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "freq_def",
                label: "Frequency Distribution",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Definition</h4><p>A <strong>frequency distribution</strong> is a summary of a data set that displays the number of observations (the <strong>frequency</strong>) in each of the distribution's distinct categories or classes.</p><p>In plain words: instead of staring at hundreds of raw numbers, you count how many times each value (or range of values) shows up and put that count in a table — an organized head-count.</p>",
              },
              {
                id: "disc_cont",
                label: "Discrete vs. Continuous Data",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Two Data Types</h4><p><strong>Discrete data:</strong> takes on a countable number of possible values, usually whole numbers you can list out (e.g., number of late deliveries, touchdowns per game).</p><p><strong>Continuous data:</strong> possible values are uncountable and can be any value in an interval (e.g., weight, time, response time in seconds).</p><p><strong>Tip:</strong> if a variable has few distinct values (under ~10), build a simple frequency distribution with one row per value. If it's continuous or has many possible values (income, GPA), you must <em>group</em> the data into class intervals first.</p>",
              },
              {
                id: "build_discrete",
                label: "Building a Distribution (Discrete)",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>3 Steps for Few-Value Data</h4><p><strong>Step 1:</strong> List the possible values.<br><strong>Step 2:</strong> Count the number of occurrences at each value (the frequency).<br><strong>Step 3:</strong> Compute the relative frequency for each value.</p>",
              },
              {
                id: "rel_freq",
                label: "Relative Frequency Formula",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>Relative Frequency</h4><p>The proportion of total observations that fall in a given category or class.</p><p style="font-family:monospace;background:var(--bg3);padding:10px;border-radius:6px;">Relative Frequency of class i = f<sub>i</sub> / n</p><p>where f<sub>i</sub> = frequency of the i-th value/class, n = total number of observations.</p><p><strong>Self-check tip:</strong> all relative frequencies in a table must sum to 1.00 (100%). If they don\'t, you made an arithmetic mistake somewhere.</p>',
              },
              {
                id: "ex_late_deliveries",
                label: "Worked Example: Late Deliveries",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>Number of Late Deliveries per Month (n = 30)</h4><p>Raw data: 2,1,3,2,1,0,3,5,2,1,2,3,0,3,2,2,2,4,4,2,0,1,2,3,3,2,1,3,2,0</p><table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;"><tr style="background:var(--bg3);"><th style="padding:4px;text-align:left;">Value</th><th style="padding:4px;">Freq.</th><th style="padding:4px;">Rel. Freq.</th></tr><tr><td style="padding:4px;">0</td><td style="padding:4px;">4</td><td style="padding:4px;">0.133</td></tr><tr><td style="padding:4px;">1</td><td style="padding:4px;">5</td><td style="padding:4px;">0.167</td></tr><tr><td style="padding:4px;">2</td><td style="padding:4px;">11</td><td style="padding:4px;">0.367</td></tr><tr><td style="padding:4px;">3</td><td style="padding:4px;">7</td><td style="padding:4px;">0.233</td></tr><tr><td style="padding:4px;">4</td><td style="padding:4px;">2</td><td style="padding:4px;">0.067</td></tr><tr><td style="padding:4px;">5</td><td style="padding:4px;">1</td><td style="padding:4px;">0.033</td></tr></table><p style="margin-top:8px;"><strong>Interpretation:</strong> during 13.3% of months there were 0 late deliveries; during 36.7% of months there were exactly 2.</p>',
              },
              {
                id: "class_criteria",
                label: "Criteria for Good Classes",
                level: 2,
                tag: "concept",
                leaf: true,
                content:

      let nodes = {},
        expanded = new Set(["stat_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "stat_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {

          concept: "CONCEPT",

          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content || "<p>Core concept from STAT101 Chapter 2.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("stat_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
