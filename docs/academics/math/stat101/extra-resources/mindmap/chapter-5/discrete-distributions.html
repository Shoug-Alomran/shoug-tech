    <script>
      // DATA based on STAT101 Chapter 5: Discrete Probability Distributions
      const DATA = {
        id: "stat5_root",
        label: "Discrete Distributions",
        level: 0,
        children: [
          {
            id: "sec51",
            label: "5.1 Discrete Probability Distributions",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "discrete_rv",
                label: "Discrete Random Variable",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Random Variable</h4><p>A <strong>random variable</strong> takes on different numerical values based on chance. A <strong>discrete random variable</strong> can only take a finite number of values, or a countable infinite sequence like 0, 1, 2, 3, ... — examples: number of complaints per day, number of TVs in a household, number of rings before a phone is answered.</p><p>A <strong>continuous random variable</strong> can take an uncountable infinite number of values over an interval (height, weight, time). Chapter 5 is only about the discrete case.</p><p><strong>Spotting the difference:</strong> if you can list the possible values ("0, 1, 2, 3, ...") it\'s discrete. If it\'s measured on a continuum, it\'s continuous. Counting questions ("how many...") are almost always discrete.</p>',
              },
              {
                id: "dist_requirements",
                label: "Probability Distribution Requirements",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>The Two Rules</h4><p>A discrete probability distribution lists every possible value x of the random variable together with its probability P(x). Two requirements must always hold:</p><ul><li><strong>0 ≤ P(x) ≤ 1</strong> for every value of x</li><li><strong>Σ P(x) = 1</strong> — all the probabilities must add up to exactly 1</li></ul><p><strong>Example:</strong> Real-estate listings by number of bedrooms (x = 1..6) with P(x) = 0.10, 0.30, 0.40, 0.10, 0.05, 0.05. Every P(x) is between 0 and 1, and they sum to 1.00 — a valid distribution.</p>",
              },
              {
                id: "expected_value",
                label: "Expected Value & Standard Deviation",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>Mean and Spread of a Discrete Distribution</h4><p>The <strong>expected value</strong> (mean) is a weighted average of all possible x values, weighted by their probabilities — the long-run average if the experiment were repeated over and over.</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">μ = E(x) = Σ x·P(x)</p><p><strong>Variance and standard deviation</strong> measure the spread of x around its mean:</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">σ² = Σ [x − E(x)]²·P(x)<br>σ = √(σ²)</p><p><strong>Build the table left to right:</strong> x, P(x), x·P(x) (sum to get E(x) first), then [x−E(x)], square it, multiply by P(x), and sum that last column for the variance. You cannot compute [x−E(x)] until you already know E(x).</p>',
              },
              {
                id: "ev_example",
                label: "Worked Example: Bedroom Distribution",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>Real Estate Listings — Full Walkthrough</h4><p>Using the bedroom distribution (x = 1..6, P(x) = 0.10, 0.30, 0.40, 0.10, 0.05, 0.05), the x·P(x) column sums to:</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">E(x) = 2.85 bedrooms</p><p>Then [x−E(x)]²·P(x) for each row sums to a variance of 1.427.</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">σ = √1.427 ≈ 1.19 bedrooms</p><p><strong>Common mistake:</strong> stopping at the variance (1.427) and reporting it as if it were σ — always remember to take the square root!</p>',
              },
            ],
          },
          {
            id: "sec52",
            label: "5.2 The Binomial Distribution",
            level: 1,
            tag: "formula",
            children: [
              {
                id: "binomial_conditions",
                label: "The Four Binomial Conditions",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>All Four Must Hold</h4><p>The binomial distribution gives the probability of x successes in n trials in a process that meets <strong>all four</strong> conditions:</p><ol><li>A trial has only <strong>two</strong> possible outcomes: success or failure.</li><li>There is a <strong>fixed</strong> number, n, of identical trials.</li><li>The trials are <strong>independent</strong> of each other.</li><li>The process is <strong>consistent</strong>: the probability of success, p, stays constant trial to trial (q = 1 − p is the failure probability).</li></ol><p><strong>Typical situations:</strong> defective/acceptable products, win/lose a bid, yes/no survey responses, accept/reject a job offer.</p>",
              },
              {
                id: "binomial_formula",
                label: "Binomial Formula",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>The Binomial Formula</h4><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">P(x) = [n!/(x!(n−x)!)] · pˣ · q⁽ⁿ⁻ˣ⁾</p><p>where x = number of successes (0, 1, ..., n), n = number of trials, p = probability of success, q = 1 − p = probability of failure.</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">μ = np<br>σ = √(npq)</p><p><strong>Combination shortcuts:</strong> 0! = 1 and 1! = 1 always. C(n,x) = C(n, n−x) — use whichever side has the smaller number to compute faster.</p>',
              },
              {
                id: "binomial_ex1",
                label: "Worked Example: Exact Probability",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>Bank Saturday Preference — P(x = 3)</h4><p>A bank believes 80% of customers prefer Saturday morning hours. Three customers are surveyed (n = 3, p = 0.80, q = 0.20). Find P(x = 3), all three prefer Saturday.</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">P(3) = [3!/(3!·0!)]·(0.80)³·(0.20)⁰ = 1 · 0.512 · 1 = 0.512</p><p><strong>Answer:</strong> P(x = 3) = 0.512, a 51.2% chance all three prefer Saturday.</p>',
              },
              {
                id: "binomial_ex2",
                label: "Worked Example: At Least / At Most",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>Extended to n = 8 — "At Least 6"</h4><p>Same bank scenario with n = 8, p = 0.80. "At least 6" means x = 6, 7, or 8.</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">P(x ≥ 6) = P(6)+P(7)+P(8) = 0.294+0.336+0.168 = 0.798</p><p><strong>Answer:</strong> 79.8% chance at least 6 of 8 prefer Saturday. μ = np = 6.40, σ = √(npq) = √1.28 ≈ 1.13.</p><h4>Reading Cumulative Tables</h4><ul><li>P(x ≤ a) — read directly.</li><li>P(x ≥ a) = 1 − P(x ≤ a−1)</li><li>P(x &gt; a) = 1 − P(x ≤ a)</li><li>P(x = a) = P(x ≤ a) − P(x ≤ a−1)</li></ul><p><strong>Acceptance sampling example:</strong> inspect n = 20, accept if x ≤ 1 defect. If true p = 0.05, P(x ≤ 1) = 0.7358 (73.6% chance of correctly accepting a good shipment). If true p = 0.10, P(x ≤ 1) = 0.3917 (39.2% chance of wrongly accepting a bad shipment).</p>',
              },
            ],
          },
          {
            id: "sec53",
            label: "5.3 Other Discrete Distributions (Poisson)",
            level: 1,
            tag: "formula",
            children: [
              {
                id: "poisson_concept",
                label: "What Is the Poisson Distribution?",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Rare Events Over an Interval</h4><p>The Poisson distribution describes a process extending over space, time, or any well-defined interval, where outcomes of interest occur at random and are counted. Unlike the binomial, there is no fixed "n" number of trials.</p><ul><li>Outcomes of interest are <strong>rare</strong> relative to possible outcomes.</li><li>The average number of outcomes per interval is λ ("lambda").</li><li>Outcomes are random and independent of each other.</li><li>The probability of an outcome is the same across all segments.</li></ul><p><strong>Classic examples:</strong> ER arrivals per hour, tech-support calls in 30 minutes, defects per square meter of leather.</p>',
              },
              {
                id: "poisson_formula",
                label: "Poisson Formula",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>The Poisson Formula</h4><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">P(x) = (λt)ˣ · e^(−λt) / x!</p><p>where t = number of segments of interest, x = number of successes in t segments, λ = expected successes in one segment, e ≈ 2.71828. Mean/expected value = λt.</p><p><strong>4 steps:</strong> (1) define the segment unit, (2) find λ per one segment, (3) determine t and compute λt, (4) apply the formula or table to the event of interest.</p>',
              },
              {
                id: "poisson_example",
                label: "Worked Example: Concession Stand Arrivals",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>Baseball Concession Stand</h4><p>5 customers arrive on average in a 10-minute period (λ = 5, t = 1). Find P(exactly 3 arrivals).</p><p style="text-align:center;font-family:monospace;background:var(--bg3);padding:8px;border-radius:6px;">P(x=3) = 5³·e⁻⁵/3! = (125)(0.006738)/6 = 0.1404</p><p><strong>Answer:</strong> about 14.0% chance of exactly 3 arrivals in 10 minutes.</p><p><strong>Scaling by t:</strong> for a 20-minute window (two 10-minute segments), λt = 5 × 2 = 10, not 5 — always rescale λ by the correct number of segments before plugging into the formula.</p>',
              },
              {
                id: "binomial_vs_poisson",
                label: "Binomial vs. Poisson & Common Errors",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>How to Tell Them Apart</h4><table style="width:100%;border-collapse:collapse;font-size:12.5px;"><tr><th style="text-align:left;padding:4px;border-bottom:1px solid var(--border);">Clue in wording</th><th style="text-align:left;padding:4px;border-bottom:1px solid var(--border);">Use</th></tr><tr><td style="padding:4px;border-bottom:1px solid var(--border);">Fixed n trials, clear success/failure ("out of 20 shipped parts")</td><td style="padding:4px;border-bottom:1px solid var(--border);">Binomial</td></tr><tr><td style="padding:4px;border-bottom:1px solid var(--border);">A rate over continuous time/area/volume, no natural n ("per hour")</td><td style="padding:4px;border-bottom:1px solid var(--border);">Poisson</td></tr></table><h4>Common Errors</h4><ul><li><strong>Forgetting q = 1 − p</strong> — every binomial term needs both pˣ AND q^(n−x).</li><li><strong>Mixing up n and x</strong> — n is the fixed sample size; x is the number of successes you solve for.</li><li><strong>Forgetting to scale λ by t</strong> — the single most common Poisson mistake.</li><li><strong>Forgetting 0! = 1</strong>, not 0, when x = 0 or x = n.</li></ul>',
              },
            ],
          },
        ],
      };

      let nodes = {},
        expanded = new Set(["stat5_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "stat5_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {
        let nd = nodes[id];
        document.getElementById("ptitle").innerHTML = nd.label.replace(
          /\n/g,
          " ",
        );
        let tagDiv = document.getElementById("ptag");
        let tagMap = {
          concept: "CONCEPT",
          formula: "FORMULA",
          example: "EXAMPLE",
          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content || "<p>Core concept from STAT101 Chapter 5.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("stat5_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
