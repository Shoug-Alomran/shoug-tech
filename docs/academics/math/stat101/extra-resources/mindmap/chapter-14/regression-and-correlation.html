        border-radius: 20px;

    <script>
      // DATA based on STAT101 Chapter 14: Introduction to Linear Regression and Correlation Analysis
      const DATA = {
        id: "reg_root",
        label: "Regression & Correlation",
        level: 0,
        children: [
          {
            id: "scatter_corr",
            label: "Scatter Plots & Correlation",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "scatter_def",
                label: "Scatter Plot",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Scatter Plot (Scatter Diagram)</h4><p>A two-dimensional plot showing the joint occurrence of two quantitative variables — one variable on the x-axis, one on the y-axis, one dot per observation.</p><p>It is always the <strong>first thing you do</strong> before calculating anything, because it tells you whether a straight-line model even makes sense for the data.</p>",
              },
              {
                id: "corr_coef",
                label: "Correlation Coefficient r",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Correlation Coefficient (r)</h4><p>A quantitative measure of the <strong>strength and direction</strong> of the linear relationship between two variables.</p><p><strong>Range:</strong> -1.0 ≤ r ≤ +1.0</p><ul><li><strong>r close to +1.0</strong> → strong <em>positive</em> linear relationship</li><li><strong>r close to -1.0</strong> → strong <em>negative</em> linear relationship</li><li><strong>r close to 0.0</strong> → weak (or no) linear relationship</li><li><strong>r = ±1.0</strong> → a perfect linear relationship (every point sits exactly on a line)</li></ul>",
              },
              {
                id: "corr_formula",
                label: "Correlation Formula",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Correlation Coefficient Formula (Eq. 14.1)</h4><p><strong>Deviation form:</strong></p><p>r = Σ(x - x̄)(y - ȳ) ÷ √[ Σ(x - x̄)² × Σ(y - ȳ)² ]</p><p><strong>Algebraic (raw-score) form — easier for calculators:</strong></p><p>r = [nΣxy - (Σx)(Σy)] ÷ √{ [nΣx² - (Σx)²] × [nΣy² - (Σy)²] }</p><p>where n = sample size, x = independent variable, y = dependent variable.</p>",
              },
              {
                id: "shapes",
                label: "Linear vs Curvilinear vs None",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Shapes You Must Recognize</h4><ul><li><strong>Linear (positive)</strong> — points trend up and to the right in a fairly straight band; r is a large positive number (0.7–1.0).</li><li><strong>Linear (negative)</strong> — points trend down and to the right; r is a large negative number (-0.7 to -1.0).</li><li><strong>Curvilinear</strong> — points bend into a curve (U-shape, S-shape); r can be small or even near 0, even though a strong <em>nonlinear</em> relationship exists!</li><li><strong>No relationship</strong> — points scattered with no visible pattern; r near 0.</li></ul>",
              },
              {
                id: "causation",
                label: "Correlation ≠ Causation",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Correlation Does Not Prove Causation</h4><p>A strong, significant r just means x and y move together. It never proves x <em>causes</em> y — a third, unmeasured "lurking" variable could be driving both.</p><p><strong>Classic example:</strong> ice cream sales and drowning deaths correlate strongly — because both rise in summer heat, not because ice cream causes drowning.</p>',
              },
              {
                id: "r_zero_myth",
                label: '"r ≈ 0 Means Unrelated" Myth',
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Common Mistake: "r ≈ 0 means the variables are unrelated"</h4><p>Not necessarily! r only measures <strong>linear</strong> association. Two variables can have a very strong <em>curved</em> relationship and still produce a small r, because a straight line is simply the wrong shape to draw through them.</p><p><strong>Always look at the scatter plot first</strong> — don\'t just trust the number.</p>',
              },
            ],
          },
          {
            id: "simple_reg",
            label: "Simple Linear Regression",
            level: 1,
            tag: "formula",
            children: [
              {
                id: "reg_model",
                label: "Regression Model ŷ=b0+b1x",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>The Regression Model</h4><p><strong>Population model:</strong> y = β₀ + β₁x + ε</p><p><strong>Estimated (sample) regression equation:</strong> ŷ = b₀ + b₁x</p><p>ŷ = predicted value of y for a given x | b₁ = estimate of the true slope β₁ | b₀ = estimate of the true y-intercept β₀.</p><p>Simple regression: only one dependent variable (y) and one independent variable (x). Simple <em>linear</em> regression: the relationship is modeled as a straight line.</p>",
              },
              {
                id: "slope_intercept",
                label: "Interpreting Slope & Intercept",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Meaning of the Regression Coefficients</h4><p><strong>Slope, b₁</strong> — the average change in the dependent variable (y) for a one-unit increase in the independent variable (x).</p><p><strong>Intercept, b₀</strong> — the predicted value of y when x = 0, only meaningful if x = 0 is actually a realistic/observed value in the data.</p><p><strong>Tip:</strong> the sign of b₁ always matches the sign of r — if the correlation is positive, the slope is positive, and vice versa. Then always ask: does this slope's real-world direction make sense?</p>",
              },
              {
                id: "least_squares",
                label: "Least Squares Method",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Least Squares Criterion</h4><p><strong>Residual:</strong> the difference between an actual y value and the value the regression line predicts, y - ŷ.</p><p>The least squares criterion finds the one line that minimizes the <em>sum of the squared</em> residuals — squaring stops positive and negative errors from canceling out and penalizes big misses much more than small ones.</p><p>minimize Σ(y - ŷ)²</p><p>b₁ = Σ(x - x̄)(y - ȳ) ÷ Σ(x - x̄)² &nbsp; and &nbsp; b₀ = ȳ - b₁x̄</p>",
              },
              {
                id: "worked_example",
                label: "Worked Example: Midwest Reps",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Worked Example: Midwest Distribution Company (n = 12 reps)</h4><p>x = years with company, y = annual sales ($000). Building-block sums:</p><p>Σx = 55, Σy = 4,855, Σxy = 26,091, Σx² = 329, n = 12</p><p><strong>Step 1 — Slope:</strong></p><p>b₁ = [nΣxy - (Σx)(Σy)] ÷ [nΣx² - (Σx)²] = [12(26,091) - (55)(4,855)] ÷ [12(329) - 55²]</p><p>b₁ = (313,092 - 267,025) ÷ (3,948 - 3,025) = 46,067 ÷ 923 = <strong>49.91</strong></p><p><strong>Step 2 — Intercept:</strong></p><p>b₀ = ȳ - b₁x̄ = 404.583 - (49.91)(4.583) = 404.583 - 228.75 = <strong>175.83</strong></p><p><strong>Step 3 — Regression equation:</strong> ŷ = 175.83 + 49.91x</p><p><strong>Interpretation:</strong> for every additional year a rep stays with the company, average annual sales rise by about $49,910 (b₁). A brand-new rep (0 years) is predicted to start at about $175,830 (b₀) — but x = 0 is outside the observed range of 1–9 years.</p><p><strong>Step 4 — Prediction at x = 10 years:</strong></p><p>ŷ = 175.83 + 49.91(10) = 175.83 + 499.10 = <strong>$674.93 thousand</strong></p><p>Also, correlation for this data: r = 0.8325 (strong positive linear relationship, statistically significant, t = 4.752 > critical 2.228).</p>",
              },
            ],
          },
          {
            id: "coef_det",
            label: "Coefficient of Determination",
            level: 1,
            tag: "formula",
            children: [
              {
                id: "r_squared",
                label: "r² = Proportion Explained",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>Coefficient of Determination, r²</h4><p>r² is the <strong>proportion of the total variation in y that is explained</strong> by its linear relationship with x. For simple (one-x) regression, r² is simply r squared.</p><p>R² = SSR ÷ SST = (r)²</p><p><strong>Midwest example:</strong> R² = 191,600.62 ÷ 276,434.92 = 0.6931 (matches 0.8325² = 0.6931). About 69.3% of the variation in sales among these reps is explained by years with the company; the remaining 30.7% is due to other factors (skill, territory, luck, etc.).</p>",
              },
              {
                id: "sum_squares",
                label: "SST = SSR + SSE",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Breaking Down the Variation</h4><p>SST = SSR + SSE</p><p><strong>SST</strong> (Total Sum of Squares) = Σ(y - ȳ)² — total variation in y.<br><strong>SSR</strong> (Sum of Squares Regression) = variation in y <em>explained</em> by the regression line.<br><strong>SSE</strong> (Sum of Squares Error) = variation in y <em>left unexplained</em> (the residuals).</p><p>For the Midwest data: SST = 276,434.92, SSE = 84,834.29, so SSR = 191,600.62.</p>",
              },
              {
                id: "r2_reading",
                label: "Reading r² in Context",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Tip: Reading r² at a Glance</h4><p>r² close to 1.0 → the line fits the data very tightly, strong explanatory power. r² close to 0.0 → the line barely explains anything about y.</p><p>There\'s no universal "good" cutoff — 0.3 might be impressive in social science data, unimpressive in engineering data — so always interpret r² in the context of the field.</p>',
              },
            ],
          },
          {
            id: "assumptions_misuse",
            label: "Assumptions & Misuses",
            level: 1,
            tag: "pitfall",
            children: [
              {
                id: "assumptions",
                label: "Model Assumptions",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Linear Regression Assumptions</h4><ol><li>The random errors (ε) are statistically <strong>independent</strong>.</li><li>For each value of x, the distribution of possible y values is <strong>normally distributed</strong>.</li><li>The distributions of the errors have <strong>equal variances</strong> for all levels of x — this is called <strong>homoscedasticity</strong>.</li><li>A straight line (the population regression model) passes through the <strong>mean</strong> of the possible y values for every level of x — i.e., the relationship really is linear.</li></ol>",
              },
              {
                id: "extrapolation",
                label: "Extrapolation",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  "<h4>Common Mistake: Extrapolation</h4><p>Using a regression equation to predict y for x values <strong>outside</strong> the range of x actually observed in the sample.</p><p>The Midwest sample only contains reps with 1–9 years of tenure. Predicting at x = 10 is already a small step outside the observed range — we have zero data confirming the relationship stays linear beyond x = 9. Predicting for a 25-year veteran using the same equation would be far worse: the line might curve, plateau, or reverse entirely outside the observed range.</p><p><strong>Never trust a regression prediction far outside the range of x used to build the model.</strong></p>",
              },
              {
                id: "curvilinear_misuse",
                label: "Fitting a Line to Curvilinear Data",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Fitting a Straight Line to Curved Data</h4><p>If the scatter plot clearly bends, a straight line is the wrong model — even a "significant" linear fit can badly misrepresent the true (curved) relationship and produce systematically wrong predictions in different regions of x.</p><p>Always inspect the scatter plot before committing to a linear regression model.</p>',
              },
              {
                id: "small_sample_r2",
                label: "Over-trusting High r² (Small n)",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  "<h4>Over-trusting r² with a Small Sample</h4><p>A high r² from a tiny sample (say n = 5) is far less reliable than the same r² from a large sample — one or two unusual points can swing it dramatically.</p><p>Always check the sample size and look for influential outliers before trusting the fit. A single extreme (x, y) point far from the rest of the data can pull the entire regression line toward it, distorting both the slope and r².</p>",
              },
            ],
          },
        ],
      };

      let nodes = {},
        expanded = new Set(["reg_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "reg_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {
        let nd = nodes[id];
        document.getElementById("ptitle").innerHTML = nd.label.replace(
          /\n/g,
          " ",
        );
        let tagDiv = document.getElementById("ptag");
        let tagMap = {
          concept: "CONCEPT",
          formula: "FORMULA",
          example: "EXAMPLE",
          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content ||
          "<p>Core concept from regression and correlation analysis.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("reg_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
