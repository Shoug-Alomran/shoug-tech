    <script>
      // DATA based on STAT101 Chapter 4: Introduction to Probability
      const DATA = {
        id: "prob_root",
        label: "Introduction to Probability",
        level: 0,
        children: [
          {
            id: "basics",
            label: "4.1 The Basics of Probability",
            level: 1,
            tag: "concept",
            children: [
              {
                id: "core_defs",
                label: "Core Definitions",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Experiment, Sample Space, Event</h4><p><strong>Probability</strong> is the chance a particular event will occur, always between 0 and 1 (0% to 100%).</p><p><strong>Experiment</strong> — a process that produces a single outcome whose result cannot be predicted with certainty (drilling a well, hiring an employee, rolling a die).</p><p><strong>Sample Space (SS)</strong> — the collection of ALL outcomes that can result from the experiment. <strong>Event</strong> — any subset of outcomes you are interested in (e.g. "rolling an odd number").</p>',
              },
              {
                id: "sample_space_steps",
                label: "Defining a Sample Space",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Three-Step Process</h4><p><strong>Step 1:</strong> Define the experiment. <strong>Step 2:</strong> List the outcomes for one trial. <strong>Step 3:</strong> Build the full sample space — for repeated trials, multiply the outcomes together (a tree diagram enumerates this fastest).</p><p><strong>Counting shortcut:</strong> if a trial has k possible outcomes and is repeated n times, the sample space has k<sup>n</sup> outcomes. Example: asking 3 students Yes/No gives 2<sup>3</sup> = 8 outcomes.</p>",
              },
              {
                id: "event_types",
                label: "Mutually Exclusive vs. Independent vs. Dependent",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Types of Event Relationships</h4><p><strong>Mutually exclusive:</strong> events cannot both happen at the same time (no overlap) — e.g. "well produces oil" vs "well does not produce oil."</p><p><strong>Independent:</strong> one event\'s occurrence in no way influences the probability of the other — e.g. two unrelated businesses succeeding in different states.</p><p><strong>Dependent:</strong> one event\'s occurrence changes the probability of the other — e.g. selecting people without replacement from a group.</p>',
              },
              {
                id: "me_vs_indep_pitfall",
                label: "Confusing Independent with Mutually Exclusive",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>These Are Opposite Ideas</h4><p>Students very often mix these up. If two events are mutually exclusive (and each has nonzero probability), they are automatically <strong>dependent</strong> — because if one happens, the probability of the other instantly drops to zero!</p><p>Ask two separate questions: "Can both happen at once?" (mutual exclusivity) is completely different from "Does one affect the chances of the other?" (independence).</p>',
              },
              {
                id: "three_approaches",
                label: "Three Ways to Assign Probability",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  '<h4>Classical, Relative Frequency, Subjective</h4><p><strong>Classical:</strong> P(E) = (ways E can occur) / (total possible outcomes), when all outcomes are equally likely. Clue words: "randomly selected," "dealer has X of each."</p><p><strong>Relative frequency:</strong> P(E) = (times E occurred) / N, based on observed historical data. Clue words: "of the past N," "has attempted/made."</p><p><strong>Subjective:</strong> reflects a decision maker\'s personal judgment or belief, with no formula — e.g. a manager estimating whether a shipment arrives on time.</p>',
              },
              {
                id: "classical_example",
                label: "Worked Example — Classical Probability",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  '<h4>Employees & Cars</h4><p>A company has 10 employees — 7 female, 3 male. A convention attendee is picked at random: P(Female) = 7/10 = 0.70.</p><p>A car dealer has 5 GM, 6 Ford, 3 Toyota, 8 Nissan, 2 BMW (24 total). P(Nissan) = 8/24 = 1/3 ≈ 0.333.</p><p>Both problems give counts of equally-likely outcomes selected "at random" — the classic signature of the classical approach.</p>',
              },
            ],
          },
          {
            id: "rules",
            label: "4.2 The Rules of Probability",
            level: 1,
            tag: "formula",
            children: [
              {
                id: "axioms",
                label: "The Probability Axioms",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Rules 1 & 2</h4><p><strong>Rule 1:</strong> For any event E<sub>i</sub>, 0 ≤ P(E<sub>i</sub>) ≤ 1 — probability can never be negative or exceed 1.</p><p><strong>Rule 2:</strong> The sum of the probabilities of all possible outcomes in the sample space equals 1: ΣP(e<sub>i</sub>) = 1.</p><p>Always check both rules before trusting a given probability distribution — every value must sit in [0,1], and the whole table must sum to exactly 1.00.</p>",
              },
              {
                id: "complement_rule",
                label: "Complement Rule",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>P(Ē) = 1 − P(E)</h4><p>The complement of event E is the collection of all outcomes NOT contained in E. Whenever a question asks for "at least one," "1 or more," or "not," it is almost always faster to compute 1 minus the complement (usually "exactly zero") than to sum many individual terms.</p><p><strong>Example:</strong> if P(0 defects) = 0.03, then P(1 or more defects) = 1 − 0.03 = 0.97.</p>',
              },
              {
                id: "addition_general",
                label: "Addition Rule (Any Two Events)",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>P(A∪B) = P(A) + P(B) − P(A∩B)</h4><p>Used for "OR" questions where the two events CAN overlap. You must subtract the intersection so shared outcomes are not double-counted.</p><p>"The word OR means ADD" — but whenever the events can overlap, add then subtract the overlap.</p>',
              },
              {
                id: "addition_me",
                label: "Addition Rule (Mutually Exclusive)",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  "<h4>P(A∪B) = P(A) + P(B)</h4><p>When two events cannot occur together, P(A∩B) = 0, so the general addition rule simplifies — no subtraction needed.</p><p><strong>Example:</strong> a store has 6 pairs of style A boots, 12 of style B, 2 of style C (20 total, one style per pair). P(A or C) = 6/20 + 2/20 = 0.40.</p>",
              },
              {
                id: "conditional_prob",
                label: "Conditional Probability",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>P(A|B) = P(A∩B) / P(B)</h4><p>The probability that event A occurs, given that event B has already happened. Look for the word "given" — whatever follows it goes in the denominator, since it shrinks your sample space down to just that subset.</p><p>For independent events, this simplifies to P(A|B) = P(A), since knowing B happened tells you nothing new about A.</p>',
              },
              {
                id: "multiplication_rule",
                label: "Multiplication Rule",
                level: 2,
                tag: "formula",
                leaf: true,
                content:
                  '<h4>P(A∩B) = P(A) · P(B|A)</h4><p>Used for "AND" questions when you know a conditional probability but not the joint probability directly. For independent events this simplifies to P(A∩B) = P(A) · P(B), since P(B|A) = P(B).</p><p>"The word AND means MULTIPLY" — read joint probabilities straight off a contingency table cell whenever available.</p>',
              },
              {
                id: "independence_check",
                label: "Testing for Independence",
                level: 2,
                tag: "concept",
                leaf: true,
                content:
                  "<h4>Is P(A|B) = P(A)?</h4><p>To test whether events A and B are independent, compare the conditional probability P(A|B) to the plain (marginal) probability P(A). If they match, the events are independent; if not, they are dependent.</p><p>This test is the practical companion to the multiplication and conditional-probability rules — it tells you which version of each formula to use.</p>",
              },
              {
                id: "contingency_example",
                label: "Worked Example — Contingency Table",
                level: 2,
                tag: "example",
                leaf: true,
                content:
                  "<h4>Cards: P(Red or Ace)</h4><p>Drawing one card from a 52-card deck. P(Red) = 26/52, P(Ace) = 4/52, P(Red and Ace) = 2/52 (the 2 red aces — the intersection cell).</p><div>P(Red or Ace) = 26/52 + 4/52 − 2/52 = 28/52 ≈ 0.538</div><p>Row/column totals give marginal probabilities; cell values give joint probabilities. The 2 red aces live in both counts — if you just added 26/52 + 4/52 you would double-count them, which is exactly why the intersection is subtracted.</p>",
              },
              {
                id: "intersection_pitfall",
                label: "Forgetting to Subtract the Intersection",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  "<h4>The #1 Addition-Rule Error</h4><p>Computing P(A) + P(B) and stopping there. Whenever two events can overlap (are NOT mutually exclusive), you must subtract P(A∩B), or you will double-count outcomes that belong to both events — like counting the 2 red aces twice in the card example.</p>",
              },
              {
                id: "wrong_denominator_pitfall",
                label: "Dividing by the Wrong Total in a Table",
                level: 2,
                tag: "pitfall",
                leaf: true,
                content:
                  '<h4>Joint vs. Conditional Probability</h4><p>When asked for P(A|B), restrict to row/column B and divide by B\'s total — not the grand total. A frequent slip is dividing the joint cell by the grand total (giving the joint probability) instead of by the row/column total (which gives the conditional probability).</p><p>Always ask: "Am I being asked for a joint probability (divide by grand total) or a conditional probability (divide by the row/column total of the given event)?"</p>',
              },
            ],
          },
        ],
      };

      let nodes = {},
        expanded = new Set(["prob_root"]);
      let selectedId = null;
      let tf = { x: 70, y: 80, scale: 0.85 },
        isPanning = false,
        panStart = {};
      const cw = document.getElementById("cw"),
        canvas = document.getElementById("canvas"),
        linesEl = document.getElementById("lines");
      const NW = 185,
        NH = 58,
        HG = 270,
        VG = 76;

      function flatten(n, d = 0) {
        nodes[n.id] = { ...n, depth: d };
        if (n.children) n.children.forEach((c) => flatten(c, d + 1));
      }
      flatten(DATA);

      function countH(n) {
        if (!n.children || !expanded.has(n.id)) return 1;
        let total = 0;
        n.children.forEach((c) => (total += countH(nodes[c.id] || c)));
        return Math.max(total, 1);
      }

      function layout() {
        let pos = {};
        function assign(n, x, yOff) {
          pos[n.id] = { x, yOff, y: 0 };
          if (n.children && expanded.has(n.id)) {
            let sy = yOff;
            n.children.forEach((c) => {
              let cn = nodes[c.id] || c;
              let ch = countH(cn);
              assign(cn, x + HG, sy);
              sy += ch;
            });
          }
        }
        assign(DATA, 0, 0);
        function computeY(n) {
          if (!n.children || !expanded.has(n.id)) {
            pos[n.id].y = pos[n.id].yOff * VG;
            return;
          }
          n.children.forEach((c) => computeY(nodes[c.id] || c));
          let childs = n.children.map((c) => nodes[c.id] || c);
          let topY = pos[childs[0].id].y,
            botY = pos[childs[childs.length - 1].id].y;
          pos[n.id].y = (topY + botY) / 2;
        }
        computeY(DATA);
        return pos;
      }

      function render() {
        let pos = layout();
        let existing = {};
        canvas.querySelectorAll(".node").forEach((el) => {
          existing[el.dataset.id] = el;
        });
        let vis = new Set();
        function collect(n) {
          vis.add(n.id);
          if (n.children && expanded.has(n.id))
            n.children.forEach((c) => collect(nodes[c.id] || c));
        }
        collect(DATA);
        Object.keys(existing).forEach((id) => {
          if (!vis.has(id)) existing[id].remove();
        });
        vis.forEach((id) => {
          let nd = nodes[id],
            p = pos[id];
          if (!p) return;
          let el = existing[id];
          let isNew = !el;
          if (isNew) {
            el = document.createElement("div");
            el.className = "node";
            el.dataset.id = id;
            canvas.appendChild(el);
          }
          let lvlClass =
            id === "prob_root"
              ? "root"
              : nd.level === 1
                ? "l1"
                : nd.level === 2
                  ? "l2"
                  : "l3";
          el.className = `node ${lvlClass} ${selectedId === id ? "selected" : ""}`;
          el.style.left = p.x + "px";
          el.style.top = p.y - NH / 2 + "px";
          el.style.width = NW + "px";
          el.style.minHeight = NH + "px";
          let hasChildren = nd.children && nd.children.length > 0 && !nd.leaf;
          let icon = hasChildren
            ? `<svg class="chev ${expanded.has(id) ? "open" : ""}" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 4l4 4-4 4" stroke-width="2"/></svg>`
            : nd.leaf
              ? `<svg class="li" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="4"/></svg>`
              : "";
          el.innerHTML = `<span class="nl">${nd.label.replace(/\n/g, "<br>")}</span>${icon}`;
          if (isNew) el.classList.add("entering");
          el.onclick = (e) => {
            e.stopPropagation();
            onClick(id);
          };
        });
        drawLines(pos, vis);
      }

      function drawLines(pos, vis) {
        let paths = [];
        vis.forEach((id) => {
          let nd = nodes[id];
          if (!nd.children || !expanded.has(id)) return;
          nd.children.forEach((c) => {
            let cid = (nodes[c.id] || c).id;
            if (!vis.has(cid)) return;
            let p1 = pos[id],
              p2 = pos[cid];
            if (!p1 || !p2) return;
            let x1 = p1.x + NW,
              y1 = p1.y;
            let x2 = p2.x,
              y2 = p2.y;
            let mx = x1 + (x2 - x1) * 0.5;
            paths.push(
              `<path class="pl" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`,
            );
          });
        });
        linesEl.innerHTML = paths.join("");
      }

      function onClick(id) {
        let nd = nodes[id];
        if (nd.leaf || (nd.children && nd.children.length === 0)) {
          selectedId = id;
          openPanel(id);
          render();
          return;
        }
        if (nd.children && nd.children.length) {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          render();
        }
      }

      function openPanel(id) {
        let nd = nodes[id];
        document.getElementById("ptitle").innerHTML = nd.label.replace(
          /\n/g,
          " ",
        );
        let tagDiv = document.getElementById("ptag");
        let tagMap = {
          concept: "CONCEPT",
          formula: "FORMULA",
          example: "EXAMPLE",
          pitfall: "PITFALL",
        };
        let cls = tagMap[nd.tag] || "CONCEPT";
        tagDiv.textContent = cls;
        tagDiv.className = `tag-${nd.tag === "concept" ? "concept" : nd.tag === "formula" ? "formula" : nd.tag === "example" ? "example" : "pitfall"}`;
        tagDiv.style.display = "inline-flex";
        document.getElementById("pb").innerHTML =
          nd.content || "<p>Core concept from Introduction to Probability.</p>";
        document.getElementById("panel").classList.add("open");
      }

      document.getElementById("pc").onclick = () => {
        document.getElementById("panel").classList.remove("open");
        selectedId = null;
        render();
      };
      cw.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node") || e.target.closest("#panel")) return;
        isPanning = true;
        cw.classList.add("panning");
        panStart = { x: e.clientX - tf.x, y: e.clientY - tf.y };
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        tf.x = e.clientX - panStart.x;
        tf.y = e.clientY - panStart.y;
        applyTf();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        cw.classList.remove("panning");
      });
      cw.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          let delta = -e.deltaY * 0.001;
          let ns = Math.min(2.2, Math.max(0.3, tf.scale + delta));
          let rect = cw.getBoundingClientRect();
          let mx = e.clientX - rect.left,
            my = e.clientY - rect.top;
          tf.x = mx - (mx - tf.x) * (ns / tf.scale);
          tf.y = my - (my - tf.y) * (ns / tf.scale);
          tf.scale = ns;
          applyTf();
        },
        { passive: false },
      );
      function applyTf() {
        canvas.style.transform = `translate(${tf.x}px, ${tf.y}px) scale(${tf.scale})`;
        document.getElementById("zl").innerText =
          Math.round(tf.scale * 100) + "%";
      }

      function zoom(delta) {
        tf.scale = Math.min(2.2, Math.max(0.3, tf.scale + delta));
        applyTf();
      }

      function resetView() {
        tf = { x: 70, y: 80, scale: 0.85 };
        applyTf();
      }

      function collectIds(node, ids = []) {
        ids.push(node.id);
        if (node.children)
          node.children.forEach((child) => collectIds(child, ids));
        return ids;
      }

      function expandAll() {
        collectIds(DATA).forEach((id) => expanded.add(id));
        render();
      }

      function collapseAll() {
        expanded.clear();
        expanded.add("prob_root");
        render();
      }

      document.getElementById("zi").onclick = () => zoom(0.12);
      document.getElementById("zo").onclick = () => zoom(-0.12);
      document.getElementById("rb").onclick = resetView;
      document.getElementById("eab").onclick = expandAll;
      document.getElementById("cab").onclick = collapseAll;
      document.getElementById("tb").onclick = () => {
        const body = document.body;
        const next =
          body.getAttribute("data-theme") === "light" ? "dark" : "light";
        body.setAttribute("data-theme", next);
        document.getElementById("tb").textContent =
          next === "light" ? "☀️" : "🌙";
      };

      const searchInput = document.getElementById("search");
      const searchResults = document.getElementById("sr");

      function flatNodes(node, path = [], out = []) {
        out.push({ node, path: [...path, node.label] });
        if (node.children)
          node.children.forEach((child) =>
            flatNodes(child, [...path, node.label], out),
          );
        return out;
      }

      function selectNode(id) {
        function findPath(node, target, path = []) {
          if (node.id === target) return [...path, node.id];
          if (!node.children) return null;
          for (const child of node.children) {
            const found = findPath(child, target, [...path, node.id]);
            if (found) return found;
          }
          return null;
        }

        const path = findPath(DATA, id);
        if (path) path.forEach((pid) => expanded.add(pid));
        selectedId = id;
        render();
        setTimeout(() => {
          const el = canvas.querySelector(`[data-id="${id}"]`);
          if (!el) return;
          const r = el.getBoundingClientRect();
          const wr = cw.getBoundingClientRect();
          tf.x += wr.width / 2 - (r.left + r.width / 2 - wr.left);
          tf.y += wr.height / 2 - (r.top + r.height / 2 - wr.top);
          applyTf();
          if (nodes[id] && nodes[id].leaf) openPanel(id);
        }, 100);
      }

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.style.display = "none";
          return;
        }

        const matches = flatNodes(DATA)
          .filter(({ node }) => node.label.toLowerCase().includes(q))
          .slice(0, 10);
        searchResults.innerHTML = matches
          .map(({ node, path }) => {
            const trail = path.slice(0, -1).join(" › ");
            return `<div class="sr-item" data-id="${node.id}"><div>${node.label}</div>${trail ? `<div class="sr-path">${trail}</div>` : ""}</div>`;
          })
          .join("");
        searchResults.style.display = matches.length ? "block" : "none";
        searchResults.querySelectorAll(".sr-item").forEach((item) => {
          item.onclick = () => {
            searchResults.style.display = "none";
            searchInput.value = "";
            selectNode(item.dataset.id);
          };
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#search-wrap"))
          searchResults.style.display = "none";
      });

      render();
      applyTf();
    </script>

    <script src="/javascripts/mindmap-controls.js"></script>
    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
