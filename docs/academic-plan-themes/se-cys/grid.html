<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/shoug-apple-touch-icon-v4.png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Engineering · Cybersecurity Grid // SHOUG.TECH</title>
    <meta property="og:title" content="Software Engineering · Cybersecurity Grid // SHOUG.TECH" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://shoug-tech.com/academic-plan-themes/se-cys/grid.html"
    />
    <meta
      property="og:image"
      content="https://shoug-tech.com/assets/og-banner.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://shoug-tech.com/assets/og-banner.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --border: #c9ccd3;
        --text: #222;
        --muted: #6b7280;
        --term-badge: #2f5fa8;
        --term-badge-text: #fff;
        --summer-badge: #c07a1f;
        --gap-badge: #5b6472;
        --extra-badge: #5a4fcf;
        --elective-badge: #3a3f4a;

        --not-taken-bg: #8a2b2b;
        --not-taken-text: #fff;
        --not-taken-border: #6e1f1f;

        --current-bg: #ffffff;
        --current-text: #222;
        --current-border: #2f5fa8;

        --completed-bg: #3f7d3f;
        --completed-text: #fff;
        --completed-border: #2c5c2c;

        --locked-bg: #4a4a52;
        --locked-text: #fff;
        --locked-border: #2e2e33;

        --critical-accent: #d9a441;
      }

      :root[data-theme="dark"] {
        --bg: #0e0f12;
        --panel: #17181c;
        --border: #33353c;
        --text: #e7e7ea;
        --muted: #9a9ca3;
        --term-badge: #3f6fc0;
        --gap-badge: #7a828f;
        --extra-badge: #766cf0;
        --not-taken-bg: #5c2323;
        --not-taken-border: #3f1717;
        --current-bg: #1f2126;
        --current-text: #f0f0f0;
        --completed-bg: #2f5c30;
        --completed-border: #1f3f20;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e0f12;
          --panel: #17181c;
          --border: #33353c;
          --text: #e7e7ea;
          --muted: #9a9ca3;
          --term-badge: #3f6fc0;
          --gap-badge: #7a828f;
          --extra-badge: #766cf0;
          --not-taken-bg: #5c2323;
          --not-taken-border: #3f1717;
          --current-bg: #1f2126;
          --current-text: #f0f0f0;
          --completed-bg: #2f5c30;
          --completed-border: #1f3f20;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Tajawal", sans-serif;
        padding: 28px 16px 80px;
        min-height: 100vh;
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
      }

      header.page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 20px;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }

      header.page-head h1 {
        font-size: 18px;
        font-weight: 800;
      }

      .sub {
        font-size: 12px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .actions button {
        font-family: "Tajawal", sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 8px 14px;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.15s;
      }

      .actions button:hover {
        border-color: var(--term-badge);
        color: var(--term-badge);
      }

      .actions button.add-summer:hover {
        border-color: var(--summer-badge);
        color: var(--summer-badge);
      }

      .actions button.add-gap:hover {
        border-color: var(--gap-badge);
        color: var(--gap-badge);
      }

      .actions #cloudBtn[data-state="saved"] {
        border-color: var(--completed-bg);
      }

      .actions #cloudBtn[data-state="saving"],
      .actions #cloudBtn[data-state="loading"] {
        opacity: 0.7;
      }

      .actions #cloudBtn[data-state="error"] {
        border-color: var(--not-taken-border);
        color: var(--not-taken-border);
      }

      .actions button.add-extra:hover {
        border-color: var(--extra-badge);
        color: var(--extra-badge);
      }

      .progress-bar {
        height: 8px;
        border-radius: 5px;
        background: var(--border);
        overflow: hidden;
        margin-top: 2px;
      }

      .progress-fill {
        height: 100%;
        background: var(--completed-bg);
        width: 0%;
        transition: width 0.25s;
      }

      .progress-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 200px;
      }

      .plan {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 24px;
      }

      .term-row {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--border);
      }

      .term-row:last-child {
        border-bottom: none;
      }

      .term-row.summer .term-label {
        background: var(--summer-badge);
      }

      .term-row.gap .term-label {
        background: var(--gap-badge);
      }

      .term-row.extra .term-label {
        background: var(--extra-badge);
      }

      .gap-note {
        align-self: center;
        margin: 0 auto;
        padding: 10px 14px;
        color: var(--muted);
        font-size: 12px;
        font-style: italic;
      }

      .term-row.elective-row .term-label {
        background: var(--elective-badge);
        font-size: 12.5px;
      }

      .term-label {
        flex: 0 0 108px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--term-badge);
        color: var(--term-badge-text);
        font-weight: 800;
        font-size: 14px;
        text-align: center;
        padding: 8px;
        gap: 4px;
        position: relative;
      }

      .term-remove {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        color: #fff;
        border: none;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .term-remove:hover {
        background: rgba(0, 0, 0, 0.45);
      }

      .term-courses {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 1px;
        background: var(--border);
        min-height: 60px;
        transition: background 0.12s;
      }

      .term-courses.drag-over {
        background: var(--term-badge);
      }

      .term-courses.drag-invalid {
        background: var(--not-taken-bg);
      }

      .course {
        background: var(--not-taken-bg);
        color: var(--not-taken-text);
        border-inline-start: 4px solid var(--not-taken-border);
        padding: 9px 10px;
        cursor: pointer;
        user-select: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        min-height: 58px;
        flex: 1 1 150px;
        max-width: 220px;
        transition:
          filter 0.12s,
          transform 0.08s,
          opacity 0.12s;
      }

      .course:hover {
        filter: brightness(1.08);
      }

      .course:active {
        transform: scale(0.98);
      }

      .course.dragging {
        opacity: 0.35;
      }

      .course[draggable="true"] {
        cursor: grab;
      }

      .course.state-current {
        background: var(--current-bg);
        color: var(--current-text);
        border-inline-start-color: var(--current-border);
      }

      .course.state-completed {
        background: var(--completed-bg);
        color: var(--completed-text);
        border-inline-start-color: var(--completed-border);
      }

      .course.locked {
        background: var(--locked-bg);
        color: var(--locked-text);
        border-inline-start-color: var(--locked-border);
        cursor: grab;
        box-shadow: inset 0 0 0 2px var(--critical-accent);
      }

      .course.locked.state-completed {
        background: var(--completed-bg);
        border-inline-start-color: var(--completed-border);
      }

      .course.locked.state-current {
        background: var(--current-bg);
        color: var(--current-text);
        border-inline-start-color: var(--current-border);
      }

      .course .code-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .course .code {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        opacity: 0.9;
      }

      .course .lock-icon {
        font-size: 11px;
        opacity: 0.85;
      }

      .course .icon-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .exam-tick {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        border-radius: 3px;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        background: transparent;
        color: transparent;
        font-size: 11px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .exam-tick:hover {
        border-color: #fff;
      }

      .exam-tick.checked {
        background: #2f5fa8;
        border-color: #2f5fa8;
        color: #fff;
      }

      .move-tick {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        border-radius: 4px;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        background: transparent;
        color: currentColor;
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .move-tick:hover,
      .move-tick.active {
        background: var(--term-badge);
        border-color: var(--term-badge);
        color: #fff;
      }

      .course.move-selected {
        outline: 3px solid var(--summer-badge);
        outline-offset: -3px;
        filter: brightness(1.08);
      }

      .term-courses.move-target {
        box-shadow: inset 0 0 0 2px rgba(192, 122, 31, 0.45);
        cursor: copy;
      }

      .term-label.move-target-label,
      .add-course-tile.move-target-label {
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.45);
        cursor: copy;
      }

      .course.locked .exam-tick {
        border-color: rgba(255, 255, 255, 0.4);
      }

      .course.exempted .name {
        text-decoration: line-through;
        text-decoration-color: currentColor;
        text-decoration-thickness: 1.5px;
      }

      .course .name {
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.35;
      }

      .course .code-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .course .credit-pill {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        padding: 3px 6px;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 14%, transparent);
        white-space: nowrap;
      }

      .term-label .term-hours {
        font-size: 11px;
        font-weight: 700;
        opacity: 0.85;
      }

      .syllabus-tick {
        position: relative;
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        border-radius: 5px;
        border: 1.5px solid color-mix(in srgb, currentColor 45%, transparent);
        background: transparent;
        color: currentColor;
        font-size: 13px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: transform 0.15s;
      }

      /* Taller invisible hit area; kept narrow so it never covers the ↔ button beside it. */
      .syllabus-tick::after {
        content: "";
        position: absolute;
        inset: -8px -2px;
      }

      @media (pointer: coarse) {
        .syllabus-tick {
          width: 30px;
          height: 30px;
          flex-basis: 30px;
          font-size: 15px;
        }
      }

      .course.expanded > .code-row,
      .course.expanded > .name {
        cursor: pointer;
      }

      .syllabus-close {
        grid-column: 1 / -1;
        min-height: 36px;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, currentColor 8%, transparent);
        color: inherit;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .syllabus-close:hover {
        background: color-mix(in srgb, currentColor 16%, transparent);
      }

      .syllabus-tick:hover {
        border-color: currentColor;
      }

      .course.expanded .syllabus-tick {
        transform: rotate(180deg);
        background: color-mix(in srgb, currentColor 16%, transparent);
      }

      .term-courses .course.expanded {
        flex: 1 1 100%;
        max-width: none;
        cursor: default;
      }

      .syllabus-panel {
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 14px 22px;
        cursor: auto;
        user-select: text;
      }

      .syllabus-summary {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .syllabus-summary .chip {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }

      .syllabus-summary a {
        margin-inline-start: auto;
        font-size: 11.5px;
        font-weight: 700;
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .syllabus-panel h4 {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.75;
      }

      .syllabus-chapters {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 4px 14px;
      }

      .syllabus-chapters li {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 6px;
        font-size: 12px;
        line-height: 1.35;
      }

      .syllabus-chapters .ch-n {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        font-weight: 700;
        opacity: 0.7;
        padding-top: 1px;
      }

      .syllabus-chapters .ch-exams {
        display: block;
        font-size: 10.5px;
        opacity: 0.7;
      }

      .syllabus-weights {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .syllabus-weights li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        font-size: 12px;
      }

      .syllabus-weights .w-val {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 11px;
      }

      .syllabus-weights .w-bar {
        grid-column: 1 / -1;
        height: 4px;
        border-radius: 2px;
        background: color-mix(in srgb, currentColor 14%, transparent);
        overflow: hidden;
      }

      .syllabus-weights .w-bar span {
        display: block;
        height: 100%;
        background: color-mix(in srgb, currentColor 45%, transparent);
      }

      .syllabus-weights li.is-exam .w-bar span {
        background: var(--summer-badge);
      }

      .syllabus-empty {
        grid-column: 1 / -1;
        font-size: 12px;
        opacity: 0.75;
        font-style: italic;
      }

      @media (max-width: 720px) {
        .syllabus-panel {
          grid-template-columns: 1fr;
        }
      }

      .add-course-tile {
        flex: 0 0 44px;
        width: 44px;
        min-height: 58px;
        background: transparent;
        border: 2px dashed var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 20px;
        cursor: pointer;
        transition: 0.12s;
      }

      .add-course-tile:hover {
        border-color: var(--term-badge);
        color: var(--term-badge);
      }

      .lang-toggle {
        font-family: "JetBrains Mono", monospace !important;
        font-weight: 700;
        min-width: 42px;
      }

      .lang-toggle:hover {
        border-color: var(--summer-badge) !important;
        color: var(--summer-badge) !important;
      }

      .lang-toggle.active {
        background: var(--term-badge) !important;
        border-color: var(--term-badge) !important;
        color: #fff !important;
      }

      .course.view-only {
        cursor: default;
      }

      .course.elective-slot {
        background: var(--empty-slot-bg);
        color: var(--empty-slot-text);
        border-inline-start-color: var(--term-badge);
        cursor: default;
      }

      .course.elective-slot:hover {
        filter: none;
      }

      .compare-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        z-index: 60;
      }

      .compare-overlay.open {
        display: block;
      }

      .compare-panel {
        position: fixed;
        top: 4%;
        left: 50%;
        transform: translateX(-50%);
        width: min(1180px, 94vw);
        max-height: 90vh;
        overflow-y: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        display: none;
        z-index: 61;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .compare-panel.open {
        display: block;
      }

      .walk-panel {
        position: fixed;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, 92vw);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        display: none;
        z-index: 61;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .walk-panel.open {
        display: block;
      }

      /* Anchored next to the element the current step explains. */
      .walk-panel.anchored {
        transform: none;
        right: auto;
        width: min(400px, calc(100vw - 32px));
        transition:
          top 0.25s ease,
          left 0.25s ease;
      }

      .compare-overlay.walk-clear {
        background: transparent;
      }

      .walk-spot {
        position: fixed;
        z-index: 60;
        display: none;
        border-radius: 10px;
        pointer-events: none;
        box-shadow:
          0 0 0 3px var(--term-badge),
          0 0 0 9999px rgba(0, 0, 0, 0.55);
        transition:
          top 0.25s ease,
          left 0.25s ease,
          width 0.25s ease,
          height 0.25s ease;
      }

      .walk-spot.open {
        display: block;
      }

      .summer-panel {
        width: min(640px, 92vw);
      }

      .summer-options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        max-height: min(54vh, 430px);
        overflow-y: auto;
        margin-top: 16px;
        padding-inline-end: 4px;
      }

      .summer-option {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        padding: 12px;
        text-align: start;
        cursor: pointer;
        transition:
          border-color 0.14s ease,
          background 0.14s ease,
          transform 0.14s ease;
      }

      .summer-option:hover {
        border-color: var(--summer-badge);
        background: rgba(205, 130, 24, 0.12);
        transform: translateY(-1px);
      }

      .gap-panel .summer-option:hover {
        border-color: var(--gap-badge);
        background: rgba(91, 100, 114, 0.16);
        transform: translateY(-1px);
      }

      .summer-option-title {
        display: block;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .summer-option-meta {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .summer-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
      }

      .summer-actions button {
        font-family: "Tajawal", sans-serif;
        font-size: 13px;
        font-weight: 700;

          empty.textContent = s.syllabusEmpty;
          panel.appendChild(empty);
          return panel;

        const examShare = data.items
          .filter((i) => i.exam)

        const summary = document.createElement("div");

        chapCol.appendChild(chapList);

      function courseIndex() {
        const all = COURSES.concat(customCourses);
        const map = {};
        all.forEach((c) => (map[c.code] = c));
        return map;

      function coopCourse(map = courseIndex()) {
        return (
          Object.values(map).find((c) => {
            const name = `${c.nameEn || c.name || ""}`.toLowerCase();

              c.term === "t8" &&
              (name.includes("cooperative training") || /492$/.test(c.code))
            );
          }) ||
          map.SE492 ||
          map.CS492 ||
          map.IS492 ||
          null
        );
      }

      function defaultLocation(course) {
        return (
          course.term ||
          course.group ||
          (ELECTIVE_GROUPS[ELECTIVE_GROUPS.length - 1] || {}).id ||
          "grp-culture"

      // A course is "critical" (locked, non-draggable) if it's a prerequisite for at least one other course —
      // moving it could silently break that course's requirement chain.
      // General-ed / Arabic / Islamic courses students can take alongside the preparatory year in practice —
      // never lock these even if the plan lists them as a prerequisite for something later.
      const NEVER_LOCK = new Set([
        "ENG101",
        "ENG103",
        "MATH111",
        "MATH113",
        "PHY105",
        "PHY205",
        "PSY101",
        "ARAB101",

        "ISC101",

        "ISC105",
        "ISC203",

      // Still enforced as critical-path (move-earlier-only), just without the ⬆ badge cluttering the card.
      const NO_CRITICAL_ICON = new Set([
        "PE001",
        "PE002",
        "PDS001",
        "MATH001",
        "ENG020",
        "ENG010",
        "CMP011",
        "CS101",
        "CS102",
      ]);

      function computeGatewaySet(map) {
        const gateways = new Set();
        Object.values(map).forEach((c) =>
          (c.prereqs || []).forEach((p) => gateways.add(p)),
        );
        NEVER_LOCK.forEach((code) => gateways.delete(code));
        return gateways;
      }

      function allTerms() {
        return BASE_TERMS.concat(extraTerms).sort((a, b) => a.order - b.order);
      }
      function isGroupId(id) {
        return ELECTIVE_GROUPS.some((g) => g.id === id);
      }
      function termLabel(term) {
        return lang === "ar" ? term.labelAr : term.labelEn;

      function loadState() {
        let saved = {};
        try {
          saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
          saved = {};
        }
        applySavedState(saved);
      }
      function applySavedState(saved) {
        statusMap = saved.statusMap || {};
        extraTerms = saved.extraTerms || [];
        customCourses = saved.customCourses || [];
        examMap = saved.examMap || {};
        gradState = saved.gradState || gradState;
        const map = courseIndex();
        assignments = saved.assignments || {};
        Object.keys(map).forEach((code) => {
          if (!(code in assignments))
            assignments[code] = defaultLocation(map[code]);
        });
      }
      function saveState() {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            statusMap,
            assignments,
            extraTerms,
            customCourses,
            examMap,
            gradState,
            updatedAt: Date.now(),
          }),
        );
        queueCloudSave();
      }

      // Cloud copy of the plan in users/{uid}/private/data → academicPlanGrids[STORAGE_KEY], so a
      // signed-in student gets the same plan on every device. The newer of the two copies wins.
      let cloudUser = null;
      let cloudStatus = "signed-out";
      let cloudTimer = null;

      function readLocalPlan() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
        } catch (e) {
          return null;
        }
      }

      function setCloudStatus(status) {
        cloudStatus = status;
        renderCloudBtn();
      }

      function renderCloudBtn() {
        const btn = document.getElementById("cloudBtn");
        if (!btn) return;
        const s = t();
        btn.textContent = {
          "signed-out": s.cloudSignIn,
          loading: s.cloudLoading,
          saving: s.cloudSaving,
          saved: s.cloudSaved,
          error: s.cloudError,
        }[cloudStatus];
        btn.dataset.state = cloudStatus;
        btn.title = cloudUser
          ? s.cloudTitleIn(cloudUser.email || "")
          : s.cloudTitleOut;
      }

      function pushCloud() {
        clearTimeout(cloudTimer);
        const user = cloudUser;
        const plan = readLocalPlan();
        if (!user || !plan) return Promise.resolve();
        setCloudStatus("saving");
        return window.ShougPrivate.ready(user.uid)
          .then((ref) =>
            ref.set({ academicPlanGrids: { [STORAGE_KEY]: plan } }, { merge: true }),
          )
          .then(() => {
            if (cloudUser === user) setCloudStatus("saved");
          })
          .catch((err) => {
            console.warn("Plan sync failed", err);
            if (cloudUser === user) setCloudStatus("error");
          });
      }

      function queueCloudSave() {
        if (!cloudUser) return;
        clearTimeout(cloudTimer);
        setCloudStatus("saving");
        cloudTimer = setTimeout(pushCloud, 1200);
      }

      function pullCloud(user) {
        setCloudStatus("loading");
        return window.ShougPrivate.ready(user.uid)
          .then((ref) => ref.get())
          .then((snap) => {
            if (cloudUser !== user) return;
            const plans = (snap.exists && snap.data().academicPlanGrids) || {};
            const remote = plans[STORAGE_KEY];
            const local = readLocalPlan();
            if (remote && (remote.updatedAt || 0) > ((local && local.updatedAt) || 0)) {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
              loadState();
              render();
              toast(t().cloudLoaded);
              setCloudStatus("saved");
            } else if (local) {
              return pushCloud();
            } else {
              setCloudStatus("saved");
            }
          })
          .catch((err) => {
            console.warn("Plan sync failed", err);
            if (cloudUser === user) setCloudStatus("error");
          });
      }

      function withFirebase(cb) {
        if (window.__shoug_fb) return cb(window.__shoug_fb);
        window.addEventListener("shoug:fb", () => cb(window.__shoug_fb), {
          once: true,
        });
        if (!document.querySelector('script[src^="/javascripts/firebase-auth.js"]')) {
          const s = document.createElement("script");
          s.src = "/javascripts/firebase-auth.js?v=64";
          s.async = true;
          document.head.appendChild(s);
        }
      }

      function initCloudSync() {
        withFirebase((fb) =>
          fb.auth().onAuthStateChanged((user) => {
            clearTimeout(cloudTimer);
            cloudUser = user || null;
            if (!user) return setCloudStatus("signed-out");
            if (!window.ShougPrivate) return setCloudStatus("error");
            pullCloud(user);
          }),
        );
        document.getElementById("cloudBtn").addEventListener("click", () => {
          if (cloudUser) return pushCloud();
          withFirebase(() => {
            if (typeof window.__shougOpenAuthModal === "function")
              window.__shougOpenAuthModal();
          });
        });
      }

      function toast(msg) {
        const el = document.getElementById("toast");

        toastTimer = setTimeout(() => el.classList.remove("show"), 2600);

      /* ---------- Status cycling ---------- */
      function cycleStatus(code) {
        const cur = statusMap[code] || "not-taken";
        statusMap[code] = STATES[(STATES.indexOf(cur) + 1) % STATES.length];
        saveState();
        render();

      /* ---------- Prereq-aware drag validation ---------- */
      function dependentsOf(code, map) {
        return Object.values(map).filter((c) =>
          (c.prereqs || []).includes(code),
        );
      }

      function validateMove(code, targetId) {
        if (targetId === "pool" || isGroupId(targetId)) return { ok: true };
        const map = courseIndex();
        const course = map[code];
        const terms = allTerms();
        const targetTerm = terms.find((term) => term.id === targetId);
        const targetOrder = targetTerm.order;

        if (targetTerm.isGap) {
          return { ok: false, reason: t().gapNoCourses };
        }

        if (course.noPrepSummer && (targetTerm.isPrep || targetTerm.isSummer)) {
          return { ok: false, reason: t().moveBlockedNoPrepSummer(code) };
        }

        for (const preCode of course.prereqs || []) {
          const preLoc = assignments[preCode];
          if (!preLoc || preLoc === "pool" || isGroupId(preLoc)) continue;
          const preTerm = terms.find((term) => term.id === preLoc);
          if (preTerm && preTerm.order >= targetOrder) {
            return { ok: false, reason: t().moveBlockedPrereq(code, preCode) };
          }
        }

        // Standing gate (e.g. junior standing before CYS401): sum the credit hours of every course
        // scheduled strictly before this term and require it to clear the course's minHours threshold.
        if (course.minHours) {
          let priorHours = Object.values(map).reduce((sum, c) => {
            const loc = assignments[c.code];
            if (!loc || loc === "pool" || isGroupId(loc)) return sum;
            const locTerm = terms.find((term) => term.id === loc);
            return locTerm && locTerm.order < targetOrder
              ? sum + (c.hours || 0)
              : sum;
          }, 0);

          // Elective slots the official plan schedules before this term count toward standing until real
          // elective courses are dragged into the terms to fill them (official plans reach 70 hours this way).
          ELECTIVE_SLOTS.forEach((slot) => {
            const slotTerm = terms.find((term) => term.id === slot.term);
            const group = ELECTIVE_GROUPS.find((g) => g.id === slot.group);
            if (
              !slotTerm ||
              slotTerm.order >= targetOrder ||
              !group ||
              !group.required
            )
              return;
            const slotCount = ELECTIVE_SLOTS.filter(
              (s) => s.group === group.id,
            ).reduce((n, s) => n + s.count, 0);
            const placedHours = Object.values(map)
              .filter(
                (c) =>
                  c.group === group.id &&
                  terms.some((term) => term.id === assignments[c.code]),
              )
              .reduce((sum, c) => sum + (c.hours || 0), 0);
            priorHours += Math.max(
              0,
              (group.required * slot.count) / slotCount - placedHours,
            );
          });
          if (priorHours < course.minHours) {
            return {
              ok: false,
              reason: t().moveBlockedMinHours(
                code,
                course.minHours,
                priorHours,
              ),
            };
          }
        }

        for (const dep of dependentsOf(code, map)) {
          const depLoc = assignments[dep.code];
          if (!depLoc || depLoc === "pool" || isGroupId(depLoc)) continue;
          const depTerm = terms.find((term) => term.id === depLoc);
          if (depTerm && depTerm.order <= targetOrder) {
            return {
              ok: false,
              reason: t().moveBlockedDependent(code, dep.code),
            };
          }
        }

        // Critical-path courses (something else depends on them) can be pulled earlier — e.g. CS175 has no
        // prereqs so it's fine to take it in the 1st term instead of its usual 2nd — but never pushed later
        // than their listed term, since that would delay everything that depends on them.
        const gateways = computeGatewaySet(map);
        if (gateways.has(code) && !NEVER_LOCK.has(code) && course.term) {
          const defaultTerm = BASE_TERMS.find(
            (term) => term.id === course.term,
          );
          if (defaultTerm && targetOrder > defaultTerm.order) {
            return { ok: false, reason: t().moveBlockedCritical(code) };
          }
        }

        return { ok: true };
      }

      function wireDropZone(el, locationId) {
        el.dataset.termId = locationId;
        if (selectedMoveCode) el.classList.add("move-target");
        el.addEventListener("click", (e) => {
          if (!selectedMoveCode) return;
          e.preventDefault();
          e.stopPropagation();
          moveSelectedCourse(locationId);
        });
        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        });
        el.addEventListener("dragenter", (e) => {
          e.preventDefault();
          if (!draggingCode) return;
          const v = validateMove(draggingCode, locationId);
          el.classList.add(v.ok ? "drag-over" : "drag-invalid");
        });
        el.addEventListener("dragleave", () => {
          el.classList.remove("drag-over", "drag-invalid");
        });
        el.addEventListener("drop", (e) => {
          e.preventDefault();
          el.classList.remove("drag-over", "drag-invalid");
          const code = e.dataTransfer.getData("text/plain") || draggingCode;
          if (!code) return;
          const v = validateMove(code, locationId);
          if (!v.ok) {
            toast(v.reason);
            return;
          }
          assignments[code] = locationId;
          saveState();
          suppressClick = true;
          setTimeout(() => {
            suppressClick = false;
          }, 400);
          render();

      function walkthroughSteps(map) {
        const s = t();
        const courses = Object.values(map);
        const doneCount = courses.filter((c) => isCourseDone(c)).length;
        const currentCount = courses.filter(
          (c) => statusMap[c.code] === "current" && !isCourseDone(c),
        ).length;
        const summerCount = extraTerms.filter((term) => term.isSummer).length;
        const extraCount = extraTerms.filter((term) => term.isExtra).length;
        const gapCount = extraTerms.filter((term) => term.isGap).length;
        const movedCount = courses.filter(
          (c) =>
            assignments[c.code] && assignments[c.code] !== defaultLocation(c),
        ).length;
        const hasCustomLayout =
          summerCount > 0 ||
          extraCount > 0 ||
          gapCount > 0 ||
          movedCount > 0 ||
          customCourses.length > 0;
        const steps = hasCustomLayout
          ? s.walkCustomSteps(summerCount, extraCount, gapCount, movedCount)
          : doneCount > 0 || currentCount > 0
            ? s.walkProgressSteps(doneCount, currentCount)
            : s.walkBlankSteps;
        const kind = hasCustomLayout
          ? "custom"
          : doneCount > 0 || currentCount > 0
            ? "progress"
            : "blank";
        return Object.assign(steps.slice(), { kind });
      }

      // What each step points at, by position in its step set (same order in both languages).
      const WALK_TARGETS = {
        blank: ["course", "course", "addSummer", "toolbar", "critical", "prep", "grad"],
        progress: ["statusCourse", "course", "eye", "critical", "prep", "grad"],
        custom: ["customTerm", "movedCourse", "eye", "critical", "prep", "grad"],
      };
      let walkTargetKey = null;

      function walkTargets(key) {
        const visible = (el) => {
          if (!el) return false;
          const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0;
        };
        const first = (sel) =>
          [...document.querySelectorAll(sel)].find(visible) || null;
        const movedCourse = () => {
          const map = courseIndex();
          const code = Object.keys(map).find(
            (c) =>
              assignments[c] && assignments[c] !== defaultLocation(map[c]),
          );
          return code ? first(`.term-courses .course[data-code="${code}"]`) : null;
        };
        const pick = {
          course: () => first(".term-courses .course:not(.elective-slot)"),
          statusCourse: () =>
            first(".term-courses .course.state-current") ||
            first(".term-courses .course.state-completed"),
          critical: () => first(".term-courses .course.locked"),
          customTerm: () =>
            first(".term-row.summer, .term-row.extra, .term-row.gap") ||
            movedCourse(),
          movedCourse: () =>
            movedCourse() || first(".term-row.summer, .term-row.extra, .term-row.gap"),
          addSummer: () => document.getElementById("addSummerBtn"),
          toolbar: () => [
            document.getElementById("viewModeBtn"),
            document.getElementById("eyeBtn"),
          ],
          eye: () => document.getElementById("eyeBtn"),
          prep: () => document.getElementById("pypBtn"),
          grad: () => document.getElementById("gradBtn"),
        }[key];
        const found = pick ? pick() : null;
        return (Array.isArray(found) ? found : [found]).filter(visible);
      }

      function placeWalkthrough() {
        const panel = document.getElementById("walkPanel");
        const spot = document.getElementById("walkSpot");
        const overlay = document.getElementById("walkOverlay");
        const targets = panel.classList.contains("open")
          ? walkTargets(walkTargetKey)
          : [];
        if (!targets.length) {
          panel.classList.remove("anchored");
          panel.style.top = panel.style.left = "";
          spot.classList.remove("open");
          overlay.classList.remove("walk-clear");
          return;
        }
        const rects = targets.map((el) => el.getBoundingClientRect());
        const pad = 6;
        const box = {
          top: Math.min(...rects.map((r) => r.top)) - pad,
          left: Math.min(...rects.map((r) => r.left)) - pad,
          right: Math.max(...rects.map((r) => r.right)) + pad,
          bottom: Math.max(...rects.map((r) => r.bottom)) + pad,
        };
        Object.assign(spot.style, {
          top: `${box.top}px`,
          left: `${box.left}px`,
          width: `${box.right - box.left}px`,
          height: `${box.bottom - box.top}px`,
        });
        spot.classList.add("open");
        overlay.classList.add("walk-clear");
        panel.classList.add("anchored");

        const vw = document.documentElement.clientWidth;
        const vh = window.innerHeight;
        const gap = 12;
        const edge = 16;
        const pw = panel.offsetWidth;
        const ph = panel.offsetHeight;
        let top;
        if (box.bottom + gap + ph <= vh - edge) top = box.bottom + gap;
        else if (box.top - gap - ph >= edge) top = box.top - gap - ph;
        else top = vh - ph - edge;
        const center = (box.left + box.right) / 2;
        const left = Math.min(Math.max(center - pw / 2, edge), vw - pw - edge);
        panel.style.top = `${Math.max(edge, top)}px`;
        panel.style.left = `${Math.max(edge, left)}px`;
      }

      let walkPlaceQueued = false;
      function queuePlaceWalkthrough() {
        if (walkPlaceQueued) return;
        walkPlaceQueued = true;
        requestAnimationFrame(() => {
          walkPlaceQueued = false;
          placeWalkthrough();
        });
      }
      window.addEventListener("scroll", queuePlaceWalkthrough, { passive: true });
      window.addEventListener("resize", queuePlaceWalkthrough);

      function renderWalkthrough() {
        const steps = walkthroughSteps(courseIndex());
        if (walkStep >= steps.length) walkStep = Math.max(0, steps.length - 1);
        const [title, body] = steps[walkStep];
        document.getElementById("walkStepCount").textContent =
          t().walkStepCount(walkStep + 1, steps.length);
        document.getElementById("walkStepTitle").textContent = title;
        document.getElementById("walkStepBody").textContent = body;
        document.getElementById("walkPrevBtn").style.visibility =
          walkStep === 0 ? "hidden" : "";
        document.getElementById("walkNextBtn").textContent =
          walkStep === steps.length - 1 ? t().walkDone : t().walkNext;
        const key = (WALK_TARGETS[steps.kind] || [])[walkStep] || null;
        const stepChanged = key !== walkTargetKey;
        walkTargetKey = key;
        // render() calls this before rebuilding the plan, so wait a frame for the new cards.
        requestAnimationFrame(() => {
          const target = walkTargets(walkTargetKey)[0];
          if (stepChanged && target) {
            const r = target.getBoundingClientRect();
            if (r.top < 16 || r.bottom > window.innerHeight - 16)
              target.scrollIntoView({ block: "center", behavior: "smooth" });
          }
          placeWalkthrough();
        });
      }

      function buildTermRow(term, map, gateways) {
        const row = document.createElement("div");
        row.className =
          "term-row" +
          (term.isSummer ? " summer" : "") +
          (term.isExtra ? " extra" : "") +

        const label = document.createElement("div");

        label.innerHTML = `<span>${termLabel(term)}</span>`;
        const termCourses = Object.values(map).filter(
          (c) => assignments[c.code] === term.id,
        );
        if (termCourses.length) {
          const termHours = termCourses.reduce((sum, c) => sum + (c.hours || 0), 0);
          const hoursTag = document.createElement("small");
          hoursTag.className = "term-hours";
          hoursTag.textContent = termHours ? t().termHours(termHours) : t().nonCredit;
          label.appendChild(hoursTag);
        }
        if (selectedMoveCode && !viewMode) {
          label.classList.add("move-target-label");
          label.addEventListener("click", (e) => {
            e.preventDefault();

        if ((term.isSummer || term.isExtra || term.isGap) && !viewMode) {

          rm.className = "term-remove";

        const courses = document.createElement("div");

        Object.values(map)
          .filter((c) => assignments[c.code] === term.id)

          );

        if (term.isGap && courses.children.length === 0) {

          note.className = "gap-note";
          note.textContent = t().gapNote;

        if (viewMode) {

        wireDropZone(courses, term.id);
        row.appendChild(courses);

        if (!term.isGap) {
          const addTile = document.createElement("div");
          addTile.className = "add-course-tile";
          addTile.textContent = "+";
          addTile.title = t().addCourseTileTitle;
          if (selectedMoveCode) addTile.classList.add("move-target-label");
          addTile.addEventListener("click", () => {
            if (selectedMoveCode) moveSelectedCourse(term.id);
            else addCourseToTerm(term.id);

      function render() {
        renderStaticText();
        const map = courseIndex();
        const gateways = computeGatewaySet(map);
        if (document.getElementById("walkPanel").classList.contains("open"))
          renderWalkthrough();

        const planPrep = document.getElementById("plan-prep");
        const plan = document.getElementById("plan");
        planPrep.innerHTML = "";
        plan.innerHTML = "";
        planPrep.style.display = gradState.dropPYP ? "none" : "";

        allTerms().forEach((term) => {
          if (gradState.dropPYP && term.isPrep) return;
          const row = buildTermRow(term, map, gateways);
          (term.isPrep ? planPrep : plan).appendChild(row);
        });

        const planElectives = document.getElementById("plan-electives");
        planElectives.innerHTML = "";

        ELECTIVE_GROUPS.forEach((group) => {
          const groupCourses = Object.values(map).filter(
            (c) => c.group === group.id,
          );

            .filter((c) => statusMap[c.code] === "completed")
            .reduce((sum, c) => sum + (c.hours || 0), 0);

          const row = document.createElement("div");
          row.className = "term-row elective-row";

          const label = document.createElement("div");

          if (selectedMoveCode && !viewMode) {

            label.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              moveSelectedCourse(group.id);
            });
          }
          row.appendChild(label);

          const courses = document.createElement("div");
          courses.className = "term-courses";
          Object.values(map)
            .filter((c) => assignments[c.code] === group.id)
            .forEach((c) =>
              courses.appendChild(courseEl(c, gateways.has(c.code), viewMode)),
            );

          if (viewMode) {
            row.appendChild(courses);
            planElectives.appendChild(row);
            return;
          }

          wireDropZone(courses, group.id);
          row.appendChild(courses);

          const addTile = document.createElement("div");
          addTile.className = "add-course-tile";
          addTile.textContent = "+";
          addTile.title = t().addCourseTileTitle;
          if (selectedMoveCode) addTile.classList.add("move-target-label");
          addTile.addEventListener("click", () => {
            if (selectedMoveCode) moveSelectedCourse(group.id);
            else addCourseToTerm(group.id);
          });

          planElectives.appendChild(row);
        });

        updateProgress(map);

        if (document.getElementById("comparePanel").classList.contains("open"))
          renderCompare();
      }

      // Counting every elective as its own slot (98 total) wildly overstates what's left — most electives are
      // interchangeable options where only ONE satisfies the requirement (e.g. any single PE course covers the
      // whole PE group). This counts against the real required course count instead: every core/prep course,
      // plus one slot per elective group that actually carries required hours (satisfied once any course in
      // that group is completed/waived) — matching the same total used by the "Remaining to graduate" card.
      function updateProgress(map) {
        const startTermId = gradState.dropPYP
          ? "t1"
          : (gradState && gradState.startTerm) || "prep1";
        const totals = totalPlanRequirements(startTermId);
        let done = 0,
          doneHours = 0;
        Object.values(map).forEach((c) => {
          if (!c.term || !termMeetsStartScope(c, startTermId)) return;
          if (
            statusMap[c.code] === "completed" ||
            (c.examEligible && examMap[c.code])
          ) {
            done++;
            doneHours += c.hours || 0;
          }
        });
        ELECTIVE_GROUPS.forEach((g) => {
          if (g.required <= 0) return;
          const completedHours = Object.values(map)
            .filter((c) => c.group === g.id && isCourseDone(c))
            .reduce((sum, c) => sum + (c.hours || 0), 0);
          if (completedHours >= g.required) done++;
          doneHours += Math.min(completedHours, g.required);
        });
        const pct = totals.courses
          ? Math.round((done / totals.courses) * 100)
          : 0;
        document.getElementById("progressText").textContent = t().progress(
          done,
          totals.courses,
          pct,
          doneHours,
          totals.hours,
        );
        document.getElementById("progressFill").style.width = pct + "%";
      }

      // Read-only static course tile for the comparison panel: same status colors, no drag/lock affordances.
      function staticCourseEl(course) {
        const div = document.createElement("div");
        const st = statusMap[course.code] || "not-taken";
        const exempted = course.examEligible && !!examMap[course.code];
        div.className =
          "course" +
          (exempted
            ? " state-completed exempted"
            : st === "current"
              ? " state-current"
              : st === "completed"
                ? " state-completed"
                : "");
        const displayName =
          lang === "ar" ? course.name : course.nameEn || course.name;
        div.innerHTML = `<div class="code-row"><span class="code">${course.code}</span></div><span class="name">${displayName}</span>`;
        return div;
      }

      // Renders the plan exactly as the official COURSES data lists it (term/group), ignoring drag moves,
      // added summer terms, and custom courses — so it reflects only what the university originally planned.

      function staticElectiveSlotEl(slot, slotIndex, slotCount) {
        const group = ELECTIVE_GROUPS.find((g) => g.id === slot.group);
        const div = document.createElement("div");
        div.className = "course elective-slot";
        const label = group && group.label ? group.label : t().elective;
        const suffix =
          slotCount > 1 ? " " + (slotIndex + 1) + "/" + slotCount : "";
        div.innerHTML =
          '<div class="code-row"><span class="code">' +
          t().elective +
          '</span></div><span class="name">' +
          label +
          suffix +
          "</span>";
        return div;
      }

        compareMain.innerHTML = "";
        compareElectives.innerHTML = "";
        comparePrep.style.display = gradState.dropPYP ? "none" : "";

        BASE_TERMS.slice()
          .sort((a, b) => a.order - b.order)
          .forEach((term) => {
            if (gradState.dropPYP && term.isPrep) return;
            const row = document.createElement("div");
            row.className = "term-row";
            const label = document.createElement("div");

            );

            .filter(
              (c) =>
                statusMap[c.code] === "completed" ||
                (c.examEligible && examMap[c.code]),
            )
            .reduce((sum, c) => sum + (c.hours || 0), 0);

          const row = document.createElement("div");
          row.className = "term-row elective-row";
          const label = document.createElement("div");

          row.appendChild(label);

          const courses = document.createElement("div");
          courses.className = "term-courses";
          groupCourses.forEach((c) => courses.appendChild(staticCourseEl(c)));
