      // One course open at a time; opening one closes the last and brings its panel into view.
      function toggleSyllabus(code) {
        const opening = !expandedCodes.has(code);
        expandedCodes.clear();
        if (opening) expandedCodes.add(code);
        render();
        if (!opening) return;
        const card = document.querySelector(
          `.term-courses .course.expanded[data-code="${code}"]`,
        );
        if (!card) return;
        const r = card.getBoundingClientRect();
        if (r.top < 16 || r.bottom > window.innerHeight - 16)
          card.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape" || !expandedCodes.size) return;
        if (document.getElementById("walkPanel").classList.contains("open"))
          return;
        expandedCodes.clear();
        render();
      });

      function syllabusPanel(course) {
        const s = t();
        const data = SYLLABI[course.code];
        const panel = document.createElement("div");
        panel.className = "syllabus-panel";
        panel.addEventListener("click", (e) => e.stopPropagation());
        panel.addEventListener("mousedown", (e) => e.stopPropagation());

        if (!data) {
          const empty = document.createElement("div");
          empty.className = "syllabus-empty";
          empty.textContent = s.syllabusEmpty;
          panel.appendChild(empty);
          return panel;
        }

        const examShare = data.items
          .filter((i) => i.exam)
          .reduce((sum, i) => sum + i.weight, 0);
        const summary = document.createElement("div");
        summary.className = "syllabus-summary";
        const chips = [
          data.chapterLabel === "assignments"
            ? s.syllabusAssignments(data.chapters.length)
            : s.syllabusChapters(data.chapters.length),
          s.syllabusExamShare(examShare),
        ];
        if (data.syllabusCode) chips.push(s.syllabusOldCode(data.syllabusCode));
        chips.forEach((text) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = text;
          summary.appendChild(chip);
        });
        if (data.syllabus) {
          const link = document.createElement("a");
          link.href = data.syllabus;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = s.syllabusOpen;
          summary.appendChild(link);
        }
        panel.appendChild(summary);

        const chapCol = document.createElement("div");
        chapCol.innerHTML = `<h4>${s.syllabusChaptersHead}</h4>`;
        const chapList = document.createElement("ol");
        chapList.className = "syllabus-chapters";
        data.chapters.forEach((ch) => {
          const li = document.createElement("li");
          const n = document.createElement("span");
          n.className = "ch-n";
          n.textContent = ch.n;
          const title = document.createElement("span");
          title.textContent = ch.title;
          if (ch.exams && ch.exams.length) {
            const ex = document.createElement("span");
            ex.className = "ch-exams";
            ex.textContent = ch.exams.join(" · ");
            title.appendChild(ex);
          }
          li.append(n, title);
          chapList.appendChild(li);
        });
        chapCol.appendChild(chapList);
        panel.appendChild(chapCol);

        const weightCol = document.createElement("div");
        weightCol.innerHTML = `<h4>${s.syllabusWeightsHead}</h4>`;
        const weightList = document.createElement("ul");
        weightList.className = "syllabus-weights";
        data.items.forEach((item) => {
          const li = document.createElement("li");
          if (item.exam) li.className = "is-exam";
          const label = document.createElement("span");
          label.textContent = item.title;
          const val = document.createElement("span");
          val.className = "w-val";
          val.textContent = `${item.weight}%`;
          const bar = document.createElement("span");
          bar.className = "w-bar";
          const fill = document.createElement("span");
          fill.style.width = `${item.weight}%`;
          bar.appendChild(fill);
          li.append(label, val, bar);
          weightList.appendChild(li);
        });
        weightCol.appendChild(weightList);
        panel.appendChild(weightCol);

        return panel;
      }

      function courseIndex() {
        const all = COURSES.concat(customCourses);
        const map = {};
        all.forEach((c) => (map[c.code] = c));
        return map;
      }

      function coopCourse(map = courseIndex()) {
        return (
          Object.values(map).find((c) => {
            const name = `${c.nameEn || c.name || ""}`.toLowerCase();
            return (
              c.term === "t8" &&
              (name.includes("cooperative training") || /492$/.test(c.code))
            );
          }) ||
          map.SE492 ||
          map.CS492 ||
          map.IS492 ||
          null
        );
      }

      function defaultLocation(course) {
        return (
          course.term ||
          course.group ||
          (ELECTIVE_GROUPS[ELECTIVE_GROUPS.length - 1] || {}).id ||
          "grp-culture"
        );
      }

      // A course is "critical" (locked, non-draggable) if it's a prerequisite for at least one other course —
      // moving it could silently break that course's requirement chain.
      // General-ed / Arabic / Islamic courses students can take alongside the preparatory year in practice —
      // never lock these even if the plan lists them as a prerequisite for something later.
      const NEVER_LOCK = new Set([
        "ENG101",
        "ENG103",
        "MATH111",
        "MATH113",
        "PHY105",
        "PHY205",
        "PSY101",
        "ARAB101",
        "ARAB103",
        "ARAB203",
        "ISC101",
        "ISC103",
        "ISC105",
        "ISC203",
      ]);

      // Still enforced as critical-path (move-earlier-only), just without the ⬆ badge cluttering the card.
      const NO_CRITICAL_ICON = new Set([
        "PE001",
        "PE002",
        "PDS001",
        "MATH001",
        "ENG020",
        "ENG010",
        "CMP011",
        "CS101",
        "CS102",
      ]);

      function computeGatewaySet(map) {
        const gateways = new Set();
        Object.values(map).forEach((c) =>
          (c.prereqs || []).forEach((p) => gateways.add(p)),
        );
        NEVER_LOCK.forEach((code) => gateways.delete(code));
        return gateways;
      }

      function allTerms() {
        return BASE_TERMS.concat(extraTerms).sort((a, b) => a.order - b.order);
      }
      function isGroupId(id) {
        return ELECTIVE_GROUPS.some((g) => g.id === id);
      }
      function termLabel(term) {
        return lang === "ar" ? term.labelAr : term.labelEn;
      }

      function loadState() {
        let saved = {};
        try {
          saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
          saved = {};
        }
        applySavedState(saved);
      }
      function applySavedState(saved) {
        statusMap = saved.statusMap || {};
        extraTerms = saved.extraTerms || [];
        customCourses = saved.customCourses || [];
        examMap = saved.examMap || {};
        withdrawals = saved.withdrawals || [];
        togetherPairs = saved.togetherPairs || [];
        tuition = Object.assign(
          { regular: null, summer: null, coopFee: null },
          saved.tuition,
        );
        gradState = saved.gradState || gradState;
        const map = courseIndex();
        assignments = saved.assignments || {};
        Object.keys(map).forEach((code) => {
          if (!(code in assignments))
            assignments[code] = defaultLocation(map[code]);
        });
      }
      function saveState() {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            statusMap,
            assignments,
            extraTerms,
            customCourses,
            examMap,
            withdrawals,
            togetherPairs,
            tuition,
            gradState,
            updatedAt: Date.now(),
          }),
        );
        queueCloudSave();
      }

      // Cloud copy of the plan in users/{uid}/private/data → academicPlanGrids[STORAGE_KEY], so a
      // signed-in student gets the same plan on every device. The newer of the two copies wins.
      let cloudUser = null;
      let cloudStatus = "signed-out";
      let cloudTimer = null;

      function readLocalPlan() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
        } catch (e) {
          return null;
        }
      }

      function setCloudStatus(status) {
        cloudStatus = status;
        renderCloudBtn();
      }

      function renderCloudBtn() {
        const btn = document.getElementById("cloudBtn");
        if (!btn) return;
        const s = t();
        btn.textContent = {
          "signed-out": s.cloudSignIn,
          loading: s.cloudLoading,
          saving: s.cloudSaving,
          saved: s.cloudSaved,
          error: s.cloudError,
        }[cloudStatus];
        btn.dataset.state = cloudStatus;
        btn.title = cloudUser
          ? s.cloudTitleIn(cloudUser.email || "")
          : s.cloudTitleOut;
      }

      function pushCloud() {
        clearTimeout(cloudTimer);
        const user = cloudUser;
        const plan = readLocalPlan();
        if (!user || !plan) return Promise.resolve();
        setCloudStatus("saving");
        return window.ShougPrivate.ready(user.uid)
          .then((ref) =>
            ref.set(
              { academicPlanGrids: { [STORAGE_KEY]: plan } },
              { merge: true },
            ),
          )
          .then(() => {
            if (cloudUser === user) setCloudStatus("saved");
          })
          .catch((err) => {
            console.warn("Plan sync failed", err);
            if (cloudUser === user) setCloudStatus("error");
          });
      }

      function queueCloudSave() {
        if (!cloudUser) return;
        clearTimeout(cloudTimer);
        setCloudStatus("saving");
        cloudTimer = setTimeout(pushCloud, 1200);
      }

      function pullCloud(user) {
        setCloudStatus("loading");
        return window.ShougPrivate.ready(user.uid)
          .then((ref) => ref.get())
          .then((snap) => {
            if (cloudUser !== user) return;
            const plans = (snap.exists && snap.data().academicPlanGrids) || {};
            const remote = plans[STORAGE_KEY];
            const local = readLocalPlan();
            if (
              remote &&
              (remote.updatedAt || 0) > ((local && local.updatedAt) || 0)
            ) {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
              loadState();
              render();
              toast(t().cloudLoaded);
              setCloudStatus("saved");
            } else if (local) {
              return pushCloud();
            } else {
              setCloudStatus("saved");
            }
          })
          .catch((err) => {
            console.warn("Plan sync failed", err);
            if (cloudUser === user) setCloudStatus("error");
          });
      }

      function withFirebase(cb) {
        if (window.__shoug_fb) return cb(window.__shoug_fb);
        window.addEventListener("shoug:fb", () => cb(window.__shoug_fb), {
          once: true,
        });
        if (
          !document.querySelector(
            'script[src^="/javascripts/firebase-auth.js"]',
          )
        ) {
          const s = document.createElement("script");
          s.src = "/javascripts/firebase-auth.js?v=64";
          s.async = true;
          document.head.appendChild(s);
        }
      }

      function initCloudSync() {
        withFirebase((fb) =>
          fb.auth().onAuthStateChanged((user) => {
            clearTimeout(cloudTimer);
            cloudUser = user || null;
            if (!user) return setCloudStatus("signed-out");
            if (!window.ShougPrivate) return setCloudStatus("error");
            pullCloud(user);
          }),
        );
        document.getElementById("cloudBtn").addEventListener("click", () => {
          if (cloudUser) return pushCloud();
          withFirebase(() => {
            if (typeof window.__shougOpenAuthModal === "function")
              window.__shougOpenAuthModal();
          });
        });
      }

      function toggleExam(code) {
        examMap[code] = !examMap[code];
        saveState();
        render();
      }

      /* ---------- Toast ---------- */
      let toastTimer;
      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
      }

      /* ---------- Status cycling ---------- */
      function cycleStatus(code) {
        const cur = statusMap[code] || "not-taken";
        statusMap[code] = STATES[(STATES.indexOf(cur) + 1) % STATES.length];
        saveState();
        render();
      }

      /* ---------- Prereq-aware drag validation ---------- */
      function dependentsOf(code, map) {
        return Object.values(map).filter((c) =>
          (c.prereqs || []).includes(code),
        );
      }

      function validateMove(code, targetId) {
        if (targetId === "pool" || isGroupId(targetId)) return { ok: true };
        const map = courseIndex();
        const course = map[code];
        const terms = allTerms();
        const targetTerm = terms.find((term) => term.id === targetId);
        const targetOrder = targetTerm.order;

        if (targetTerm.isGap) {
          return { ok: false, reason: t().gapNoCourses };
        }

        const lastDrop = latestWithdrawal(code);
        const dropTerm =
          lastDrop && terms.find((x) => x.id === lastDrop.termId);
        if (dropTerm && targetOrder <= dropTerm.order) {
          return {
            ok: false,
            reason: t().moveBlockedWithdrawn(code, nameOfTerm(dropTerm)),
          };
        }

        if (course.noPrepSummer && (targetTerm.isPrep || targetTerm.isSummer)) {
          return { ok: false, reason: t().moveBlockedNoPrepSummer(code) };
        }

        for (const preCode of course.prereqs || []) {
          const preLoc = assignments[preCode];
          if (!preLoc || preLoc === "pool" || isGroupId(preLoc)) continue;
          const preTerm = terms.find((term) => term.id === preLoc);
          if (
            preTerm &&
            preTerm.order >= targetOrder &&
            !(preTerm.order === targetOrder && isTogether(preCode, code))
          ) {
            return { ok: false, reason: t().moveBlockedPrereq(code, preCode) };
          }
        }

        // Standing gate (e.g. junior standing before CYS401): sum the credit hours of every course
        // scheduled strictly before this term and require it to clear the course's minHours threshold.
        if (course.minHours) {
          const priorHours = standingHoursBefore(targetOrder, map, terms);
          if (priorHours < course.minHours) {
            return {
              ok: false,
              reason: t().moveBlockedMinHours(
                code,
                course.minHours,
                priorHours,
              ),
            };
          }
        }

        for (const dep of dependentsOf(code, map)) {
          const depLoc = assignments[dep.code];
          if (!depLoc || depLoc === "pool" || isGroupId(depLoc)) continue;
          const depTerm = terms.find((term) => term.id === depLoc);
          if (
            depTerm &&
            depTerm.order <= targetOrder &&
            !(depTerm.order === targetOrder && isTogether(code, dep.code))
          ) {
            return {
              ok: false,
              dependents: true,
              reason: t().moveBlockedDependent(code, dep.code),
            };
          }
        }

        // Critical-path courses (something else depends on them) can be pulled earlier — e.g. CS175 has no
        // prereqs so it's fine to take it in the 1st term instead of its usual 2nd — but never pushed later
        // than their listed term, since that would delay everything that depends on them.
        const gateways = computeGatewaySet(map);
        if (
          gateways.has(code) &&
          !NEVER_LOCK.has(code) &&
          course.term &&
          !delayedByDrop(code, map)
        ) {
          const defaultTerm = BASE_TERMS.find(
            (term) => term.id === course.term,
          );
          const nowIn = termById(assignments[code]);
          if (
            defaultTerm &&
            targetOrder > defaultTerm.order &&
            (!nowIn || targetOrder > nowIn.order)
          ) {
            return {
              ok: false,
              critical: true,
              reason: t().moveBlockedCritical(code),
            };
          }
        }

        return { ok: true };
      }

      /* ---------- Drop a course (W) ---------- */
      // A drop leaves a ghost in the term it happened in and moves the course to the next usable term.
      // Later courses that can no longer sit where they are (prerequisite or standing) move with it.
      function termById(id) {
        return allTerms().find((term) => term.id === id) || null;
      }

      function isCustomCourse(code) {
        return customCourses.some((c) => c.code === code);
      }

      function nameOfTerm(term) {
        return term.isPrep || term.isSummer || term.isExtra || term.isGap
          ? termLabel(term)
          : t().report.baseTerm(termLabel(term));
      }

      function latestWithdrawal(code) {
        return withdrawals.filter((w) => w.code === code).pop() || null;
      }

      // Set back by a drop (its own or a prerequisite's), so it may now sit later than the official term.
      function delayedByDrop(code, map, seen = new Set()) {
        if (seen.has(code)) return false;
        seen.add(code);
        if (
          withdrawals.some(
            (w) =>
              w.code === code || (w.moves || []).some((m) => m.code === code),
          )
        )
          return true;
        return ((map[code] || {}).prereqs || []).some((p) =>
          delayedByDrop(p, map, seen),
        );
      }

      function standingHoursBefore(targetOrder, map, terms) {
        let priorHours = Object.values(map).reduce((sum, c) => {
          const loc = assignments[c.code];
          if (!loc || loc === "pool" || isGroupId(loc)) return sum;
          const locTerm = terms.find((term) => term.id === loc);
          return locTerm && locTerm.order < targetOrder
            ? sum + (c.hours || 0)
            : sum;
        }, 0);

        // Elective slots the official plan schedules before this term count toward standing until real
        // elective courses are dragged into the terms to fill them (official plans reach 70 hours this way).
        ELECTIVE_SLOTS.forEach((slot) => {
          const slotTerm = terms.find((term) => term.id === slot.term);
          const group = ELECTIVE_GROUPS.find((g) => g.id === slot.group);
          if (
            !slotTerm ||
            slotTerm.order >= targetOrder ||
            !group ||
            !group.required
          )
            return;
          const slotCount = ELECTIVE_SLOTS.filter(
            (s) => s.group === group.id,
          ).reduce((n, s) => n + s.count, 0);
          const placedHours = Object.values(map)
            .filter(
              (c) =>
                c.group === group.id &&
                terms.some((term) => term.id === assignments[c.code]),
            )
            .reduce((sum, c) => sum + (c.hours || 0), 0);
          priorHours += Math.max(
            0,
            (group.required * slot.count) / slotCount - placedHours,
          );
        });
        return priorHours;
      }

      function placementBroken(course, map, terms) {
        const term = terms.find((x) => x.id === assignments[course.code]);
        if (!term) return false;
        const preBroken = (course.prereqs || []).some((p) => {
          const preTerm = terms.find((x) => x.id === assignments[p]);
          if (
            preTerm &&
            preTerm.order === term.order &&
            isTogether(p, course.code)
          )
            return false;
          return preTerm && preTerm.order >= term.order;
        });
        if (preBroken) return true;
        return (
          !!course.minHours &&
          standingHoursBefore(term.order, map, terms) < course.minHours
        );
      }

      // A prerequisite and its dependent the university lets a student take in the same semester.
      function isTogether(pre, dep) {
        return togetherPairs.some((x) => x.pre === pre && x.dep === dep);
      }

      function usableAfter(course, term, order, regularOnly) {
        return (
          term.order > order &&
          !term.isGap &&
          !(term.isPrep && gradState.dropPYP) &&
          !(course.noPrepSummer && (term.isPrep || term.isSummer)) &&
          !(regularOnly && term.isSummer)
        );
      }

      // Courses pushed along by a drop skip summers: not everything runs in one.
      function nextTermFor(course, afterOrder, createdTerms, allowSummer) {
        const next = allTerms().find((term) =>
          usableAfter(course, term, afterOrder, !allowSummer),
        );
        if (next) return next;
        const all = allTerms();
        const n = extraTerms.filter((term) => term.isExtra).length + 1;
        const created = {
          id: `extra-${Date.now()}-${n}`,
          labelAr: "فصل إضافي " + n,
          labelEn: "Extra Semester " + n,
          order: all[all.length - 1].order + 0.5,
          isExtra: true,
        };
        extraTerms.push(created);
        createdTerms.push(created.id);
        return created;
      }

      // Moves a course to its retake term. Dependents either move later or, with keep, stay beside it
      // under a university exception. Anything else the move breaks is pushed down.
      function applyRetake(code, targetId, keep) {
        const map = courseIndex();
        const course = map[code];
        const fromTerm = termById(assignments[code]);
        const brokenBefore = new Set(
          Object.values(map)
            .filter((c) => placementBroken(c, map, allTerms()))
            .map((c) => c.code),
        );
        const moves = [];
        const createdTerms = [];
        const together = [];
        const move = (c, target) => {
          const seen = moves.find((m) => m.code === c.code);
          if (seen) seen.to = target.id;
          else
            moves.push({
              code: c.code,
              from: assignments[c.code],
              to: target.id,
            });
          assignments[c.code] = target.id;
        };
        const target =
          (targetId && termById(targetId)) ||
          nextTermFor(course, fromTerm.order, createdTerms, false);
        move(course, target);
        if (keep) {
          dependentsOf(code, map).forEach((dep) => {
            const at = termById(assignments[dep.code]);
            if (!at || isCourseDone(dep) || statusMap[dep.code] === "current")
              return;
            if (at.order > target.order) return;
            if (at.order < target.order) move(dep, target);
            const pair = { pre: code, dep: dep.code };
            togetherPairs.push(pair);
            together.push(pair);
          });
        }
        for (let pass = 0; pass < 40; pass++) {
          const terms = allTerms();
          const broken = Object.values(map).find(
            (c) =>
              !isCourseDone(c) &&
              statusMap[c.code] !== "current" &&
              !brokenBefore.has(c.code) &&
              placementBroken(c, map, terms),
          );
          if (!broken) break;
          const at = terms.find((x) => x.id === assignments[broken.code]);
          move(broken, nextTermFor(broken, at.order, createdTerms, false));
        }
        return { moves, createdTerms, together, target };
      }

      function dropCourse(code, options = {}) {
        const map = courseIndex();
        const course = map[code];
        const fromTerm = termById(assignments[code]);
        if (!course || !fromTerm) return;
        const grade = options.grade === "F" ? "F" : "W";
        const prevStatus = statusMap[code] || "not-taken";
        // "not-taken", not delete: the cloud copy is merged key by key, so a deleted key would come back.
        statusMap[code] = "not-taken";
        const plan = applyRetake(
          code,
          options.targetId || null,
          !!options.keep,
        );
        withdrawals.push({
          id: `w-${Date.now()}-${withdrawals.length}`,
          code,
          grade,
          termId: fromTerm.id,
          hours: billedHours(course),
          nameAr: course.name || code,
          nameEn: course.nameEn || course.name || code,
          prevStatus,
          refund: 0,
          moves: plan.moves,
          createdTerms: plan.createdTerms,
          together: plan.together,
          at: Date.now(),
        });
        if (selectedMoveCode === code) selectedMoveCode = null;
        expandedCodes.clear();
        saveState();
        render();
        const s = t();
        const finalTerm = termById(assignments[code]);
        toast(
          (grade === "F" ? s.failDone : s.dropDone)(
            code,
            nameOfTerm(fromTerm),
            nameOfTerm(finalTerm),
          ) +
            (plan.moves.length > 1
              ? s.dropAlsoMoved(plan.moves.length - 1)
              : ""),
        );
      }

      // A retake moved later on, e.g. out of a summer that doesn't offer it. Undo on the W/F covers this too.
      function moveRetake(code, targetId, keep) {
        const plan = applyRetake(code, targetId, keep);
        const record = withdrawals
          .slice()
          .reverse()
          .find(
            (w) =>
              w.code === code || (w.moves || []).some((m) => m.code === code),
          );
        if (record) {
          plan.moves.forEach((m) => {
            const seen = record.moves.find((x) => x.code === m.code);
            if (seen) seen.to = m.to;
            else record.moves.push(m);
          });
          record.createdTerms = (record.createdTerms || []).concat(
            plan.createdTerms,
          );
          record.together = (record.together || []).concat(plan.together);
        }
        if (selectedMoveCode === code) selectedMoveCode = null;
        saveState();
        render();
        const s = t();
        toast(
          s.moveCourseDone(code) +
            (plan.moves.length > 1
              ? s.dropAlsoMoved(plan.moves.length - 1)
              : ""),
        );
      }

      // Runs the plan on the live state to see what it would touch, then puts everything back.
      function previewRetake(code, targetId, keep) {
        const saved = {
          assignments: { ...assignments },
          extraTerms: extraTerms.slice(),
          togetherPairs: togetherPairs.slice(),
        };
        const plan = applyRetake(code, targetId, keep);
        assignments = saved.assignments;
        extraTerms = saved.extraTerms;
        togetherPairs = saved.togetherPairs;
        return plan;
      }

      function retakeConflicts(code, targetId) {
        const target = targetId && termById(targetId);
        if (!target) return [];
        return dependentsOf(code, courseIndex()).filter((dep) => {
          const at = termById(assignments[dep.code]);
          return (
            at &&
            at.order <= target.order &&
            !isCourseDone(dep) &&
            statusMap[dep.code] !== "current" &&
            !isTogether(code, dep.code)
          );
        });
      }

      // What a course unlocks: direct required or picked courses, what waits behind them, and electives not picked yet.
      function coursesOpenedBy(code, map) {
        const picked = (c) =>
          !c.group ||
          !!termById(assignments[c.code]) ||
          ["current", "completed"].includes(statusMap[c.code]);
        const open = (c) => !isCourseDone(c);
        const direct = dependentsOf(code, map).filter(open);
        const required = direct.filter(picked);
        const seen = new Set([code, ...required.map((c) => c.code)]);
        const queue = required.slice();
        const later = [];
        while (queue.length) {
          dependentsOf(queue.shift().code, map)
            .filter((c) => open(c) && picked(c) && !seen.has(c.code))
            .forEach((c) => {
              seen.add(c.code);
              later.push(c);
              queue.push(c);
            });
        }
        return {
          direct: required,
          later,
          electives: direct.filter((c) => !picked(c)),
        };
      }

      // A delay can't go past a dependent that's already done or under way; the card's own status decides the rest.
      function delayBlocker(code, targetId, map) {
        const target = targetId ? termById(targetId) : null;
        return dependentsOf(code, map).find((dep) => {
          if (!isCourseDone(dep) && statusMap[dep.code] !== "current")
            return false;
          const at = termById(assignments[dep.code]);
          return at && (!target || at.order <= target.order);
        });
      }

      let retakeState = null;

      // grade set: a new W/F. delay: moving a course later without a W/F, always confirmed.
      // Neither: moving a retake that already has one. targetId fixes the destination.
      function openRetake({
        code,
        grade = null,
        targetId = null,
        delay = false,
        fallback = "",
      }) {
        const map = courseIndex();
        const course = map[code];
        const from = termById(assignments[code]);
        if (!course || !from) return;
        if (delay) {
          if (isCourseDone(course)) {
            if (fallback) toast(fallback);
            return;
          }
          if (statusMap[code] === "current") {
            toast(t().delayCurrentNote(code));
            return;
          }
        }
        let options;
        if (targetId) options = [targetId];
        else {
          const after = allTerms();
          const next = after.find((x) =>
            usableAfter(course, x, from.order, false),
          );
          const regular = after.find((x) =>
            usableAfter(course, x, from.order, true),
          );
          options = [regular ? regular.id : ""];
          if (next && next.isSummer) options.push(next.id);
        }
        if (delay) {
          const blocker = delayBlocker(code, options[0], map);
          if (blocker) {
            toast(t().moveBlockedDependent(code, blocker.code));
            return;
          }
        }
        retakeState = {
          code,
          grade,
          delay,
          options,
          targetId: options[0],
          keep: false,
        };
        if (
          !delay &&
          options.length === 1 &&
          !retakeConflicts(code, options[0]).length
        ) {
          commitRetake();
          return;
        }
        toggleRetake(true);
      }

      function commitRetake() {
        const state = retakeState;
        retakeState = null;
        toggleRetake(false);
        if (!state) return;
        if (state.grade)
          dropCourse(state.code, {
            grade: state.grade,
            targetId: state.targetId || null,
            keep: state.keep,
          });
        else moveRetake(state.code, state.targetId || null, state.keep);
      }

      function toggleRetake(open) {
        document.getElementById("retakeOverlay").classList.toggle("open", open);
        document.getElementById("retakePanel").classList.toggle("open", open);
        if (open) renderRetake();
      }

      function renderRetake() {
        if (!retakeState) return;
        const s = t();
        const { code, grade, delay, options, targetId, keep } = retakeState;
        const termName = (id) => {
          const term = id && termById(id);
          return term ? nameOfTerm(term) : s.retakeNewTerm;
        };
        document.getElementById("retakeTitle").textContent =
          grade === "F"
            ? s.retakeTitleF(code)
            : grade
              ? s.retakeTitleW(code)
              : delay
                ? s.retakeTitleDelay(
                    code,
                    options.length === 1 ? termName(targetId) : "",
                  )
                : s.retakeTitleMove(code);
        const summerTarget = options.length === 1 && termById(targetId);
        document.getElementById("retakeSub").textContent = grade
          ? s.retakeSub
          : delay
            ? s.delaySub +
              (summerTarget && summerTarget.isSummer
                ? ` ${s.retakeSummerNote}`
                : "")
            : "";
        document.getElementById("retakeCancelBtn").textContent = s.addCancel;
        document.getElementById("retakeConfirmBtn").textContent =
          s.retakeConfirm;

        const radio = (name, value, checked, title, meta, onPick) => {
          const label = document.createElement("label");
          label.className = "retake-option";
          const input = document.createElement("input");
          input.type = "radio";
          input.name = name;
          input.checked = checked;
          input.addEventListener("change", onPick);
          const text = document.createElement("span");
          const strong = document.createElement("strong");
          strong.textContent = title;
          text.appendChild(strong);
          if (meta) {
            const small = document.createElement("small");
            small.textContent = meta;
            text.appendChild(small);
          }
          label.append(input, text);
          return label;
        };

        const opens = document.getElementById("retakeOpens");
        opens.innerHTML = "";
        if (delay) {
          const opened = coursesOpenedBy(code, courseIndex());
          const head = document.createElement("h4");
          head.textContent = s.delayOpensHead(code);
          opens.appendChild(head);
          const note = (text) => {
            const p = document.createElement("p");
            p.className = "retake-opens-note";
            p.textContent = text;
            opens.appendChild(p);
          };
          if (opened.direct.length) {
            const list = document.createElement("ul");
            list.className = "retake-opens-list";
            opened.direct.forEach((c) => {
              const li = document.createElement("li");
              const strong = document.createElement("strong");
              strong.textContent = c.code;
              li.append(strong, lang === "ar" ? c.name : c.nameEn || c.name);
              list.appendChild(li);
            });
            opens.appendChild(list);
          } else note(s.delayOpensNone);
          if (opened.later.length)
            note(s.delayLaterChain(opened.later.map((c) => c.code).join(", ")));
          if (opened.electives.length)
            note(
              s.delayElectives(opened.electives.map((c) => c.code).join(", ")),
            );
        }

        const where = document.getElementById("retakeWhere");
        where.innerHTML = "";
        if (options.length > 1) {
          const head = document.createElement("h4");
          head.textContent = delay ? s.delayWhereHead : s.retakeWhereHead;
          where.appendChild(head);
          options.forEach((id) => {
            const term = id && termById(id);
            where.appendChild(
              radio(
                "retakeTarget",
                id,
                id === targetId,
                termName(id),
                term && term.isSummer ? s.retakeSummerNote : "",
                () => {
                  retakeState.targetId = id;
                  retakeState.keep = false;
                  renderRetake();
                },
              ),
            );
          });
        }

        const deps = document.getElementById("retakeDeps");
        deps.innerHTML = "";
        const conflicts = retakeConflicts(code, targetId);
        if (conflicts.length) {
          const head = document.createElement("h4");
          head.textContent = s.retakeDepsHead(
            conflicts.map((c) => c.code).join(", "),
            termName(targetId),
          );
          deps.appendChild(head);
          const later = previewRetake(code, targetId || null, false);
          const moved = later.moves
            .map((m) => m.code)
            .filter((c) => c !== code);
          deps.appendChild(
            radio(
              "retakeKeep",
              "move",
              !keep,
              s.retakeMoveLater(moved.length),
              moved.join(", ") +
                (later.createdTerms.length ? ` · ${s.retakeAddsTerm}` : ""),
              () => {
                retakeState.keep = false;
                renderRetake();
              },
            ),
          );
          deps.appendChild(
            radio(
              "retakeKeep",
              "keep",
              keep,
              s.retakeKeep(termName(targetId)),
              s.retakeKeepNote,
              () => {
                retakeState.keep = true;
                renderRetake();
              },
            ),
          );
        }
      }

      function refuseMove(code, targetId, verdict) {
        const map = courseIndex();
        if (verdict.dependents && delayedByDrop(code, map)) {
          openRetake({ code, targetId });
          return;
        }
        const from = termById(assignments[code]);
        const target = termById(targetId);
        const later = from && target && target.order > from.order;
        if (!(verdict.critical || verdict.dependents) || !later) {
          toast(verdict.reason);
          return;
        }
        openRetake({ code, targetId, delay: true, fallback: verdict.reason });
      }

      function undoWithdrawal(id) {
        const w = withdrawals.find((x) => x.id === id);
        if (!w) return;
        (w.moves || [])
          .slice()
          .reverse()
          .forEach((m) => {
            if (assignments[m.code] === m.to) assignments[m.code] = m.from;
          });
        assignments[w.code] = w.termId;
        statusMap[w.code] = w.prevStatus || "not-taken";
        withdrawals = withdrawals.filter((x) => x !== w);
        togetherPairs = togetherPairs.filter(
          (p) =>
            !(w.together || []).some((x) => x.pre === p.pre && x.dep === p.dep),
        );
        const map = courseIndex();
        extraTerms = extraTerms.filter(
          (term) =>
            !(w.createdTerms || []).includes(term.id) ||
            termInUse(term.id, map),
        );
        saveState();
        render();
        toast(t().undoDone(w.code));
      }

      function termInUse(termId, map) {
        return (
          Object.keys(map).some((code) => assignments[code] === termId) ||
          withdrawals.some((w) => w.termId === termId)
        );
      }

      function removeCustomCourse(code) {
        if (!confirm(t().removeCustomConfirm(code))) return;
        customCourses = customCourses.filter((c) => c.code !== code);
        withdrawals = withdrawals.filter((w) => w.code !== code);
        togetherPairs = togetherPairs.filter(
          (p) => p.pre !== code && p.dep !== code,
        );
        delete assignments[code];
        statusMap[code] = "not-taken";
        if (selectedMoveCode === code) selectedMoveCode = null;
        expandedCodes.delete(code);
        saveState();
        render();
      }

      function withdrawnEl(w) {
        const s = t();
        const div = document.createElement("div");
        const failed = w.grade === "F";
        div.className = "course withdrawn" + (failed ? " failed" : "");
        const term = termById(w.termId);
        div.title = term
          ? (failed ? s.failedTitle : s.withdrawnTitle)(nameOfTerm(term))
          : "";
        const row = document.createElement("div");
        row.className = "code-row";
        const group = document.createElement("span");
        group.className = "code-group";
        const code = document.createElement("span");
        code.className = "code";
        code.textContent = w.code;
        group.appendChild(code);
        if (w.hours) {
          const pill = document.createElement("span");
          pill.className = "credit-pill";
          pill.textContent = `${w.hours} ${s.creditShort}`;
          group.appendChild(pill);
        }
        const badge = document.createElement("span");
        badge.className = "w-badge";
        badge.textContent = failed ? "F" : "W";
        row.append(group, badge);
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = lang === "ar" ? w.nameAr : w.nameEn;
        div.append(row, name);
        const latest = latestWithdrawal(w.code);
        if (!viewMode && latest && latest.id === w.id) {
          const undo = document.createElement("button");
          undo.type = "button";
          undo.className = "undo-drop";
          undo.textContent = s.undoDrop;
          undo.addEventListener("click", (e) => {
            e.stopPropagation();
            undoWithdrawal(w.id);
          });
          div.appendChild(undo);
        }
        return div;
      }

      /* ---------- Tuition ---------- */
      // Prep courses carry hours that are charged and displayed, but they sit outside the degree: they
      // must not count toward the plan total, the standing rule or the pace cards, which all read c.hours.
      function billedHours(course) {
        return course.hours || course.prepHours || 0;
      }

      // A student who entered at Prep 2nd or 1st never took (or paid for) the prep terms before that.
      function prepTermSkipped(term) {
        if (!term.isPrep) return false;
        const start = BASE_TERMS.find((x) => x.id === gradState.startTerm);
        return !!start && term.order < start.order;
      }

      function formatMoney(value) {
        return (Math.round(value * 100) / 100).toLocaleString("en-US", {
          maximumFractionDigits: 2,
        });
      }

      // Students who joined in these years don't pay for cooperative training. tuition.coopFee is the
      // student's own answer; null means follow the start year.
      const COOP_FREE_YEARS = [2022, 2023];

      function coopFeeAuto() {
        return COOP_FREE_YEARS.includes(Number(gradState.startYear))
          ? "free"
          : "pay";
      }

      function coopFee() {
        return tuition.coopFee || coopFeeAuto();
      }

      function isFreeCoop(code, map) {
        const coop = coopCourse(map);
        return !!coop && coop.code === code && coopFee() === "free";
      }

      function setCoopFee(choice) {
        tuition = {
          ...tuition,
          coopFee: choice === coopFeeAuto() ? null : choice,
        };
        saveState();
        render();
      }

      function renderCoopFee() {
        const box = document.getElementById("coopFee");
        const coop = coopCourse(courseIndex());
        box.innerHTML = "";
        if (!coop) return;
        const s = t();
        const year = Number(gradState.startYear);
        const row = document.createElement("div");
        row.className = "coop-fee-row";
        const label = document.createElement("span");
        label.textContent = `${coop.code} ${lang === "ar" ? coop.name : coop.nameEn || coop.name} (${billedHours(coop)} ${s.creditShort})`;
        const choice = document.createElement("span");
        choice.className = "coop-fee-choice";
        [
          ["pay", s.coopPay],
          ["free", s.coopFree],
        ].forEach(([value, text]) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = text;
          btn.disabled = !!viewMode;
          btn.setAttribute(
            "aria-pressed",
            coopFee() === value ? "true" : "false",
          );
          btn.addEventListener("click", () => setCoopFee(value));
          choice.appendChild(btn);
        });
        row.append(label, choice);
        const note = document.createElement("p");
        note.className = "coop-fee-note";
        note.textContent = tuition.coopFee
          ? s.coopChosen
          : !year
            ? s.coopAutoNoYear
            : coopFeeAuto() === "free"
              ? s.coopAutoFree(year)
              : s.coopAutoPay(year);
        box.append(row, note);
      }

      function hourRate(term) {
        const rate = term && term.isSummer ? tuition.summer : tuition.regular;
        return typeof rate === "number" && rate >= 0 ? rate : null;
      }

      // Billed hours for one term. A dropped course stays billed in the term it was dropped from, less
      // any refund, and is billed again wherever it is retaken. Exam-waived courses cost nothing.
      function termTuition(term, map) {
        const rate = hourRate(term);
        const row = {
          term,
          rate,
          paidHours: 0,
          dueHours: 0,
          dropHours: 0,
          paid: 0,
          due: 0,
          dropped: 0,
          drops: [],
        };
        Object.values(map).forEach((c) => {
          const hours = billedHours(c);
          if (assignments[c.code] !== term.id || !hours) return;
          if (prepTermSkipped(term) && !c.hours) return;
          if (c.examEligible && examMap[c.code]) return;
          if (isFreeCoop(c.code, map)) return;
          if (["completed", "current"].includes(statusMap[c.code]))
            row.paidHours += hours;
          else row.dueHours += hours;
        });
        withdrawals
          .filter((w) => w.termId === term.id && !isFreeCoop(w.code, map))
          .forEach((w) => {
            const refund =
              w.grade === "F" ? 0 : Math.min(100, Math.max(0, w.refund || 0));
            const charged = (w.hours || 0) * (rate || 0) * (1 - refund / 100);
            row.dropHours += w.hours || 0;
            row.dropped += charged;
            row.drops.push({ w, charged, refund });
          });
        row.paid = row.paidHours * (rate || 0) + row.dropped;
        row.due = row.dueHours * (rate || 0);
        row.hours = row.paidHours + row.dueHours + row.dropHours;
        row.total = row.paid + row.due;
        return row;
      }

      function tuitionSummary() {
        const map = courseIndex();
        const rows = allTerms()
          .filter((term) => !(gradState.dropPYP && term.isPrep) && !term.isGap)
          .map((term) => termTuition(term, map))
          .filter((row) => row.hours > 0);

        // Electives finished without being placed in a term, and required ones not placed yet, bill at the
        // regular price so the degree total matches the plan's full credit hours.
        const rate = hourRate(null);
        let poolHours = 0;
        let unplacedHours = 0;
        ELECTIVE_GROUPS.forEach((g) => {
          let counted = 0;
          Object.values(map)
            .filter((c) => c.group === g.id)
            .forEach((c) => {
              const hours = c.hours || 0;
              const inPool = isGroupId(assignments[c.code]);
              const waived = c.examEligible && examMap[c.code];
              const taken = ["completed", "current"].includes(
                statusMap[c.code],
              );
              if (inPool && !waived && taken) poolHours += hours;
              if (!inPool || waived || taken) counted += hours;
            });
          if (g.required > 0)
            unplacedHours += Math.max(0, g.required - counted);
        });
        const extra = (label, paidHours, dueHours) => ({
          label,
          rate,
          paidHours,
          dueHours,
          dropHours: 0,
          hours: paidHours + dueHours,
          paid: paidHours * (rate || 0),
          due: dueHours * (rate || 0),
          total: (paidHours + dueHours) * (rate || 0),
          dropped: 0,
          drops: [],
        });
        if (poolHours) rows.push(extra(t().tuitionPool, poolHours, 0));
        if (unplacedHours)
          rows.push(extra(t().tuitionUnplaced, 0, unplacedHours));

        const sum = (key) => rows.reduce((total, row) => total + row[key], 0);
        const section = (list) => ({
          rows: list,
          hours: list.reduce((total, row) => total + row.hours, 0),
          total: list.reduce((total, row) => total + row.total, 0),
          paid: list.reduce((total, row) => total + row.paid, 0),
          due: list.reduce((total, row) => total + row.due, 0),
        });
        return {
          rows,
          prep: section(rows.filter((row) => row.term && row.term.isPrep)),
          degree: section(rows.filter((row) => !(row.term && row.term.isPrep))),
          paid: sum("paid"),
          due: sum("due"),
          total: sum("total"),
          dropped: sum("dropped"),
          hours: sum("hours"),
          summerHours: rows
            .filter((row) => row.term && row.term.isSummer)
            .reduce((total, row) => total + row.hours, 0),
          regularHours: rows
            .filter((row) => !(row.term && row.term.isSummer))
            .reduce((total, row) => total + row.hours, 0),
        };
      }

      function renderTuition() {
        const s = t();
        const e = escapeHtml;
        const data = tuitionSummary();
        renderCoopFee();
        const anyRate =
          hourRate(null) !== null || hourRate({ isSummer: true }) !== null;
        const money = (v) => (anyRate ? s.tuitionMoney(formatMoney(v)) : "—");
        const cell = (v, hasRate) => (hasRate ? formatMoney(v) : "—");

        document.getElementById("tuitionCards").innerHTML = [
          [s.tuitionPaid, data.paid],
          [s.tuitionDue, data.due],
          ...(data.prep.rows.length
            ? [[s.tuitionPrepTotal, data.prep.total]]
            : []),
          [s.tuitionDegreeTotal, data.degree.total],
          [s.tuitionTotal, data.total],
          [s.tuitionLost, data.dropped],
        ]
          .map(
            ([label, value]) =>
              `<div class="grad-card"><div class="grad-card-label">${e(label)}</div><div class="grad-card-value">${e(money(value))}</div></div>`,
          )
          .join("");

        const map = courseIndex();
        const noHours = customCourses
          .filter((c) => !c.hours && assignments[c.code])
          .map((c) => c.code);
        const waived = Object.values(map).filter(
          (c) => c.examEligible && examMap[c.code] && billedHours(c),
        ).length;
        const notes = [];
        if (!anyRate) notes.push(s.tuitionEnterRates);
        else {
          if (hourRate(null) === null && data.regularHours)
            notes.push(s.tuitionNoRegular(data.regularHours));
          if (hourRate({ isSummer: true }) === null && data.summerHours)
            notes.push(s.tuitionNoSummer(data.summerHours));
        }
        if (noHours.length) notes.push(s.tuitionNoHours(noHours.join(", ")));
        if (waived) notes.push(s.tuitionWaivedNote(waived));
        document.getElementById("tuitionNote").textContent = notes.join(" ");

        const rowHtml = (row) => {
          const has = row.rate !== null;
          const label = row.term ? nameOfTerm(row.term) : row.label;
          const drops = row.drops
            .map(
              (
                d,
              ) => `<tr class="tuition-w"><td colspan="6"><div class="tuition-w-line">
                  <span>${e(s.tuitionWLine(d.w.grade === "F" ? "F" : "W", d.w.code, d.w.hours, has ? s.tuitionMoney(formatMoney(d.charged)) : "—"))}</span>
                  ${d.w.grade === "F" ? "" : `<label>${e(s.tuitionRefund)}<input type="number" min="0" max="100" step="any" inputmode="decimal" data-w="${e(d.w.id)}" value="${d.refund}"${viewMode ? " disabled" : ""} /></label>`}
                </div></td></tr>`,
            )
            .join("");
          return `<tr><td>${e(label)}</td><td>${row.hours}</td><td class="col-rate">${has ? formatMoney(row.rate) : "—"}</td><td>${cell(row.total, has)}</td><td>${cell(row.paid, has)}</td><td>${cell(row.due, has)}</td></tr>${drops}`;
        };
        const sumCells = (part) =>
          `<td>${part.hours}</td><td class="col-rate"></td><td>${cell(part.total, anyRate)}</td><td>${cell(part.paid, anyRate)}</td><td>${cell(part.due, anyRate)}</td>`;
        const sectionHtml = (title, part) =>
          part.rows.length
            ? `<tbody><tr class="tuition-section"><td colspan="6">${e(title)}</td></tr>${part.rows.map(rowHtml).join("")}<tr class="tuition-subtotal"><td>${e(title)}</td>${sumCells(part)}</tr></tbody>`
            : "";
        document.getElementById("tuitionTable").innerHTML =
          `<table class="tuition-table">
          <thead><tr><th>${e(s.tuitionColTerm)}</th><th>${e(s.tuitionColHours)}</th><th class="col-rate">${e(s.tuitionColRate)}</th><th>${e(s.tuitionColTotal)}</th><th>${e(s.tuitionColPaid)}</th><th>${e(s.tuitionColDue)}</th></tr></thead>
          ${sectionHtml(s.tuitionPrepTotal, data.prep)}${sectionHtml(s.tuitionDegreeTotal, data.degree)}
          <tfoot><tr><td>${e(s.tuitionTotal)}</td>${sumCells(data)}</tr></tfoot>
        </table>`;
        document
          .querySelectorAll("#tuitionTable input[data-w]")
          .forEach((input) =>
            input.addEventListener("change", () => {
              const w = withdrawals.find((x) => x.id === input.dataset.w);
              if (!w) return;
              const value = parseFloat(input.value);
              w.refund = Number.isFinite(value)
                ? Math.min(100, Math.max(0, value))
                : 0;
              saveState();
              render();
            }),
          );
      }

      function readRateInput(id) {
        const value = parseFloat(document.getElementById(id).value);
        return Number.isFinite(value) && value >= 0 ? value : null;
      }

      function toggleTuition(open) {
        const overlay = document.getElementById("tuitionOverlay");
        const panel = document.getElementById("tuitionPanel");
        const shouldOpen =
          open !== undefined ? open : !panel.classList.contains("open");
        overlay.classList.toggle("open", shouldOpen);
        panel.classList.toggle("open", shouldOpen);
        if (!shouldOpen) return;
        document.getElementById("tuitionRegular").value =
          tuition.regular === null ? "" : tuition.regular;
        document.getElementById("tuitionSummer").value =
          tuition.summer === null ? "" : tuition.summer;
        renderTuition();
      }

      /* ---------- Drag & drop wiring ---------- */
      let draggingCode = null;
      let suppressClick = false;

      // Swallow the stray click a browser fires on the element left under the cursor
      // right after a drop re-renders the DOM (was mis-firing the "add course" prompt).
      document.addEventListener(
        "click",
        (e) => {
          if (suppressClick) {
            e.stopPropagation();
            e.preventDefault();
            suppressClick = false;
          }
        },
        true,
      );

      function courseEl(course, locked, readOnly) {
        const div = document.createElement("div");
        div.dataset.code = course.code;
        const st = statusMap[course.code] || "not-taken";
        const exempted = course.examEligible && !!examMap[course.code];
        div.className =
          "course" +
          (exempted
            ? " state-completed exempted"
            : st === "current"
              ? " state-current"
              : st === "completed"
                ? " state-completed"
                : "") +
          (locked && !readOnly ? " locked" : "") +
          (selectedMoveCode === course.code && !readOnly
            ? " move-selected"
            : "") +
          (readOnly ? " view-only" : "");
        const displayName =
          lang === "ar" ? course.name : course.nameEn || course.name;

        const codeRow = document.createElement("div");
        codeRow.className = "code-row";
        const codeGroup = document.createElement("span");
        codeGroup.className = "code-group";
        const codeSpan = document.createElement("span");
        codeSpan.className = "code";
        codeSpan.textContent = course.code;
        codeGroup.appendChild(codeSpan);
        if (billedHours(course)) {
          const pill = document.createElement("span");
          pill.className = "credit-pill";
          pill.textContent = `${billedHours(course)} ${t().creditShort}`;
          codeGroup.appendChild(pill);
        }
        codeRow.appendChild(codeGroup);

        const expanded = expandedCodes.has(course.code);
        if (expanded) div.classList.add("expanded");
        const syllabusBtn = document.createElement("button");
        syllabusBtn.type = "button";
        syllabusBtn.className = "syllabus-tick";
        syllabusBtn.textContent = "▾";
        syllabusBtn.title = t().syllabusTitle;
        syllabusBtn.setAttribute("aria-expanded", expanded ? "true" : "false");
        syllabusBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleSyllabus(course.code);
        });
        // A small wobble while pressing would otherwise start a card drag and eat the click.
        syllabusBtn.addEventListener("pointerdown", () => {
          div.draggable = false;
        });
        const restoreDrag = () => {
          if (!readOnly && !expanded) div.draggable = true;
        };
        syllabusBtn.addEventListener("pointerup", restoreDrag);
        syllabusBtn.addEventListener("pointerleave", restoreDrag);

        if (readOnly) {
          const icons = document.createElement("span");
          icons.className = "icon-row";
          icons.appendChild(syllabusBtn);
          codeRow.appendChild(icons);
        } else {
          const icons = document.createElement("span");
          icons.className = "icon-row";
          icons.appendChild(syllabusBtn);
          const moveBtn = document.createElement("button");
          moveBtn.type = "button";
          moveBtn.className =
            "move-tick" + (selectedMoveCode === course.code ? " active" : "");
          moveBtn.textContent = "↔";
          moveBtn.title = t().moveCourseTitle;
          moveBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleMoveSelection(course.code);
          });
          icons.appendChild(moveBtn);
          if (isCustomCourse(course.code)) {
            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "remove-tick";
            removeBtn.textContent = "×";
            removeBtn.title = t().removeCustomTitle;
            removeBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              removeCustomCourse(course.code);
            });
            icons.appendChild(removeBtn);
          }
          if (course.examEligible) {
            const tick = document.createElement("button");
            tick.type = "button";
            tick.className = "exam-tick" + (exempted ? " checked" : "");
            tick.textContent = "✓";
            tick.title = t().examTickTitle;
            tick.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleExam(course.code);
            });
            icons.appendChild(tick);
          }
          if (locked && !NO_CRITICAL_ICON.has(course.code)) {
            const lockIcon = document.createElement("span");
            lockIcon.className = "lock-icon";
            lockIcon.textContent = "⬆";
            lockIcon.title = t().criticalTitle;
            icons.appendChild(lockIcon);
          }
          codeRow.appendChild(icons);
        }

        const nameSpan = document.createElement("span");
        nameSpan.className = "name";
        nameSpan.textContent = displayName;

        div.appendChild(codeRow);
        div.appendChild(nameSpan);
        if (expanded) {
          const panel = syllabusPanel(course);
          const closeBtn = document.createElement("button");
          closeBtn.type = "button";
          closeBtn.className = "syllabus-close";
          closeBtn.textContent = `▴ ${t().syllabusClose}`;
          closeBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleSyllabus(course.code);
          });
          panel.appendChild(closeBtn);
          div.appendChild(panel);
        }

        if (readOnly) {
          div.addEventListener("click", () => toggleSyllabus(course.code));
          return div;
        }

        const inTerm = termById(assignments[course.code]);
        const together = togetherPairs.filter(
          (p) =>
            p.dep === course.code &&
            assignments[p.pre] === assignments[course.code],
        );
        if (together.length) {
          const tag = document.createElement("small");
          tag.className = "together-tag";
          tag.textContent = t().togetherTag(
            together.map((p) => p.pre).join(", "),
          );
          div.appendChild(tag);
        }
        if (!expanded && !isCourseDone(course) && inTerm) {
          if (inTerm.isSummer && latestWithdrawal(course.code)) {
            const nextUp = allTerms().find((x) =>
              usableAfter(course, x, inTerm.order, true),
            );
            const moveOut = document.createElement("button");
            moveOut.type = "button";
            moveOut.className = "retake-move";
            moveOut.textContent = t().retakeNotOffered(
              nextUp ? nameOfTerm(nextUp) : t().retakeNewTerm,
            );
            moveOut.addEventListener("click", (e) => {
              e.stopPropagation();
              openRetake({
                code: course.code,
                targetId: nextUp ? nextUp.id : "",
              });
            });
            div.appendChild(moveOut);
          }
          const gradeRow = document.createElement("span");
          gradeRow.className = "grade-actions";
          [
            ["W", t().dropTitle],
            ["F", t().failTitle],
          ].forEach(([grade, title]) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "drop-tick";
            btn.textContent = grade;
            btn.title = title;
            btn.setAttribute("aria-label", title);
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              openRetake({ code: course.code, grade });
            });
            btn.addEventListener("pointerdown", () => {
              div.draggable = false;
            });
            btn.addEventListener("pointerup", restoreDrag);
            btn.addEventListener("pointerleave", restoreDrag);
            gradeRow.appendChild(btn);
          });
          if (locked && statusMap[course.code] !== "current") {
            const delayBtn = document.createElement("button");
            delayBtn.type = "button";
            delayBtn.className = "drop-tick delay-tick";
            delayBtn.textContent = t().delayBtn;
            delayBtn.title = t().delayTitle;
            delayBtn.setAttribute("aria-label", t().delayTitle);
            delayBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openRetake({ code: course.code, delay: true });
            });
            delayBtn.addEventListener("pointerdown", () => {
              div.draggable = false;
            });
            delayBtn.addEventListener("pointerup", restoreDrag);
            delayBtn.addEventListener("pointerleave", restoreDrag);
            gradeRow.appendChild(delayBtn);
          }
          div.appendChild(gradeRow);
        }

        div.addEventListener("click", (e) => {
          e.stopPropagation();
          if (expanded) {
            toggleSyllabus(course.code);
            return;
          }
          cycleStatus(course.code);
        });

        div.draggable = !expanded;
        div.addEventListener("dragstart", (e) => {
          draggingCode = course.code;
          div.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", course.code);
        });
        div.addEventListener("dragend", () => {
          div.classList.remove("dragging");
          draggingCode = null;
        });

        return div;
      }

      function toggleMoveSelection(code) {
        if (selectedMoveCode === code) {
          selectedMoveCode = null;
          toast(t().moveCourseCancelled);
        } else {
          selectedMoveCode = code;
          toast(t().moveCourseSelected(code));
        }
        render();
      }

      function moveSelectedCourse(locationId) {
        if (!selectedMoveCode) return false;
        const code = selectedMoveCode;
        const v = validateMove(code, locationId);
        if (!v.ok) {
          refuseMove(code, locationId, v);
          return true;
        }
        assignments[code] = locationId;
        selectedMoveCode = null;
        saveState();
        render();
        toast(t().moveCourseDone(code));
        return true;
      }

      function wireDropZone(el, locationId) {
        el.dataset.termId = locationId;
        if (selectedMoveCode) el.classList.add("move-target");
        el.addEventListener("click", (e) => {
          if (!selectedMoveCode) return;
          e.preventDefault();
          e.stopPropagation();
          moveSelectedCourse(locationId);
        });
        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        });
        el.addEventListener("dragenter", (e) => {
          e.preventDefault();
          if (!draggingCode) return;
          const v = validateMove(draggingCode, locationId);
          el.classList.add(v.ok ? "drag-over" : "drag-invalid");
        });
        el.addEventListener("dragleave", () => {
          el.classList.remove("drag-over", "drag-invalid");
        });
        el.addEventListener("drop", (e) => {
          e.preventDefault();
          el.classList.remove("drag-over", "drag-invalid");
          const code = e.dataTransfer.getData("text/plain") || draggingCode;
          if (!code) return;
          const v = validateMove(code, locationId);
          if (!v.ok) {
            refuseMove(code, locationId, v);
            return;
          }
          assignments[code] = locationId;
          saveState();
          suppressClick = true;
          setTimeout(() => {
            suppressClick = false;
          }, 400);
          render();
        });
      }
