      function walkthroughSteps(map) {
        const s = t();
        const courses = Object.values(map);
        const doneCount = courses.filter((c) => isCourseDone(c)).length;
        const currentCount = courses.filter(
          (c) => statusMap[c.code] === "current" && !isCourseDone(c),
        ).length;
        const summerCount = extraTerms.filter((term) => term.isSummer).length;
        const extraCount = extraTerms.filter((term) => term.isExtra).length;
        const gapCount = extraTerms.filter((term) => term.isGap).length;
        const movedCount = courses.filter(
          (c) =>
            assignments[c.code] && assignments[c.code] !== defaultLocation(c),
        ).length;
        const hasCustomLayout =
          summerCount > 0 ||
          extraCount > 0 ||
          gapCount > 0 ||
          movedCount > 0 ||
          customCourses.length > 0;
        const steps = hasCustomLayout
          ? s.walkCustomSteps(summerCount, extraCount, gapCount, movedCount)
          : doneCount > 0 || currentCount > 0
            ? s.walkProgressSteps(doneCount, currentCount)
            : s.walkBlankSteps;
        const kind = hasCustomLayout
          ? "custom"
          : doneCount > 0 || currentCount > 0
            ? "progress"
            : "blank";
        return Object.assign(steps.concat([s.walkTuitionStep]), { kind });
      }

      // What each step points at, by position in its step set (same order in both languages).
      const WALK_TARGETS = {
        blank: [
          "course",
          "course",
          "addSummer",
          "toolbar",
          "critical",
          "prep",
          "grad",
          "tuition",
        ],
        progress: [
          "statusCourse",
          "course",
          "eye",
          "critical",
          "prep",
          "grad",
          "tuition",
        ],
        custom: [
          "customTerm",
          "movedCourse",
          "eye",
          "critical",
          "prep",
          "grad",
          "tuition",
        ],
      };
      let walkTargetKey = null;

      function walkTargets(key) {
        const visible = (el) => {
          if (!el) return false;
          const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0;
        };
        const first = (sel) =>
          [...document.querySelectorAll(sel)].find(visible) || null;
        const movedCourse = () => {
          const map = courseIndex();
          const code = Object.keys(map).find(
            (c) => assignments[c] && assignments[c] !== defaultLocation(map[c]),
          );
          return code
            ? first(`.term-courses .course[data-code="${code}"]`)
            : null;
        };
        const pick = {
          course: () =>
            first(".term-courses .course:not(.elective-slot):not(.withdrawn)"),
          statusCourse: () =>
            first(".term-courses .course.state-current") ||
            first(".term-courses .course.state-completed"),
          critical: () => first(".term-courses .course.locked"),
          customTerm: () =>
            first(".term-row.summer, .term-row.extra, .term-row.gap") ||
            movedCourse(),
          movedCourse: () =>
            movedCourse() ||
            first(".term-row.summer, .term-row.extra, .term-row.gap"),
          addSummer: () => document.getElementById("addSummerBtn"),
          toolbar: () => [
            document.getElementById("viewModeBtn"),
            document.getElementById("eyeBtn"),
          ],
          eye: () => document.getElementById("eyeBtn"),
          prep: () => document.getElementById("pypBtn"),
          grad: () => document.getElementById("gradBtn"),
          tuition: () => document.getElementById("tuitionBtn"),
        }[key];
        const found = pick ? pick() : null;
        return (Array.isArray(found) ? found : [found]).filter(visible);
      }

      function placeWalkthrough() {
        const panel = document.getElementById("walkPanel");
        const spot = document.getElementById("walkSpot");
        const overlay = document.getElementById("walkOverlay");
        const targets = panel.classList.contains("open")
          ? walkTargets(walkTargetKey)
          : [];
        if (!targets.length) {
          panel.classList.remove("anchored");
          panel.style.top = panel.style.left = "";
          spot.classList.remove("open");
          overlay.classList.remove("walk-clear");
          return;
        }
        const rects = targets.map((el) => el.getBoundingClientRect());
        const pad = 6;
        const box = {
          top: Math.min(...rects.map((r) => r.top)) - pad,
          left: Math.min(...rects.map((r) => r.left)) - pad,
          right: Math.max(...rects.map((r) => r.right)) + pad,
          bottom: Math.max(...rects.map((r) => r.bottom)) + pad,
        };
        Object.assign(spot.style, {
          top: `${box.top}px`,
          left: `${box.left}px`,
          width: `${box.right - box.left}px`,
          height: `${box.bottom - box.top}px`,
        });
        spot.classList.add("open");
        overlay.classList.add("walk-clear");
        panel.classList.add("anchored");

        const vw = document.documentElement.clientWidth;
        const vh = window.innerHeight;
        const gap = 12;
        const edge = 16;
        const pw = panel.offsetWidth;
        const ph = panel.offsetHeight;
        let top;
        if (box.bottom + gap + ph <= vh - edge) top = box.bottom + gap;
        else if (box.top - gap - ph >= edge) top = box.top - gap - ph;
        else top = vh - ph - edge;
        const center = (box.left + box.right) / 2;
        const left = Math.min(Math.max(center - pw / 2, edge), vw - pw - edge);
        panel.style.top = `${Math.max(edge, top)}px`;
        panel.style.left = `${Math.max(edge, left)}px`;
      }

      let walkPlaceQueued = false;
      function queuePlaceWalkthrough() {
        if (walkPlaceQueued) return;
        walkPlaceQueued = true;
        requestAnimationFrame(() => {
          walkPlaceQueued = false;
          placeWalkthrough();
        });
      }
      window.addEventListener("scroll", queuePlaceWalkthrough, {
        passive: true,
      });
      window.addEventListener("resize", queuePlaceWalkthrough);

      function renderWalkthrough() {
        const steps = walkthroughSteps(courseIndex());
        if (walkStep >= steps.length) walkStep = Math.max(0, steps.length - 1);
        const [title, body] = steps[walkStep];
        document.getElementById("walkStepCount").textContent =
          t().walkStepCount(walkStep + 1, steps.length);
        document.getElementById("walkStepTitle").textContent = title;
        document.getElementById("walkStepBody").textContent = body;
        document.getElementById("walkPrevBtn").style.visibility =
          walkStep === 0 ? "hidden" : "";
        document.getElementById("walkNextBtn").textContent =
          walkStep === steps.length - 1 ? t().walkDone : t().walkNext;
        const key = (WALK_TARGETS[steps.kind] || [])[walkStep] || null;
        const stepChanged = key !== walkTargetKey;
        walkTargetKey = key;
        // render() calls this before rebuilding the plan, so wait a frame for the new cards.
        requestAnimationFrame(() => {
          const target = walkTargets(walkTargetKey)[0];
          if (stepChanged && target) {
            const r = target.getBoundingClientRect();
            if (r.top < 16 || r.bottom > window.innerHeight - 16)
              target.scrollIntoView({ block: "center", behavior: "smooth" });
          }
          placeWalkthrough();
        });
      }

      function buildTermRow(term, map, gateways) {
        const row = document.createElement("div");
        row.className =
          "term-row" +
          (term.isSummer ? " summer" : "") +
          (term.isExtra ? " extra" : "") +
          (term.isGap ? " gap" : "");

        const label = document.createElement("div");
        label.className = "term-label";
        label.innerHTML = `<span>${termLabel(term)}</span>`;
        const termCourses = Object.values(map).filter(
          (c) => assignments[c.code] === term.id,
        );
        const gradeHours = (grade) =>
          withdrawals
            .filter((w) => w.termId === term.id && (w.grade || "W") === grade)
            .reduce((sum, w) => sum + (w.hours || 0), 0);
        const droppedParts = ["W", "F"]
          .filter((grade) => gradeHours(grade))
          .map((grade) => `${gradeHours(grade)} ${grade}`);
        const droppedHours = droppedParts.length;
        if (termCourses.length || droppedHours) {
          const termHours = termCourses.reduce(
            (sum, c) => sum + billedHours(c),
            0,
          );
          const hoursTag = document.createElement("small");
          hoursTag.className = "term-hours";
          hoursTag.textContent =
            (termHours || !droppedHours
              ? termHours
                ? t().termHours(termHours)
                : t().nonCredit
              : "") +
            (droppedHours
              ? `${termHours ? " + " : ""}${droppedParts.join(" + ")}`
              : "");
          label.appendChild(hoursTag);
        }
        if (hourRate(term) !== null && !term.isGap) {
          const cost = termTuition(term, map).total;
          if (cost > 0) {
            const costTag = document.createElement("small");
            costTag.className = "term-cost";
            costTag.textContent = t().tuitionMoney(formatMoney(cost));
            label.appendChild(costTag);
          }
        }
        if (selectedMoveCode && !viewMode) {
          label.classList.add("move-target-label");
          label.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            moveSelectedCourse(term.id);
          });
        }
        if ((term.isSummer || term.isExtra || term.isGap) && !viewMode) {
          const rm = document.createElement("button");
          rm.className = "term-remove";
          rm.textContent = "×";
          rm.title = t().termRemoveTitle;
          rm.addEventListener("click", (e) => {
            e.stopPropagation();
            removeExtraTerm(term.id);
          });
          label.appendChild(rm);
        }
        row.appendChild(label);

        const courses = document.createElement("div");
        courses.className = "term-courses";
        Object.values(map)
          .filter((c) => assignments[c.code] === term.id)
          .forEach((c) =>
            courses.appendChild(courseEl(c, gateways.has(c.code), viewMode)),
          );

        withdrawals
          .filter((w) => w.termId === term.id)
          .forEach((w) => courses.appendChild(withdrawnEl(w)));

        if (term.isGap && courses.children.length === 0) {
          const note = document.createElement("div");
          note.className = "gap-note";
          note.textContent = t().gapNote;
          courses.appendChild(note);
        }

        if (viewMode) {
          row.appendChild(courses);
          return row;
        }

        wireDropZone(courses, term.id);
        row.appendChild(courses);

        if (!term.isGap) {
          const addTile = document.createElement("div");
          addTile.className = "add-course-tile";
          addTile.textContent = "+";
          addTile.title = t().addCourseTileTitle;
          if (selectedMoveCode) addTile.classList.add("move-target-label");
          addTile.addEventListener("click", () => {
            if (selectedMoveCode) moveSelectedCourse(term.id);
            else addCourseToTerm(term.id);
          });
          row.appendChild(addTile);
        }

        return row;
      }

      function render() {
        renderStaticText();
        const map = courseIndex();
        const gateways = computeGatewaySet(map);
        if (document.getElementById("walkPanel").classList.contains("open"))
          renderWalkthrough();

        const planPrep = document.getElementById("plan-prep");
        const plan = document.getElementById("plan");
        planPrep.innerHTML = "";
        plan.innerHTML = "";
        planPrep.style.display = gradState.dropPYP ? "none" : "";

        allTerms().forEach((term) => {
          if (gradState.dropPYP && term.isPrep) return;
          const row = buildTermRow(term, map, gateways);
          (term.isPrep ? planPrep : plan).appendChild(row);
        });

        const planElectives = document.getElementById("plan-electives");
        planElectives.innerHTML = "";

        ELECTIVE_GROUPS.forEach((group) => {
          const groupCourses = Object.values(map).filter(
            (c) => c.group === group.id,
          );
          const completedHours = groupCourses
            .filter((c) => statusMap[c.code] === "completed")
            .reduce((sum, c) => sum + (c.hours || 0), 0);

          const row = document.createElement("div");
          row.className = "term-row elective-row";

          const label = document.createElement("div");
          label.className = "term-label";
          label.innerHTML = `<span>${t().elective} ${completedHours} - ${group.required}</span>`;
          if (selectedMoveCode && !viewMode) {
            label.classList.add("move-target-label");
            label.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              moveSelectedCourse(group.id);
            });
          }
          row.appendChild(label);

          const courses = document.createElement("div");
          courses.className = "term-courses";
          Object.values(map)
            .filter((c) => assignments[c.code] === group.id)
            .forEach((c) =>
              courses.appendChild(courseEl(c, gateways.has(c.code), viewMode)),
            );

          if (viewMode) {
            row.appendChild(courses);
            planElectives.appendChild(row);
            return;
          }

          wireDropZone(courses, group.id);
          row.appendChild(courses);

          const addTile = document.createElement("div");
          addTile.className = "add-course-tile";
          addTile.textContent = "+";
          addTile.title = t().addCourseTileTitle;
          if (selectedMoveCode) addTile.classList.add("move-target-label");
          addTile.addEventListener("click", () => {
            if (selectedMoveCode) moveSelectedCourse(group.id);
            else addCourseToTerm(group.id);
          });
          row.appendChild(addTile);

          planElectives.appendChild(row);
        });

        updateProgress(map);

        if (document.getElementById("tuitionPanel").classList.contains("open"))
          renderTuition();

        if (document.getElementById("comparePanel").classList.contains("open"))
          renderCompare();
      }

      // Counting every elective as its own slot (98 total) wildly overstates what's left — most electives are
      // interchangeable options where only ONE satisfies the requirement (e.g. any single PE course covers the
      // whole PE group). This counts against the real required course count instead: every core/prep course,
      // plus one slot per elective group that actually carries required hours (satisfied once any course in
      // that group is completed/waived) — matching the same total used by the "Remaining to graduate" card.
      function updateProgress(map) {
        const startTermId = gradState.dropPYP
          ? "t1"
          : (gradState && gradState.startTerm) || "prep1";
        const totals = totalPlanRequirements(startTermId);
        let done = 0,
          doneHours = 0;
        Object.values(map).forEach((c) => {
          if (!c.term || !termMeetsStartScope(c, startTermId)) return;
          if (
            statusMap[c.code] === "completed" ||
            (c.examEligible && examMap[c.code])
          ) {
            done++;
            doneHours += c.hours || 0;
          }
        });
        ELECTIVE_GROUPS.forEach((g) => {
          if (g.required <= 0) return;
          const completedHours = Object.values(map)
            .filter((c) => c.group === g.id && isCourseDone(c))
            .reduce((sum, c) => sum + (c.hours || 0), 0);
          if (completedHours >= g.required) done++;
          doneHours += Math.min(completedHours, g.required);
        });
        const pct = totals.courses
          ? Math.round((done / totals.courses) * 100)
          : 0;
        document.getElementById("progressText").textContent = t().progress(
          done,
          totals.courses,
          pct,
          doneHours,
          totals.hours,
        );
        document.getElementById("progressFill").style.width = pct + "%";
      }

      // Read-only static course tile for the comparison panel: same status colors, no drag/lock affordances.
      function staticCourseEl(course) {
        const div = document.createElement("div");
        const st = statusMap[course.code] || "not-taken";
        const exempted = course.examEligible && !!examMap[course.code];
        div.className =
          "course" +
          (exempted
            ? " state-completed exempted"
            : st === "current"
              ? " state-current"
              : st === "completed"
                ? " state-completed"
                : "");
        const displayName =
          lang === "ar" ? course.name : course.nameEn || course.name;
        div.innerHTML = `<div class="code-row"><span class="code">${course.code}</span></div><span class="name">${displayName}</span>`;
        return div;
      }

      // Renders the plan exactly as the official COURSES data lists it (term/group), ignoring drag moves,
      // added summer terms, and custom courses — so it reflects only what the university originally planned.

      function staticElectiveSlotEl(slot, slotIndex, slotCount) {
        const group = ELECTIVE_GROUPS.find((g) => g.id === slot.group);
        const div = document.createElement("div");
        div.className = "course elective-slot";
        const label = group && group.label ? group.label : t().elective;
        const suffix =
          slotCount > 1 ? " " + (slotIndex + 1) + "/" + slotCount : "";
        div.innerHTML =
          '<div class="code-row"><span class="code">' +
          t().elective +
          '</span></div><span class="name">' +
          label +
          suffix +
          "</span>";
        return div;
      }

      function renderCompare() {
        const comparePrep = document.getElementById("compare-prep");
        const compareMain = document.getElementById("compare-main");
        const compareElectives = document.getElementById("compare-electives");
        comparePrep.innerHTML = "";
        compareMain.innerHTML = "";
        compareElectives.innerHTML = "";
        comparePrep.style.display = gradState.dropPYP ? "none" : "";

        BASE_TERMS.slice()
          .sort((a, b) => a.order - b.order)
          .forEach((term) => {
            if (gradState.dropPYP && term.isPrep) return;
            const row = document.createElement("div");
            row.className = "term-row";
            const label = document.createElement("div");
            label.className = "term-label";
            label.innerHTML = `<span>${termLabel(term)}</span>`;
            row.appendChild(label);

            const courses = document.createElement("div");
            courses.className = "term-courses";
            COURSES.filter((c) => c.term === term.id).forEach((c) =>
              courses.appendChild(staticCourseEl(c)),
            );
            ELECTIVE_SLOTS.filter((slot) => slot.term === term.id).forEach(
              (slot) => {
                for (let slotIndex = 0; slotIndex < slot.count; slotIndex++) {
                  courses.appendChild(
                    staticElectiveSlotEl(slot, slotIndex, slot.count),
                  );
                }
              },
            );
            row.appendChild(courses);

            (term.isPrep ? comparePrep : compareMain).appendChild(row);
          });

        ELECTIVE_GROUPS.forEach((group) => {
          const groupCourses = COURSES.filter((c) => c.group === group.id);
          const completedHours = groupCourses
            .filter(
              (c) =>
                statusMap[c.code] === "completed" ||
                (c.examEligible && examMap[c.code]),
            )
            .reduce((sum, c) => sum + (c.hours || 0), 0);

          const row = document.createElement("div");
          row.className = "term-row elective-row";
          const label = document.createElement("div");
          label.className = "term-label";
          label.innerHTML = `<span>${t().elective} ${completedHours} - ${group.required}</span>`;
          row.appendChild(label);

          const courses = document.createElement("div");
          courses.className = "term-courses";
          groupCourses.forEach((c) => courses.appendChild(staticCourseEl(c)));
          row.appendChild(courses);

          compareElectives.appendChild(row);
        });
      }

      function toggleCompare(open) {
        const overlay = document.getElementById("compareOverlay");
        const panel = document.getElementById("comparePanel");
        const shouldOpen =
          open !== undefined ? open : !panel.classList.contains("open");
        overlay.classList.toggle("open", shouldOpen);
        panel.classList.toggle("open", shouldOpen);
        if (shouldOpen) renderCompare();
      }

      function toggleWalkthrough(open) {
        const overlay = document.getElementById("walkOverlay");
        const panel = document.getElementById("walkPanel");
        const shouldOpen =
          open !== undefined ? open : !panel.classList.contains("open");
        overlay.classList.toggle("open", shouldOpen);
        panel.classList.toggle("open", shouldOpen);
        if (shouldOpen) {
          walkStep = 0;
          walkTargetKey = null;
          renderWalkthrough();
        } else {
          placeWalkthrough();
        }
      }

      function stepWalkthrough(delta) {
        const steps = walkthroughSteps(courseIndex());
        const nextStep = walkStep + delta;
        if (nextStep >= steps.length) {
          toggleWalkthrough(false);
          return;
        }
        walkStep = Math.max(0, nextStep);
        renderWalkthrough();
      }

      /* ---------- Graduation timeline ---------- */
      // PSU runs two regular terms a year: Fall (odd term order) and Spring (even term order) — prep1=-1(Fall),
      // prep2=0(Spring), 1st=1(Fall), 2nd=2(Spring), ... 8th=8(Spring). Prep is counted as its own
      // academic year when the student selects Prep 1st / Prep 2nd as the entry point.
      let gradState = { startTerm: "prep1", startYear: null };

      function semesterTypeForOrder(order) {
        return order % 2 === 0 ? "spring" : "fall";
      }

      // Keep the visible plan order and the calendar order identical. If a student selects Prep 1st, that means
      // they started in the preparatory year, so Prep 1st/Prep 2nd must not be collapsed onto 1st/2nd semester.
      function calendarOrder(order) {
        return order;
      }

      // Display Spring by the Gregorian year it mostly belongs to: Fall 2023 -> Spring 2024 -> Fall 2024.
      // That matches the user's "Year (Gregorian)" input and makes Prep 1st 2023 graduate in Spring 2028
      // for a five-year path: one prep year plus four major years.
      function advanceSemester(year, semester) {
        return semester === "fall"
          ? { year: year + 1, semester: "spring" }
          : { year, semester: "fall" };
      }

      function stepsBetween(fromYear, fromSemester, toYear, toSemester) {
        let y = fromYear,
          s = fromSemester,
          steps = 0;
        while ((y !== toYear || s !== toSemester) && steps < 60) {
          const next = advanceSemester(y, s);
          y = next.year;
          s = next.semester;
          steps++;
        }
        return steps;
      }

      // Fall runs ~Aug-Nov. Spring runs ~Dec-Apr and is labeled by the following Gregorian year; May-Jul is
      // the summer break/session, counted as having just finished that year's Spring.
      function currentAcademicSemester() {
        const now = new Date();
        const m = now.getMonth() + 1;
        const y = now.getFullYear();
        if (m >= 8 && m <= 11) return { year: y, semester: "fall" };
        if (m === 12) return { year: y + 1, semester: "spring" };
        if (m <= 4) return { year: y, semester: "spring" };
        return { year: y, semester: "spring" }; // May-Jul summer break
      }

      // False only in the May-Jul break, when the Spring that currentAcademicSemester() names is already over.
      function currentTermInProgress() {
        const m = new Date().getMonth() + 1;
        return m < 5 || m > 7;
      }

      function psuTermCode(termRef) {
        const academicYear =
          termRef.semester === "fall" ? termRef.year : termRef.year - 1;
        const yearCode = String(academicYear % 100).padStart(2, "0");
        const semesterCode =
          termRef.semester === "fall"
            ? "1"
            : termRef.semester === "spring"
              ? "2"
              : "3";
        return yearCode + semesterCode;
      }

      function psuTermLabel(termRef) {
        const s = t();
        const name =
          termRef.semester === "fall"
            ? s.termFirst
            : termRef.semester === "spring"
              ? s.termSecond
              : s.termSummer;
        return `${name} ${psuTermCode(termRef)}`;
      }

      function nextDegreeTermAfter(coopTerm) {
        if (coopTerm.semester === "spring")
          return { year: coopTerm.year, semester: "summer" };
        if (coopTerm.semester === "fall")
          return { year: coopTerm.year + 1, semester: "spring" };
        return { year: coopTerm.year + 1, semester: "fall" };
      }

      // Your "current position" is the last term reached by walking CONSECUTIVELY from the start — not just
      // the highest order that has any single course marked done. A stray/leftover mark in a much later term
      // (e.g. from earlier testing) shouldn't make you look "ahead" while everything in between is untouched;
      // that term only counts once every term before it is actually complete.
      function furthestReachedOrder(startTermId) {
        const map = courseIndex();
        const startTerm = BASE_TERMS.find((bt) => bt.id === startTermId);
        const startOrder = startTerm ? startTerm.order : -Infinity;
        const terms = allTerms()
          .slice()
          .sort((a, b) => a.order - b.order);
        const isDone = (code) => {
          const course = map[code];
          if (!course) return false;
          return isCourseDone(course);
        };
        const isTouched = (code) =>
          isDone(code) || statusMap[code] === "current";

        let lastFullyDoneOrder = null;
        for (const term of terms) {
          if (term.order < startOrder) continue;
          const termCourses = Object.keys(assignments).filter(
            (code) => assignments[code] === term.id && map[code],
          );
          if (termCourses.length === 0) continue;
          if (termCourses.every(isDone)) {
            lastFullyDoneOrder = {
              raw: term.order,
              calendar: calendarOrder(term.order),
            };
            continue;
          }
          if (termCourses.some(isTouched))
            return { raw: term.order, calendar: calendarOrder(term.order) }; // currently in this term
          break; // first untouched term — stop here, ignore anything further out
        }
        return lastFullyDoneOrder;
      }

      function isCourseDone(course) {
        return (
          statusMap[course.code] === "completed" ||
          (course.examEligible && examMap[course.code])
        );
      }

      function termMeetsStartScope(course, startTermId) {
        if (!course.term) return false;
        const courseTerm = BASE_TERMS.find((bt) => bt.id === course.term);
        const startTerm = BASE_TERMS.find((bt) => bt.id === startTermId);
        if (!courseTerm || !startTerm) return true;
        return courseTerm.order >= startTerm.order;
      }

      function completedElectiveProgress(map) {
        let courses = 0,
          hours = 0;
        ELECTIVE_GROUPS.forEach((g) => {
          if (g.required <= 0) return;
          const completedHours = Object.values(map)
            .filter((c) => c.group === g.id && isCourseDone(c))
            .reduce((sum, c) => sum + (c.hours || 0), 0);
          hours += Math.min(completedHours, g.required);
          if (completedHours >= g.required) courses++;
        });
        return { courses, hours };
      }

      // How many courses/hours a student pacing normally would have finished by "expectedOrder", vs.
      // how many the student has actually marked done (completed or exam-waived).
      function courseAndHourProgress(expectedOrder, startTermId) {
        const map = courseIndex();
        let expectedCourses = 0,
          expectedHours = 0,
          actualCourses = 0,
          actualHours = 0;

        Object.values(map).forEach((course) => {
          const hours = course.hours || 0;
          if (course.term && termMeetsStartScope(course, startTermId)) {
            const termDef = BASE_TERMS.find((bt) => bt.id === course.term);
            if (termDef && calendarOrder(termDef.order) <= expectedOrder) {
              expectedCourses++;
              expectedHours += hours;
            }
          }
          // PSU's own registrar plan reports "hours passed" separately from "hours registered" (in-progress,
          // ungraded) — e.g. a course you're currently taking shows up under "credit hours registered," not
          // under "credit hours passed." Match that: only fully completed/waived courses count as earned here.
          if (
            course.term &&
            termMeetsStartScope(course, startTermId) &&
            isCourseDone(course)
          ) {
            actualCourses++;
            actualHours += hours;
          }
        });

        if (expectedOrder >= BASE_TERMS.find((bt) => bt.id === "t8").order) {
          ELECTIVE_GROUPS.forEach((g) => {
            if (g.required <= 0) return;
            expectedCourses++;
            expectedHours += g.required;
          });
        }

        const electiveProgress = completedElectiveProgress(map);
        actualCourses += electiveProgress.courses;
        actualHours += electiveProgress.hours;

        return { expectedCourses, expectedHours, actualCourses, actualHours };
      }

      // The official plan totals 134 credit hours (per the registrar PDF), covering every core/prep course
      // plus exactly one course from each elective group that actually carries required hours (the
      // culture/language group is a free 0-hour elective and doesn't count toward the 134).
      function totalPlanRequirements(startTermId) {
        let hours = 0,
          courses = 0;
        COURSES.forEach((c) => {
          if (c.term && (!startTermId || termMeetsStartScope(c, startTermId))) {
            hours += c.hours || 0;
            courses++;
          }
        });
        ELECTIVE_GROUPS.forEach((g) => {
          if (g.required > 0) {
            hours += g.required;
            courses += 1;
          }
        });
        return { hours, courses };
      }

      // Where a student's hours put them, whichever semester each course was actually taken in. A swap
      // counts in full: this reads total hours against the official plan's running total, not the rows.
      function paceOrder(hours) {
        const load = {};
        COURSES.forEach((c) => {
          if (c.term) load[c.term] = (load[c.term] || 0) + (c.hours || 0);
        });
        ELECTIVE_SLOTS.forEach((slot) => {
          const group = ELECTIVE_GROUPS.find((g) => g.id === slot.group);
          const slotTotal = ELECTIVE_SLOTS.filter(
            (x) => x.group === slot.group,
          ).reduce((sum, x) => sum + x.count, 0);
          if (group && slotTotal)
            load[slot.term] =
              (load[slot.term] || 0) +
              (group.required * slot.count) / slotTotal;
        });
        const terms = BASE_TERMS.filter((x) => !x.isPrep).sort(
          (a, b) => a.order - b.order,
        );
        let total = 0;
        for (const term of terms) {
          const size = load[term.id] || 0;
          if (size && hours < total + size)
            return term.order - 1 + (hours - total) / size;
          total += size;
        }
        return terms[terms.length - 1].order;
      }

      // Prep rows the chosen start says were skipped, yet hold courses the student marked as taken.
      function earlierStartThanChosen(termId) {
        const chosen = BASE_TERMS.find((x) => x.id === termId);
        const map = courseIndex();
        return (
          BASE_TERMS.filter((x) => x.isPrep && x.order < chosen.order)
            .sort((a, b) => a.order - b.order)
            .find((prep) =>
              Object.values(map).some((c) => {
                if (assignments[c.code] !== prep.id) return false;
                if (
                  gradState.dropPYP &&
                  BASE_TERMS.some((x) => x.isPrep && x.id === c.term)
                )
                  return false;
                if (c.examEligible && examMap[c.code]) return false;
                return ["completed", "current"].includes(statusMap[c.code]);
              }),
            ) || null
        );
      }

      function renderStartHint(termId, year) {
        const hint = document.getElementById("gradStartHint");
        hint.innerHTML = "";
        const earlier = earlierStartThanChosen(termId);
        if (!earlier) return;
        const s = t();
        const chosen = BASE_TERMS.find((x) => x.id === termId);
        const text = document.createElement("span");
        text.textContent = s.gradStartHintText(
          nameOfTerm(earlier),
          nameOfTerm(chosen),
          year,
        );
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "grad-calc-btn";
        btn.textContent = s.gradStartHintBtn(nameOfTerm(earlier));
        btn.addEventListener("click", () => {
          gradState.dropPYP = false;
          delete gradState.pypPrevStartTerm;
          renderStaticText();
          document.getElementById("gradStartTerm").value = earlier.id;
          calculateGraduation();
          render();
        });
        hint.append(text, btn);
      }

      function calculateGraduation() {
        const s = t();
        const termId = document.getElementById("gradStartTerm").value;
        const yearRaw = document.getElementById("gradStartYear").value;
        const year = parseInt(yearRaw, 10);
        const results = document.getElementById("gradResults");
        const note = document.getElementById("gradNote");
        document.getElementById("gradStartHint").innerHTML = "";
        document.getElementById("gradStatusNote").textContent = "";

        if (!year || year < 2000 || year > 2100) {
          results.classList.remove("show");
          note.textContent = s.gradInvalid;
          return;
        }

        const yearChanged = Number(gradState.startYear) !== year;
        gradState = { ...gradState, startTerm: termId, startYear: year };
        saveState();
        // The start year decides whether coop is charged, and term costs show on the grid.
        if (yearChanged) render();

        renderStartHint(termId, year);

        const startTerm = BASE_TERMS.find((bt) => bt.id === termId);
        const t8 = BASE_TERMS.find((bt) => bt.id === "t8");
        const startSemester = semesterTypeForOrder(startTerm.order);

        const now = currentAcademicSemester();
        const stepsElapsed = stepsBetween(
          year,
          startSemester,
          now.year,
          now.semester,
        );
        // Uncapped: how many order-steps have really elapsed since your start, with no ceiling at t8. Capping
        // this at the plan length used to hide just how far behind a badly-delayed student actually is (it
        // made "now" freeze at the plan's own end once you were even one term late).
        const expectedOrder = calendarOrder(startTerm.order) + stepsElapsed;
        const actualPosition = furthestReachedOrder(termId);

        // Pace is measured against terms that are already over: a standard student hasn't passed the
        // current term's courses yet either, and in-progress courses don't count as earned on our side.
        const finishedOrder = currentTermInProgress()
          ? expectedOrder - 1
          : expectedOrder;
        const progress = courseAndHourProgress(finishedOrder, termId);
        const courseDiff = progress.actualCourses - progress.expectedCourses;
        const hourDiff = progress.actualHours - progress.expectedHours;

        const map = courseIndex();
        updateProgress(map);
        const planTerms = allTerms();
        const currentPositionOrder =
          actualPosition !== null ? actualPosition.raw : startTerm.order - 1;
        const remainingTermsList = planTerms
          .filter((term) => term.order > currentPositionOrder)
          .filter((term) =>
            Object.values(map).some(
              (c) => assignments[c.code] === term.id && !isCourseDone(c),
            ),
          );
        const coopRemaining = remainingTermsList.some(
          (term) => term.id === "t8",
        )
          ? 1
          : 0;
        const regularRemaining = remainingTermsList.filter(
          (term) => !term.isSummer && !term.isGap && term.id !== "t8",
        ).length;
        const summerCount = remainingTermsList.filter(
          (term) => term.isSummer,
        ).length;
        const totalsForPace = totalPlanRequirements(termId);

        // Expected graduation is anchored at "now" (expectedOrder) and walked forward by however many regular/
        // co-op term-slots your current layout still has pending (summers don't count — they're squeezed into
        // breaks, not an extra fall/spring slot). That reflects real progress in both directions: fewer slots
        // left than the standard plan pulls the date earlier (e.g. only co-op remaining), more slots left pushes
        // it later — instead of a catalog target that never moved and a "behind" push that could land in the past.
        const stepsNatural = t8.order - calendarOrder(startTerm.order);
        let grad = { year, semester: startSemester };
        if (actualPosition === null) {
          for (let i = 0; i < stepsNatural; i++)
            grad = advanceSemester(grad.year, grad.semester);
        } else {
          const remainingCount = regularRemaining + coopRemaining;
          const projectedOrder = expectedOrder + remainingCount;
          const orderSteps = Math.max(0, projectedOrder - startTerm.order);
          for (let i = 0; i < orderSteps; i++)
            grad = advanceSemester(grad.year, grad.semester);
        }
        const degreeTerm = nextDegreeTermAfter(grad);

        document.getElementById("gradExpectedValue").textContent =
          `${grad.semester === "fall" ? s.gradFall : s.gradSpring} ${grad.year}`;
        if (actualPosition === null) {
          document.getElementById("gradExpectedNote").textContent = "";
        } else {
          const projectedOrder =
            expectedOrder + regularRemaining + coopRemaining;
          const deltaFromStandard = Math.round(projectedOrder - t8.order);
          document.getElementById("gradExpectedNote").textContent =
            deltaFromStandard > 0
              ? s.gradExpectedDelayed(deltaFromStandard)
              : deltaFromStandard < 0
                ? s.gradExpectedEarly(Math.abs(deltaFromStandard))
                : "";
        }
        document.getElementById("gradCoopTermValue").textContent =
          psuTermLabel(grad);
        document.getElementById("gradDegreeTermValue").textContent =
          psuTermLabel(degreeTerm);

        const statusCard = document.getElementById("gradStatusCard");
        const statusValue = document.getElementById("gradStatusValue");
        statusCard.classList.remove(
          "grad-status-ahead",
          "grad-status-behind",
          "grad-status-ontrack",
        );

        const coursesCard = document.getElementById("gradCoursesCard");
        const coursesValue = document.getElementById("gradCoursesValue");
        coursesCard.classList.remove(
          "grad-status-ahead",
          "grad-status-behind",
          "grad-status-ontrack",
        );
        if (courseDiff === 0) {
          coursesCard.classList.add("grad-status-ontrack");
          coursesValue.textContent = s.gradOnTrack;
        } else if (courseDiff > 0) {
          coursesCard.classList.add("grad-status-ahead");
          coursesValue.textContent = s.gradAheadCourses(courseDiff);
        } else {
          coursesCard.classList.add("grad-status-behind");
          coursesValue.textContent = s.gradBehindCourses(Math.abs(courseDiff));
        }

        const hoursCard = document.getElementById("gradHoursCard");
        const hoursValue = document.getElementById("gradHoursValue");
        hoursCard.classList.remove(
          "grad-status-ahead",
          "grad-status-behind",
          "grad-status-ontrack",
        );
        if (hourDiff === 0) {
          hoursCard.classList.add("grad-status-ontrack");
          hoursValue.textContent = s.gradOnTrack;
        } else if (hourDiff > 0) {
          hoursCard.classList.add("grad-status-ahead");
          hoursValue.textContent = s.gradAheadHours(hourDiff);
        } else {
          hoursCard.classList.add("grad-status-behind");
          hoursValue.textContent = s.gradBehindHours(Math.abs(hourDiff));
        }

        const remainingHours = Math.max(
          0,
          totalsForPace.hours - progress.actualHours,
        );
        const remainingCourses = Math.max(
          0,
          totalsForPace.courses - progress.actualCourses,
        );
        document.getElementById("gradRemainingValue").textContent =
          s.gradRemainingValue(
            remainingHours,
            remainingCourses,
            totalsForPace.hours,
          );

        const coop = coopCourse(map);
        const coopCode = coop ? coop.code : "";
        const coopDone = coop ? isCourseDone(coop) : false;
        const coopHours = (coop || {}).hours || 10;
        document.getElementById("gradCoopNote").textContent = coopDone
          ? s.gradCoopDone(coopCode)
          : s.gradCoopPending(coopHours, coopCode);

        if (actualPosition === null) {
          statusValue.textContent = "—";
          note.textContent = s.gradNoProgress;
        } else {
          // Still in the prep year there are no credit hours to read, so the row is all there is.
          let reachedOrder = actualPosition.calendar;
          if (expectedOrder >= 1) {
            const currentHours = Object.values(map)
              .filter(
                (c) => statusMap[c.code] === "current" && !isCourseDone(c),
              )
              .reduce((sum, c) => sum + (c.hours || 0), 0);
            reachedOrder = Math.round(
              paceOrder(progress.actualHours + currentHours),
            );
            const termAt = (order) =>
              BASE_TERMS.find((x) => x.order === order) || null;
            const nowTerm = termAt(Math.min(expectedOrder, t8.order));
            const reachedTerm = termAt(Math.max(1, reachedOrder));
            if (nowTerm && reachedTerm)
              document.getElementById("gradStatusNote").textContent =
                s.gradStatusBasis(nameOfTerm(nowTerm), nameOfTerm(reachedTerm));
          }
          const diff = reachedOrder - expectedOrder;
          if (diff === 0) {
            statusCard.classList.add("grad-status-ontrack");
            statusValue.textContent = s.gradOnTrack;
          } else if (diff > 0) {
            statusCard.classList.add("grad-status-ahead");
            statusValue.textContent = s.gradAhead(diff);
          } else {
            statusCard.classList.add("grad-status-behind");
            statusValue.textContent = s.gradBehind(Math.abs(diff));
          }
          const breakdownParts = [];
          if (regularRemaining > 0)
            breakdownParts.push(s.gradPartRegular(regularRemaining));
          if (summerCount > 0)
            breakdownParts.push(s.gradPartSummer(summerCount));
          if (coopRemaining > 0) breakdownParts.push(s.gradPartCoop(coopCode));
          const totalTerms = regularRemaining + summerCount + coopRemaining;
          note.textContent = breakdownParts.length
            ? s.gradBasisTotal(breakdownParts.join(s.gradPartJoin), totalTerms)
            : s.gradBasisDone;
        }

        results.classList.add("show");
      }

      /* ---------- Advisor export ---------- */
      // Everything an advisor reviews in one printable page (plus a CSV), built from the same state the grid uses.
      const ADVISOR_KEY = `${STORAGE_KEY}_advisor`;

      function readAdvisorFields() {
        try {
          return JSON.parse(localStorage.getItem(ADVISOR_KEY)) || {};
        } catch (e) {
          return {};
        }
      }

      function advisorFields() {
        const fields = {
          name: document.getElementById("exportName").value.trim(),
          id: document.getElementById("exportId").value.trim(),
          advisor: document.getElementById("exportAdvisor").value.trim(),
          notes: document.getElementById("exportNotes").value.trim(),
        };
        try {
          localStorage.setItem(ADVISOR_KEY, JSON.stringify(fields));
        } catch (e) {}
        return fields;
      }

      function toggleExport(open) {
        const overlay = document.getElementById("exportOverlay");
        const panel = document.getElementById("exportPanel");
        const shouldOpen =
          open !== undefined ? open : !panel.classList.contains("open");
        overlay.classList.toggle("open", shouldOpen);
        panel.classList.toggle("open", shouldOpen);
        if (!shouldOpen) return;
        const saved = readAdvisorFields();
        document.getElementById("exportName").value =
          saved.name || (cloudUser && cloudUser.displayName) || "";
        document.getElementById("exportId").value = saved.id || "";
        document.getElementById("exportAdvisor").value = saved.advisor || "";
        document.getElementById("exportNotes").value = saved.notes || "";
      }

      // Runs the graduation panel's own calculation and reads its results, so both always agree.
      function gradSnapshot() {
        if (!gradState.startYear) return null;
        document.getElementById("gradStartTerm").value =
          gradState.startTerm || "prep1";
        document.getElementById("gradStartYear").value = gradState.startYear;
        calculateGraduation();
        const s = t();
        const v = (id) => document.getElementById(id).textContent.trim();
        return {
          rows: [
            [
              s.gradExpectedLabel,
              v("gradExpectedValue"),
              v("gradExpectedNote"),
            ],
            [s.gradCoopTermLabel, v("gradCoopTermValue"), v("gradCoopNote")],
            [s.gradDegreeTermLabel, v("gradDegreeTermValue"), ""],
            [s.gradStatusLabel, v("gradStatusValue"), ""],
            [s.gradCoursesLabel, v("gradCoursesValue"), ""],
            [s.gradHoursLabel, v("gradHoursValue"), ""],
            [s.gradRemainingLabel, v("gradRemainingValue"), ""],
          ].filter((row) => row[1]),
          basis: v("gradNote"),
        };
      }

      function advisorReportData() {
        const R = t().report;
        const map = courseIndex();
        const gateways = computeGatewaySet(map);
        const dropPrep = !!gradState.dropPYP;
        const terms = allTerms();
        const termOf = (id) => terms.find((x) => x.id === id) || null;
        const orderOf = (id) => (termOf(id) ? termOf(id).order : Infinity);
        const groupOf = (id) =>
          ELECTIVE_GROUPS.find((g) => g.id === id) || null;
        const termName = (term) =>
          term.isPrep || term.isSummer || term.isExtra || term.isGap
            ? termLabel(term)
            : R.baseTerm(termLabel(term));
        const placeName = (id) =>
          termOf(id)
            ? termName(termOf(id))
            : groupOf(id)
              ? groupOf(id).label || t().elective
              : "";
        const courseName = (c) => (lang === "ar" ? c.name : c.nameEn || c.name);
        const prepExempt = (c) => dropPrep && !!(termOf(c.term) || {}).isPrep;
        const statusOf = (c) =>
          c.examEligible && examMap[c.code]
            ? "waived"
            : statusMap[c.code] === "completed"
              ? "completed"
              : statusMap[c.code] === "current"
                ? "current"
                : "planned";
        const isCustom = (c) => customCourses.some((x) => x.code === c.code);
        const courses = Object.values(map).filter((c) => !prepExempt(c));
        const placed = (c) => !!termOf(assignments[c.code]);

        const rowFor = (c) => {
          const notes = [];
          if (c.term && assignments[c.code] !== c.term)
            notes.push(R.noteMoved(placeName(c.term)));
          if (c.group) notes.push(R.noteElective(placeName(c.group)));
          if (isCustom(c)) notes.push(R.noteCustom);
          withdrawals
            .filter((w) => w.code === c.code)
            .forEach((w) =>
              notes.push(
                (w.grade === "F" ? R.noteFailed : R.noteWithdrawn)(
                  placeName(w.termId),
                ),
              ),
            );
          togetherPairs
            .filter((p) => p.dep === c.code)
            .forEach((p) => notes.push(R.noteTogether(p.pre)));
          if (gateways.has(c.code)) notes.push(R.noteCritical);
          return {
            code: c.code,
            name: courseName(c),
            hours: billedHours(c),
            status: statusOf(c),
            official: placeName(c.term || c.group),
            planned: placed(c) ? placeName(assignments[c.code]) : R.unplanned,
            prereqs: (c.prereqs || []).map((p) => ({
              code: p,
              done: map[p] ? isCourseDone(map[p]) || prepExempt(map[p]) : null,
            })),
            notes,
          };
        };

        const termRows = terms
          .filter((term) => !(dropPrep && term.isPrep))
          .map((term) => {
            const rows = courses
              .filter((c) => assignments[c.code] === term.id)
              .map(rowFor);
            return {
              term,
              label: termName(term),
              kind: term.isSummer
                ? "summer"
                : term.isExtra
                  ? "extra"
                  : term.isGap
                    ? "gap"
                    : term.isPrep
                      ? "prep"
                      : "",
              rows,
              hours: rows.reduce((sum, r) => sum + r.hours, 0),
            };
          })
          .filter(
            (r) =>
              r.rows.length ||
              r.term.isSummer ||
              r.term.isExtra ||
              r.term.isGap,
          );

        // Heaviest term in the official plan, with elective slots spread over the terms that hold them.
        const officialLoad = {};
        COURSES.forEach((c) => {
          if (c.term)
            officialLoad[c.term] = (officialLoad[c.term] || 0) + (c.hours || 0);
        });
        ELECTIVE_SLOTS.forEach((slot) => {
          const group = groupOf(slot.group);
          const slotTotal = ELECTIVE_SLOTS.filter(
            (x) => x.group === slot.group,
          ).reduce((sum, x) => sum + x.count, 0);
          if (group && slotTotal)
            officialLoad[slot.term] =
              (officialLoad[slot.term] || 0) +
              (group.required * slot.count) / slotTotal;
        });
        const maxLoad = Math.round(
          Math.max(
            0,
            ...BASE_TERMS.filter((b) => !b.isPrep).map(
              (b) => officialLoad[b.id] || 0,
            ),
          ),
        );

        const electives = ELECTIVE_GROUPS.map((g) => {
          const chosen = courses
            .filter(
              (c) =>
                c.group === g.id && (statusOf(c) !== "planned" || placed(c)),
            )
            .map(rowFor);
          const done = chosen
            .filter((r) => r.status === "completed" || r.status === "waived")
            .reduce((sum, r) => sum + r.hours, 0);
          return {
            label: g.label || t().elective,
            required: g.required,
            done,
            planned: chosen.reduce((sum, r) => sum + r.hours, 0),
            chosen,
          };
        });

        const attention = [];
        courses.forEach((c) => {
          const loc = assignments[c.code];
          if (isCourseDone(c) || !termOf(loc)) return;
          const missing = (c.prereqs || []).filter(
            (p) =>
              map[p] &&
              !isCourseDone(map[p]) &&
              !prepExempt(map[p]) &&
              orderOf(assignments[p]) >= orderOf(loc) &&
              !(
                orderOf(assignments[p]) === orderOf(loc) &&
                isTogether(p, c.code)
              ),
          );
          if (missing.length)
            attention.push(
              R.prereqIssue(c.code, missing.join(", "), placeName(loc)),
            );
        });
        termRows.forEach((r) => {
          if (!r.term.isPrep && maxLoad && r.hours > maxLoad)
            attention.push(R.heavyTerm(r.label, r.hours, maxLoad));
        });
        electives.forEach((g) => {
          if (g.required > 0 && g.planned < g.required)
            attention.push(R.electiveShort(g.label, g.required - g.planned));
        });

        const startTermId = dropPrep ? "t1" : gradState.startTerm || "prep1";
        const totals = totalPlanRequirements(startTermId);
        const earned = courseAndHourProgress(0, startTermId);
        const current = courses.filter((c) => statusOf(c) === "current");
        const startTerm = BASE_TERMS.find(
          (b) => b.id === (dropPrep ? "t1" : gradState.startTerm),
        );

        return {
          program: (document.getElementById("pageTitle").textContent || "")
            .split(" — ")[0]
            .trim(),
          generated: new Date().toLocaleDateString(
            lang === "ar" ? "ar-SA-u-ca-gregory-nu-latn" : "en-GB",
            { year: "numeric", month: "long", day: "numeric" },
          ),
          startTerm:
            gradState.startYear && startTerm
              ? `${termName(startTerm)} · ${gradState.startYear}`
              : R.notSet,
          dropPrep,
          totals,
          earned,
          currentCount: current.length,
          currentHours: current.reduce((sum, c) => sum + (c.hours || 0), 0),
          waived: courses
            .filter((c) => statusOf(c) === "waived")
            .map((c) => c.code),
          grad: gradSnapshot(),
          attention,
          moved: courses
            .filter((c) => c.term && assignments[c.code] !== c.term)
            .map(rowFor),
          addedTerms: extraTerms
            .slice()
            .sort((a, b) => a.order - b.order)
            .map((term) => ({
              label: termName(term),
              kind: term.isSummer ? "summer" : term.isExtra ? "extra" : "gap",
              count: courses.filter((c) => assignments[c.code] === term.id)
                .length,
            })),
          custom: courses.filter(isCustom).map(rowFor),
          termRows,
          electives,
          unplacedElectives: electives.flatMap((g) =>
            g.chosen.filter((r) => r.planned === R.unplanned),
          ),
          remaining: courses
            .filter(
              (c) =>
                statusOf(c) === "planned" &&
                (c.term || placed(c) || isCustom(c)),
            )
            .map(rowFor),
          electiveGaps: electives
            .filter((g) => g.required > g.planned)
            .map((g) => R.electiveCredits(g.label, g.required - g.planned)),
        };
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }

      function advisorReportHtml(d, fields) {
        const R = t().report;
        const e = escapeHtml;
        const chip = (status) =>
          `<span class="chip ${status}">${e(R.status[status])}</span>`;
        const prereqCell = (r) =>
          r.prereqs.length
            ? r.prereqs
                .map(
                  (p) =>
                    `<span class="pre${p.done === false ? " open" : ""}">${e(p.code)}${p.done ? " ✓" : ""}</span>`,
                )
                .join(" ")
            : "—";
        const table = (heads, rows, kind) =>
          `<div class="table-wrap"><table class="fixed ${kind}"><colgroup>${heads
            .map(() => "<col />")
            .join("")}</colgroup><thead><tr>${heads
            .map(
              ([label, cls]) =>
                `<th${cls ? ` class="${cls}"` : ""}>${e(label)}</th>`,
            )
            .join(
              "",
            )}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
        const courseTable = (rows) =>
          table(
            [
              [R.cols.code],
              [R.cols.course],
              [R.cols.cr, "num"],
              [R.cols.status],
              [R.cols.prereqs],
              [R.cols.notes],
            ],
            rows.map(
              (r) =>
                `<tr><td class="code">${e(r.code)}</td><td>${e(r.name)}</td><td class="num">${r.hours}</td><td>${chip(r.status)}</td><td>${prereqCell(r)}</td><td class="notes">${e(r.notes.join(" · "))}</td></tr>`,
            ),
            "courses",
          );
        const placementTable = (rows) =>
          table(
            [
              [R.cols.code],
              [R.cols.course],
              [R.cols.cr, "num"],
              [R.cols.official],
              [R.cols.planned],
            ],
            rows.map(
              (r) =>
                `<tr><td class="code">${e(r.code)}</td><td>${e(r.name)}</td><td class="num">${r.hours}</td><td>${e(r.official)}</td><td>${e(r.planned)}</td></tr>`,
            ),
            "places",
          );
        const stat = (label, value, detail) =>
          `<div class="stat"><div class="stat-label">${e(label)}</div><div class="stat-value">${e(value)}</div>${detail ? `<div class="stat-detail">${e(detail)}</div>` : ""}</div>`;
        const info = (label, value) =>
          `<div><dt>${e(label)}</dt><dd>${e(value || "—")}</dd></div>`;

        const changes = [];
        if (d.moved.length)
          changes.push(`<h3>${e(R.moved)}</h3>${placementTable(d.moved)}`);
        if (d.addedTerms.length)
          changes.push(
            `<h3>${e(R.addedTerms)}</h3><ul>${d.addedTerms
              .map(
                (x) =>
                  `<li>${e(x.label)} · ${e(R.kind[x.kind])} · ${e(R.courses(x.count))}</li>`,
              )
              .join("")}</ul>`,
          );
        if (d.custom.length)
          changes.push(
            `<h3>${e(R.customCourses)}</h3>${placementTable(d.custom)}`,
          );

        const title = [R.docTitle, d.program, fields.name]
          .filter(Boolean)
          .join(" — ");
        const remainingHours = Math.max(
          0,
          d.totals.hours - d.earned.actualHours,
        );

        return `<!doctype html>
<html lang="${lang}" dir="${lang === "ar" ? "rtl" : "ltr"}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>${e(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
