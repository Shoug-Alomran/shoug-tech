<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/assets/shoug-favicon-v4.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/shoug-apple-touch-icon-v4.png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Software Engineering · Digital Transformation Grid // SHOUG.TECH
    </title>
    <meta
      property="og:title"
      content="Software Engineering · Digital Transformation Grid // SHOUG.TECH"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://shoug-tech.com/academic-plan-themes/se-dx/grid.html"
    />
    <meta
      property="og:image"
      content="https://shoug-tech.com/assets/og-banner.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://shoug-tech.com/assets/og-banner.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --border: #c9ccd3;
        --text: #222;
        --muted: #6b7280;
        --term-badge: #2f5fa8;
        --term-badge-text: #fff;
        --summer-badge: #c07a1f;
        --gap-badge: #5b6472;
        --extra-badge: #5a4fcf;
        --elective-badge: #3a3f4a;

        --not-taken-bg: #8a2b2b;
        --not-taken-text: #fff;
        --not-taken-border: #6e1f1f;

        --current-bg: #ffffff;
        --current-text: #222;
        --current-border: #2f5fa8;

        --completed-bg: #3f7d3f;
        --completed-text: #fff;
        --completed-border: #2c5c2c;

        --locked-bg: #4a4a52;
        --locked-text: #fff;
        --locked-border: #2e2e33;

        --critical-accent: #d9a441;
      }

      :root[data-theme="dark"] {
        --bg: #0e0f12;
        --panel: #17181c;
        --border: #33353c;
        --text: #e7e7ea;
        --muted: #9a9ca3;
        --term-badge: #3f6fc0;
        --gap-badge: #7a828f;
        --extra-badge: #766cf0;
        --not-taken-bg: #5c2323;
        --not-taken-border: #3f1717;
        --current-bg: #1f2126;
        --current-text: #f0f0f0;
        --completed-bg: #2f5c30;
        --completed-border: #1f3f20;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e0f12;
          --panel: #17181c;
          --border: #33353c;
          --text: #e7e7ea;
          --muted: #9a9ca3;
          --term-badge: #3f6fc0;
          --gap-badge: #7a828f;
          --extra-badge: #766cf0;
          --not-taken-bg: #5c2323;
          --not-taken-border: #3f1717;
          --current-bg: #1f2126;
          --current-text: #f0f0f0;
          --completed-bg: #2f5c30;
          --completed-border: #1f3f20;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Tajawal", sans-serif;
        padding: 28px 16px 80px;
        min-height: 100vh;
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
      }

      header.page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 20px;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }

      header.page-head h1 {
        font-size: 18px;
        font-weight: 800;
      }

      .sub {
        font-size: 12px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .actions button {
        font-family: "Tajawal", sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 8px 14px;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.15s;
      }

      .actions button:hover {
        border-color: var(--term-badge);
        color: var(--term-badge);
      }

      .actions button.add-summer:hover {
        border-color: var(--summer-badge);
        color: var(--summer-badge);
      }

      .actions button.add-gap:hover {
        border-color: var(--gap-badge);
        color: var(--gap-badge);
      }

      .actions #cloudBtn[data-state="saved"] {
        border-color: var(--completed-bg);
      }

      .actions #cloudBtn[data-state="saving"],
      .actions #cloudBtn[data-state="loading"] {
        opacity: 0.7;
      }

      .actions #cloudBtn[data-state="error"] {
        border-color: var(--not-taken-border);
        color: var(--not-taken-border);
      }

      .actions button.add-extra:hover {
        border-color: var(--extra-badge);
        color: var(--extra-badge);
      }

      .progress-bar {
        height: 8px;
        border-radius: 5px;
        background: var(--border);
        overflow: hidden;
        margin-top: 2px;
      }

      .progress-fill {
        height: 100%;
        background: var(--completed-bg);
        width: 0%;
        transition: width 0.25s;
      }

      .progress-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 200px;
      }

      .plan {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 24px;
      }

      .term-row {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid var(--border);
      }

      .term-row:last-child {
        border-bottom: none;
      }

      .term-row.summer .term-label {
        background: var(--summer-badge);
      }

      .term-row.gap .term-label {
        background: var(--gap-badge);
      }

      .term-row.extra .term-label {
        background: var(--extra-badge);
      }

      .gap-note {
        align-self: center;
        margin: 0 auto;
        padding: 10px 14px;
        color: var(--muted);
        font-size: 12px;
        font-style: italic;
      }

      .term-row.elective-row .term-label {
        background: var(--elective-badge);
        font-size: 12.5px;
      }

      .term-label {
        flex: 0 0 108px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--term-badge);
        color: var(--term-badge-text);
        font-weight: 800;
        font-size: 14px;
        text-align: center;
        padding: 8px;
        gap: 4px;
        position: relative;
      }

      .term-remove {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        color: #fff;
        border: none;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .term-remove:hover {
        background: rgba(0, 0, 0, 0.45);
      }

      .term-courses {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 1px;
        background: var(--border);
        min-height: 60px;
        transition: background 0.12s;
      }

      .term-courses.drag-over {
        background: var(--term-badge);
      }

      .term-courses.drag-invalid {
        background: var(--not-taken-bg);
      }

      .course {
        background: var(--not-taken-bg);
        color: var(--not-taken-text);
        border-inline-start: 4px solid var(--not-taken-border);
        padding: 9px 10px;
        cursor: pointer;
        user-select: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        min-height: 58px;
        flex: 1 1 150px;
        max-width: 220px;
        transition:
          filter 0.12s,
          transform 0.08s,
          opacity 0.12s;
      }

      .course:hover {
        filter: brightness(1.08);
      }

      .course:active {
        transform: scale(0.98);
      }

      .course.dragging {
        opacity: 0.35;
      }

      .course[draggable="true"] {
        cursor: grab;
      }

      .course.state-current {
        background: var(--current-bg);
        color: var(--current-text);
        border-inline-start-color: var(--current-border);
      }

      .course.state-completed {
        background: var(--completed-bg);
        color: var(--completed-text);
        border-inline-start-color: var(--completed-border);
      }

      .course.locked {
        background: var(--locked-bg);
        color: var(--locked-text);
        border-inline-start-color: var(--locked-border);
        cursor: grab;
        box-shadow: inset 0 0 0 2px var(--critical-accent);
      }

      .course.locked.state-completed {
        background: var(--completed-bg);
        border-inline-start-color: var(--completed-border);
      }

      .course.locked.state-current {
        background: var(--current-bg);
        color: var(--current-text);
        border-inline-start-color: var(--current-border);
      }

      .course .code-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .course .code {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        opacity: 0.9;
      }

      .course .lock-icon {
        font-size: 11px;
        opacity: 0.85;
      }

      .course .icon-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .exam-tick {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        border-radius: 3px;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        background: transparent;
        color: transparent;
        font-size: 11px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .exam-tick:hover {
        border-color: #fff;
      }

      .exam-tick.checked {
        background: #2f5fa8;
        border-color: #2f5fa8;
        color: #fff;
      }

      .move-tick {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        border-radius: 4px;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        background: transparent;
        color: currentColor;
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .move-tick:hover,
      .move-tick.active {
        background: var(--term-badge);
        border-color: var(--term-badge);
        color: #fff;
      }

      .course.move-selected {
        outline: 3px solid var(--summer-badge);
        outline-offset: -3px;
        filter: brightness(1.08);
      }

      .term-courses.move-target {
        box-shadow: inset 0 0 0 2px rgba(192, 122, 31, 0.45);
        cursor: copy;
      }

      .term-label.move-target-label,
      .add-course-tile.move-target-label {
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.45);
        cursor: copy;
      }

      .course.locked .exam-tick {
        border-color: rgba(255, 255, 255, 0.4);
      }

      .course.exempted .name {
        text-decoration: line-through;
        text-decoration-color: currentColor;
        text-decoration-thickness: 1.5px;
      }

      .course .name {
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.35;
      }

      .course .code-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .course .credit-pill {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        padding: 3px 6px;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 14%, transparent);
        white-space: nowrap;
      }

      .term-label .term-hours {
        font-size: 11px;
        font-weight: 700;
        opacity: 0.85;
      }

      .syllabus-tick {
        position: relative;
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        border-radius: 5px;
        border: 1.5px solid color-mix(in srgb, currentColor 45%, transparent);
        background: transparent;
        color: currentColor;
        font-size: 13px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: transform 0.15s;
      }

      /* Taller invisible hit area; kept narrow so it never covers the ↔ button beside it. */
      .syllabus-tick::after {
        content: "";
        position: absolute;
        inset: -8px -2px;
      }

      @media (pointer: coarse) {
        .syllabus-tick {
          width: 30px;
          height: 30px;
          flex-basis: 30px;
          font-size: 15px;
        }
      }

      .course.expanded > .code-row,
      .course.expanded > .name {
        cursor: pointer;
      }

      .syllabus-close {
        grid-column: 1 / -1;
        min-height: 36px;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, currentColor 8%, transparent);
        color: inherit;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .syllabus-close:hover {
        background: color-mix(in srgb, currentColor 16%, transparent);
      }

      .syllabus-tick:hover {
        border-color: currentColor;
      }

      .course.expanded .syllabus-tick {
        transform: rotate(180deg);
        background: color-mix(in srgb, currentColor 16%, transparent);
      }

      .term-courses .course.expanded {
        flex: 1 1 100%;
        max-width: none;
        cursor: default;
      }

      .syllabus-panel {
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 14px 22px;
        cursor: auto;
        user-select: text;
      }

      .syllabus-summary {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .syllabus-summary .chip {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }

      .syllabus-summary a {
        margin-inline-start: auto;
        font-size: 11.5px;
        font-weight: 700;
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .syllabus-panel h4 {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.75;
      }

      .syllabus-chapters {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 4px 14px;
      }

      .syllabus-chapters li {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 6px;
        font-size: 12px;
        line-height: 1.35;
      }

      .syllabus-chapters .ch-n {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        font-weight: 700;
        opacity: 0.7;
        padding-top: 1px;
      }

      .syllabus-chapters .ch-exams {
        display: block;
        font-size: 10.5px;
        opacity: 0.7;
      }

      .syllabus-weights {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .syllabus-weights li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        font-size: 12px;
      }

      .syllabus-weights .w-val {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 11px;
      }

      .syllabus-weights .w-bar {
        grid-column: 1 / -1;
        height: 4px;
        border-radius: 2px;
        background: color-mix(in srgb, currentColor 14%, transparent);
        overflow: hidden;
      }

      .syllabus-weights .w-bar span {
        display: block;
        height: 100%;
        background: color-mix(in srgb, currentColor 45%, transparent);
      }

      .syllabus-weights li.is-exam .w-bar span {
        background: var(--summer-badge);
      }

      .syllabus-empty {
        grid-column: 1 / -1;
        font-size: 12px;
        opacity: 0.75;
        font-style: italic;
      }

      @media (max-width: 720px) {
        .syllabus-panel {
          grid-template-columns: 1fr;
        }
      }

      .add-course-tile {
        flex: 0 0 44px;
        width: 44px;
        min-height: 58px;
        background: transparent;
        border: 2px dashed var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 20px;
        cursor: pointer;
        transition: 0.12s;
      }

      .add-course-tile:hover {
        border-color: var(--term-badge);
        color: var(--term-badge);
      }

      .lang-toggle {
        font-family: "JetBrains Mono", monospace !important;
        font-weight: 700;
        min-width: 42px;
      }

      .lang-toggle:hover {
        border-color: var(--summer-badge) !important;
        color: var(--summer-badge) !important;
      }

      .lang-toggle.active {
        background: var(--term-badge) !important;
        border-color: var(--term-badge) !important;
        color: #fff !important;
      }

      .course.view-only {
        cursor: default;
      }

      .course.elective-slot {
        background: var(--empty-slot-bg);
        color: var(--empty-slot-text);
        border-inline-start-color: var(--term-badge);
        cursor: default;
      }

      .course.elective-slot:hover {
        filter: none;
      }

      .compare-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        z-index: 60;
      }

      .compare-overlay.open {
        display: block;
      }

      .compare-panel {
        position: fixed;
        top: 4%;
        left: 50%;
        transform: translateX(-50%);
        width: min(1180px, 94vw);
        max-height: 90vh;
        overflow-y: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        display: none;
        z-index: 61;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .compare-panel.open {
        display: block;
      }

      .walk-panel {
        position: fixed;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, 92vw);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        display: none;
        z-index: 61;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      .walk-panel.open {
        display: block;
      }

      /* Anchored next to the element the current step explains. */
      .walk-panel.anchored {
        transform: none;
        right: auto;
        width: min(400px, calc(100vw - 32px));
        transition:
          top 0.25s ease,
          left 0.25s ease;
      }

      .compare-overlay.walk-clear {
        background: transparent;
      }

      .walk-spot {
        position: fixed;
        z-index: 60;
        display: none;
        border-radius: 10px;
        pointer-events: none;
        box-shadow:
          0 0 0 3px var(--term-badge),
          0 0 0 9999px rgba(0, 0, 0, 0.55);
        transition:
          top 0.25s ease,
          left 0.25s ease,
          width 0.25s ease,
          height 0.25s ease;
      }

      .walk-spot.open {
        display: block;
      }

      .summer-panel {
        width: min(640px, 92vw);
      }

      .summer-options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        max-height: min(54vh, 430px);
        overflow-y: auto;
        margin-top: 16px;
        padding-inline-end: 4px;
      }

      .summer-option {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        padding: 12px;
        text-align: start;
        cursor: pointer;
        transition:
          border-color 0.14s ease,
          background 0.14s ease,
          transform 0.14s ease;
      }

      .summer-option:hover {
        border-color: var(--summer-badge);
        background: rgba(205, 130, 24, 0.12);
        transform: translateY(-1px);
      }

      .gap-panel .summer-option:hover {
        border-color: var(--gap-badge);
        background: rgba(91, 100, 114, 0.16);
        transform: translateY(-1px);
      }

      .summer-option-title {
        display: block;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .summer-option-meta {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .summer-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
      }

      .summer-actions button {
        font-family: "Tajawal", sans-serif;

        font-weight: 700;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 8px 14px;
        border-radius: 7px;
        cursor: pointer;

      .walk-actions button:last-child {

        background: var(--term-badge);
        color: #fff;

      .compare-header {

        align-items: center;
        justify-content: space-between;

      }

        font-size: 16px;
        font-weight: 800;
      }

      .compare-close {

        height: 32px;
        flex: 0 0 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .compare-close:hover {
        border-color: var(--term-badge);
        color: var(--term-badge);
      }

        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        margin: 10px 0 18px;

        display: flex;
        flex-direction: column;
        gap: 4px;

        color: var(--muted);
        font-family: "JetBrains Mono", monospace;

      .grad-field input {

        font-size: 13.5px;
        padding: 8px 10px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        min-width: 140px;
      }

      .export-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .export-form .export-notes {
        grid-column: 1 / -1;
      }

      #exportSub,
      .export-form label {
        font-family: "Tajawal", sans-serif;
        font-size: 12.5px;
      }

      .export-form textarea {
        font-family: "Tajawal", sans-serif;
        font-size: 13.5px;
        padding: 8px 10px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        resize: vertical;
        min-height: 84px;
      }

      .export-actions {
        gap: 8px;
        flex-wrap: wrap;
      }

      .export-actions button:last-child {
        border-color: var(--term-badge);
        background: var(--term-badge);
        color: #fff;
      }

      .grad-calc-btn {
        font-family: "Tajawal", sans-serif;
        font-size: 13px;
        font-weight: 700;
        padding: 9px 18px;
        border-radius: 7px;
        border: 1px solid var(--term-badge);
        background: var(--term-badge);
        color: #fff;
        cursor: pointer;
      }

      .grad-calc-btn:hover {
        filter: brightness(1.1);
      }

      .grad-results {
        display: none;
        flex-wrap: wrap;
        gap: 14px;
      }

      .grad-results.show {
        display: flex;
      }

      .grad-card {
        flex: 1 1 220px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }

      .grad-card-label {
        font-size: 11px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }

      .grad-card-value {
        font-size: 18px;
        font-weight: 800;
      }

      .grad-status-ahead .grad-card-value {
        color: var(--completed-bg);
      }

      .grad-status-behind .grad-card-value {
        color: var(--not-taken-bg);
      }

      .grad-status-ontrack .grad-card-value {
        color: var(--term-badge);
      }

      .grad-status-note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.5;
      }

      .grad-start-hint {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 16px;
        margin-bottom: 14px;
        padding: 12px 14px;
        border: 1px solid var(--summer-badge);
        border-radius: 10px;
        background: var(--panel);
        font-size: 13px;
        line-height: 1.6;
      }

      .grad-start-hint span {
        flex: 1 1 280px;
      }

      .grad-start-hint:empty {
        display: none;
      }

      .grad-note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }

      .legend {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 20px;
        font-size: 13px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .swatch {
        width: 20px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      .swatch.red {
        background: var(--not-taken-bg);
      }

      .swatch.white {
        background: var(--current-bg);
        border-color: var(--current-border);
      }

      .swatch.green {
        background: var(--completed-bg);
      }

      .swatch.locked {
        background: var(--locked-bg);
        box-shadow: inset 0 0 0 2px var(--critical-accent);

      footer.hint {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin-top: 16px;
        font-family: "JetBrains Mono", monospace;
      }

      #toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #1a1a1a;
        color: #fff;
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 999;
        max-width: 90vw;
        text-align: center;
      }

      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Drop (W): a ghost stays in the term the course was dropped from. */
      .term-courses .course {
        position: relative;

      .course:has(.grade-actions) {
        padding-bottom: 28px;

      .grade-actions {
        position: absolute;
        inset-block-end: 4px;
        inset-inline-end: 4px;
        display: flex;
        gap: 3px;
      }

      .drop-tick {
        width: 20px;
        height: 20px;
        border-radius: 4px;

        font-size: 11px;
        font-weight: 800;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;

      .drop-tick:hover {

        background: var(--summer-badge);

        gap: 4px;

        border: 1px solid var(--border);

        font-weight: 700;

        background: var(--panel);
        cursor: pointer;
        font-size: 13px;

      .retake-option input {
        margin-top: 3px;
        flex: 0 0 auto;
      }

      .retake-option span {
        min-width: 0;

      .retake-option small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        margin-top: 2px;
      }

      .remove-tick {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        border-radius: 4px;
        border: 1.5px solid currentColor;
        background: transparent;
        color: inherit;
        opacity: 0.65;
        font-size: 13px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;

      .remove-tick:hover {
        opacity: 1;

      @media (pointer: coarse) {

          width: 30px;
          height: 30px;
        }

      .course.withdrawn,

        cursor: default;
        filter: none;
        transform: none;

      .course.withdrawn .code,

        font-weight: 800;
        line-height: 20px;
        text-align: center;

      .undo-drop {
        align-self: flex-start;
        border: none;
        background: none;

        font-weight: 700;
        padding: 2px 0;
        cursor: pointer;
        text-decoration: underline;

      .swatch.withdrawn {
        background: var(--bg);
        border: 1px dashed var(--muted);

      .term-cost {

        flex: 0 1 auto;
        gap: 6px;

        border: 1px solid var(--border);
        border-radius: 8px;

        color: inherit;

        font-size: 12.5px;

      <header class="page-head">
        <div>
          <h1 id="pageTitle">الخطة الدراسية — التسجيل</h1>
          <div class="sub" id="pageSub">
            اضغط على مقرر لتبديل حالته &middot; اسحب المقررات (غير المقفلة) بين
            الفصول
          </div>
        </div>
        <div class="progress-row">
          <div class="sub" id="progressText">0 / 0 مقرر مكتمل</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <div class="actions">
          <button class="lang-toggle" id="walkBtn" type="button">?</button>
          <button class="lang-toggle" id="themeBtn" type="button">🌙</button>
          <button class="lang-toggle" id="viewModeBtn" type="button">✏️</button>
          <button class="lang-toggle" id="eyeBtn" type="button">👁</button>
          <button class="lang-toggle" id="gradBtn" type="button">🎓</button>
          <button class="lang-toggle" id="pypBtn" type="button">🎒</button>
          <button class="lang-toggle" id="langBtn" type="button">EN</button>
          <button class="add-summer" id="addSummerBtn"></button>
          <button class="add-extra" id="addExtraBtn"></button>
          <button class="add-gap" id="addGapBtn"></button>
          <button id="cloudBtn" type="button" data-state="signed-out"></button>
          <button id="tuitionBtn" type="button"></button>
          <button id="exportBtn" type="button"></button>
          <button id="resetBtn"></button>
        </div>
      </header>

      <div class="plan" id="plan-prep"></div>
      <div class="plan" id="plan"></div>
      <div class="plan" id="plan-electives"></div>

      <div class="legend">
        <div class="legend-item">
          <span class="swatch red"></span><span id="legendRed"></span>
        </div>
        <div class="legend-item">
          <span class="swatch white"></span><span id="legendWhite"></span>
        </div>
        <div class="legend-item">
          <span class="swatch green"></span><span id="legendGreen"></span>
        </div>
        <div class="legend-item">
          <span class="swatch locked"></span><span id="legendLocked"></span>
        </div>
        <div class="legend-item">
          <span class="swatch withdrawn"></span><span id="legendW"></span>
        </div>
        <div class="legend-item">
          <span class="swatch withdrawn failed"></span
          ><span id="legendF"></span>
        </div>
      </div>

      <footer class="hint" id="pageFooter"></footer>
    </div>

    <div class="compare-overlay" id="compareOverlay"></div>
    <div class="compare-panel" id="comparePanel">
      <div class="compare-header">
        <h2 id="compareTitle"></h2>
        <button class="compare-close" id="compareCloseBtn" type="button">
          ×
        </button>
      </div>
      <div class="sub" id="compareSub" style="margin-bottom: 14px"></div>
      <div class="plan" id="compare-prep"></div>
      <div class="plan" id="compare-main"></div>
      <div class="plan" id="compare-electives"></div>
    </div>

    <div class="compare-overlay" id="walkOverlay"></div>
    <div class="walk-spot" id="walkSpot"></div>
    <div class="walk-panel" id="walkPanel">
      <div class="compare-header">
        <h2 id="walkTitle"></h2>
        <button class="compare-close" id="walkCloseBtn" type="button">×</button>
      </div>
      <div class="walk-step-count" id="walkStepCount"></div>
      <div class="walk-step-title" id="walkStepTitle"></div>
      <div class="walk-step-body" id="walkStepBody"></div>
      <div class="walk-actions">
        <button id="walkPrevBtn" type="button"></button>
        <button id="walkNextBtn" type="button"></button>
      </div>
    </div>

    <div class="compare-overlay" id="summerOverlay"></div>
    <div class="walk-panel summer-panel" id="summerPanel">
      <div class="compare-header">
        <h2 id="summerTitle"></h2>
        <button class="compare-close" id="summerCloseBtn" type="button">
          ×
        </button>
      </div>
      <div class="sub" id="summerSub"></div>
      <div class="summer-options" id="summerOptions"></div>
      <div class="summer-actions">
        <button id="summerCancelBtn" type="button"></button>
      </div>
    </div>

    <div class="compare-overlay" id="extraOverlay"></div>
    <div class="walk-panel summer-panel extra-panel" id="extraPanel">
      <div class="compare-header">
        <h2 id="extraTitle"></h2>
        <button class="compare-close" id="extraCloseBtn" type="button">
          ×
        </button>
      </div>
      <div class="sub" id="extraSub"></div>
      <div class="summer-options" id="extraOptions"></div>
      <div class="summer-actions">
        <button id="extraCancelBtn" type="button"></button>
      </div>
    </div>

    <div class="compare-overlay" id="gapOverlay"></div>
    <div class="walk-panel summer-panel gap-panel" id="gapPanel">
      <div class="compare-header">
        <h2 id="gapTitle"></h2>
        <button class="compare-close" id="gapCloseBtn" type="button">×</button>
      </div>
      <div class="sub" id="gapSub"></div>
      <div class="summer-options" id="gapOptions"></div>
      <div class="summer-actions">
        <button id="gapCancelBtn" type="button"></button>
      </div>
    </div>

    <div class="compare-overlay" id="exportOverlay"></div>
    <div class="walk-panel summer-panel" id="exportPanel">
      <div class="compare-header">
        <h2 id="exportTitle"></h2>
        <button class="compare-close" id="exportCloseBtn" type="button">
          ×
        </button>
      </div>
      <div class="sub" id="exportSub"></div>
      <div class="export-form">
        <div class="grad-field">
          <label id="exportNameLabel" for="exportName"></label>
          <input id="exportName" type="text" autocomplete="name" />
        </div>
        <div class="grad-field">
          <label id="exportIdLabel" for="exportId"></label>
          <input
            id="exportId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
          />
        </div>
        <div class="grad-field">
          <label id="exportAdvisorLabel" for="exportAdvisor"></label>
          <input id="exportAdvisor" type="text" autocomplete="off" />
        </div>
        <div class="grad-field export-notes">
          <label id="exportNotesLabel" for="exportNotes"></label>
          <textarea id="exportNotes" rows="4"></textarea>
        </div>
      </div>
      <div class="summer-actions export-actions">
        <button id="exportCsvBtn" type="button"></button>
        <button id="exportGridBtn" type="button"></button>
        <button id="exportOpenBtn" type="button"></button>
      </div>
    </div>

    <div class="compare-overlay" id="addOverlay"></div>
    <div class="walk-panel summer-panel" id="addPanel">
      <div class="compare-header">
        <h2 id="addTitle"></h2>
        <button class="compare-close" id="addCloseBtn" type="button">×</button>
      </div>
      <div class="sub" id="addSub"></div>
      <div class="add-form">
        <div class="grad-field add-wide" id="addPickField">
          <label id="addPickLabel" for="addPick"></label>
          <select id="addPick"></select>
        </div>
        <div class="grad-field" id="addCodeField">
          <label id="addCodeLabel" for="addCode"></label>
          <input id="addCode" type="text" autocomplete="off" />
        </div>
        <div class="grad-field" id="addHoursField">
          <label id="addHoursLabel" for="addHours"></label>
          <input
            id="addHours"
            type="number"
            min="0"
            max="12"
            step="1"
            inputmode="numeric"
          />
        </div>
        <div class="grad-field add-wide" id="addNameField">
          <label id="addNameLabel" for="addName"></label>
          <input id="addName" type="text" autocomplete="off" />
        </div>
      </div>
      <div class="add-error" id="addError"></div>
      <div class="summer-actions">
        <button id="addCancelBtn" type="button"></button>
        <button class="add-confirm" id="addConfirmBtn" type="button"></button>
      </div>
    </div>

    <div class="compare-overlay" id="retakeOverlay"></div>
    <div class="walk-panel summer-panel" id="retakePanel">
      <div class="compare-header">
        <h2 id="retakeTitle"></h2>
        <button class="compare-close" id="retakeCloseBtn" type="button">
          ×
        </button>
      </div>
      <div class="sub" id="retakeSub"></div>
      <div class="retake-group" id="retakeOpens"></div>
      <div class="retake-group" id="retakeWhere"></div>
      <div class="retake-group" id="retakeDeps"></div>
      <div class="summer-actions">
        <button id="retakeCancelBtn" type="button"></button>
        <button
          class="add-confirm"
          id="retakeConfirmBtn"
          type="button"
        ></button>
      </div>
    </div>

    <div class="compare-overlay" id="tuitionOverlay"></div>
    <div class="compare-panel" id="tuitionPanel">
      <div class="compare-header">
        <h2 id="tuitionTitle"></h2>
        <button class="compare-close" id="tuitionCloseBtn" type="button">
          ×
        </button>
      </div>
      <div class="sub" id="tuitionSub" style="margin-bottom: 14px"></div>
      <div class="grad-form">
        <div class="grad-field">
          <label id="tuitionRegularLabel" for="tuitionRegular"></label>
          <input
            id="tuitionRegular"
            type="number"
            min="0"
            step="any"
            inputmode="decimal"
          />
        </div>
        <div class="grad-field">
          <label id="tuitionSummerLabel" for="tuitionSummer"></label>
          <input
            id="tuitionSummer"
            type="number"
            min="0"
            step="any"
            inputmode="decimal"
          />
        </div>
      </div>
      <div class="coop-fee" id="coopFee"></div>
      <div class="grad-results show" id="tuitionCards"></div>
      <div class="tuition-note" id="tuitionNote"></div>
      <div id="tuitionTable"></div>
    </div>

    <div class="compare-overlay" id="gradOverlay"></div>
    <div class="compare-panel" id="gradPanel">
      <div class="compare-header">
        <h2 id="gradTitle"></h2>
        <button class="compare-close" id="gradCloseBtn" type="button">×</button>
      </div>
      <div class="sub" id="gradSub" style="margin-bottom: 14px"></div>
      <div class="grad-form">
        <div class="grad-field">
          <label id="gradTermLabel" for="gradStartTerm"></label>
          <select id="gradStartTerm"></select>
        </div>
        <div class="grad-field">
          <label id="gradYearLabel" for="gradStartYear"></label>
          <input
            id="gradStartYear"
            type="number"
            min="2000"
            max="2100"
            placeholder="2024"
          />
        </div>
        <button class="grad-calc-btn" id="gradCalcBtn" type="button"></button>
      </div>
      <div class="grad-start-hint" id="gradStartHint"></div>
      <div class="grad-results" id="gradResults">
        <div class="grad-card">
          <div class="grad-card-label" id="gradExpectedLabel"></div>
          <div class="grad-card-value" id="gradExpectedValue"></div>
          <div
            class="grad-note"
            id="gradExpectedNote"
            style="margin-top: 6px"
          ></div>
        </div>
        <div class="grad-card">
          <div class="grad-card-label" id="gradCoopTermLabel"></div>
          <div class="grad-card-value" id="gradCoopTermValue"></div>
        </div>
        <div class="grad-card">
          <div class="grad-card-label" id="gradDegreeTermLabel"></div>
          <div class="grad-card-value" id="gradDegreeTermValue"></div>
        </div>
        <div class="grad-card" id="gradStatusCard">
          <div class="grad-card-label" id="gradStatusLabel"></div>
          <div class="grad-card-value" id="gradStatusValue"></div>
          <div class="grad-status-note" id="gradStatusNote"></div>
        </div>
        <div class="grad-card" id="gradCoursesCard">
          <div class="grad-card-label" id="gradCoursesLabel"></div>
          <div class="grad-card-value" id="gradCoursesValue"></div>
        </div>
        <div class="grad-card" id="gradHoursCard">
          <div class="grad-card-label" id="gradHoursLabel"></div>
          <div class="grad-card-value" id="gradHoursValue"></div>
        </div>
        <div class="grad-card">
          <div class="grad-card-label" id="gradRemainingLabel"></div>
          <div class="grad-card-value" id="gradRemainingValue"></div>
          <div
            class="grad-note"
            id="gradCoopNote"
            style="margin-top: 6px"
          ></div>
        </div>
      </div>
      <div class="grad-note" id="gradNote"></div>
    </div>

    <div id="toast"></div>
