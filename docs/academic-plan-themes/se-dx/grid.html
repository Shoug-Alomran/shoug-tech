  header.doc { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 24px;
    border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .program { font-size: 15px; font-weight: 700; color: var(--muted); }
  h2 { font-size: 15px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 13px; margin: 14px 0 6px; }
  dl.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 18px; margin: 0; }
  dl.info dt { font-size: 11px; color: var(--muted); }
  dl.info dd { margin: 0; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--soft); }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-value { font-size: 16px; font-weight: 800; }
  .stat-detail { font-size: 11.5px; color: var(--muted); }
  .grad-basis { color: var(--muted); margin: 8px 0 0; }
  ul.flags { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  ul.flags li { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 7px 10px; font-weight: 500; }
  .muted { color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 620px; }
  th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; color: var(--muted); font-weight: 700; background: var(--soft); }
  td.code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px; font-weight: 700; white-space: nowrap; }
  table.fixed { table-layout: fixed; }
  table.courses col:nth-child(1) { width: 12%; } table.courses col:nth-child(2) { width: 32%; }
  table.courses col:nth-child(3) { width: 6%; } table.courses col:nth-child(4) { width: 14%; }
  table.courses col:nth-child(5) { width: 18%; } table.courses col:nth-child(6) { width: 18%; }
  table.places col:nth-child(1) { width: 12%; } table.places col:nth-child(2) { width: 40%; }
  table.places col:nth-child(3) { width: 6%; } table.places col:nth-child(4) { width: 21%; }
  table.places col:nth-child(5) { width: 21%; }
  .num { text-align: center; white-space: nowrap; }
  td.notes { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .chip.completed { background: var(--ok-bg); color: var(--ok); }
  .chip.current { background: var(--cur-bg); color: var(--cur); }
  .chip.planned { background: var(--plan-bg); color: var(--plan); }
  .chip.waived { background: var(--waive-bg); color: var(--waive); }
  .pre { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 11.5px; white-space: nowrap; }
  .pre.open { color: var(--warn); font-weight: 700; }
  .term { margin-top: 14px; }
  .term-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 4px; }
  .term-head strong { font-size: 13.5px; }
  .term-kind { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--plan-bg); color: var(--plan); }
  .notes-box { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--soft); }
  .sign { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-top: 8px; }
  .sign div { border-top: 1px solid var(--ink); padding-top: 4px; margin-top: 36px; font-size: 11.5px; color: var(--muted); }
  .comments { border: 1px solid var(--line); border-radius: 10px; min-height: 90px; margin-top: 8px; }
  footer { margin-top: 28px; font-size: 11px; color: var(--muted); }
  @page { size: A4; margin: 14mm; }
  @media print {
    .toolbar { display: none; }
    main { max-width: none; padding: 0; }
    .table-wrap { overflow: visible; }
    table { min-width: 0; }
    thead { display: table-header-group; }
    tr, .stat, .term-head { break-inside: avoid; }
    h2, h3, .term-head { break-after: avoid; }
    .review { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="toolbar"><button type="button" onclick="window.print()">${e(R.print)}</button></div>
<main>
  <header class="doc">
    <div><h1>${e(R.docTitle)}</h1><div class="program">${e(d.program)}</div></div>
    <div class="muted">${e(R.generated)}: ${e(d.generated)}</div>
  </header>

  <dl class="info">
    ${info(R.name, fields.name)}
    ${info(R.id, fields.id)}
    ${info(R.advisor, fields.advisor)}
    ${info(R.program, d.program)}
    ${info(R.startTerm, d.startTerm)}
    ${info(R.prepYear, d.dropPrep ? R.prepDropped : R.prepIncluded)}
  </dl>

  <h2>${e(R.summary)}</h2>
  <div class="stats">
    ${stat(R.earned, R.hoursOf(d.earned.actualHours, d.totals.hours), R.coursesOf(d.earned.actualCourses, d.totals.courses))}
    ${stat(R.inProgress, R.hours(d.currentHours), R.courses(d.currentCount))}
    ${stat(R.remaining, R.hours(remainingHours), "")}
    ${stat(R.waived, String(d.waived.length), d.waived.join(", "))}
  </div>

  <h2>${e(R.graduation)}</h2>
  ${
    d.grad
      ? `<div class="stats">${d.grad.rows.map((row) => stat(row[0], row[1], row[2])).join("")}</div>${d.grad.basis ? `<p class="grad-basis">${e(d.grad.basis)}</p>` : ""}`
      : `<p class="muted">${e(R.gradMissing)}</p>`
  }

  <h2>${e(R.attention)}</h2>
  ${d.attention.length ? `<ul class="flags">${d.attention.map((x) => `<li>${e(x)}</li>`).join("")}</ul>` : `<p class="muted">${e(R.none)}</p>`}

  <h2>${e(R.changes)}</h2>
  ${changes.length ? changes.join("") : `<p class="muted">${e(R.noChanges)}</p>`}

  <h2>${e(R.plan)}</h2>
  ${d.termRows
    .map(
      (r) => `<section class="term">
    <div class="term-head"><strong>${e(r.label)}</strong>${r.kind ? `<span class="term-kind">${e(R.kind[r.kind])}</span>` : ""}<span class="muted">${e(R.hours(r.hours))} · ${e(R.courses(r.rows.length))}</span></div>
    ${r.rows.length ? courseTable(r.rows) : `<p class="muted">${e(R.emptyTerm)}</p>`}
  </section>`,
    )
    .join("")}

  <h2>${e(R.electives)}</h2>
  ${d.electives
    .map(
      (g) => `<section class="term">
    <div class="term-head"><strong>${e(g.label)}</strong><span class="muted">${e(R.electiveProgress(g.done, g.planned, g.required))}</span></div>
    ${g.chosen.length ? courseTable(g.chosen) : `<p class="muted">${e(R.notChosen)}</p>`}
  </section>`,
    )
    .join("")}

  <h2>${e(R.remainingList)}</h2>
  ${d.remaining.length ? placementTable(d.remaining) : `<p class="muted">${e(R.none)}</p>`}
  ${d.electiveGaps.length ? `<ul>${d.electiveGaps.map((x) => `<li>${e(x)}</li>`).join("")}</ul>` : ""}

  ${fields.notes ? `<h2>${e(R.notesHead)}</h2><div class="notes-box">${e(fields.notes)}</div>` : ""}

  <section class="review">
    <h2>${e(R.review)}</h2>
    <h3>${e(R.advisorComments)}</h3>
    <div class="comments"></div>
    <div class="sign">
      <div>${e(R.studentSign)}</div>
      <div>${e(R.advisorSign)}</div>
      <div>${e(R.date)}</div>
    </div>
  </section>

  <footer>${e(R.footer)}</footer>
</main>
</body>
</html>`;
      }

      function advisorReportCsv(d, fields) {
        const R = t().report;
        const cell = (v) =>
          `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
        const lines = [
          [R.docTitle, d.program],
          [R.name, fields.name],
          [R.id, fields.id],
          [R.advisor, fields.advisor],
          [R.generated, d.generated],
          [],
          [
            R.cols.planned,
            R.cols.type,
            R.cols.code,
            R.cols.course,
            R.cols.cr,
            R.cols.status,
            R.cols.official,
            R.cols.prereqs,
            R.cols.notes,
          ],
        ];
        const push = (place, kind, r) =>
          lines.push([
            place,
            kind,
            r.code,
            r.name,
            r.hours,
            R.status[r.status],
            r.official,
            r.prereqs.map((p) => p.code + (p.done ? " ✓" : "")).join(" "),
            r.notes.join(" · "),
          ]);
        d.termRows.forEach((tr) =>
          tr.rows.forEach((r) =>
            push(tr.label, tr.kind ? R.kind[tr.kind] : "", r),
          ),
        );
        d.unplacedElectives.forEach((r) => push(R.unplanned, "", r));
        return "﻿" + lines.map((row) => row.map(cell).join(",")).join("\r\n");
      }

      function advisorFileBase(d) {
        const slug = (d.program || "plan")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");
        return `${slug || "plan"}-advisor-report-${new Date().toISOString().slice(0, 10)}`;
      }

      function downloadFile(name, content, type) {
        const url = URL.createObjectURL(new Blob([content], { type }));
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }

      function openAdvisorReport() {
        const fields = advisorFields();
        const d = advisorReportData();
        const html = advisorReportHtml(d, fields);
        const url = URL.createObjectURL(
          new Blob([html], { type: "text/html" }),
        );
        const win = window.open(url, "_blank");
        if (!win) {
          downloadFile(`${advisorFileBase(d)}.html`, html, "text/html");
          toast(t().report.popupBlocked);
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }

      // The plan exactly as the student sees it: the live grid with its own styles, minus the editing controls.
      function gridViewHtml(fields) {
        const R = t().report;
        const e = escapeHtml;
        const d = advisorReportData();
        // Only the grid's own stylesheet; the site shell injects print rules of its own.
        const css = document.querySelector("head > style").textContent;
        const fonts = [...document.querySelectorAll('link[rel="stylesheet"]')]
          .map((l) => `<link rel="stylesheet" href="${e(l.href)}" />`)
          .join("");
        const wrap = document.createElement("div");
        ["plan-prep", "plan", "plan-electives"].forEach((id) => {
          const el = document.getElementById(id);
          if (el && el.style.display !== "none")
            wrap.appendChild(el.cloneNode(true));
        });
        const legend = document.querySelector(".legend");
        if (legend) wrap.appendChild(legend.cloneNode(true));
        wrap
          .querySelectorAll(
            "button, .term-remove, .term-cost, .add-course-tile, .syllabus-panel",
          )
          .forEach((n) => n.remove());
        wrap.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
        wrap
          .querySelectorAll("[draggable]")
          .forEach((n) => n.removeAttribute("draggable"));
        wrap
          .querySelectorAll(
            ".expanded, .move-selected, .dragging, .move-target-label",
          )
          .forEach((n) =>
            n.classList.remove(
              "expanded",
              "move-selected",
              "dragging",
              "move-target-label",
            ),
          );
        const who = [fields.name, fields.id].filter(Boolean).join(" · ");
        const title = [R.gridTitle, d.program, fields.name]
          .filter(Boolean)
          .join(" — ");
        return `<!doctype html>
<html lang="${lang}" dir="${lang === "ar" ? "rtl" : "ltr"}" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>${e(title)}</title>
${fonts}
<style>${css}</style>
<style>
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: var(--bg); }
  .grid-toolbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: flex-end; padding: 10px 16px;
    background: var(--bg); border-bottom: 1px solid var(--border); }
  .grid-toolbar button { font-family: "Tajawal", sans-serif; font-weight: 700; font-size: 13px; padding: 8px 16px;
    border-radius: 8px; border: 1px solid var(--term-badge); background: var(--term-badge); color: #fff; cursor: pointer; }
  .grid-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 20px;
    margin-bottom: 14px; }
  .grid-head h1 { margin: 0; font-size: 20px; }
  .grid-head .sub { font-family: "Tajawal", sans-serif; font-size: 13px; }
  .course { cursor: default; }
  @page { size: A4 landscape; margin: 8mm; }
  @media print {
    .grid-toolbar { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .term-row, .legend { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="grid-toolbar"><button type="button" onclick="window.print()">${e(R.print)}</button></div>
<div class="wrap">
  <div class="grid-head">
    <div><h1>${e(d.program)}</h1><div class="sub">${e(who)}</div></div>
    <div class="sub">${e(R.hoursOf(d.earned.actualHours, d.totals.hours))} · ${e(R.generated)}: ${e(d.generated)}</div>
  </div>
  ${wrap.innerHTML}
</div>
</body>
</html>`;
      }

      function openGridView() {
        const fields = advisorFields();
        const html = gridViewHtml(fields);
        const url = URL.createObjectURL(
          new Blob([html], { type: "text/html" }),
        );
        const win = window.open(url, "_blank");
        if (!win) {
          downloadFile(
            `${advisorFileBase(advisorReportData())}-grid.html`,
            html,
            "text/html",
          );
          toast(t().report.popupBlocked);
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }

      function downloadAdvisorCsv() {
        const fields = advisorFields();
        const d = advisorReportData();
        downloadFile(
          `${advisorFileBase(d)}.csv`,
          advisorReportCsv(d, fields),
          "text/csv;charset=utf-8",
        );
      }

      document
        .getElementById("exportBtn")
        .addEventListener("click", () => toggleExport(true));
      document
        .getElementById("exportCloseBtn")
        .addEventListener("click", () => toggleExport(false));
      document
        .getElementById("exportOverlay")
        .addEventListener("click", () => toggleExport(false));
      document
        .getElementById("exportOpenBtn")
        .addEventListener("click", openAdvisorReport);
      document
        .getElementById("exportCsvBtn")
        .addEventListener("click", downloadAdvisorCsv);
      document
        .getElementById("exportGridBtn")
        .addEventListener("click", openGridView);

      function toggleGrad(open) {
        const overlay = document.getElementById("gradOverlay");
        const panel = document.getElementById("gradPanel");
        const shouldOpen =
          open !== undefined ? open : !panel.classList.contains("open");
        overlay.classList.toggle("open", shouldOpen);
        panel.classList.toggle("open", shouldOpen);
        if (shouldOpen) {
          document.getElementById("gradStartTerm").value =
            gradState.startTerm || "prep1";
          document.getElementById("gradStartYear").value =
            gradState.startYear || "";
          if (gradState.startYear) calculateGraduation();
        }
      }

      document.getElementById("resetBtn").addEventListener("click", () => {
        if (confirm(t().resetConfirm)) {
          statusMap = {};
          examMap = {};
          withdrawals = [];
          togetherPairs = [];
          extraTerms = [];
          customCourses = [];
          assignments = {};
          const map = courseIndex();
          Object.keys(map).forEach((code) => {
            assignments[code] = defaultLocation(map[code]);
          });
          saveState();
          render();
        }
      });
      document
        .getElementById("addSummerBtn")
        .addEventListener("click", addSummerTerm);
      document
        .getElementById("addExtraBtn")
        .addEventListener("click", addExtraTerm);
      document
        .getElementById("summerCloseBtn")
        .addEventListener("click", () => toggleSummerPicker(false));
      document
        .getElementById("summerCancelBtn")
        .addEventListener("click", () => toggleSummerPicker(false));
      document
        .getElementById("summerOverlay")
        .addEventListener("click", () => toggleSummerPicker(false));
      document
        .getElementById("addGapBtn")
        .addEventListener("click", addGapTerm);
      document
        .getElementById("extraCloseBtn")
        .addEventListener("click", () => toggleExtraPicker(false));
      document
        .getElementById("extraCancelBtn")
        .addEventListener("click", () => toggleExtraPicker(false));
      document
        .getElementById("extraOverlay")
        .addEventListener("click", () => toggleExtraPicker(false));
      document
        .getElementById("gapCloseBtn")
        .addEventListener("click", () => toggleGapPicker(false));
      document
        .getElementById("gapCancelBtn")
        .addEventListener("click", () => toggleGapPicker(false));
      document
        .getElementById("gapOverlay")
        .addEventListener("click", () => toggleGapPicker(false));
      document
        .getElementById("tuitionBtn")
        .addEventListener("click", () => toggleTuition());
      document
        .getElementById("tuitionCloseBtn")
        .addEventListener("click", () => toggleTuition(false));
      document
        .getElementById("tuitionOverlay")
        .addEventListener("click", () => toggleTuition(false));
      ["tuitionRegular", "tuitionSummer"].forEach((id) =>
        document.getElementById(id).addEventListener("input", () => {
          tuition = {
            ...tuition,
            regular: readRateInput("tuitionRegular"),
            summer: readRateInput("tuitionSummer"),
          };
          saveState();
          render();
        }),
      );
      document
        .getElementById("retakeConfirmBtn")
        .addEventListener("click", commitRetake);
      ["retakeCloseBtn", "retakeCancelBtn", "retakeOverlay"].forEach((id) =>
        document.getElementById(id).addEventListener("click", () => {
          retakeState = null;
          toggleRetake(false);
        }),
      );
      document
        .getElementById("addPick")
        .addEventListener("change", syncAddFields);
      document
        .getElementById("addConfirmBtn")
        .addEventListener("click", confirmAddCourse);
      ["addCloseBtn", "addCancelBtn", "addOverlay"].forEach((id) =>
        document
          .getElementById(id)
          .addEventListener("click", () => toggleAddCourse(false)),
      );
      document.getElementById("langBtn").addEventListener("click", () => {
        lang = lang === "ar" ? "en" : "ar";
        localStorage.setItem(LANG_KEY, lang);
        render();
      });
      document.getElementById("viewModeBtn").addEventListener("click", () => {
        viewMode = !viewMode;
        if (viewMode) selectedMoveCode = null;
        localStorage.setItem(VIEW_MODE_KEY, viewMode ? "1" : "0");
        render();
      });
      document.getElementById("themeBtn").addEventListener("click", () => {
        const next = currentTheme() === "dark" ? "light" : "dark";
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
        renderStaticText();
      });
      document
        .getElementById("walkBtn")
        .addEventListener("click", () => toggleWalkthrough());
      document
        .getElementById("walkCloseBtn")
        .addEventListener("click", () => toggleWalkthrough(false));
      document
        .getElementById("walkOverlay")
        .addEventListener("click", () => toggleWalkthrough(false));
      document
        .getElementById("walkPrevBtn")
        .addEventListener("click", () => stepWalkthrough(-1));
      document
        .getElementById("walkNextBtn")
        .addEventListener("click", () => stepWalkthrough(1));
      document
        .getElementById("eyeBtn")
        .addEventListener("click", () => toggleCompare());
      document
        .getElementById("compareCloseBtn")
        .addEventListener("click", () => toggleCompare(false));
      document
        .getElementById("compareOverlay")
        .addEventListener("click", () => toggleCompare(false));
      document
        .getElementById("gradBtn")
        .addEventListener("click", () => toggleGrad());
      document.getElementById("pypBtn").addEventListener("click", () => {
        gradState.dropPYP = !gradState.dropPYP;
        if (gradState.dropPYP) {
          gradState.pypPrevStartTerm = gradState.startTerm;
          gradState.startTerm = "t1";
        } else if (gradState.pypPrevStartTerm) {
          gradState.startTerm = gradState.pypPrevStartTerm;
          delete gradState.pypPrevStartTerm;
        }
        saveState();
        renderStaticText();
        render();
      });
      document
        .getElementById("gradCloseBtn")
        .addEventListener("click", () => toggleGrad(false));
      document
        .getElementById("gradOverlay")
        .addEventListener("click", () => toggleGrad(false));
      document
        .getElementById("gradCalcBtn")
        .addEventListener("click", calculateGraduation);

      loadState();
      render();
      initCloudSync();
      fetch("../course-syllabi.json")
        .then((r) => (r.ok ? r.json() : {}))
        .then((data) => {
          SYLLABI = data || {};
          render();
        })
        .catch(() => {});
    </script>

    <script src="/javascripts/register-sw.js" defer></script>
  </body>
</html>
