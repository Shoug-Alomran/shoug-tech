<header class="shoug-site-header">
  <div class="shoug-header-inner">
    <a class="shoug-header-logo" href="/">SHOUG.TECH</a>
    <nav class="shoug-header-nav" id="shoug-mobile-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/academics/">Academics</a>
      <a href="/work/">Work</a>
      <a href="/workshops/">Workshops</a>
      <a href="/resources/">Resources</a>
      <a href="/about/">About</a>
    </nav>
    <div class="shoug-header-actions">
      <button
        id="shoug-fb-user"
        class="shoug-auth-btn"
        type="button"
        data-account-loader
      >
        Sign In
      </button>
      <button
        class="shoug-header-menu-btn"
        type="button"
        aria-label="Open site menu"
        aria-controls="shoug-mobile-nav"
        aria-expanded="false"
      >
        Menu
      </button>
      <button
        class="shoug-directory-btn"
        type="button"
        aria-label="Open academic directory"
        aria-expanded="false"
      >
        Dir
      </button>
      <a class="shoug-icon-btn" href="/?q=" aria-label="Search">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="square"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
      </a>
      <a
        class="shoug-icon-btn"
        href="https://github.com/Shoug-Alomran"
        aria-label="GitHub"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 .5A12 12 0 0 0 8.2 23.9c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.3 1 .1-.7.4-1.3.7-1.6-2.6-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.7 4.4 18.7 4.7 18.7 4.7c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.4 5.9.4.4.8 1.1.8 2.2v4.1c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"
          ></path>
        </svg>
      </a>
      <a
        class="shoug-icon-btn"
        href="https://www.linkedin.com/in/shoug-alomran/"
        aria-label="LinkedIn"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M20.4 20.4h-3.6v-5.6c0-1.3 0-3-1.9-3s-2.1 1.4-2.1 2.9v5.7H9.3V9h3.4v1.6h.1c.5-.9 1.6-1.9 3.4-1.9 3.6 0 4.3 2.4 4.3 5.5v6.2ZM5.3 7.4a2.1 2.1 0 1 1 0-4.1 2.1 2.1 0 0 1 0 4.1Zm1.8 13H3.6V9h3.5v11.4ZM22.2 0H1.8C.8 0 0 .8 0 1.7v20.5C0 23.2.8 24 1.8 24h20.4c1 0 1.8-.8 1.8-1.8V1.7C24 .8 23.2 0 22.2 0Z"
          ></path>
        </svg>
      </a>
      <button
        class="shoug-theme-btn"
        type="button"
        aria-label="Toggle dark and light mode"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="square"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          ></path>
        </svg>
      </button>
      <button
        class="shoug-lang-btn"
        type="button"
        data-lang-toggle
        aria-label="Switch to Arabic"
      >
        AR
      </button>
      <a class="shoug-contact-btn" href="mailto:shoug.alomran@shoug-tech.com"
        >Contact</a
      >
    </div>
  </div>
  <div class="shoug-header-backdrop" data-mobile-overlay></div>
</header>
